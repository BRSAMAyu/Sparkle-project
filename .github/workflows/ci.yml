name: Sparkle CI Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI 全局兜底：任何构造 pydantic Settings 的步骤（alembic/AGE-init/测试）
  # 都要求 SECRET_KEY/JWT_SECRET 非空——逐步补漏过两次，断根。
  SECRET_KEY: ci-workflow-default-secret-0123456789abcdef
  JWT_SECRET: ci-workflow-default-jwt-0123456789abcdef
  GO_VERSION: '1.24.0'
  PYTHON_VERSION: '3.11'
  FLUTTER_VERSION: '3.41.3'  # 2026-09-24: align with local toolchain — protobuf 6.1.0 needs Dart >=3.6; 3.24 (Dart 3.5) broke package resolution and exploded the analyze gate
  COVERAGE_RULES_FILE: 'quality/coverage_thresholds.json'
  COVERAGE_THRESHOLD_GO: '30'
  COVERAGE_THRESHOLD_PYTHON: '50'
  COVERAGE_THRESHOLD_FLUTTER: '25'

jobs:
  # ==================== JOB 1: LINT ====================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: golangci-lint new-from-rev needs the baseline commit
          fetch-depth: 0

      # Go Linting
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate Go Proto Code
        run: make proto-tools-build && make proto-gen

      - name: Go Vet
        working-directory: backend/gateway
        run: go vet ./...

      - name: Go Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend/gateway
          args: --timeout=5m

      # Python Linting
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Lint Tools
        run: |
          sudo apt-get update && sudo apt-get install -y liblzo2-dev
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Install quality gate runtime deps
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Python Lint (Ruff)
        run: ruff check backend/app --output-format=github

      - name: Python Type Check (MyPy)
        run: bash scripts/ci/mypy_ratchet.sh

      # Flutter Linting
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Analyze Gate
        run: |
          cd mobile && flutter pub get
          cd .. && python3 scripts/check_flutter_analyze_gate.py \
            --project-dir mobile \
            --budget-file quality/flutter_analyze_allowlist.json \
            --write-report quality/flutter_analyze_report_ci.json

      - name: Technical Debt Budget Gate
        run: python3 scripts/check_tech_debt_budget.py

      - name: Detect Duplicate Code Blocks
        run: python3 scripts/check_duplicate_code_blocks.py backend/app/signals/spine_orchestrator.py

  # ==================== JOB 1B: RULE GUARDS ====================
  all-rule-guards:
    name: All Rule Guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      # AT/AX/BJ 族守卫按「changed-files 圈定」防历史误报（origin/HEAD 的
      # merge-base）；浅克隆拿不到 ref 会回落全量扫描把历史孤儿全翻出来。
      # 本地行为依赖全量 ref——CI 对齐。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitignored 生成物（backend/app/gen 等）是 AT/AX/AV 族守卫的扫描输入：
      # 本地树有它们所以绿，CI 裸检出会环境性误报——先再生（与 lint job 同形制）。
      - name: Regenerate protobuf bindings
        run: make proto-tools-build && make proto-gen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y liblzo2-dev
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Install Guard Runtime Deps
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/gateway/go.sum

      # Guards AQ/BG parse generated artifacts (backend/app/gen, gateway gen,
      # mobile lib/gen) which are gitignored — regenerate before guarding or
      # AQ dies on ModuleNotFoundError and BG reports phantom violations.
      - name: Generate Proto Code for Guards
        run: make proto-tools-build && make proto-gen

      - name: Run Stage 22 Baseline Artifact Refresh
        run: |
          python3 scripts/check_prompt_render_coverage.py --write
          python3 scripts/render_stage22_precheck.py

      - name: Run All Rule Guards (includes Rule AR SQAM)
        env:
          # AT/AX/BJ 按 diff 圈定变更面：push-to-main 后 HEAD==origin/main，
          # origin/HEAD merge-base 圈定恒空（且 actions/checkout 不建 origin/HEAD
          # 符号引用，直接触发全量回落翻历史账 → run 35965302672 的 AT/AX 红）。
          # 改用 event.before（本次 push 旧头）圈定；workflow_dispatch 无 before
          # 时回落 github.sha = 空 diff，守卫按 scope-empty PASS（空集≠None 语义），
          # 不再全扫。
          RULE_GUARD_DIFF_BASE: ${{ github.event.before || github.sha }}
        run: bash scripts/run_all_rule_guards.sh --jobs 4

  # ==================== JOB 2: BACKEND TEST (3-shard) ====================
  # wt592 落地 wt577 提案（v3-output/WT577-PROFILE/report.md §5.2）：文件粒度
  # LPT 三分静态清单（scripts/ci/backend_tests_shards.txt，数据源 run
  # 36253679384 / job 108452479615，逐文件时长与 pytest 自报总时长 5043.68s
  # 对平），预估每片 ~28.4m pytest 墙钟（现状单 job 84m）+ ~6m 环境步。
  # fail-fast: false——一片红不取消其他片，两片并行取证不留观测空窗；
  # coverage 按片唯一 COVERAGE_FILE 上传，由 backend-test-coverage 合并后
  # 统一跑契约门与阈值。
  backend-test:
    name: Backend Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      # CI-AGE: dev/prod 同源的 pgvector+AGE DB（docker/pgvector-age.Dockerfile），
      # 取代裸 pgvector/pgvector:pg16 service——GHA services 先于 step 启动，
      # 无法使用 job 内构建的镜像，故转为 step 托管容器。守卫同源:
      # scripts/guards/check_rule_bn_prod_db_age_parity.py
      - name: Start AGE-enabled PostgreSQL (dev-parity image)
        uses: ./.github/actions/age-postgres
        with:
          postgres-user: postgres
          postgres-password: password
          postgres-db: sparkle_test

      # Go Tests
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/gateway/go.sum

      - name: Generate Go Proto Code
        run: make proto-tools-build && make proto-gen

      # wt577 免费项备忘：Go test -race（~2-3m）可拆独立并行 job，三片各省一份
      # 关键路径；涉及新 job 块（>5 行改动），wt592 不做，留待独立卡。
      - name: Go Test with Coverage
        working-directory: backend/gateway
        # -race needs cgo (default enabled on ubuntu runners). -timeout is an
        # explicit per-package budget so race-mode slowdowns (2-20x) cannot hit
        # the 10m go-test default; the 120m job timeout still bounds the step.
        run: |
          go test -v -race -timeout=20m -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Go Critical Risk Suites
        working-directory: backend/gateway
        run: |
          go test -v ./internal/handler/... ./internal/service/... ./internal/db/...

      - name: Go Proto Serialization Contract
        working-directory: backend/gateway
        run: |
          go test -v -run TestProtoSerialization ./internal/handler/

      - name: Enforce Go Coverage Threshold
        run: |
          python3 scripts/check_coverage_thresholds.py \
            --kind go \
            --report backend/gateway/coverage.out \
            --rules-file "${{ env.COVERAGE_RULES_FILE }}"

      # Python Tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y liblzo2-dev
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      # CI-AGE: dev 侧 sparkle_age_init 同款 one-shot（extensions + sparkle_galaxy
      # 图谱 + 基础 label），失败即红（与 prod db_age_init 同等严格度）。
      - name: Init AGE extension and galaxy graph (dev one-shot parity)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/sparkle_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: 'true'
        run: python backend/scripts/init_age_extension.py

      # 与 e2e-tests.yml 同序（先图谱后迁移）：integration 侧 db_session 契约是
      # 「表来自迁移、fixture 不建表」（tests/integration/conftest.py），首次完整
      # 全量跑（run 36178015150）暴露 ~70 例 relation "users" does not exist——
      # 非测试或产品回归，是 ci.yml 缺迁移步骤的环境面缺口。此步补齐。
      # 分片注意（wt577 §5.5 迹象 4）：本步连同 AGE 容器/init 每片原样复制、
      # 各自独立 upgrade head；分片不改变迁移单头性（wt539/wt544 撞号教训——
      # 不因分片拆迁移、不加第二迁移头）。
      - name: Apply database migrations (test schema parity)
        run: |
          cd backend
          DATABASE_URL=postgresql://postgres:password@localhost:5432/sparkle_test \
          SECRET_KEY=ci-workflow-default-secret-0123456789abcdef \
          ENVIRONMENT=development \
          alembic upgrade head

      # 层17（第17次尝试定谳）：应用代码 import 的是 buf 嵌套布局（app.gen.agent.v1 等），
      # generate_python_protos.sh 只产扁平 _pb2——shard job 因先跑 make proto-gen（Go 面顺带
      # 产出嵌套 Python gen）而双布局齐全；本 job 此前只有扁平脚本，OpenAPI 导入链炸
      # ModuleNotFoundError: app.gen.agent。先 make proto-gen 再叠加扁平脚本，与 shard 端态对齐。
      - name: Generate Python Proto Code
        run: |
          make proto-tools-build && make proto-gen
          sudo mkdir -p backend/app/gen && sudo chown -R "$(id -u):$(id -g)" backend/app/gen
          pip install grpcio-tools
          PYTHON_BIN=python3 bash scripts/generate_python_protos.sh

      # 静态清单（可复现优先，可 review diff）：从 scripts/ci/backend_tests_shards.txt
      # 取本片文件集（文件粒度 LPT 装箱 + 有状态钉扎，钉扎理由逐条见清单头注释）。
      # 清单并集必须等于 backend/tests 全量可收集集——
      # `python3 scripts/ci/backend_test_shards.py verify` 校验零遗漏零重复；
      # 新增/删除测试文件后需重跑 generate 并 diff review。
      - name: Resolve shard test file list (static manifest)
        run: |
          python3 scripts/ci/backend_test_shards.py emit \
            --shard "${{ matrix.shard }}" \
            --manifest scripts/ci/backend_tests_shards.txt \
            --out .pytest-shard-files.txt
          echo "shard ${{ matrix.shard }}: $(grep -c '^backend/tests/' .pytest-shard-files.txt) test files"

      # --cov-report=（空值）：只写数据文件不出报告，报告由 backend-test-coverage
      # 对三片合并后统一产出；COVERAGE_FILE 按片唯一（upload-artifact v4 禁重名）。
      # 去重（wt577 §5.0 免费项①，只去重不改语义）：golden / contract / workflow
      # / proto 序列化契约文件本就落在该片清单内，不再像旧单 job 那样全量扫后
      # 又用专用步重跑第二遍（ci.yml 旧 :285-299、:313）。
      - name: Python Test with Coverage (shard ${{ matrix.shard }})
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sparkle_test
          REDIS_URL: redis://localhost:6379/0
          TESTING: 'true'
          COVERAGE_FILE: /tmp/cov/.coverage.${{ matrix.shard }}
        run: |
          mkdir -p /tmp/cov
          pytest -v $(tr '\n' ' ' < .pytest-shard-files.txt) --cov=backend/app --cov-report= --timeout=300 --timeout-method=thread
          # run 36316568689 实证：COVERAGE_FILE 指 /tmp/cov 但 pytest-cov 7.1.0
          # 可能把数据落在 cwd 默认 .coverage——兜底搬运 + 列目录留证（下一轮若仍空，
          # 日志可定位真实落点；两头位置都盖住，上传步路径不变）。
          if [ ! -f "/tmp/cov/.coverage.${{ matrix.shard }}" ] && [ -f .coverage ]; then
            mv .coverage "/tmp/cov/.coverage.${{ matrix.shard }}"
          fi
          ls -la /tmp/cov .coverage* 2>/dev/null || true

      # if: always()：片红也上传已写盘的部分数据供取证（WT572 观测失明教训）；
      # 合并侧仍要求全片绿才继续跑契约门与阈值。
      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-cov-shard-${{ matrix.shard }}
          path: /tmp/cov/.coverage.${{ matrix.shard }}
          # .coverage.N 是点开头隐藏文件——upload-artifact v4 默认排除 hidden
          # files，run 36319588673 实证 ls 在位（487KB）而上传报 No files，
          # 必须显式 include-hidden-files: true。
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  # ==================== JOB 2A: BACKEND COVERAGE MERGE ====================
  # 三片 coverage 合并 + 原属 Backend Tests 的契约门与 Python 阈值检查（每项
  # 只跑一次，不随片三倍付费）。矩阵任何一片非绿 → 首步直接红：needs +
  # if: always() + 显式 result 检查，红不可被吞（wt577 §5.0）。
  backend-test-coverage:
    name: Backend Coverage Merge & Contract Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-test]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Require all backend test shards green
        if: needs.backend-test.result != 'success'
        run: |
          echo "::error title=Backend Tests shard not green::needs.backend-test.result=${{ needs.backend-test.result }}；拒绝合并 coverage 与放行契约门，避免片红被吞。"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y liblzo2-dev
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      # 契约门（OpenAPI 快照导出 / fixture replay）经 subprocess 导入 app，需要
      # gitignored 生成物 backend/app/gen 先行再生（与分片内同形制）。
      # 层17（第17次尝试定谳）：应用代码 import 的是 buf 嵌套布局（app.gen.agent.v1 等），
      # generate_python_protos.sh 只产扁平 _pb2——shard job 因先跑 make proto-gen（Go 面顺带
      # 产出嵌套 Python gen）而双布局齐全；本 job 此前只有扁平脚本，OpenAPI 导入链炸
      # ModuleNotFoundError: app.gen.agent。先 make proto-gen 再叠加扁平脚本，与 shard 端态对齐。
      - name: Generate Python Proto Code
        run: |
          make proto-tools-build && make proto-gen
          sudo mkdir -p backend/app/gen && sudo chown -R "$(id -u):$(id -g)" backend/app/gen
          pip install grpcio-tools
          PYTHON_BIN=python3 bash scripts/generate_python_protos.sh

      - name: Download shard coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: backend-cov-shard-*
          merge-multiple: true
          path: coverage-shards

      # combine 收拢 .coverage.<shard> → .coverage → coverage.xml；仓库无
      # .coveragerc/[tool.coverage] 自定义（wt577 已核），hosted runner 检出路径
      # 一致，无需 [paths] 重映射。
      - name: Merge shard coverage into coverage.xml
        run: |
          ls -la coverage-shards
          python -m coverage combine coverage-shards
          python -m coverage xml
          python -m coverage report | tail -n 8

      - name: OpenAPI Contract Check
        run: python3 scripts/check_openapi_contract.py

      - name: Proto Contract Check
        run: python3 scripts/check_proto_contract.py

      - name: Dependency Contract Check
        run: python3 scripts/check_dependency_contract.py

      - name: Rule K Write-Path Guard
        run: python3 scripts/check_rule_k_write_paths.py

      - name: Backend Fixture Replay Gate
        run: python3 scripts/replay_backend_contract_fixtures.py

      - name: Enforce Python Coverage Threshold (merged across shards)
        run: |
          python3 scripts/check_coverage_thresholds.py \
            --kind python \
            --report coverage.xml \
            --rules-file "${{ env.COVERAGE_RULES_FILE }}"

  # ==================== JOB 2B: JOURNEY SMOKE ====================
  journey-smoke:
    name: Journey Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [all-rule-guards, backend-test, backend-test-coverage]
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y liblzo2-dev
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      # 层17（第17次尝试定谳）：应用代码 import 的是 buf 嵌套布局（app.gen.agent.v1 等），
      # generate_python_protos.sh 只产扁平 _pb2——shard job 因先跑 make proto-gen（Go 面顺带
      # 产出嵌套 Python gen）而双布局齐全；本 job 此前只有扁平脚本，OpenAPI 导入链炸
      # ModuleNotFoundError: app.gen.agent。先 make proto-gen 再叠加扁平脚本，与 shard 端态对齐。
      - name: Generate Python Proto Code
        run: |
          make proto-tools-build && make proto-gen
          sudo mkdir -p backend/app/gen && sudo chown -R "$(id -u):$(id -g)" backend/app/gen
          pip install grpcio-tools
          PYTHON_BIN=python3 bash scripts/generate_python_protos.sh

      - name: Run Stage35 Journey Smoke
        env:
          REDIS_URL: redis://localhost:6379/0
          TESTING: 'true'
        run: bash scripts/journey_smoke.sh all

  # ==================== JOB 2C: SIMULATION BENCHMARK ====================
  simulation-benchmark:
    name: Simulation Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, backend-test-coverage]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect benchmark-sensitive changes
        id: benchmark_changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- \
            backend/app/signals/policy_engine.py \
            backend/app/aurora \
            backend/app/signals/marketplace.py \
            'backend/app/signals/skill_*.py')
          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED" ]; then
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_benchmark=false" >> "$GITHUB_OUTPUT"
            echo "No benchmark-sensitive files changed."
          fi

      # CI-AGE: dev/prod 同源 pgvector+AGE DB；仅在基准确需运行时构建/启动。
      - name: Start AGE-enabled PostgreSQL (dev-parity image)
        if: steps.benchmark_changes.outputs.run_benchmark == 'true'
        uses: ./.github/actions/age-postgres
        with:
          postgres-user: postgres
          postgres-password: password
          postgres-db: sparkle_simulation_ci

      - name: Set up Python
        if: steps.benchmark_changes.outputs.run_benchmark == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        if: steps.benchmark_changes.outputs.run_benchmark == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y liblzo2-dev
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Apply migrations
        if: steps.benchmark_changes.outputs.run_benchmark == 'true'
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sparkle_simulation_ci
          ENVIRONMENT: development
        run: cd backend && alembic upgrade head

      - name: Run SparkleGoalBench regression gate
        if: steps.benchmark_changes.outputs.run_benchmark == 'true'
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sparkle_simulation_ci
          TESTING: 'true'
          PYTHONPATH: backend
        run: python -m backend.scripts.run_simulation_benchmark --suite=full --commit="${GITHUB_SHA}"

      - name: Upload benchmark report
        if: always() && steps.benchmark_changes.outputs.run_benchmark == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-benchmark-report
          path: docs/benchmarks/*.md
          if-no-files-found: warn

  # ==================== JOB 3: FLUTTER TEST ====================
  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # gen/ 为 gitignored 生成物，测试前必须再生（docker 工具链已钉 protobuf 6.1.0 ↔ protoc_plugin 25.1.0 配对）
      - name: Regenerate protobuf bindings
        run: make proto-tools-build && make proto-gen

      - name: Get Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Tests with Coverage
        working-directory: mobile
        run: flutter test --coverage

      - name: Flutter Critical Smoke and Regression Suites
        working-directory: mobile
        run: |
          flutter test test/app test/integration test/goldens test/widget/visual_elements_layout_regression_test.dart test/widget/chat_action_card_navigation_test.dart -r compact

      - name: Enforce Flutter Coverage Threshold
        run: |
          python3 scripts/check_coverage_thresholds.py \
            --kind flutter \
            --report mobile/coverage/lcov.info \
            --rules-file "${{ env.COVERAGE_RULES_FILE }}"

  # ==================== JOB 4: SECURITY SCAN ====================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Trivy for container security (advisory: findings reported, not blocking)
      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

      # Gitleaks: no GITLEAKS_LICENSE configured (personal repo), advisory only
      - name: Run Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency audit: safety DB can flag uncontrollable upstream advisories, advisory only
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python Safety Check
        continue-on-error: true
        run: |
          pip install safety
          safety check -r backend/requirements.lock --full-report

  # ==================== JOB 5: DB SCHEMA CHECK ====================
  db-schema-check:
    name: DB Schema Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CI-AGE: 同源 pgvector+AGE 镜像，但 age-init=none——本 job 对比的是
      # 「fresh 迁移链终态」的 pg_dump（Makefile R2-08-06 口径），迁移链自身不
      # CREATE EXTENSION age，若在此库预装 age 扩展会引入 dump 漂移假差异。
      # vector/pgcrypto 由迁移链自建，与 schema.sql 快照口径一致。
      - name: Start AGE-image PostgreSQL (migration-chain parity)
        uses: ./.github/actions/age-postgres
        with:
          postgres-user: postgres
          postgres-password: password
          postgres-db: sparkle_ci
          age-init: none

      - name: Migration Contract Check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/main
        run: python scripts/check_migration_contracts.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y liblzo2-dev
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sparkle_ci
          ENVIRONMENT: development
          SECRET_KEY: ci-schema-drift-secret-0123456789abcdef
          JWT_SECRET: ci-schema-drift-jwt-0123456789abcdef
        run: cd backend && alembic upgrade head

      - name: Compare Schema Dump
        id: schema_dump_compare
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          PGPASSWORD: password
        run: |
          # pg_dump 方言伪漂移：CI 侧 pg_dump 对每个对象输出 public. 限定名
          # （search_path 置空风格），提交快照由 pg_dump 16.15 生成、不带限定。
          # 单 schema（public）单库下 public.x 与 x 语义等价——diff 前双方归一
          # 去限定，只留真漂移。2026-09-24 run 35965302672 判定：3445 对差异行
          # 去限定后逐行配对归零，零真差异。
          normalize() {
            grep -v '^--' "$1" | grep -v '^SET ' | grep -v '^SELECT pg_catalog.set_config' | grep -v '^\\' | sed 's/public\.//g'
          }
          pg_dump -h localhost -U postgres -d sparkle_ci --schema-only | grep -v '^\\' > /tmp/schema_ci.sql
          normalize backend/gateway/internal/db/schema.sql > /tmp/schema_repo.sql
          normalize /tmp/schema_ci.sql > /tmp/schema_ci_norm.sql
          diff -u /tmp/schema_repo.sql /tmp/schema_ci_norm.sql

      - name: Warn On Advisory Schema Diff
        if: steps.schema_dump_compare.outcome == 'failure'
        run: |
          echo "::warning title=Advisory schema diff mismatch::Normalized schema diff is non-blocking until the comparison is hardened. Review the step log before merging schema-related changes."

  # ==================== JOB 6: PROTO CHECK ====================
  proto-check:
    name: Protobuf Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed proto files
        id: proto_changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${BASE_REF}" --depth=1
            CHANGED_PROTO=$(git diff --name-only "origin/${BASE_REF}"...HEAD -- 'proto/*.proto')
          else
            CHANGED_PROTO=$(git diff --name-only HEAD~1...HEAD -- 'proto/*.proto' 2>/dev/null || true)
            if [ -z "$CHANGED_PROTO" ]; then
              CHANGED_PROTO="(none)"
            fi
          fi
          echo "changed_proto<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED_PROTO" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED_PROTO" ] && [ "$CHANGED_PROTO" != "(none)" ]; then
            echo "has_proto_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proto_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Proto Toolchain Image
        if: steps.proto_changes.outputs.has_proto_changes == 'true'
        run: make proto-tools-build

      - name: Buf Breaking Change Detection
        if: github.event_name == 'pull_request' && steps.proto_changes.outputs.has_proto_changes == 'true'
        run: |
          PROTO_TOOLCHAIN_IMAGE=sparkle/proto-toolchain:latest \
          scripts/proto_toolchain.sh breaking '.git#branch=main'

      - name: Enforce Deprecated Removal Milestones
        if: steps.proto_changes.outputs.has_proto_changes == 'true'
        run: python3 scripts/check_proto_deprecated_windows.py

      - name: Enforce Generated Code Consistency
        if: steps.proto_changes.outputs.has_proto_changes == 'true'
        run: |
          PROTO_TOOLCHAIN_IMAGE=sparkle/proto-toolchain:latest \
          scripts/proto_toolchain.sh check-generated

      - name: Enforce Proto Migration Notes
        if: github.event_name == 'pull_request' && steps.proto_changes.outputs.has_proto_changes == 'true'
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -q '^docs/engineering/proto_dual_stack_migration.md$'; then
            echo "Proto files changed but migration guide was not updated."
            echo "Changed proto files:"
            echo "${{ steps.proto_changes.outputs.changed_proto }}"
            exit 1
          fi

      - name: Enforce Proto ADR Update
        if: github.event_name == 'pull_request' && steps.proto_changes.outputs.has_proto_changes == 'true'
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -Eq '^docs/adr/.*proto.*\.md$'; then
            echo "Proto files changed but no proto ADR was updated."
            echo "Please add or update an ADR file under docs/adr/ with 'proto' in file name."
            exit 1
          fi

  # ==================== JOB 7: BUILD (main pushes and tags only) ====================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [all-rule-guards, backend-test, backend-test-coverage, flutter-test, security-scan, db-schema-check, proto-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Generated proto code is gitignored; generate before Go/Docker builds
      - name: Build Proto Toolchain Image
        run: make proto-tools-build

      - name: Generate Go Proto Code
        run: make proto-gen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 层17（第17次尝试定谳）：应用代码 import 的是 buf 嵌套布局（app.gen.agent.v1 等），
      # generate_python_protos.sh 只产扁平 _pb2——shard job 因先跑 make proto-gen（Go 面顺带
      # 产出嵌套 Python gen）而双布局齐全；本 job 此前只有扁平脚本，OpenAPI 导入链炸
      # ModuleNotFoundError: app.gen.agent。先 make proto-gen 再叠加扁平脚本，与 shard 端态对齐。
      - name: Generate Python Proto Code
        run: |
          make proto-tools-build && make proto-gen
          sudo mkdir -p backend/app/gen && sudo chown -R "$(id -u):$(id -g)" backend/app/gen
          pip install grpcio-tools
          PYTHON_BIN=python3 bash scripts/generate_python_protos.sh

      # GHCR requires all-lowercase repository names (owner contains uppercase)
      - name: Compute lowercase image namespace
        run: echo "IMAGE_NS=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Go Gateway
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Go Gateway
        working-directory: backend/gateway
        run: |
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/gateway ./cmd/server

      # Build Docker Images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (gateway)
        id: meta_gateway
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NS }}/sparkle-gateway
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/gateway
          push: true
          tags: ${{ steps.meta_gateway.outputs.tags }}
          labels: ${{ steps.meta_gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NS }}/sparkle-backend
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Flutter (APK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-apk-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
