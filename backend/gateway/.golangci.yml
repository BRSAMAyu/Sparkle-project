# GolangCI-Lint configuration — right-sized 2026-09
# Philosophy: catch real bugs (correctness, security, concurrency), not style opinions.
# Style-philosophy linters (wsl/nlreturn/godot/gocritic/wrapcheck/nestif/goconst/
# gocyclo/dupl/whitespace/prealloc) are intentionally NOT enabled.

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    # Correctness (default set)
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Security
    - gosec
    - bodyclose
    - noctx

    # Error handling
    - errorlint

    # Hygiene
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - revive

linters-settings:
  goimports:
    local-prefixes: github.com/sparkle/gateway

  gosec:
    excludes:
      - G104  # Audit errors not checked (errcheck covers this)
      - G304  # File path from variable is expected in file handling paths

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

issues:
  exclude-dirs:
    - vendor
    - mocks
  exclude-rules:
    # Relax correctness linters on test files where they add noise
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - unparam

    # Never lint generated protobuf code
    - path: \.pb\.go
      linters:
        - all

    # Allow dot imports in test files
    - path: _test\.go
      text: "should not use dot imports"

  max-issues-per-linter: 0
  max-same-issues: 0
  # Lint adoption baseline (2026-09-16, post gofmt sweep): findings on or
  # before this revision do not block CI; every change after it is fully
  # linted. Pay down the recorded baseline (docs/engineering/KNOWN_CODE_DEBT_LEDGER.md),
  # then advance the baseline or remove it to enforce repo-wide.
  new-from-rev: e6256a3

severity:
  default-severity: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - errcheck
      severity: error
