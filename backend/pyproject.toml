[project]
name = "sparkle-backend"
version = "2.0.0"
description = "Sparkle AI Learning Assistant - Backend Services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sparkle Team" }
]
keywords = ["ai", "learning", "assistant", "fastapi", "grpc"]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.25",
    "greenlet>=3.0.0",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.22.0",
    "pgvector>=0.2.4",
    "redis>=5.0.1",
    "aiokafka>=0.10.0",
    "boto3>=1.34.0",
    "hvac>=2.0.0",

    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",

    # Task Scheduling
    "apscheduler>=3.10.4",

    # HTTP Client & Tools
    "httpx>=0.26.0",
    "aiofiles>=23.2.1",

    # LLM & AI
    "openai>=1.10.0",
    "dashscope>=1.20.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.0.1",
    "langgraph>=0.2.0",
    "tiktoken>=0.5.2",
    "pypdf>=3.0.0",
    "pdfplumber>=0.10.0",
    "readmdict>=0.1.1",
    "python-lzo>=1.15",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",

    # Additional Dependencies
    "sse-starlette",
    "loguru",
    "structlog>=24.1.0",
    "json-repair",
    "typing-extensions",
    "email-validator>=2.0.0",
    "slowapi>=0.1.9",
    "tenacity",
    "prometheus-fastapi-instrumentator",
    "networkx>=3.2.1",

    # Observability
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-grpc",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-redis",

    # gRPC
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "psutil>=5.9.0",
    "black>=24.1.1",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
llm = [
    "openai>=1.10.0",
    "langchain-openai>=0.1.8",
    "langchain-core>=0.2.0",
    "langchain-text-splitters>=0.0.1",
    "tiktoken>=0.5.2",
    "sentence-transformers>=2.2.2",
]
ingestion = [
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
]
reporting = [
    "weasyprint>=60.0",
    "jinja2>=3.1.2",
    "matplotlib>=3.8.0",
]
agent_graph = [
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Use Aliyun mirror for China network (comment out if overseas)
index-url = "https://mirrors.aliyun.com/pypi/simple/"
dev-dependencies = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "psutil>=5.9.0",
    "black>=24.1.1",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    "ARG004", # unused static method argument
    "ARG005", # unused lambda argument
    "B017",  # assert-raises-exception
    "B027",  # empty method without abstract decorator
    "E402",  # module import not at top
    "E701",  # multiple statements on one line
    "E722",  # bare except
    "E741",  # ambiguous variable name
    "F402",  # import shadowed by loop variable
    "SIM102", # collapsible if
    "SIM103", # needless bool
    "SIM105", # suppressible exception
    "SIM108", # if-else block instead of if-exp
    "SIM116", # if-else block instead of dict lookup
    "SIM117", # multiple with statements
    "UP035", # deprecated import typing.* names
    "UP045", # non-pep604 optional annotation
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["ARG001", "S101"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
ignore_errors = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
markers = [
  "benchmark: performance benchmarks (set PERF_TESTS=1 to run)",
  "performance: performance/stress tests",
  "e2e: end-to-end tests",
  "postgres: requires real PostgreSQL with pgvector (run in CI or with docker-compose)",
]
