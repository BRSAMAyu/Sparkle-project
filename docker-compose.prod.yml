services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sparkle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ${SSL_CERT_DIR:-./ssl}:/etc/nginx/ssl:ro
    depends_on:
      - gateway_blue
      - gateway_green
    networks:
      - edge

  gateway_blue:
    image: ${GATEWAY_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-gateway}:${IMAGE_TAG:-latest}
    container_name: sparkle_gateway_blue
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AGENT_ADDRESS=agent:50051
      - BACKEND_URL=${BACKEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_AUTO_CREATE_BUCKET=${MINIO_AUTO_CREATE_BUCKET:-true}
      - FILE_MAX_UPLOAD_SIZE=${FILE_MAX_UPLOAD_SIZE:-52428800}
      - FILE_PRESIGN_EXPIRES_SECONDS=${FILE_PRESIGN_EXPIRES_SECONDS:-420}
      - FILE_GC_INTERVAL_MINUTES=${FILE_GC_INTERVAL_MINUTES:-60}
      - FILE_GC_GRACE_HOURS=${FILE_GC_GRACE_HOURS:-24}
      - FILE_GC_BATCH_SIZE=${FILE_GC_BATCH_SIZE:-200}
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
      - CHAOS_ALLOW_PROD=${CHAOS_ALLOW_PROD:-false}
    depends_on:
      - backend
      - agent
    networks:
      - edge
      - app

  gateway_green:
    image: ${GATEWAY_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-gateway}:${IMAGE_TAG:-latest}
    container_name: sparkle_gateway_green
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AGENT_ADDRESS=agent:50051
      - BACKEND_URL=${BACKEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_AUTO_CREATE_BUCKET=${MINIO_AUTO_CREATE_BUCKET:-true}
      - FILE_MAX_UPLOAD_SIZE=${FILE_MAX_UPLOAD_SIZE:-52428800}
      - FILE_PRESIGN_EXPIRES_SECONDS=${FILE_PRESIGN_EXPIRES_SECONDS:-420}
      - FILE_GC_INTERVAL_MINUTES=${FILE_GC_INTERVAL_MINUTES:-60}
      - FILE_GC_GRACE_HOURS=${FILE_GC_GRACE_HOURS:-24}
      - FILE_GC_BATCH_SIZE=${FILE_GC_BATCH_SIZE:-200}
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
      - CHAOS_ALLOW_PROD=${CHAOS_ALLOW_PROD:-false}
    depends_on:
      - backend
      - agent
    networks:
      - edge
      - app

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-backend}:${IMAGE_TAG:-latest}
    container_name: sparkle_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENVIRONMENT=production
      - SERVICE_ROLE=api
      - EMAIL_ENABLED=${EMAIL_ENABLED:-true}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Sparkle}
      - ENABLE_AURORA_RUNTIME_V1=true
      - AURORA_BAYESIAN_MODE=live
      - AURORA_IDIOGRAPHIC_MODE=live
      - AURORA_STAGE33_MODE=live
      - AURORA_STAGE33_EVENTS_MODE=live
      - AURORA_STAGE33_SRL_MODE=live
      - AURORA_STAGE33_WM_PROMPT_MODE=live
      - AURORA_STAGE34_MODE=live
      - AURORA_STAGE34_CAPSULE_MODE=live
      - AURORA_STAGE34_ERROR_BRIDGE_MODE=live
      - AURORA_STAGE35_MODE=live
      - AURORA_STAGE35_METACOG_ROUTER_MODE=live
      - AURORA_STAGE38_ERR_REPLAN_MODE=live
      - AURORA_STAGE38_PUSH_SCHEDULER_MODE=live
      - AURORA_DOC_CONTEXT_DOCUMENT_CONTEXT_INJECTION_MODE=live
      - AURORA_STAGE18_PUSH_POLICY_MODE=live
      - AURORA_STAGE18_PUSH_DELIVERY_MODE=live
      - AURORA_TRAITS_MODE=live
      - AURORA_TRAITS_COLDSTART_MODE=live
      - AURORA_SRL_MODE=live
      - AURORA_SRL_BRIDGE_MODE=live
      - AURORA_SRL_TRACKER_MODE=live
      - AURORA_SRL_SCAFFOLDING_CONSUME_MODE=live
      - AURORA_FORESIGHT_MODE=live
      - AURORA_METACOG_MODE=live
      - AURORA_POLICY_COMPILER_MODE=live
      - AURORA_REFLECTION_WIRE_MODE=live
      - AURORA_SCENE_MODE=live
      - AURORA_STAGE19_CONSOLIDATION_MODE=live
      - AURORA_STAGE19_LLM_EXTRACTOR_MODE=live
      - AURORA_STAGE19_WORKING_MEMORY_MODE=live
      - AURORA_STAGE21_SKILL_SELECTION_MODE=live
      - AURORA_STAGE21_SKILL_SHARE_MODE=live
      - AURORA_TRAITS_NLP_MODE=live
    depends_on:
      - db
      - redis
    networks:
      - app

  agent:
    image: ${BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-backend}:${IMAGE_TAG:-latest}
    container_name: sparkle_agent
    restart: unless-stopped
    command: python grpc_server.py
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
      - SERVICE_ROLE=grpc
      - GRPC_REQUIRE_TLS=true
      - GRPC_TLS_CERT_PATH=${GRPC_TLS_CERT_PATH}
      - GRPC_TLS_KEY_PATH=${GRPC_TLS_KEY_PATH}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - ENABLE_AURORA_RUNTIME_V1=true
      - AURORA_BAYESIAN_MODE=live
      - AURORA_IDIOGRAPHIC_MODE=live
      - AURORA_STAGE33_MODE=live
      - AURORA_STAGE33_EVENTS_MODE=live
      - AURORA_STAGE33_SRL_MODE=live
      - AURORA_STAGE33_WM_PROMPT_MODE=live
      - AURORA_STAGE34_MODE=live
      - AURORA_STAGE34_CAPSULE_MODE=live
      - AURORA_STAGE34_ERROR_BRIDGE_MODE=live
      - AURORA_STAGE35_MODE=live
      - AURORA_STAGE35_METACOG_ROUTER_MODE=live
      - AURORA_STAGE38_ERR_REPLAN_MODE=live
      - AURORA_STAGE38_PUSH_SCHEDULER_MODE=live
      - AURORA_DOC_CONTEXT_DOCUMENT_CONTEXT_INJECTION_MODE=live
      - AURORA_STAGE18_PUSH_POLICY_MODE=live
      - AURORA_STAGE18_PUSH_DELIVERY_MODE=live
      - AURORA_TRAITS_MODE=live
      - AURORA_TRAITS_COLDSTART_MODE=live
      - AURORA_SRL_MODE=live
      - AURORA_SRL_BRIDGE_MODE=live
      - AURORA_SRL_TRACKER_MODE=live
      - AURORA_SRL_SCAFFOLDING_CONSUME_MODE=live
      - AURORA_FORESIGHT_MODE=live
      - AURORA_METACOG_MODE=live
      - AURORA_POLICY_COMPILER_MODE=live
      - AURORA_REFLECTION_WIRE_MODE=live
      - AURORA_SCENE_MODE=live
      - AURORA_STAGE19_CONSOLIDATION_MODE=live
      - AURORA_STAGE19_LLM_EXTRACTOR_MODE=live
      - AURORA_STAGE19_WORKING_MEMORY_MODE=live
      - AURORA_STAGE21_SKILL_SELECTION_MODE=live
      - AURORA_STAGE21_SKILL_SHARE_MODE=live
      - AURORA_TRAITS_NLP_MODE=live
    depends_on:
      - db
      - redis
    networks:
      - app

  db:
    image: postgres:16
    container_name: sparkle_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - app

  redis:
    image: redis/redis-stack-server:latest
    container_name: sparkle_redis
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/redis-stack.conf
    networks:
      - app

  minio:
    image: minio/minio:latest
    container_name: sparkle_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - ./minio_data:/data
    networks:
      - app

  tempo:
    image: grafana/tempo:2.4.1
    container_name: sparkle_tempo
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - sparkle_tempo_data:/tmp/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
    networks:
      - app

  prometheus:
    image: prom/prometheus:latest
    container_name: sparkle_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/celery_alerts.yml:/etc/prometheus/celery_alerts.yml:ro
      - ./monitoring/sparkle_slo_alerts.yml:/etc/prometheus/sparkle_slo_alerts.yml:ro
      - ./monitoring/sparkle_production_baseline_alerts.yml:/etc/prometheus/sparkle_production_baseline_alerts.yml:ro
      - sparkle_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - gateway_blue
      - gateway_green
      - alertmanager
    networks:
      - app

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sparkle_alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    environment:
      - ALERTMANAGER_DEFAULT_WEBHOOK_URL=${ALERTMANAGER_DEFAULT_WEBHOOK_URL:-http://host.docker.internal:19093/alerts/default}
      - ALERTMANAGER_CRITICAL_WEBHOOK_URL=${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://host.docker.internal:19093/alerts/critical}
      - ALERTMANAGER_WARNING_WEBHOOK_URL=${ALERTMANAGER_WARNING_WEBHOOK_URL:-http://host.docker.internal:19093/alerts/warning}
      - ALERTMANAGER_EMAIL_TO=${ALERTMANAGER_EMAIL_TO:-ops@example.com}
      - ALERTMANAGER_EMAIL_FROM=${ALERTMANAGER_EMAIL_FROM:-sparkle-alerts@example.com}
      - ALERTMANAGER_SMTP_SMARTHOST=${ALERTMANAGER_SMTP_SMARTHOST:-smtp.example.com:587}
      - ALERTMANAGER_SMTP_AUTH_USERNAME=${ALERTMANAGER_SMTP_AUTH_USERNAME:-}
      - ALERTMANAGER_SMTP_AUTH_PASSWORD=${ALERTMANAGER_SMTP_AUTH_PASSWORD:-}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - app

  loki:
    image: grafana/loki:2.9.8
    container_name: sparkle_loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - sparkle_loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - app

  promtail:
    image: grafana/promtail:2.9.8
    container_name: sparkle_promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: sparkle_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - sparkle_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - app

networks:
  edge:
    name: sparkle_edge
  app:
    name: sparkle_app
    internal: true

volumes:
  sparkle_prometheus_data:
  sparkle_loki_data:
  sparkle_grafana_data:
  sparkle_tempo_data:
