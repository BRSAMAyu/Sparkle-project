x-resources:
  nginx: &resources_nginx
    limits:
      memory: 128M
    reservations:
      memory: 64M
  gateway: &resources_gateway
    limits:
      memory: 512M
    reservations:
      memory: 256M
  backend: &resources_backend
    limits:
      memory: 1G
    reservations:
      memory: 512M
  agent: &resources_agent
    limits:
      memory: 2G
    reservations:
      memory: 1G
  worker: &resources_worker
    limits:
      memory: 1G
    reservations:
      memory: 512M
  beat: &resources_beat
    limits:
      memory: 512M
    reservations:
      memory: 128M
  db: &resources_db
    limits:
      memory: 2G
    reservations:
      memory: 512M
  redis: &resources_redis
    limits:
      memory: 4G
    reservations:
      memory: 512M
  minio: &resources_minio
    limits:
      memory: 1G
    reservations:
      memory: 256M
  observability_small: &resources_observability_small
    limits:
      memory: 256M
    reservations:
      memory: 64M
  observability_medium: &resources_observability_medium
    limits:
      memory: 512M
    reservations:
      memory: 128M
  observability_large: &resources_observability_large
    limits:
      memory: 1G
    reservations:
      memory: 256M

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sparkle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ${SSL_CERT_DIR:-./ssl}:/etc/nginx/ssl:ro
    depends_on:
      - gateway_blue
      - gateway_green
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && kill -0 $$(cat /var/run/nginx.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources: *resources_nginx

  gateway_blue:
    image: ${GATEWAY_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-gateway}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: sparkle_gateway_blue
    restart: unless-stopped
    user: "${SPARKLE_APP_UID:-10001}:${SPARKLE_APP_GID:-10001}"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - SPARKLE_RBAC_ENABLED=${SPARKLE_RBAC_ENABLED:-false}
      - SPARKLE_GATEWAY_DATABASE_URL=${SPARKLE_GATEWAY_DATABASE_URL}
      - REDIS_URL=${SPARKLE_GATEWAY_REDIS_URL:-${REDIS_URL}}
      - REDIS_PASSWORD=${SPARKLE_GATEWAY_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - AGENT_ADDRESS=agent:50051
      - BACKEND_URL=${BACKEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_UPLOADS_ACCESS_KEY:-${MINIO_ACCESS_KEY}}
      - MINIO_SECRET_KEY=${MINIO_UPLOADS_SECRET_KEY:-${MINIO_SECRET_KEY}}
      - MINIO_BUCKET=${MINIO_UPLOADS_BUCKET:-${MINIO_BUCKET}}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_AUTO_CREATE_BUCKET=${MINIO_AUTO_CREATE_BUCKET:-true}
      - FILE_MAX_UPLOAD_SIZE=${FILE_MAX_UPLOAD_SIZE:-52428800}
      - FILE_PRESIGN_EXPIRES_SECONDS=${FILE_PRESIGN_EXPIRES_SECONDS:-420}
      - FILE_GC_INTERVAL_MINUTES=${FILE_GC_INTERVAL_MINUTES:-60}
      - FILE_GC_GRACE_HOURS=${FILE_GC_GRACE_HOURS:-24}
      - FILE_GC_BATCH_SIZE=${FILE_GC_BATCH_SIZE:-200}
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
      - CHAOS_ALLOW_PROD=${CHAOS_ALLOW_PROD:-false}
    depends_on:
      backend:
        condition: service_started
      agent:
        condition: service_started
      minio_rbac_init:
        condition: service_completed_successfully
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources: *resources_gateway

  gateway_green:
    image: ${GATEWAY_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-gateway}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: sparkle_gateway_green
    restart: unless-stopped
    user: "${SPARKLE_APP_UID:-10001}:${SPARKLE_APP_GID:-10001}"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - SPARKLE_RBAC_ENABLED=${SPARKLE_RBAC_ENABLED:-false}
      - SPARKLE_GATEWAY_DATABASE_URL=${SPARKLE_GATEWAY_DATABASE_URL}
      - REDIS_URL=${SPARKLE_GATEWAY_REDIS_URL:-${REDIS_URL}}
      - REDIS_PASSWORD=${SPARKLE_GATEWAY_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - AGENT_ADDRESS=agent:50051
      - BACKEND_URL=${BACKEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_UPLOADS_ACCESS_KEY:-${MINIO_ACCESS_KEY}}
      - MINIO_SECRET_KEY=${MINIO_UPLOADS_SECRET_KEY:-${MINIO_SECRET_KEY}}
      - MINIO_BUCKET=${MINIO_UPLOADS_BUCKET:-${MINIO_BUCKET}}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_AUTO_CREATE_BUCKET=${MINIO_AUTO_CREATE_BUCKET:-true}
      - FILE_MAX_UPLOAD_SIZE=${FILE_MAX_UPLOAD_SIZE:-52428800}
      - FILE_PRESIGN_EXPIRES_SECONDS=${FILE_PRESIGN_EXPIRES_SECONDS:-420}
      - FILE_GC_INTERVAL_MINUTES=${FILE_GC_INTERVAL_MINUTES:-60}
      - FILE_GC_GRACE_HOURS=${FILE_GC_GRACE_HOURS:-24}
      - FILE_GC_BATCH_SIZE=${FILE_GC_BATCH_SIZE:-200}
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
      - CHAOS_ALLOW_PROD=${CHAOS_ALLOW_PROD:-false}
    depends_on:
      backend:
        condition: service_started
      agent:
        condition: service_started
      minio_rbac_init:
        condition: service_completed_successfully
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources: *resources_gateway

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-backend}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: sparkle_backend
    restart: unless-stopped
    user: "${SPARKLE_APP_UID:-10001}:${SPARKLE_APP_GID:-10001}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SPARKLE_RBAC_ENABLED=${SPARKLE_RBAC_ENABLED:-false}
      - SPARKLE_ENGINE_DATABASE_URL=${SPARKLE_ENGINE_DATABASE_URL}
      - REDIS_URL=${SPARKLE_ENGINE_REDIS_URL:-${REDIS_URL}}
      - REDIS_PASSWORD=${SPARKLE_ENGINE_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENVIRONMENT=production
      - SERVICE_ROLE=api
      - EMAIL_ENABLED=${EMAIL_ENABLED:-true}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Sparkle}
      - ENABLE_AURORA_RUNTIME_V1=${ENABLE_AURORA_RUNTIME_V1:-true}
      - AURORA_BAYESIAN_MODE=${AURORA_BAYESIAN_MODE:-live}
      - AURORA_IDIOGRAPHIC_MODE=${AURORA_IDIOGRAPHIC_MODE:-live}
      - AURORA_STAGE33_MODE=${AURORA_STAGE33_MODE:-live}
      - AURORA_STAGE33_EVENTS_MODE=${AURORA_STAGE33_EVENTS_MODE:-live}
      - AURORA_STAGE33_SRL_MODE=${AURORA_STAGE33_SRL_MODE:-live}
      - AURORA_STAGE33_WM_PROMPT_MODE=${AURORA_STAGE33_WM_PROMPT_MODE:-live}
      - AURORA_STAGE34_MODE=${AURORA_STAGE34_MODE:-live}
      - AURORA_STAGE34_CAPSULE_MODE=${AURORA_STAGE34_CAPSULE_MODE:-live}
      - AURORA_STAGE34_ERROR_BRIDGE_MODE=${AURORA_STAGE34_ERROR_BRIDGE_MODE:-live}
      - AURORA_STAGE35_MODE=${AURORA_STAGE35_MODE:-live}
      - AURORA_STAGE35_METACOG_ROUTER_MODE=${AURORA_STAGE35_METACOG_ROUTER_MODE:-live}
      - AURORA_STAGE38_ERR_REPLAN_MODE=${AURORA_STAGE38_ERR_REPLAN_MODE:-live}
      - AURORA_STAGE38_PUSH_SCHEDULER_MODE=${AURORA_STAGE38_PUSH_SCHEDULER_MODE:-live}
      - AURORA_DOC_CONTEXT_DOCUMENT_CONTEXT_INJECTION_MODE=${AURORA_DOC_CONTEXT_DOCUMENT_CONTEXT_INJECTION_MODE:-live}
      - AURORA_STAGE18_PUSH_POLICY_MODE=${AURORA_STAGE18_PUSH_POLICY_MODE:-live}
      - AURORA_STAGE18_PUSH_DELIVERY_MODE=${AURORA_STAGE18_PUSH_DELIVERY_MODE:-live}
      - AURORA_TRAITS_MODE=${AURORA_TRAITS_MODE:-live}
      - AURORA_TRAITS_COLDSTART_MODE=${AURORA_TRAITS_COLDSTART_MODE:-live}
      - AURORA_SRL_MODE=${AURORA_SRL_MODE:-live}
      - AURORA_SRL_BRIDGE_MODE=${AURORA_SRL_BRIDGE_MODE:-live}
      - AURORA_SRL_TRACKER_MODE=${AURORA_SRL_TRACKER_MODE:-live}
      - AURORA_SRL_SCAFFOLDING_CONSUME_MODE=${AURORA_SRL_SCAFFOLDING_CONSUME_MODE:-live}
      - AURORA_FORESIGHT_MODE=${AURORA_FORESIGHT_MODE:-live}
      - AURORA_METACOG_MODE=${AURORA_METACOG_MODE:-live}
      - AURORA_POLICY_COMPILER_MODE=${AURORA_POLICY_COMPILER_MODE:-live}
      - AURORA_REFLECTION_WIRE_MODE=${AURORA_REFLECTION_WIRE_MODE:-live}
      - AURORA_SCENE_MODE=${AURORA_SCENE_MODE:-live}
      - AURORA_STAGE19_CONSOLIDATION_MODE=${AURORA_STAGE19_CONSOLIDATION_MODE:-live}
      - AURORA_STAGE19_LLM_EXTRACTOR_MODE=${AURORA_STAGE19_LLM_EXTRACTOR_MODE:-live}
      - AURORA_STAGE19_WORKING_MEMORY_MODE=${AURORA_STAGE19_WORKING_MEMORY_MODE:-live}
      - AURORA_STAGE21_SKILL_SELECTION_MODE=${AURORA_STAGE21_SKILL_SELECTION_MODE:-live}
      - AURORA_STAGE21_SKILL_SHARE_MODE=${AURORA_STAGE21_SKILL_SHARE_MODE:-live}
      - AURORA_TRAITS_NLP_MODE=${AURORA_TRAITS_NLP_MODE:-live}
      # Aurora: Stage 37-40, DualCore, Privacy
      - AURORA_STAGE37_LLM_SAFETY_MODE=${AURORA_STAGE37_LLM_SAFETY_MODE:-live}
      - AURORA_STAGE39_MODE=${AURORA_STAGE39_MODE:-live}
      - AURORA_STAGE39_SCAFFOLDING_PROMPT_MODE=${AURORA_STAGE39_SCAFFOLDING_PROMPT_MODE:-live}
      - AURORA_STAGE39_COGLOAD_ROUTE_MODE=${AURORA_STAGE39_COGLOAD_ROUTE_MODE:-live}
      - AURORA_STAGE39_GALAXY_INJECT_MODE=${AURORA_STAGE39_GALAXY_INJECT_MODE:-live}
      - AURORA_STAGE40_CALENDAR_MODE=${AURORA_STAGE40_CALENDAR_MODE:-live}
      - AURORA_DUAL_CORE_ROUTER_MODE=${AURORA_DUAL_CORE_ROUTER_MODE:-live}
      - AURORA_PRIVACY_PII_REDACTION_MODE=${AURORA_PRIVACY_PII_REDACTION_MODE:-live}
    depends_on:
      - db
      - redis
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources: *resources_backend

  agent:
    image: ${BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-backend}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: sparkle_agent
    restart: unless-stopped
    command: python grpc_server.py
    user: "${SPARKLE_APP_UID:-10001}:${SPARKLE_APP_GID:-10001}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SPARKLE_RBAC_ENABLED=${SPARKLE_RBAC_ENABLED:-false}
      - SPARKLE_ENGINE_DATABASE_URL=${SPARKLE_ENGINE_DATABASE_URL}
      - REDIS_URL=${SPARKLE_ENGINE_REDIS_URL:-${REDIS_URL}}
      - REDIS_PASSWORD=${SPARKLE_ENGINE_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
      - SERVICE_ROLE=grpc
      - GRPC_REQUIRE_TLS=true
      - GRPC_TLS_CERT_PATH=${GRPC_TLS_CERT_PATH}
      - GRPC_TLS_KEY_PATH=${GRPC_TLS_KEY_PATH}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
      - ENABLE_AURORA_RUNTIME_V1=${ENABLE_AURORA_RUNTIME_V1:-true}
      - AURORA_BAYESIAN_MODE=${AURORA_BAYESIAN_MODE:-live}
      - AURORA_IDIOGRAPHIC_MODE=${AURORA_IDIOGRAPHIC_MODE:-live}
      - AURORA_STAGE33_MODE=${AURORA_STAGE33_MODE:-live}
      - AURORA_STAGE33_EVENTS_MODE=${AURORA_STAGE33_EVENTS_MODE:-live}
      - AURORA_STAGE33_SRL_MODE=${AURORA_STAGE33_SRL_MODE:-live}
      - AURORA_STAGE33_WM_PROMPT_MODE=${AURORA_STAGE33_WM_PROMPT_MODE:-live}
      - AURORA_STAGE34_MODE=${AURORA_STAGE34_MODE:-live}
      - AURORA_STAGE34_CAPSULE_MODE=${AURORA_STAGE34_CAPSULE_MODE:-live}
      - AURORA_STAGE34_ERROR_BRIDGE_MODE=${AURORA_STAGE34_ERROR_BRIDGE_MODE:-live}
      - AURORA_STAGE35_MODE=${AURORA_STAGE35_MODE:-live}
      - AURORA_STAGE35_METACOG_ROUTER_MODE=${AURORA_STAGE35_METACOG_ROUTER_MODE:-live}
      - AURORA_STAGE38_ERR_REPLAN_MODE=${AURORA_STAGE38_ERR_REPLAN_MODE:-live}
      - AURORA_STAGE38_PUSH_SCHEDULER_MODE=${AURORA_STAGE38_PUSH_SCHEDULER_MODE:-live}
      - AURORA_DOC_CONTEXT_DOCUMENT_CONTEXT_INJECTION_MODE=${AURORA_DOC_CONTEXT_DOCUMENT_CONTEXT_INJECTION_MODE:-live}
      - AURORA_STAGE18_PUSH_POLICY_MODE=${AURORA_STAGE18_PUSH_POLICY_MODE:-live}
      - AURORA_STAGE18_PUSH_DELIVERY_MODE=${AURORA_STAGE18_PUSH_DELIVERY_MODE:-live}
      - AURORA_TRAITS_MODE=${AURORA_TRAITS_MODE:-live}
      - AURORA_TRAITS_COLDSTART_MODE=${AURORA_TRAITS_COLDSTART_MODE:-live}
      - AURORA_SRL_MODE=${AURORA_SRL_MODE:-live}
      - AURORA_SRL_BRIDGE_MODE=${AURORA_SRL_BRIDGE_MODE:-live}
      - AURORA_SRL_TRACKER_MODE=${AURORA_SRL_TRACKER_MODE:-live}
      - AURORA_SRL_SCAFFOLDING_CONSUME_MODE=${AURORA_SRL_SCAFFOLDING_CONSUME_MODE:-live}
      - AURORA_FORESIGHT_MODE=${AURORA_FORESIGHT_MODE:-live}
      - AURORA_METACOG_MODE=${AURORA_METACOG_MODE:-live}
      - AURORA_POLICY_COMPILER_MODE=${AURORA_POLICY_COMPILER_MODE:-live}
      - AURORA_REFLECTION_WIRE_MODE=${AURORA_REFLECTION_WIRE_MODE:-live}
      - AURORA_SCENE_MODE=${AURORA_SCENE_MODE:-live}
      - AURORA_STAGE19_CONSOLIDATION_MODE=${AURORA_STAGE19_CONSOLIDATION_MODE:-live}
      - AURORA_STAGE19_LLM_EXTRACTOR_MODE=${AURORA_STAGE19_LLM_EXTRACTOR_MODE:-live}
      - AURORA_STAGE19_WORKING_MEMORY_MODE=${AURORA_STAGE19_WORKING_MEMORY_MODE:-live}
      - AURORA_STAGE21_SKILL_SELECTION_MODE=${AURORA_STAGE21_SKILL_SELECTION_MODE:-live}
      - AURORA_STAGE21_SKILL_SHARE_MODE=${AURORA_STAGE21_SKILL_SHARE_MODE:-live}
      - AURORA_TRAITS_NLP_MODE=${AURORA_TRAITS_NLP_MODE:-live}
      # Aurora: Stage 37-40, DualCore, Privacy
      - AURORA_STAGE37_LLM_SAFETY_MODE=${AURORA_STAGE37_LLM_SAFETY_MODE:-live}
      - AURORA_STAGE39_MODE=${AURORA_STAGE39_MODE:-live}
      - AURORA_STAGE39_SCAFFOLDING_PROMPT_MODE=${AURORA_STAGE39_SCAFFOLDING_PROMPT_MODE:-live}
      - AURORA_STAGE39_COGLOAD_ROUTE_MODE=${AURORA_STAGE39_COGLOAD_ROUTE_MODE:-live}
      - AURORA_STAGE39_GALAXY_INJECT_MODE=${AURORA_STAGE39_GALAXY_INJECT_MODE:-live}
      - AURORA_STAGE40_CALENDAR_MODE=${AURORA_STAGE40_CALENDAR_MODE:-live}
      - AURORA_DUAL_CORE_ROUTER_MODE=${AURORA_DUAL_CORE_ROUTER_MODE:-live}
      - AURORA_PRIVACY_PII_REDACTION_MODE=${AURORA_PRIVACY_PII_REDACTION_MODE:-live}
    depends_on:
      - db
      - redis
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',50051)); s.close()\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources: *resources_agent

  celery_worker:
    image: ${BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-backend}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: sparkle_celery_worker
    restart: unless-stopped
    user: "${SPARKLE_APP_UID:-10001}:${SPARKLE_APP_GID:-10001}"
    command: celery -A app.core.celery_app worker -l warning -Q high_priority,default,low_priority --concurrency=4
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SPARKLE_RBAC_ENABLED=${SPARKLE_RBAC_ENABLED:-false}
      - SPARKLE_ENGINE_DATABASE_URL=${SPARKLE_ENGINE_DATABASE_URL}
      - SPARKLE_CELERY_DATABASE_URL=${SPARKLE_CELERY_DATABASE_URL}
      - REDIS_URL=${SPARKLE_CELERY_REDIS_URL:-${REDIS_URL}}
      - REDIS_PASSWORD=${SPARKLE_CELERY_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - CELERY_BROKER_URL=${SPARKLE_CELERY_BROKER_URL:-${CELERY_BROKER_URL}}
      - CELERY_RESULT_BACKEND=${SPARKLE_CELERY_RESULT_BACKEND:-${CELERY_RESULT_BACKEND}}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENVIRONMENT=production
      - SERVICE_ROLE=worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      - db
      - redis
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$${HOSTNAME} 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    deploy:
      resources: *resources_worker

  celery_glm_batch_worker:
    image: ${BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-backend}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: sparkle_celery_glm_batch_worker
    restart: unless-stopped
    user: "${SPARKLE_APP_UID:-10001}:${SPARKLE_APP_GID:-10001}"
    command: celery -A app.core.celery_app worker -l warning -Q glm_batch --autoscale=6,2 --hostname=glm-batch@%h
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SPARKLE_RBAC_ENABLED=${SPARKLE_RBAC_ENABLED:-false}
      - SPARKLE_ENGINE_DATABASE_URL=${SPARKLE_ENGINE_DATABASE_URL}
      - SPARKLE_CELERY_DATABASE_URL=${SPARKLE_CELERY_DATABASE_URL}
      - REDIS_URL=${SPARKLE_CELERY_REDIS_URL:-${REDIS_URL}}
      - REDIS_PASSWORD=${SPARKLE_CELERY_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - CELERY_BROKER_URL=${SPARKLE_CELERY_BROKER_URL:-${CELERY_BROKER_URL}}
      - CELERY_RESULT_BACKEND=${SPARKLE_CELERY_RESULT_BACKEND:-${CELERY_RESULT_BACKEND}}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENVIRONMENT=production
      - SERVICE_ROLE=celery-glm-batch
      - GLM_BATCH_MAX_CONCURRENCY=${GLM_BATCH_MAX_CONCURRENCY:-6}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      - db
      - redis
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d glm-batch@$${HOSTNAME} 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
    deploy:
      resources: *resources_worker

  celery_beat:
    image: ${BACKEND_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER:-local}/sparkle-backend}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: sparkle_celery_beat
    restart: unless-stopped
    user: "${SPARKLE_APP_UID:-10001}:${SPARKLE_APP_GID:-10001}"
    command: celery -A app.core.celery_app beat -l warning
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SPARKLE_RBAC_ENABLED=${SPARKLE_RBAC_ENABLED:-false}
      - SPARKLE_ENGINE_DATABASE_URL=${SPARKLE_ENGINE_DATABASE_URL}
      - SPARKLE_CELERY_DATABASE_URL=${SPARKLE_CELERY_DATABASE_URL}
      - REDIS_URL=${SPARKLE_CELERY_REDIS_URL:-${REDIS_URL}}
      - REDIS_PASSWORD=${SPARKLE_CELERY_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - CELERY_BROKER_URL=${SPARKLE_CELERY_BROKER_URL:-${CELERY_BROKER_URL}}
      - CELERY_RESULT_BACKEND=${SPARKLE_CELERY_RESULT_BACKEND:-${CELERY_RESULT_BACKEND}}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - ENVIRONMENT=production
      - SERVICE_ROLE=beat
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      - db
      - redis
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources: *resources_beat

  db:
    image: pgvector/pgvector:pg16
    container_name: sparkle_db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources: *resources_db

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: sparkle_redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_GATEWAY_PASSWORD=${SPARKLE_GATEWAY_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - REDIS_ENGINE_PASSWORD=${SPARKLE_ENGINE_REDIS_PASSWORD:-${REDIS_PASSWORD}}
      - REDIS_CELERY_PASSWORD=${SPARKLE_CELERY_REDIS_PASSWORD:-${REDIS_PASSWORD}}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      cat >/tmp/users.acl <<EOF
      user default on >$${REDIS_PASSWORD} ~* +@all
      user gateway on >$${REDIS_GATEWAY_PASSWORD} ~gateway:* ~chat:* ~session:* ~auth:* ~ws:* ~file:* ~cqrs:* ~rate:* ~ratelimit:* ~health:* +@read +@write +@connection +@pubsub -@admin -@dangerous
      user engine on >$${REDIS_ENGINE_PASSWORD} ~engine:* ~aurora:* ~galaxy:* ~signals:* ~context:* ~user:* ~cache:* ~memory:* ~llm:* ~health:* +@read +@write +@connection +@pubsub -@admin -@dangerous
      user celery on >$${REDIS_CELERY_PASSWORD} ~celery* ~_kombu* ~kombu* ~engine:* ~aurora:* ~signals:* ~jobs:* ~health:* +@read +@write +@connection +@pubsub +@stream -@admin -@dangerous
      EOF
      exec redis-stack-server /redis-stack.conf
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/redis-stack.conf
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources: *resources_redis

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sparkle_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - ./minio_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources: *resources_minio

  minio_rbac_init:
    image: minio/mc:RELEASE.2025-09-07T16-13-09Z
    container_name: sparkle_minio_rbac_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      - MINIO_UPLOADS_BUCKET=${MINIO_UPLOADS_BUCKET:-${MINIO_BUCKET}}
      - MINIO_EXPORTS_BUCKET=${MINIO_EXPORTS_BUCKET:-sparkle-exports}
      - MINIO_BACKUPS_BUCKET=${MINIO_BACKUPS_BUCKET:-sparkle-backups}
      - MINIO_UPLOADS_ACCESS_KEY=${MINIO_UPLOADS_ACCESS_KEY:-${MINIO_ACCESS_KEY}}
      - MINIO_UPLOADS_SECRET_KEY=${MINIO_UPLOADS_SECRET_KEY:-${MINIO_SECRET_KEY}}
      - MINIO_EXPORTS_ACCESS_KEY=${MINIO_EXPORTS_ACCESS_KEY:-sparkle_exports}
      - MINIO_EXPORTS_SECRET_KEY=${MINIO_EXPORTS_SECRET_KEY:-${MINIO_SECRET_KEY}}
      - MINIO_BACKUPS_ACCESS_KEY=${MINIO_BACKUPS_ACCESS_KEY:-sparkle_backups}
      - MINIO_BACKUPS_SECRET_KEY=${MINIO_BACKUPS_SECRET_KEY:-${MINIO_SECRET_KEY}}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
      mc mb -p "local/$$MINIO_UPLOADS_BUCKET" "local/$$MINIO_EXPORTS_BUCKET" "local/$$MINIO_BACKUPS_BUCKET"
      cat >/tmp/uploads-policy.json <<EOF
      {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket"],"Resource":["arn:aws:s3:::$$MINIO_UPLOADS_BUCKET","arn:aws:s3:::$$MINIO_UPLOADS_BUCKET/*"]}]}
      EOF
      cat >/tmp/exports-policy.json <<EOF
      {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket"],"Resource":["arn:aws:s3:::$$MINIO_EXPORTS_BUCKET","arn:aws:s3:::$$MINIO_EXPORTS_BUCKET/*"]}]}
      EOF
      cat >/tmp/backups-policy.json <<EOF
      {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket"],"Resource":["arn:aws:s3:::$$MINIO_BACKUPS_BUCKET","arn:aws:s3:::$$MINIO_BACKUPS_BUCKET/*"]}]}
      EOF
      mc admin user add local "$$MINIO_UPLOADS_ACCESS_KEY" "$$MINIO_UPLOADS_SECRET_KEY" || true
      mc admin user add local "$$MINIO_EXPORTS_ACCESS_KEY" "$$MINIO_EXPORTS_SECRET_KEY" || true
      mc admin user add local "$$MINIO_BACKUPS_ACCESS_KEY" "$$MINIO_BACKUPS_SECRET_KEY" || true
      mc admin policy create local sparkle-uploads /tmp/uploads-policy.json || mc admin policy update local sparkle-uploads /tmp/uploads-policy.json
      mc admin policy create local sparkle-exports /tmp/exports-policy.json || mc admin policy update local sparkle-exports /tmp/exports-policy.json
      mc admin policy create local sparkle-backups /tmp/backups-policy.json || mc admin policy update local sparkle-backups /tmp/backups-policy.json
      mc admin policy attach local sparkle-uploads --user "$$MINIO_UPLOADS_ACCESS_KEY"
      mc admin policy attach local sparkle-exports --user "$$MINIO_EXPORTS_ACCESS_KEY"
      mc admin policy attach local sparkle-backups --user "$$MINIO_BACKUPS_ACCESS_KEY"
    networks:
      - app

  tempo:
    image: grafana/tempo:2.4.1
    container_name: sparkle_tempo
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yaml"
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - sparkle_tempo_data:/tmp/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources: *resources_observability_medium

  prometheus:
    image: quay.io/prometheus/prometheus:v2.53.4
    container_name: sparkle_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/celery_alerts.yml:/etc/prometheus/celery_alerts.yml:ro
      - ./monitoring/sparkle_slo_alerts.yml:/etc/prometheus/sparkle_slo_alerts.yml:ro
      - ./monitoring/sparkle_production_baseline_alerts.yml:/etc/prometheus/sparkle_production_baseline_alerts.yml:ro
      - ./monitoring/sparkle_t6_slo_alerts.yml:/etc/prometheus/sparkle_t6_slo_alerts.yml:ro
      - ./monitoring/sparkle_recording_rules.yml:/etc/prometheus/sparkle_recording_rules.yml:ro
      - ./monitoring/sqam_alerts.yml:/etc/prometheus/sqam_alerts.yml:ro
      - sparkle_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - gateway_blue
      - gateway_green
      - alertmanager
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources: *resources_observability_large

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sparkle_alertmanager
    restart: unless-stopped
    command:
      - "/bin/sh"
      - "-c"
      - "envsubst < /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && /bin/alertmanager --config.file=/tmp/alertmanager.yml"
    environment:
      - ALERTMANAGER_DEFAULT_WEBHOOK_URL=${ALERTMANAGER_DEFAULT_WEBHOOK_URL:?ALERTMANAGER_DEFAULT_WEBHOOK_URL must be set for production alerts}
      - ALERTMANAGER_CRITICAL_WEBHOOK_URL=${ALERTMANAGER_CRITICAL_WEBHOOK_URL:?ALERTMANAGER_CRITICAL_WEBHOOK_URL must be set for production alerts}
      - ALERTMANAGER_WARNING_WEBHOOK_URL=${ALERTMANAGER_WARNING_WEBHOOK_URL:?ALERTMANAGER_WARNING_WEBHOOK_URL must be set for production alerts}
      - ALERTMANAGER_EMAIL_TO=${ALERTMANAGER_EMAIL_TO:-ops@example.com}
      - ALERTMANAGER_EMAIL_FROM=${ALERTMANAGER_EMAIL_FROM:-sparkle-alerts@example.com}
      - ALERTMANAGER_SMTP_SMARTHOST=${ALERTMANAGER_SMTP_SMARTHOST:-smtp.example.com:587}
      - ALERTMANAGER_SMTP_AUTH_USERNAME=${ALERTMANAGER_SMTP_AUTH_USERNAME:-}
      - ALERTMANAGER_SMTP_AUTH_PASSWORD=${ALERTMANAGER_SMTP_AUTH_PASSWORD:-}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources: *resources_observability_small

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: sparkle_node_exporter
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^(/dev|/proc|/sys|/var/lib/docker/.+|/var/lib/containerd/.+)($$|/)"
      - "--collector.systemd"
      - "--collector.processes"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources: *resources_observability_small

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: sparkle_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources: *resources_observability_small

  loki:
    image: grafana/loki:2.9.8
    container_name: sparkle_loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - sparkle_loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources: *resources_observability_large

  promtail:
    image: grafana/promtail:2.9.8
    container_name: sparkle_promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - app
    healthcheck:
      test: ["CMD", "/usr/bin/promtail", "-config.file=/etc/promtail/config.yml", "-check-syntax"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources: *resources_observability_small

  grafana:
    image: grafana/grafana-oss:11.1.4
    container_name: sparkle_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - sparkle_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources: *resources_observability_medium

networks:
  edge:
    name: sparkle_edge
  app:
    name: sparkle_app
    internal: true

volumes:
  sparkle_prometheus_data:
  sparkle_loki_data:
  sparkle_grafana_data:
  sparkle_tempo_data:
