services:
  routing_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkle_routing_service
    command: ["uvicorn", "services.routing.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@${POSTGRES_HOST:-sparkle_db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-sparkle}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me}@${REDIS_HOST:-sparkle_redis}:${REDIS_PORT:-6379}/0
    depends_on:
      redis:
        condition: service_started

  learning_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkle_learning_service
    command: ["uvicorn", "services.learning.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@${POSTGRES_HOST:-sparkle_db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-sparkle}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me}@${REDIS_HOST:-sparkle_redis}:${REDIS_PORT:-6379}/0
    depends_on:
      redis:
        condition: service_started

  visualization_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkle_visualization_service
    command: ["uvicorn", "services.visualization.main:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me}@${POSTGRES_HOST:-sparkle_db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-sparkle}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me}@${REDIS_HOST:-sparkle_redis}:${REDIS_PORT:-6379}/0
    depends_on:
      redis:
        condition: service_started
