# Unified Sparkle Docker Infrastructure - Stabilized Communication
services:
  sparkle_db:
    image: pgvector/pgvector:pg16
    container_name: sparkle_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sparkle
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=change-me
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: sparkle_redis
    ports:
      - "6379:6379"
    command: redis-stack-server --requirepass change-me
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "change-me", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sparkle_minio
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data

  sparkle_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkle_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:change-me@sparkle_db:5432/sparkle
      - REDIS_URL=redis://:change-me@sparkle_redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://sparkle_tempo:4317
    volumes:
      - ./backend:/app
      - ./data/dictionaries:/app/data/dictionaries:ro
    depends_on:
      sparkle_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: root

  sparkle_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkle_agent
    env_file:
      - .env
    command: python grpc_server.py
    ports:
      - "50051:50051"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:change-me@sparkle_db:5432/sparkle
      - REDIS_URL=redis://:change-me@sparkle_redis:6379/0
      - INTERNAL_API_KEY=dev_internal_key
      - JWT_SECRET=Jk8Lm2Np5Qr9St3Uv7Wx1Yz4Ab6Cd0Ef8Gh3Ij7Kl2Mn9Op4Qr6Sv0Tw1Xy5Za
    volumes:
      - ./backend:/app
    depends_on:
      sparkle_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A app.core.celery_app worker -l info -Q high_priority,default,low_priority --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:change-me@sparkle_db:5432/sparkle
      - CELERY_BROKER_URL=redis://:change-me@sparkle_redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:change-me@sparkle_redis:6379/2
    depends_on:
      sparkle_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  sparkle_gateway:
    build: 
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: sparkle_gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:change-me@sparkle_db:5432/sparkle
      - REDIS_URL=sparkle_redis:6379
      - REDIS_PASSWORD=change-me
      - AGENT_ADDRESS=sparkle_agent:50051
      - BACKEND_URL=http://sparkle_api:8000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_USE_SSL=false
      - JWT_SECRET=Jk8Lm2Np5Qr9St3Uv7Wx1Yz4Ab6Cd0Ef8Gh3Ij7Kl2Mn9Op4Qr6Sv0Tw1Xy5Za

    depends_on:
      sparkle_api:
        condition: service_started
      sparkle_agent:
        condition: service_started
      sparkle_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # ==================== Monitoring Simplified ====================
  tempo:
    image: grafana/tempo:latest
    container_name: sparkle_tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317"
