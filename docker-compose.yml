# Unified Sparkle Docker Infrastructure - Stabilized Communication
services:
  sparkle_db:
    build:
      context: .
      dockerfile: docker/pgvector-age.Dockerfile
      args:
        AGE_REF: PG16/v1.6.0-rc0
    container_name: sparkle_db
    ports:
      - "${SPARKLE_DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  sparkle_age_init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkle_age_init
    env_file:
      - .env
    command: python scripts/init_age_extension.py
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sparkle_db:5432/${POSTGRES_DB}
      - POSTGRES_HOST=sparkle_db
      - POSTGRES_PORT=5432
      - SERVICE_ROLE=age-init
    volumes:
      - ./backend:/app
    depends_on:
      sparkle_db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis/redis-stack-server:latest
    container_name: sparkle_redis
    ports:
      - "6379:6379"
    command: redis-stack-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sparkle_minio
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "${SPARKLE_MINIO_API_PORT:-9000}:9000"
      - "${SPARKLE_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - sparkle_minio_data:/data

  sparkle_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkle_api
    env_file:
      - .env
    ports:
      - "${SPARKLE_API_PORT:-8000}:8000"
    environment:
      # Override localhost URLs from .env with correct Docker service names
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sparkle_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@sparkle_redis:6379/0
      - POSTGRES_HOST=sparkle_db
      - POSTGRES_PORT=5432
      - REDIS_HOST=sparkle_redis
      - SERVICE_ROLE=api
      - RUN_MIGRATIONS=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://sparkle_tempo:4317
    volumes:
      - ./backend:/app
      - ./data/dictionaries:/app/data/dictionaries:ro
    depends_on:
      sparkle_db:
        condition: service_healthy
      sparkle_age_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    user: root
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sparkle_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparkle_agent
    env_file:
      - .env
    command: python grpc_server.py
    ports:
      - "${SPARKLE_AGENT_PORT:-50051}:50051"
    environment:
      # Override localhost URLs from .env with correct Docker service names
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sparkle_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@sparkle_redis:6379/0
      - POSTGRES_HOST=sparkle_db
      - POSTGRES_PORT=5432
      - REDIS_HOST=sparkle_redis
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_ROLE=grpc
    volumes:
      - ./backend:/app
    depends_on:
      sparkle_db:
        condition: service_healthy
      sparkle_age_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G  # LLM processing requires more memory
        reservations:
          memory: 1G
    # Probe gRPC port directly: a TCP connection to 50051 means the server is up
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',50051)); s.close()\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A app.core.celery_app worker -l info -Q high_priority,default,low_priority --concurrency=4
    environment:
      # Override localhost URLs from .env with correct Docker service names
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sparkle_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@sparkle_redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@sparkle_redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@sparkle_redis:6379/2
      - POSTGRES_HOST=sparkle_db
      - POSTGRES_PORT=5432
      - REDIS_HOST=sparkle_redis
      - SERVICE_ROLE=celery
    depends_on:
      sparkle_db:
        condition: service_healthy
      sparkle_age_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$${HOSTNAME} 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s

  celery_glm_batch_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A app.core.celery_app worker -l info -Q glm_batch --concurrency=2 --hostname=glm-batch@%h
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sparkle_db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@sparkle_redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@sparkle_redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@sparkle_redis:6379/2
      - POSTGRES_HOST=sparkle_db
      - POSTGRES_PORT=5432
      - REDIS_HOST=sparkle_redis
      - SERVICE_ROLE=celery-glm-batch
      - GLM_BATCH_MAX_CONCURRENCY=2
    depends_on:
      sparkle_db:
        condition: service_healthy
      sparkle_age_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d glm-batch@$${HOSTNAME} 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s

  sparkle_gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: sparkle_gateway
    env_file:
      - .env
    ports:
      - "${SPARKLE_GATEWAY_PORT:-8080}:8080"
    environment:
      # Explicit container-internal addresses (override .env localhost values)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sparkle_db:5432/${POSTGRES_DB}
      - POSTGRES_HOST=sparkle_db
      - POSTGRES_PORT=5432
      - REDIS_HOST=sparkle_redis
      - REDIS_URL=sparkle_redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AGENT_ADDRESS=sparkle_agent:50051
      - BACKEND_URL=http://sparkle_api:8000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_USE_SSL=false
      - JWT_SECRET=${JWT_SECRET}

    depends_on:
      sparkle_api:
        condition: service_started
      sparkle_agent:
        condition: service_started
      sparkle_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==================== Monitoring Simplified ====================
  tempo:
    image: grafana/tempo:latest
    container_name: sparkle_tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml
    ports:
      - "4317:4317"

volumes:
  sparkle_minio_data:
