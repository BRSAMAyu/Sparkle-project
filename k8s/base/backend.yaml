apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkle-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sparkle-backend
  template:
    metadata:
      labels:
        app: sparkle-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/sparkle/backend:latest
        ports:
        - containerPort: 50051
          name: grpc
        - containerPort: 8000
          name: http
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://tempo:4317"
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sparkle-backend
spec:
  selector:
    app: sparkle-backend
  ports:
  - port: 50051
    targetPort: 50051
    name: grpc
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP
