# Secrets are managed via External Secrets Operator or envsubst pre-processing.
# Do NOT store real credentials here — use CI/CD or sealed-secrets for production.
#
# Usage with envsubst:
#   envsubst < secrets-and-configmaps.yaml | kubectl apply -f -
#
# Required environment variables:
#   OPENAI_API_KEY, JWT_SECRET_KEY, ENCRYPTION_KEY
#   JWT_PUBLIC_KEY, JWT_PRIVATE_KEY, ADMIN_SECRET
#   DB_USER, DB_PASSWORD, REDIS_ADDR

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@sparkle_db:5432/sparkle"
  REDIS_URL: "redis://${REDIS_ADDR}:6379/0"
  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_LOG_LEVEL: "info"
  GRPC_PORT: "50051"
  HTTP_PORT: "8000"
  CORS_ORIGINS: '["https://sparkle.app"]'
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
type: Opaque
stringData:
  DB_DSN: "postgres://${DB_USER}:${DB_PASSWORD}@sparkle_db:5432/sparkle?sslmode=require"
  REDIS_ADDR: "${REDIS_ADDR}:6379"
  JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
  JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
  ADMIN_SECRET: "${ADMIN_SECRET}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  LOG_LEVEL: "info"
  GIN_MODE: "release"
  GATEWAY_PORT: "8080"
  GRPC_ADDR: "sparkle-backend:50051"
  CORS_ALLOWED_ORIGINS: '["https://sparkle.app"]'
