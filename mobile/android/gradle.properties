# 内存纪律（AGENTS 2026-09）：16GB 物理内存，daemon 上限收紧到 Xmx2g+metaspace 1g；
# 旧值 -Xmx8G/-XX:MaxMetaspaceSize=4G 可合法吃 12G+，属整机卡死事故类配置
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# 应用包名 - 修改为你自己的域名反向格式
# 例如: com.company.sparkle 或 ai.sparkle.app
APPLICATION_ID=com.sparkle.app

# TLS 配置 - 解决国内网络 TLS 握手问题
systemProp.https.protocols=TLSv1.2,TLSv1.3

# 如果需要代理，取消注释并配置
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
