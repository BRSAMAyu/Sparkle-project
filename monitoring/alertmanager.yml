global:
  resolve_timeout: 5m
  smtp_from: ${ALERTMANAGER_EMAIL_FROM:-sparkle-alerts@example.com}
  smtp_smarthost: ${ALERTMANAGER_SMTP_SMARTHOST:-smtp.example.com:587}
  smtp_auth_username: ${ALERTMANAGER_SMTP_AUTH_USERNAME:-}
  smtp_auth_password: ${ALERTMANAGER_SMTP_AUTH_PASSWORD:-}

route:
  receiver: default-webhook
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-webhook
      continue: true
    - matchers:
        - severity="warning"
      receiver: warning-webhook
      continue: true

receivers:
  - name: default-webhook
    webhook_configs:
      - url: ${ALERTMANAGER_DEFAULT_WEBHOOK_URL:-http://host.docker.internal:19093/alerts/default}
        send_resolved: true
  - name: critical-webhook
    webhook_configs:
      - url: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://host.docker.internal:19093/alerts/critical}
        send_resolved: true
  - name: warning-webhook
    webhook_configs:
      - url: ${ALERTMANAGER_WARNING_WEBHOOK_URL:-http://host.docker.internal:19093/alerts/warning}
        send_resolved: true
  - name: email-fallback
    email_configs:
      - to: ${ALERTMANAGER_EMAIL_TO:-ops@example.com}
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'service']
