global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "celery_alerts.yml"
  - "sparkle_slo_alerts.yml"
  - "sparkle_production_baseline_alerts.yml"
  - "sqam_alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    basic_auth:
      username: 'admin'
      password: 'change-me-in-prod'

  - job_name: 'sparkle_gateway'
    static_configs:
      - targets: ['sparkle_gateway:8080']

  - job_name: 'sparkle_backend'
    static_configs:
      - targets: ['sparkle_api:8000']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
