global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "celery_alerts.yml"
  - "sparkle_slo_alerts.yml"
  - "sparkle_production_baseline_alerts.yml"
  - "sparkle_t6_slo_alerts.yml"
  - "sparkle_recording_rules.yml"
  - "sqam_alerts.yml"

# ── 抓取目标按形制解耦（file_sd，D-DEPLOY-FIX G1 登记债务的彻底解）───────────
# 本文件同时被 dev（docker-compose.yml 基座）与 prod（docker-compose.prod.yml）
# 的 prometheus 服务挂载，而两形制的服务拓扑不同：网关 dev 单实例
# sparkle_gateway vs prod 蓝绿 gateway_blue+green；引擎 dev sparkle_api vs prod
# backend——共用一份写死的目标必然一侧解析不到（wt186 对齐 prod 后 dev 侧
# 网关/引擎两 job 反转为 no-data 的教训）。故把环境相关目标拆出本文件：
#
#   - 环境相关 job 一律 file_sd_configs，指向 /etc/prometheus/targets/<名>.yml；
#   - dev compose 挂 ./monitoring/targets/dev → 该路径，prod compose 挂
#     ./monitoring/targets/prod → 同一路径：**挂载面即形制开关**，规则文件与
#     Grafana 面板零改动，无需 PROMETHEUS_ARGS 或配置双份；
#   - 两目录文件同名同构（gateway/backend/node/cadvisor 四件）：backend.yml 由
#     sparkle_backend 与四个模块 metrics job 共用；prod 比 dev 多 node/cadvisor
#     的真实目标（dev 无对应服务，文件留空 [] → job 无序列，no-data 而非常驻
#     down）；新增环境 = 新增一个同名目录 + compose 改一行挂载；
#   - 目标名与所在形制的服务真实名逐字对齐（Docker user-defined 网络按
#     「服务名 + container_name」双轨解析，prometheus 与被抓目标同内网可达）：
#     dev = sparkle_gateway:8080 / sparkle_api:8000；prod = gateway_blue+green
#     双抓（任一实例掉线即有 up==0 序列）/ backend:8000。
#
# job_name 一律不变：告警规则（sparkle_slo_alerts.yml 等）与 Grafana 面板按
# job 标签取数，改 job 名会连锁破坏告警与面板；目标文件也不得改写 job 标签
# （由 job_name 统一赋值）。环境无关的目标保持 static：prometheus 自抓、
# alertmanager、sparkle_agent（prod container_name 与 dev 服务名同名，两形制
# 通吃）。
# ─────────────────────────────────────────────────────────────────────────────

scrape_configs:
  # —— 环境无关：两形制同目标，保持 static ——
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'sparkle_agent_grpc'
    # sparkle_agent 在两种形制下均可解析（prod container_name 与 dev 服务名同名），保持不变
    static_configs:
      - targets: ['sparkle_agent:50051']

  # —— 环境相关：file_sd 指向 /etc/prometheus/targets/（dev/prod compose 各挂各的目标目录）——
  - job_name: 'sparkle_gateway'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/gateway.yml'

  - job_name: 'sparkle_backend'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/backend.yml'

  - job_name: 'sparkle_counterfactual'
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/backend.yml'

  - job_name: 'sparkle_simulation_lab'
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/backend.yml'

  - job_name: 'sparkle_safe_experiments'
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/backend.yml'

  - job_name: 'sparkle_community_privacy'
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/backend.yml'

  - job_name: 'node'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/node.yml'

  - job_name: 'cadvisor'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/cadvisor.yml'

  # 待部署：全仓不存在 celery metrics exporter（9808 无任何监听者），保留目标只会
  # 产生永久 down 序列。接入 prometheus-community/celery-exporter（celery_worker
  # 侧开启 --metrics 端口）后取消注释；在此之前 celery_alerts.yml（按
  # job="celery_worker"/"celery_beat" 取数）持续 no-data 空转（登记债务）。
  # - job_name: 'sparkle_celery'
  #   static_configs:
  #     - targets: ['sparkle_celery:9808']
