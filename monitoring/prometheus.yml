global:
  scrape_interval: 15s

rule_files:
  - "sparkle_slo_alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    basic_auth:
      username: 'admin'
      password: 'change-me-in-prod'

  - job_name: 'sparkle_gateway'
    static_configs:
      - targets: ['sparkle_gateway:8080']

  - job_name: 'sparkle_backend'
    static_configs:
      - targets: ['sparkle_backend:8000']
