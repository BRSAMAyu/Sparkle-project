global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "celery_alerts.yml"
  - "sparkle_slo_alerts.yml"
  - "sparkle_production_baseline_alerts.yml"
  - "sparkle_t6_slo_alerts.yml"
  - "sparkle_recording_rules.yml"
  - "sqam_alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sparkle_gateway'
    static_configs:
      - targets: ['sparkle_gateway:8080']

  - job_name: 'sparkle_backend'
    static_configs:
      - targets: ['sparkle_api:8000']

  - job_name: 'sparkle_counterfactual'
    metrics_path: /metrics
    static_configs:
      - targets: ['sparkle_api:8000']

  - job_name: 'sparkle_simulation_lab'
    metrics_path: /metrics
    static_configs:
      - targets: ['sparkle_api:8000']

  - job_name: 'sparkle_safe_experiments'
    metrics_path: /metrics
    static_configs:
      - targets: ['sparkle_api:8000']

  - job_name: 'sparkle_community_privacy'
    metrics_path: /metrics
    static_configs:
      - targets: ['sparkle_api:8000']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
