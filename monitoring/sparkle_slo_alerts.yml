groups:
  - name: sparkle_slo
    interval: 30s
    rules:
      - alert: SparkleGatewayDown
        expr: up{job="sparkle_gateway"} == 0
        for: 2m
        labels:
          severity: critical
          tier: P1
          service: gateway
        annotations:
          summary: "Gateway is down"
          description: "sparkle_gateway has been unreachable for more than 2 minutes"
          runbook: "monitoring/runbooks/incident_response.md#p1-gatewaydown"

      - alert: SparkleBackendDown
        expr: up{job="sparkle_backend"} == 0
        for: 2m
        labels:
          severity: critical
          tier: P1
          service: backend
        annotations:
          summary: "Backend is down"
          description: "sparkle_backend has been unreachable for more than 2 minutes"
          runbook: "monitoring/runbooks/incident_response.md#p1-backenddown"

      - alert: SparkleBackendHigh5xxRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 1)
          > 0.02
        for: 10m
        labels:
          severity: warning
          tier: P2
          service: backend
        annotations:
          summary: "Backend 5xx rate high"
          description: "5xx ratio > 2% for 10m"
          runbook: "monitoring/runbooks/incident_response.md#p2-backendhigh5xxrate"

      - alert: SparkleBackendP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.5
        for: 10m
        labels:
          severity: warning
          tier: P2
          service: backend
        annotations:
          summary: "Backend P95 latency high"
          description: "P95 latency exceeds 1.5s for 10m"
          runbook: "monitoring/runbooks/incident_response.md#p2-backendp95latencyhigh"

      - alert: SparkleEventStreamLagHigh
        expr: sparkle_event_stream_lag_seconds > 120
        for: 5m
        labels:
          severity: warning
          tier: P2
          service: backend
        annotations:
          summary: "Event stream lag high"
          description: "Event stream lag above 120s for 5m"
          runbook: "monitoring/runbooks/incident_response.md#p2-eventstreamlaghigh"

      - alert: SparkleContextPackOverBudgetSpike
        expr: increase(sparkle_context_pack_over_budget_total[10m]) > 20
        for: 10m
        labels:
          severity: warning
          tier: P3
          service: backend
        annotations:
          summary: "Context pack over-budget spikes"
          description: "More than 20 over-budget context-pack events in 10m"
          runbook: "monitoring/runbooks/incident_response.md#p3-contextpackoverbudgetspike"

      - alert: SparkleSpineDegradation
        expr: increase(sparkle_spine_degradation_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          tier: P2
          service: backend
        annotations:
          summary: "Spine degradation detected"
          description: "Signal-to-Action Spine degraded during chat orchestration for at least 5 minutes"
          runbook: "monitoring/runbooks/incident_response.md#p2-spine-degradation"

      - alert: SparkleEventBusDLQGrowing
        expr: increase(event_bus_dlq_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
          tier: P2
          service: backend
        annotations:
          summary: "Event Bus DLQ is receiving events"
          description: "More than 5 events moved to Dead Letter Queue in the last 10 minutes. Check event consumers for failures."
          runbook: "monitoring/runbooks/incident_response.md#p2-eventbus-dlq"

      - alert: SparkleEventBusConsumerLagHigh
        expr: sparkle_event_stream_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
          tier: P2
          service: backend
        annotations:
          summary: "Event Bus consumer lag exceeds 5 minutes"
          description: "Redis Streams consumer group lag is above 300s. Consumers may be stalled or overwhelmed."
          runbook: "monitoring/runbooks/incident_response.md#p2-eventbus-lag"

      - alert: SparkleAuroraCorrectionLoopStuck
        expr: increase(sparkle_aurora_correction_failure_total[10m]) > 5
        for: 10m
        labels:
          severity: warning
          tier: P2
          service: backend
        annotations:
          summary: "Aurora correction loop stuck"
          description: "More than 5 consecutive Aurora correction failures in the last 10 minutes. The calibration loop may be stuck and unable to converge for affected users."
          runbook: "monitoring/runbooks/incident_response.md#p2-aurora-correction-stuck"

      - alert: SparkleCircuitBreakerOpen
        expr: sparkle_grpc_circuit_breaker_state{state="open"} == 1
        for: 2m
        labels:
          severity: warning
          tier: P2
          service: gateway
        annotations:
          summary: "gRPC circuit breaker is open"
          description: "The gRPC agent client circuit breaker has been open for more than 2 minutes. All agent requests are being rejected without attempt."
          runbook: "monitoring/runbooks/incident_response.md#p2-circuit-breaker-open"

      - alert: SparkleWebSocketConnectionsGrowing
        expr: deriv(sparkle_ws_active_connections[30m]) > 0.5
        for: 5m
        labels:
          severity: warning
          tier: P2
          service: gateway
        annotations:
          summary: "WebSocket connections growing steadily"
          description: "Active WebSocket connections have been growing at more than 0.5 connections per second over a 30 minute window."
          runbook: "monitoring/runbooks/incident_response.md#p2-websocket-connections-growing"

      - alert: SparkleSessionLockContentionHigh
        expr: increase(sparkle_session_lock_acquire_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          tier: P2
          service: backend
        annotations:
          summary: "Session lock contention is high"
          description: "More than 5 session lock acquire attempts failed due to contention in the last 5 minutes."
          runbook: "monitoring/runbooks/incident_response.md#p2-session-lock-contention"

      - alert: SparkleGrpcStreamSemaphoreUsageHigh
        expr: sparkle_grpc_stream_semaphore_usage > 0.8
        for: 5m
        labels:
          severity: warning
          tier: P2
          service: gateway
        annotations:
          summary: "gRPC stream semaphore usage high"
          description: "Gateway gRPC StreamChat semaphore usage has exceeded 80% for 5 minutes."
          runbook: "monitoring/runbooks/incident_response.md#p2-grpc-stream-semaphore-usage"

    # --- Resource Alerts (P2-Inf-2) ---

    - alert: SparkleDatabasePoolExhaustion
      expr: pg_stat_activity_count{datname="sparkle"} > 25
      for: 5m
      labels:
        severity: warning
        tier: P2
        service: database
      annotations:
        summary: "Database connection pool nearly exhausted"
        description: "PostgreSQL connection count for sparkle database has exceeded 25 for 5 minutes. Pool exhaustion will cause request failures."
        runbook: "monitoring/runbooks/incident_response.md#p2-database-pool"

    - alert: SparkleDiskSpaceHigh
      expr: (node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"} - node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql"}) / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql"} > 0.9
      for: 5m
      labels:
        severity: warning
        tier: P2
        service: infrastructure
      annotations:
        summary: "Database disk space above 90%"
        description: "PostgreSQL data volume disk usage has exceeded 90%. Risk of database corruption and write failures."
        runbook: "monitoring/runbooks/incident_response.md#p2-disk-space"

    - alert: SparkleContainerMemoryHigh
      expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
      for: 5m
      labels:
        severity: warning
        tier: P2
        service: infrastructure
      annotations:
        summary: "Container memory usage above 90%"
        description: "A container is using over 90% of its memory limit. Risk of OOM kills."
        runbook: "monitoring/runbooks/incident_response.md#p2-memory"
