syntax = "proto3";

package galaxy.v1;

option go_package = "github.com/sparkle/gateway/gen/galaxy/v1;galaxyv1";

import "google/protobuf/timestamp.proto";

// GalaxyService defines the interface for Knowledge Galaxy operations.
service GalaxyService {
  // UpdateNodeMastery updates the mastery level of a node for a user.
  rpc UpdateNodeMastery(UpdateNodeMasteryRequest) returns (UpdateNodeMasteryResponse);

  // SyncCollaborativeGalaxy syncs CRDT updates for a collaborative galaxy.
  rpc SyncCollaborativeGalaxy(SyncCollaborativeGalaxyRequest) returns (SyncCollaborativeGalaxyResponse);

  // Get a user's knowledge graph overview
  rpc GetUserGalaxy(GetUserGalaxyRequest) returns (GetUserGalaxyResponse);

  // Get detailed node information
  rpc GetNodeDetail(GetNodeDetailRequest) returns (GetNodeDetailResponse);

  // Search nodes by keyword
  rpc SearchNodes(SearchNodesRequest) returns (SearchNodesResponse);

  // Get learning path between two nodes
  rpc GetLearningPath(GetLearningPathRequest) returns (GetLearningPathResponse);

  // Get node prerequisites and dependencies
  rpc GetNodeDependencies(GetNodeDependenciesRequest) returns (GetNodeDependenciesResponse);

  // Record a learning interaction with a node
  rpc RecordNodeInteraction(RecordNodeInteractionRequest) returns (RecordNodeInteractionResponse);

  // Get galaxy statistics for a user
  rpc GetGalaxyStats(GetGalaxyStatsRequest) returns (GetGalaxyStatsResponse);

  // Get recommended next nodes to study
  rpc GetRecommendedNodes(GetRecommendedNodesRequest) returns (GetRecommendedNodesResponse);
}

message CollaborativeGalaxyUpdate {
  string galaxy_id = 1;
  bytes yjs_update = 2; // Yjs binary update
  string user_id = 3;
  reserved 4;
  reserved "timestamp";
  google.protobuf.Timestamp event_time = 5;
}

message SyncCollaborativeGalaxyRequest {
  string galaxy_id = 1;
  bytes partial_update = 2; // The update from client
  // SECURITY NOTE: user_id in request body should be ignored.
  // Server must validate ownership using authenticated user_id from gRPC auth context.
  string user_id = 3 [deprecated = true];
}

message SyncCollaborativeGalaxyResponse {
  bool success = 1;
  bytes server_update = 2; // The update from server to client
}

message UpdateNodeMasteryRequest {
  string user_id = 1;
  string node_id = 2;
  int32 mastery = 3;
  reserved 4;
  reserved "version";
  string reason = 5;
  string request_id = 6;
  int64 revision = 7; // Logical clock for conflict resolution
}

message UpdateNodeMasteryResponse {
  bool success = 1;
  int32 old_mastery = 2;
  int32 new_mastery = 3;
  string reason = 4;
  string request_id = 5;
  int64 current_revision = 6; // The latest revision on server
}

// ============================================================================
// Galaxy Overview & Navigation
// ============================================================================

message GetUserGalaxyRequest {
  string user_id = 1;
}

message GetUserGalaxyResponse {
  string user_id = 1;
  repeated GalaxyNode nodes = 2;
  repeated GalaxyEdge edges = 3;
  int32 total_nodes = 4;
}

message GalaxyNode {
  string node_id = 1;
  string label = 2;
  string node_type = 3; // e.g. "concept", "skill", "topic"
  int32 mastery = 4;
  repeated string tags = 5;
  // GRAPH-GRPC-SHAPE: per-user status for this node. The REST face
  // (GET /galaxy/graph → NodeWithStatus.user_status) always carries this
  // block; without a proto counterpart the gateway's gRPC-first branch
  // dropped it and mobile defaulted is_unlocked=false + zeroed review
  // signals. Field set = exactly what the mobile client consumes
  // (mobile/lib/shared/entities/galaxy_model.dart GalaxyNodeModel.fromJson);
  // keep the two in lockstep. Absent (proto3 message presence) mirrors the
  // REST contract's user_status=null (no personal signal for this node).
  GalaxyNodeUserStatus user_status = 6;
}

// Subset of the REST UserStatusInfo (backend/app/schemas/galaxy.py) that
// crosses the gateway. mastery_score stays double here (the int32 `mastery`
// above truncates fractional scores); timestamps use proto well-known types
// and the gateway re-spells them to ISO strings for the REST shape.
message GalaxyNodeUserStatus {
  double mastery_score = 1;
  bool is_unlocked = 2;
  int32 study_count = 3;
  int32 recent_error_count = 4;
  double review_urgency_score = 5;
  bool is_review_recommended = 6;
  string review_urgency_reason = 7; // "" when absent (gateway emits null)
  double days_since_mastery_update = 8;
  google.protobuf.Timestamp mastery_last_updated_at = 9;
  google.protobuf.Timestamp first_unlock_at = 10;
}

message GalaxyEdge {
  string source_id = 1;
  string target_id = 2;
  string relation = 3; // e.g. "prerequisite", "related", "parent"
}

message GetNodeDetailRequest {
  string user_id = 1;
  string node_id = 2;
}

message GetNodeDetailResponse {
  string node_id = 1;
  string label = 2;
  string node_type = 3;
  int32 mastery = 4;
  string description = 5;
  repeated string tags = 6;
  repeated string parent_ids = 7;
  repeated string child_ids = 8;
  map<string, string> metadata = 9;
}

message SearchNodesRequest {
  string user_id = 1;
  string query = 2;
  int32 limit = 3;
}

message SearchNodesResponse {
  repeated GalaxyNode nodes = 1;
  int32 total_found = 2;
}

message GetLearningPathRequest {
  string user_id = 1;
  string from_node_id = 2;
  string to_node_id = 3;
}

message GetLearningPathResponse {
  repeated string node_ids = 1;
  repeated GalaxyEdge edges = 2;
  bool path_found = 3;
}

message GetNodeDependenciesRequest {
  string user_id = 1;
  string node_id = 2;
}

message GetNodeDependenciesResponse {
  repeated string prerequisite_ids = 1;
  repeated string dependent_ids = 2;
}

message RecordNodeInteractionRequest {
  string user_id = 1;
  string node_id = 2;
  string interaction_type = 3; // e.g. "view", "study", "quiz", "review"
  map<string, string> metadata = 4;
}

message RecordNodeInteractionResponse {
  bool success = 1;
}

message GetGalaxyStatsRequest {
  string user_id = 1;
}

message GetGalaxyStatsResponse {
  int32 total_nodes = 1;
  int32 mastered_nodes = 2;
  int32 in_progress_nodes = 3;
  int32 not_started_nodes = 4;
  double average_mastery = 5;
  map<string, int32> nodes_by_type = 6;
}

message GetRecommendedNodesRequest {
  string user_id = 1;
  int32 limit = 2;
}

message GetRecommendedNodesResponse {
  repeated GalaxyNode nodes = 1;
  repeated string reasons = 2;
}
