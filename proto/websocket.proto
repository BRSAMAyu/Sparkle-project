syntax = "proto3";

package sparkle.ws;

option go_package = "github.com/sparkle/gateway/gen/ws;ws";

import "agent_service.proto";
import "google/protobuf/timestamp.proto";

// WebSocketMessage represents the envelope for all WebSocket communications
message WebSocketMessage {
  // Version negotiation: client sends preferred version, server responds with
  // the highest mutually supported version. Currently only "1.0" is supported.
  // Breaking changes require a new version number and dual-version support period.
  string version = 1; // Protocol version, e.g., "1.0"
  string type = 2; // Message type: "chat", "tool_result", "status", etc.
  bytes payload = 3; // Protobuf binary payload (marshaled specific message)
  string trace_id = 4; // OpenTelemetry Trace ID
  string request_id = 5; // Idempotency / Request ID
  reserved 6;
  reserved "timestamp";
  google.protobuf.Timestamp event_time = 7; // Preferred timestamp for new clients
}

// ChatMessage represents a user chat message payload
message ChatMessage {
  string session_id = 1;
  string user_id = 2;
  string message = 3;
  repeated agent.v1.ToolCall tool_calls = 4;
  // Intentionally proto3 optional: unset means "use the session default", while
  // false explicitly disables document grounding for this message.
  optional bool use_document_context = 5;
  repeated string document_filter = 6;
}

message UpdateNodeMasteryRequest {
  string node_id = 1;
  int32 mastery = 2;
  reserved 3;
  reserved "timestamp";
  string request_id = 4;
  int32 revision = 5;
  google.protobuf.Timestamp event_time = 6;
}

// Intervention push messages for real-time adaptive interventions
message InterventionPushMessage {
  string intervention_id = 1;
  string level = 2; // "toast", "card", "modal", "silent"
  InterventionContent content = 3;
  repeated InterventionAction actions = 4;
  int64 expires_at = 5;
}

message InterventionContent {
  string rendered_message = 1;
  string intent_type = 2;
  string template_id = 3;
  int32 scaffolding_level = 4;
  map<string, string> context_variables = 5;
}

message InterventionAction {
  string id = 1;
  string label = 2;
  string type = 3;
}

// ============================================
// Message Acknowledgment (ACK/NACK) Protocol
// ============================================

// MessageAck - Server acknowledgment of client message
message MessageAck {
  string message_id = 1;         // Client message ID being acknowledged
  string status = 2;             // "received", "processing", "failed"
  int64 timestamp = 3;           // Server timestamp when ack was sent
  string error_code = 4;         // Error code if status is "failed"
  string error_message = 5;      // Human-readable error message if failed
}

// MessageNack - Server rejection of client message
message MessageNack {
  string message_id = 1;         // Client message ID being rejected
  string error_code = 2;         // Error code (e.g., "rate_limited", "invalid_payload")
  string error_message = 3;      // Human-readable error message
  int32 retry_after_ms = 4;      // Suggested retry delay in milliseconds (0 = no retry)
  bool permanent = 5;            // If true, the message should not be retried
}

// DEPRECATED: Not used in production. Actual heartbeat uses two mechanisms:
// 1. RFC 6455 WebSocket Ping/Pong control frames (Go: chat_orchestrator.go)
// 2. JSON {"type":"ping"}/{"type":"pong"} text frames (Flutter → Go)
// Retained for potential future unified heartbeat with RTT tracking.
message HeartbeatPing {
  option deprecated = true;
  int64 timestamp = 1;           // Client timestamp when ping was sent
  string client_id = 2;          // Optional client identifier
}

// DEPRECATED: See HeartbeatPing comment above.
message HeartbeatPong {
  option deprecated = true;
  int64 client_timestamp = 1;    // Echo of client's ping timestamp for RTT calculation
  int64 server_timestamp = 2;    // Server timestamp when pong was sent
}
