syntax = "proto3";

package sparkle.ws;

option go_package = "github.com/sparkle/gateway/gen/ws;ws";

import "agent_service.proto";
import "google/protobuf/timestamp.proto";

// WebSocketMessage represents the envelope for all WebSocket communications
message WebSocketMessage {
  string version = 1; // Protocol version, e.g., "2.0"
  string type = 2; // Message type: "chat", "tool_result", "status", etc.
  bytes payload = 3; // Protobuf binary payload (marshaled specific message)
  string trace_id = 4; // OpenTelemetry Trace ID
  string request_id = 5; // Idempotency / Request ID
  int64 timestamp = 6 [deprecated = true]; // Deprecated (remove_after: M3): legacy milliseconds timestamp
  google.protobuf.Timestamp event_time = 7; // Preferred timestamp for new clients
}

// ChatMessage represents a user chat message payload
message ChatMessage {
  string session_id = 1;
  string user_id = 2;
  string message = 3;
  repeated agent.v1.ToolCall tool_calls = 4;
}

message UpdateNodeMasteryRequest {
  string node_id = 1;
  int32 mastery = 2;
  int64 timestamp = 3 [deprecated = true]; // Deprecated (remove_after: M3): legacy milliseconds timestamp
  string request_id = 4;
  int32 revision = 5;
  google.protobuf.Timestamp event_time = 6;
}

// Intervention push messages for real-time adaptive interventions
message InterventionPushMessage {
  string intervention_id = 1;
  string level = 2; // "toast", "card", "modal", "silent"
  InterventionContent content = 3;
  repeated InterventionAction actions = 4;
  int64 expires_at = 5;
}

message InterventionContent {
  string rendered_message = 1;
  string intent_type = 2;
  string template_id = 3;
  int32 scaffolding_level = 4;
  map<string, string> context_variables = 5;
}

message InterventionAction {
  string id = 1;
  string label = 2;
  string type = 3;
}
