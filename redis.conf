
bind 0.0.0.0
protected-mode yes
port 6379

# Production RBAC is enabled by docker-compose.prod.yml with a generated ACL
# file passed via --aclfile. Local development keeps the single-password path.
aclfile /tmp/users.acl

# Memory Management
maxmemory 3gb
maxmemory-policy volatile-lru

# Persistence
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
