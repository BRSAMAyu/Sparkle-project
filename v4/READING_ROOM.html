inSection`（我的群组今日打卡段：冲刺群排前、真源计数直显、复用群聊同款打卡对话框，回执「+N 火苗喂进群火堆」把 Flame 锚定群活跃）；孤儿组件 `SharedResourceCard` 接回产品面（fetchSharedResources/adoptResource 此前产线零调用方）；demo 模式顶部常驻 `_DemoModeBanner`（不可关闭）；BonfireWidget 包 Semantics（gdFlameSemantics：火苗代表群活跃度——「Flame 不与付费绑定」的后端 entitlement 守卫早已在 core/entitlement.py，mobile 全库 grep 零 flame→付费耦合）；mock 仓库 4 个 demo 群名追加「（演示）」后缀（l10n demoGroupSuffix）。\n**验收「seed/demo group 明确标演示」的双面现状**：mobile demo-mode 组有标记（mock 仓库后缀+横幅）；**guest_seed_service 后端播种的 6 个真·访客可见演示群无任何标记**（本次开文件亲证：guest_seed_service.py:2815-2867 `_ensure_group(name=\"算法冲刺小队\"...)` defaults 无 is_demo/marker 字段，models/community.py 无 is_demo 列；wt760 §5 同口径发现并指向「S-03 验收承接」——但 S-03 当时已销账，承接链断裂）→ V3-FIX-506。\n**「单人核心 journey 不受依赖」**：单人群组外全功能可走（S-01 两账号走的就是纯社群路径；核心 GJ01-GJ08 均无社群依赖——B-01 CORE 15 项映射在案）。\n\n### S-04 · Artifact Feedback → Outcome/Evidence\n\n**交付（两波）**：`c026f0c1`（wt312 v1：新表 shared_resource_feedbacks + Alembic 迁移）+ `8656eaa9`（wt382：结构化证据+flywheel）。\n**主干面亲证**：backend/app/models/community.py:574 `shared_resource_feedbacks` + :625 `community_outcome_evidence`（FK→shared_resource_feedbacks.id ondelete=CASCADE——撤回级联的 schema 层载体）两表在树。\n**「feedback/ack 不自动成为 mastery」**：wt382 commit 语义——同伴反馈采纳才落**结构化 outcome evidence**（用户可选择采纳为 Goal evidence，走 evidence 族权重面），ack/like 本身不写 mastery；与 G-01 的 SELF_REPORT 单独通道原则同构（G-line 章互证）。\n**「事件进入 flywheel」**：8656eaa9 明示 S-03 第 4 入径上加两块结构化不留断头路+flywheel 事件。\n**测试**：backend/tests/api/test_s04_community_outcome_evidence.py 4 test + tests/test_s04_community_feedback_evidence.py 9 test（逐文件计数）。\n**「撤回后派生引用更新」**：CASCADE FK 承载 schema 级；应用层撤回路径的显式测试未逐条定位（S-05 的 retract 谱系覆盖 retract 行为本身）。\n\n### S-05 · Reconnect/Retract/Two-account E2E（high，双审查）\n\n**交付（两轮）**：`911dbeb7`（wt383：**30 case 全谱 headless 真实验证+当场修 3 缺陷**）+ `64e6cdff`（wt396 轮 3 清扫 F5/F6/F7：里程碑位置 join 错位/离群 kick 无补偿/评估引擎事件通道污染——三项独立复核全 CONFIRMED 红绿修复）。\n**主干面亲证**：backend/tests/api/test_s05_community_reconnect_retract_two_account_e2e.py **30 个 test**（逐文件计数，覆盖 reconnect/dup event/out-of-order/leave/revoke/block 谱系）+ security/test_q05_redteam_final.py 跨用户隔离对抗面复用。\n**卡面「Android/Web/macOS applicable flows」**：headless 谱系承载；三端实机流未发生（无设备——U 线同款欠账，转出链缺口见 508）。\n**「失败态不冒充 live」**：与 S-01 的 no-mock-fallback 代码级核验同构（isDemoMode 默认 false+WS 失败终态）。\n**「duplicate check-in=0」**：S-01 live 时间线双打卡 streak=1→count=2、12+17=29 火堆对账平（幂等/计数控）+wt383 谱系内 dup case。\n\n---\n\n## S.3 设计决定与取舍\n\n1. **「先测真相再动刀」**：S-01 卡面明示不直接重写；结果是 M-3 免了一次救援重写、CQRS 闲置面从「疑项」变「实锤登记」（495）——后四卡的前提全部建立在实测上。V4 群面设计应从 S-01 报告出发而非从 V2.5 快照出发。\n2. **红线先行、豁免显式**：S-02 在消费面（群 AI）存在前立守卫+登记 orphan-by-design 豁免（带移除条件）——把「V4 接线义务」写成机器可查的登记而非口头承诺。这是「验收模型前置」的变体：守卫的红测（16/16）在无生产流量时就跑通。\n3. **实时面复用引擎进程内基建**：群聊/打卡实时走 ConnectionManager+pub/sub，不迁 CQRS——「不重建真源」+「闲置接线如实登记」的组合取舍。代价是 495 的悬置与多实例扩展的未决。\n4. **Flame 语义主动去货币化**：S-03 把火焰显式锚定为群活跃（Semantics 文案+回执话术），配合既有 entitlement 守卫（flame_level 永久禁作权益判据）——「付费绑定」从产品语言层和后端判据层双向封死。\n5. **两段真实账号+nonce 逐帧对账**：S-01/wt760 的 live 方法论（guest 账号明标测试身份、步进≥1.2s、逐帧 JSONL、A/B 交叉读侧核验、火堆总数对账）是可复用的社群面验收 harness——wt763 独立审查能逐项重放正因证据链是机器可读的。\n6. **收口而非铺开**：S-03/S-04/S-05 都经历「v1（wt307/312/383）→收口轮（wt377/382/396）」两波——v1 交付主体，收口轮修 v1 真红面（如 wt377 亲证 v1 改 TabBarView children 漏改 tabController.length 的真缺陷）+ 补契约锁。\n\n---\n\n## S.4 残差与 V4 注意点（汇总）\n\n1. **FIX-495 的裁量建议素材（主会话待产品裁决项，本章供给料）**：\n   - **事实面**：community post CQRS 投影=完整闲置接线（零生产者+零消费者+零流量）；461/469/481 耐久幂等链在 community 流零真实流量锻炼（单测承载）；而 posts/feed 功能本身经引擎 API+网关纯代理正常服务（S-01 live 全绿）。\n   - **留档接线（keep）的论据**：V4 若做 feed 规模化/多实例（ConnectionManager 跨进程失效时投影是现成的读扩展路径）；galaxy 流（321 行）证明同构管线在真流量下工作；拆除后再建成本高于维护。\n   - **拆除（remove）的论据**：零流量管线自带腐烂风险（461/469/481 的修复在真实流量为零时回归锚只剩单测）；「死接线」对 V4 新人是误导性复杂度；wt639 审计的 ORPHAN 判据（入口可达/下游消费/测试在测/宣称 vs 实现）四问全不过。\n   - **折中建议**：post-RC（10/7 后）裁决；若 V4 群 AI/feed 面立项则接线并补集成测试，否则按 FIX-341 判例走「撤面+AT 豁免+重建须三件齐上」的 by-design 收口。\n2. **群 AI 面的接线义务**：community_context_boundary 豁免（rule_at_exceptions.md:39）的移除条件=群 AI prompt/tool 面接入。V4 做群 AI 时第一件事就是接它（fail-closed 语义+七键 payload+Prometheus 计量全部现成），否则隐私宣称持续大于保障面。\n3. **实时面的多实例边界**：引擎内 ConnectionManager 是单实例语义；V4 若横向扩引擎，群广播/个人通道/ACK 路由需重设计（495 的投影是候选承载之一——与 1 的裁决联动）。\n4. **演示群标记（506）**：guest 可见的 6 个种子群无 demo 标记；V4 若动 guest/演示面，随 S-03 语义（横幅+后缀）补齐后端标记。\n5. **461/469/481 的流量真空**：不只 community——任何 CQRS 流的真实故障注入演练（Q-07 chaos 终验未做）之前，耐久链的运行级置信度都来自单测。V4 排期 chaos 面时应把 community 流的故障注入纳入（若 495 裁决为保留）。\n6. **S-04 的应用层撤回测试**：CASCADE FK 承载了 schema 级撤回；「撤回后派生引用更新」的显式应用层测试未逐条定位——V4 若扩展 evidence 派生面（引用/快照/聚合），补一条端到端 retract 测试。\n\n---\n\n## S.5 本次审查登记\n\n- **V3-FIX-506**（本次新登记，台账行已入本 worktree commit）：S-03 验收「seed/demo group 明确标演示」对 guest_seed_service 后端播种的 6 个演示群未兑现——`_ensure_group` defaults 无任何 demo 标记字段（guest_seed_service.py:2815-2867），models/community.py 无 is_demo 列；wt760（09-27）发现后注记「→S-03 验收承接（S-03.md:27）」，但 S-03 已于 wt377（09-25）销账——**承接链断裂：指向一张已 done 的卡**。mobile 侧 demo-mode 组有标记（mock 仓库「（演示）」后缀+常驻横幅），真实访客经 guest 登录看到的种子群反而无标记。修法方向：种子群名追加演示后缀或加 is_demo 列+读面透传（与 O1 种子计划「示例」来源标记同构）。\n- 复核过但**不构成新发现**的三项：①CQRS 闲置面（已登记 FIX-495 OPEN，本章 §S.4-1 供裁量素材）；②community_context_boundary 零生产 import（orphan-by-design 豁免在案 rule_at_exceptions.md:39，属已知设计态）；③wt763 receipt 三轻微备注（live_run1_full.log 指针失实未入库/握手计数口径/members 装饰性断言）——均不阻塞且已由 receipt 在案，不重复登记。\n- 号占用核验：500-504 已占用；505 空闲备而不用；本线取 506（grep 全仓 `V3-FIX-506` 零命中后占用）。507/508 见 U-line.md §U.5。\n"}, {"id": "00_context/source_notes/S18_G-line.md", "title": "G 线（Galaxy 5 卡）深挖章节 —— V4 交接文档素材（wt775）", "group": "原始报告副本", "html": "<h1>G 线（Galaxy 5 卡）深挖章节 —— V4 交接文档素材（wt775）<\/h1>\n<blockquote>\n<p>本文是 <code>v3/V3-COMPLETE-STATUS-FOR-V4.md<\/code> §4「各线深度状态」G 线章节的深挖草稿。\n证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n撰写：wt775（2026-09-28，基线 main@ed072fd2）。方法：卡面（v3/07_tasks/cards/G-0*.md）+ wt759 报告逐卡 SHA → <code>git log -1<\/code> 全部 9 个交付 SHA 重验在主干 → 关键代码开文件亲证（mastery_evidence.py 603 行/stats_service.spark_node/task_service 完成链/outcome_absorption_service/consistency_service/age_client 全部消费方）→ 测试逐文件计数 → v3-output/WT314-G04、WT395-G05-GALAXY、WT307/WT312 报告抽读 → AGE 使用面全仓追踪。<strong>未轻信任何台账/报告结论性文字。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>G.0 线级概览<\/h2>\n<p>G 线把星图从「学习分钟堆出来的视觉锤」升级为「证据驱动的成长地图」，并保证删除/纠正后图谱不残留错误派生。5/5 全部 done（tasks.json + fleet 名单 + wt759 逐卡 SHA）。<\/p>\n<p><strong>产品主张核心的亲证结论（V4 必读）——「星图数据源是学习分钟还是真证据？」答案是：三条写入路径并存，证据化是真实的但不是唯一的<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>写入路径<\/th>\n<th>触发<\/th>\n<th>走哪条数学<\/th>\n<th>主干证据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 任务完成 spark（主流量）<\/td>\n<td>TaskService.complete（task_service.py:780/803 两处）与 subtask 完成（subtasks.py:133）<\/td>\n<td><strong>legacy 时间公式，封顶 LEGACY_TIME_MASTERY_CAP=40<\/strong>（mastery_evidence.py:119）——调用<strong>不带 outcome 参数<\/strong>，study_minutes=resolve_spark_study_minutes（只认真实时长缺省 0，不再 estimated 回填，task_completion_evidence.py:157-161）<\/td>\n<td>spark_node 分支亲证（stats_service.py:163-172）：<code>if outcome is not None: 融合 else: capped_legacy_mastery<\/code><\/td>\n<\/tr>\n<tr>\n<td>② 显式 outcome 证据<\/td>\n<td>spark API 请求体带 outcome（galaxy.py:437-445：EvidenceObservation(type/value/confidence)）<\/td>\n<td><strong>Kalman 融合<\/strong>（fuse_mastery，先验=重放该节点证据账本）<\/td>\n<td>stats_service.py:166-170 亲证<\/td>\n<\/tr>\n<tr>\n<td>③ outcome.recorded 吸收（G-02）<\/td>\n<td>X 线 outcome 账本事件→OutcomeAbsorptionConsumer（main.py:509-512 启动）→ absorb（幂等标记+TASK_OUTCOME 权重 0.6 融合）<\/td>\n<td><strong>Kalman 融合<\/strong><\/td>\n<td>outcome_absorption_service.py:202-207 亲证<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>即：<strong>「同样 30 分钟不同 outcome 不同 mastery」的验收在证据路径上成立（卡面核心主张真实兑现），但日常任务完成的主流量仍走封顶 40 的时间公式<\/strong>——用户可见的星图亮度是三路混合结果。这不是缺陷（封顶恰恰是「无 evidence 不凭空精通」验收的实现），但 V4 若宣称「星图=证据地图」，主流量（任务完成）与证据路径（outcome.recorded）的融合比例是必须显式设计的产品参数。<\/p>\n<p>其他执行形态特点：<\/p>\n<ol>\n<li><strong>G-04 是「同一家族缺口第二遍清点」的样板<\/strong>：70eb9b68（G-02 的缓存失效）修了吸收链缺口；wt314 用同一镜头清点出 6 个同族缺口（删错题/删草稿节点/任务硬删零清理零失效+三个异步事件写不失效）一次修完（consistency_service 新模块）——「修一个缺口时把同族镜头过一遍」是 V3 后期效率最高的修法（与 FIX-489/490 孤儿清查同思路）。<\/li>\n<li><strong>G-05 用一次性库做规模终验<\/strong>：wt395 在 sparkle_db 容器内新建 <code>wt395_g05<\/code> 库（alembic 迁移到当时 head，跑完自动清理）、Redis 走 db5、真实 DashScope embedding——「真数据规模、隔离库、可复跑」的性能证据形态。<\/li>\n<\/ol>\n<hr />\n<h2>G.1 意图（卡面目标与验收）<\/h2>\n<p>五卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。<\/p>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>Risk/Resource/Reviewers<\/th>\n<th>卡面目标（一句话）<\/th>\n<th>卡面关键验收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>G-01 Mastery 从「学习分钟」升级 Evidence-aware<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>节点亮度代表有证据的成长，而非时间即掌握<\/td>\n<td>同样 30 分钟不同 outcome 不产生相同 mastery；公式透明可测；无 evidence 不凭空精通；旧数据标 legacy estimate<\/td>\n<\/tr>\n<tr>\n<td>G-02 Artifact/Outcome → Galaxy/Trajectory 接线<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>真实成果自动成为图谱证据与用户可见成长<\/td>\n<td>GJ05/GJ08 图谱变化可解释可追 source；不重复点亮；失败/撤销 outcome 正确处理<\/td>\n<\/tr>\n<tr>\n<td>G-03 Galaxy Goal-focused UX 重设计<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>保留视觉锤同时让图可读、可行动<\/td>\n<td>新用户能解释星图表达什么；5 screenshots A/B=0；缩放/点击跨端稳定<\/td>\n<\/tr>\n<tr>\n<td>G-04 对 Correction/Delete/Version 的一致性<\/td>\n<td>high/MEDIUM/2<\/td>\n<td>删除材料/纠正 evidence 后图谱不保留错误派生结论<\/td>\n<td>删除后相关 edge/node state 正确；不跨用户泄露；有回归测试与事件重放<\/td>\n<\/tr>\n<tr>\n<td>G-05 性能/手势/视觉终验<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>真实数据规模下视觉资产不变成卡顿/演示风险<\/td>\n<td>无 A/B 视觉问题；核心操作无 overlap；性能达平台可用基线，异常 graceful；语义搜索走真实 embedding<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>G.2 实际交付逐卡<\/h2>\n<h3>G-01 · Evidence-aware Mastery（Kalman 六证据型）<\/h3>\n<p><strong>交付<\/strong>：<code>19b467ff<\/code>（Kalman 6 证据型融合+self_report 隔离通道+legacy 封顶）。\n<strong>主干面亲证（mastery_evidence.py 603 行，纯函数零 DB/Redis 依赖——「公式透明可测」的架构载体）<\/strong>：<\/p>\n<ul>\n<li>六证据型封闭词表：QUIZ 1.0 / TASK_OUTCOME 0.6 / CHAT_SIGNAL 0.35 / MATERIAL_REF 0.2 / SELF_REPORT <strong>不参与融合<\/strong>（单独通道）/ TIME_ON_TASK <strong>0 权重<\/strong>（仅活动痕迹）——EVIDENCE_WEIGHTS 字典亲证。<\/li>\n<li>融合数学=M 链证据引擎同构的 1D Kalman（confidence→观测方差，gain 决定每步移动量），每步暴露 prior/observation/kalman_gain/posterior。<\/li>\n<li><strong>审计三分类<\/strong>（V3-FIX-299 信任边界，MasteryEffectKind）：<code>evidence<\/code>（重放融合）/<code>set_point<\/code>（exam-sprint 诊断/惩罚的绝对赋值）/<code>projection<\/code>（shadow/trace 行，重放跳过）——<strong>服务端定性写死，客户端伪造 reason 词表拿不到任何重放效果<\/strong>；unknown/NULL fail-closed 归 projection（「宁丢效果不注入数值」）。三条客户端可控入口（/sync/mastery、/nodes/{id}/mastery、gRPC UpdateNodeMastery）默认 projection——galaxy_service.py:3170 docstring 亲证。<\/li>\n<li>legacy 数据：<code>legacy_estimate<\/code> 标记保留旧值，真证据到位后清除（模块 docstring 属性 5）。\n<strong>测试<\/strong>：backend/tests/services/galaxy/test_mastery_evidence.py <strong>36 test<\/strong> + test_mastery_effect_kind_replay.py <strong>18 test<\/strong>（重放分类面）+ test_stats_service.py 14（逐文件计数）。\n<strong>验收对照<\/strong>：「同样 30 分钟不同 outcome 不产生相同 mastery」=证据路径成立（§G.0 表）；「无 evidence 不凭空精通」=TIME_ON_TASK 0 权重+legacy 封顶 40 双机制；「公式透明可测」=纯函数模块+全步骤暴露。<strong>「兼容旧数据并标 legacy estimate」在既有节点上的存量回填状态<\/strong>：读侧按 audit 行 effect_kind 重放分类（classify_audit_reason），未发现全量回填迁移——旧节点在无新证据时保持 legacy 口径，符合「标 legacy」而非「洗白」。<\/li>\n<\/ul>\n<h3>G-02 · Outcome → Galaxy 接线<\/h3>\n<p><strong>交付（三段）<\/strong>：<code>aced25a2<\/code>（主接线）+ <code>7bd6ade3<\/code>（wt381 不重复点亮：同 outcome 重放直接跳过融合——absorbed_outcomes 快照键 O(1) 极性翻转）+ <code>70eb9b68<\/code>（NBP-4：outcome 吸收后失效读模图缓存——吸收链失效缺口首修）。\n<strong>主干面亲证<\/strong>：outcome_absorption_service.py——消费 <code>outcome.recorded<\/code>（OUTCOME_RECORDED_EVENT，X 线 outcome_capture_service 同源）；幂等标记 <code>outcome=&lt;outc_id&gt;<\/code> 与 X-08 账本幂等 id 同源（append-only、无界、重放安全）；<strong>同因合并<\/strong>（任务完成 outcome 与 agent run receipt outcome 是同一逻辑 outcome 的两个事件面，D-02 契约）；极性翻转在上游 task_service._VALID_TRANSITIONS 收口；OUTCOME_EVIDENCE_AUDIT_REASON=TASK_OUTCOME 权重 0.6 融合；OUTCOME_PROVENANCE_SOURCE_TYPE=&quot;outcome_ledger&quot; 落快照溯源。\n<strong>「图谱变化可解释可追 source」<\/strong>：mastery_audit_log（reason/effect_kind/request_id/revision）+node_status 快照 provenance source_type 双承载；GJ05/GJ08 的用户可见解释经 G-03 节点详情 why/来源面。\n<strong>「失败/撤销 outcome 正确处理」<\/strong>：上游极性翻转约束+吸收面幂等键极性标记（wt381）——<strong>「撤销后 mastery 回滚」的显式逆融合未定位到<\/strong>（吸收面按「不再重复点亮+翻转不再点亮」处理；负向 Kalman 观测语义在 fuse_mastery 支持负 delta，但 outcome 撤销→自动回滚融合效果的端到端路径未在代码中定位，见 §G.4-3）。\n<strong>测试<\/strong>：test_outcome_absorption.py <strong>16 test<\/strong> + test_outcome_read_model_visibility.py 5 + api/test_task_complete_galaxy_outbox.py 4。<\/p>\n<h3>G-03 · Goal-focused UX 重设计<\/h3>\n<p><strong>交付<\/strong>：<code>f2fb8c2b<\/code>（wt305）——focus-follows-camera 锚（resolveNearestNodeId 纯函数：默认聚焦当前 Goal 子图，相机移动即跟随）+ Review now/controls 重叠修复+空态合理化+粒子/光效降干扰。\n<strong>mobile 面现状（本次开文件亲证）<\/strong>：<code>mobile/lib/features/galaxy/data/services/<\/code> 12 个服务件（force_engine/layout_engine/render_engine/spatial_index/gesture_recognizer/galaxy_accessibility_service/performance_monitor/predictive_viewport_preloader 等）+ repositories 三件（galaxy/enhanced/draft）——视觉锤工程面完整；数据源=ApiEndpoints.galaxyGraph/galaxyEvents/galaxyNodeDetail/galaxySearch 等（galaxy_repository.dart:31-275 亲证），mastery 显示来自 relational 读面（user_node_status），非 AGE。\n<strong>「新用户能解释星图表达什么」<\/strong>：G-03 的 why/来源/next step 节点详情+G-01 的 evidence_badge 面承载；「5 screenshots A/B=0」以 B-04 golden 链 android 批口径（U 线同款欠账：macOS ENV-1 豁免、真机批未采集——508 同族）。\n<strong>「缩放/点击跨端稳定」<\/strong>：headless 交互正确性由 G-05 的 7/7 flutter 交互测试承载（跨端真机未发生）。<\/p>\n<h3>G-04 · Correction/Delete/Version 一致性（high，双审查）<\/h3>\n<p><strong>交付（三段）<\/strong>：<code>05155fff<\/code>（wt314 六缺口清零）+ <code>0d7cda55<\/code>（wt718 验收补强：FIX-431 跨用户隔离收口）+ <code>6656df34<\/code>（wt718 收账：tasks.json 置 done）。\n<strong>六缺口（WT314 REPORT 亲读，逐条 file:line 在 base 2421a04f 上定位）<\/strong>：<\/p>\n<ul>\n<li>A1 delete_error 软删零清理：溯源行悬空引用已删错题+<code>signal:weak_at<\/code> 弱点标记不摘除→<strong>学习状态 WEAK 复活<\/strong>（schemas/galaxy.py:511 以该标记判 WEAK）+读面失效缺失；<\/li>\n<li>A2 delete_draft_node 零失效：被删节点在星图读面活到 TTL 600s（字面残影节点）；<\/li>\n<li>A3 TaskService.delete 硬删零失效；<\/li>\n<li>B1/B2/B3 三个异步事件写（error_created/task_completed/mastery_updated）不失效——B3 时序性最差：在 update_node_mastery 失效<strong>之后<\/strong>改边强/标记，读面以旧值回填存活到 TTL（失效被后写穿越）。\n<strong>修法<\/strong>：新模块 consistency_service（242 行）：provenance pruning 带节点定界+copy discipline（剪溯源不复活灯亮——红测实证）、弱点从存活错题重算、canonical invalidation；Correction/Version 自洽以 audit 行幂等门承载。\n<strong>跨用户隔离（FIX-431，FIXED@e824a39f）<\/strong>：recompute_weak_signals 的证据判据从「挂全局 keyword 的错题」改为按节点全量存活错题面——双用户共享知识节点（KnowledgeNode 全局行、keywords 全员共读）时，他用户的错题不再影响本用户弱点标记（ledger 431 行+0d7cda55 commit 亲证）。\n<strong>测试<\/strong>：test_delete_correction_consistency.py <strong>12 test<\/strong> + test_f16_galaxy_weak_node_injection.py 11 + test_galaxy_concurrency.py 3 + test_error_mastery_idempotency.py 8 + integration/test_error_book_galaxy_mastery_sync.py 21（「避免全图重建昂贵路径」=pruning 定界+弱点重算局部化）。<\/li>\n<\/ul>\n<h3>G-05 · 性能/手势/视觉终验<\/h3>\n<p><strong>交付<\/strong>：<code>47898b9f<\/code>（wt395）——<strong>33/35 判定 PASS，2 FAIL 如实保留<\/strong>；一次性库 wt395_g05+Redis db5+真实 DashScope embedding。\n<strong>规模梯度（50/500/5000 真实 ORM 行，n≥30/操作，REPORT 表亲读）<\/strong>：图取数冷缓存 p50 12.1/57.2/681.7ms；user_stats 恒 2-4ms；node_detail(gRPC) 恒 3-7ms err=0；语义搜索（真 embedding）域内 top1 命中 0.6（阈值边界，跨批 0.6~1.0 波动如实入档）+域外零命中 1.0。<strong>2 FAIL=5000 档 p95 尾部<\/strong>（热缓存 823.8ms 超 3%/学习路径 1141.2ms），根因=30 样本中 1-2 次 &gt;1s 环境级停顿（离群 far=2/30 同签名、p50 仅 25.8ms），非算法缺陷。\n<strong>恢复风暴（5000 档 16 并发×5 轮）<\/strong>：断线重连冷缓存 p50 <strong>10317ms→401.7ms<\/strong>（singleflight 修后，max/单发冷中位=1.41×）；CRDT 并发首连 6/16 丢单→<strong>16/16 并入<\/strong>；混合风暴 p50=365ms 零错误。\n<strong>5 处产品修复（全部红测先行+回归锁在库）<\/strong>：①cache.py @cached singleflight（同 key in-flight 合并，异常不粘/异 key 不合并，test_g05_cached_singleflight.py 3 用例）；②galaxy_grpc 会话 get-or-create 原子化（并发首连丢单修复）；③GetLearningPath BFS parent-map 重构；④CRDT 快照二进制安全客户端（decode_responses=False，否则引擎重启后首台重连 restore 必败）；⑤retrieval_service 两处（embedding 故障显式降级——REST /galaxy/search 此前在供应商故障时 500；keyword_search jsonpath 显式 cast——asyncpg 类型化参数 UndefinedFunctionError，psql 字面量隐式转换掩盖的生产必炸面）。\n<strong>「性能达平台可用基线，异常 graceful」<\/strong>：viewport 800 上限精确生效、LOD zoom&lt;0.5 三档收窄、向量不可用→熔断+空返回+keyword 兜底、BFS 有界 MAX_VISITED=500 远对 path_found=False 诚实返回。真机截图/FPS 段转 HUMAN_INBOX（自带 WT395-G05-GALAXY/HUMAN_INBOX_G05_VISUAL.md 清单——中央收件箱未收编，508 同族）。\n<strong>Flutter 交互测试<\/strong>：mobile/test/features/galaxy/unit/g05_galaxy_interaction_scale_test.dart 7/7 绿；galaxy 全域 flutter 测试 31 文件（find 计数）。<\/p>\n<hr />\n<h2>G.3 设计决定与取舍<\/h2>\n<ol>\n<li><strong>「封顶」而非「清零」legacy 时间路径<\/strong>：保留 spark_node 时间公式但 cap 40——兼容既有用户数据与主流量（任务完成必然触发 spark），同时兑现「无 evidence 不凭空精通」。代价是「星图=证据地图」的产品宣称打了折扣（§G.0 主流量事实）；收益是迁移零风险。V4 若要强化证据主张，路径是给任务完成链接 outcome 证据（completion evidence 分型函数 expected_evidence_kinds 已在 task_completion_evidence.py:169 就绪）而非改公式。<\/li>\n<li><strong>信任边界写在写入口而非读出口<\/strong>：FIX-299 把 effect_kind 定性放在 INSERT 点（服务端显式定性），重放按列分支而非猜 reason 字符串——客户端可控入口默认 projection。这把「伪造 mastery」从读侧过滤问题降维成「写侧根本没有效果」问题。<\/li>\n<li><strong>同因合并的幂等设计<\/strong>：任务完成 outcome 与 agent run receipt outcome 是同一逻辑 outcome 的两个事件面（D-02）——吸收面用账本幂等 id 同源标记解决「不重复点亮」，而非在事件面去重。V4 做任何「一个事实多个事件投影」时这是现成范式。<\/li>\n<li><strong>失效是写路径的一部分<\/strong>：70eb9b68（吸收后失效）→wt314（六缺口 canonical invalidation）确立「每个异步写路径自带失效」的纪律；B3 缺口（失效被后写穿越）说明失效顺序必须跟随后写顺序而非先于。<\/li>\n<li><strong>性能证据用一次性库+真实依赖<\/strong>：wt395 不在演示库跑压测（零污染），也不 mock embedding（真实 DashScope）——「真数据规模」与「隔离可复跑」同时成立。<\/li>\n<li><strong>视觉锤的令牌豁免显式化<\/strong>：galaxy 零 context.typo 采用是 E1 冻结豁免预算内的登记态（U 线 wt676 矩阵亲证）——视觉锤面不追令牌统一，把裁决权留给视觉 owner。V4 若动 galaxy 视觉，先解 E1 豁免再动代码。<\/li>\n<\/ol>\n<hr />\n<h2>G.4 残差与 V4 注意点（汇总）<\/h2>\n<ol>\n<li><strong>AGE 图查询的实际使用面（专项结论）<\/strong>：<strong>Galaxy 星图本体不存 AGE<\/strong>——knowledge_nodes/node_relations/user_node_status/study_records 全是关系表（models/galaxy.py <code>__tablename__<\/code> 逐一亲证），移动端星图读 relational 读面（@cached 600s+shield 10s）。AGE（apache-age，graph <code>sparkle_galaxy<\/code>）的真实使用面=<strong>两处<\/strong>：①GraphRAG 检索（orchestration/graph_rag.py:1928/2114/2519 三段真 Cypher：实体邻域/用户-知识关系/路径），由 chat 编排管线活调用（orchestrator.py:2020 GraphRAGRetriever，带 timeout 与全路径异常降级——AGE 不可达时回落实体抽取/RRF 序，且 mastery rerank 反向消费 galaxy_service 的掌握度分：G 线与 chat 检索的真实耦合点）；②graph_sync_worker（main.py:585 启动，消费 stream:graph_sync 写 AGE）。<strong>但 stream:graph_sync 的唯一生产者类 graph_knowledge_service 已是 orphan-by-design<\/strong>（rule_at_exceptions.md:41：唯一消费方 graph_monitor router 随 FIX-341 撤面删除，wt646 登记；预留消费方=后续 GraphRAG 可视化/运维面）——即 <strong>AGE 写侧镜像当前零生产流量，AGE 里的图数据新鲜度无保障<\/strong>；GraphRAG 读的是「上次同步时的 AGE 态+关系表回退」。V4 决策点：GraphRAG 要吃「实时星图」就必须接写侧（或改 GraphRAG 直接查关系表）；否则应诚实把 AGE 定位为检索辅助索引。<\/li>\n<li><strong>主流量证据化是 V4 的最大产品杠杆<\/strong>：任务完成链（最频繁的写入）不带 outcome（§G.0①）；expected_evidence_kinds/completion evidence 分型已在（X-01 词表复用）——把「任务完成的证据分型」接进 spark/outcome 链是让星图真变「证据地图」的最低成本路径，且 G-01/G-02 的数学与幂等面全部现成。<\/li>\n<li><strong>outcome 撤销→已吸收效果的回滚未闭环<\/strong>：吸收面按幂等+上游极性约束处理「不重复点亮/翻转不再点亮」，但「撤销一个已吸收的 outcome →回退它对 mastery 的 Kalman 贡献」的端到端路径未定位到代码或测试（G-02 卡面「失败/撤销 outcome 正确处理」的部分兑现——失败面成立，撤销回滚面未证）。S-04 的 evidence 撤回（CASCADE）同样只保 schema 级。V4 若宣称「图谱可纠正」，这是显式缺口。<\/li>\n<li><strong>5000 档两个 p95 FAIL 未复验<\/strong>：根因归因环境级停顿（同签名离群）且 p50 良好，如实保留 FAIL；V4 性能基线应复跑 wt395 同构脚本确认。<\/li>\n<li><strong>弱信号/WEAK 判据的跨用户语义<\/strong>：FIX-431 收口后按「节点全量存活错题面」判——共享节点上的弱点标记语义（他用户错题驱动我方 WEAK 的产品合理性）是 V4 可以重新审视的产品参数（当前实现是按用户过滤后的节点全量，已防跨用户泄露）。<\/li>\n<li><strong>G-03/G-05 的真机段<\/strong>：跨端缩放/点击稳定与真机 FPS 截图未采集（清单就绪：G05 自带 HUMAN_INBOX_G05_VISUAL.md）——与 U 线真机欠账同批解决。<\/li>\n<\/ol>\n<hr />\n<h2>G.5 本次审查登记<\/h2>\n<ul>\n<li>本次 G 线深挖<strong>无新缺陷登记<\/strong>。复核过但不构成新发现的三项：①AGE 写侧镜像零生产流量（graph_knowledge_service orphan-by-design 豁免在 rule_at_exceptions.md:41 在案、带移除条件与退役裁决条款——属已知设计态，本章 §G.4-1 已作为 V4 决策点展开）；②主流量走 legacy 封顶路径（§G.0 表，是验收「无 evidence 不凭空精通」的实现手段而非违背，产品宣称折扣已如实写入 §G.0/§G.4-2）；③G-05 两个 5000 档 p95 FAIL（wt395 如实保留并归因，属已登记运行态）。<\/li>\n<li>交叉登记：G 线相关的真机段转出未入中央 HUMAN_INBOX 已并入 U 线登记的 <strong>V3-FIX-511<\/strong>（G05 自带 WT395-G05-GALAXY/HUMAN_INBOX_G05_VISUAL.md 为证据锚之一）；号段使用全景见 U-line.md §U.5（507/508）与 S-line.md §S.5（506）。<\/li>\n<li>号占用核验：500-504 已占用；505 空闲备而不用；本线未占用新号。<\/li>\n<\/ul>\n", "text": "# G 线（Galaxy 5 卡）深挖章节 —— V4 交接文档素材（wt775）\n\n> 本文是 `v3/V3-COMPLETE-STATUS-FOR-V4.md` §4「各线深度状态」G 线章节的深挖草稿。\n> 证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n> 撰写：wt775（2026-09-28，基线 main@ed072fd2）。方法：卡面（v3/07_tasks/cards/G-0*.md）+ wt759 报告逐卡 SHA → `git log -1` 全部 9 个交付 SHA 重验在主干 → 关键代码开文件亲证（mastery_evidence.py 603 行/stats_service.spark_node/task_service 完成链/outcome_absorption_service/consistency_service/age_client 全部消费方）→ 测试逐文件计数 → v3-output/WT314-G04、WT395-G05-GALAXY、WT307/WT312 报告抽读 → AGE 使用面全仓追踪。**未轻信任何台账/报告结论性文字。**\n\n---\n\n## G.0 线级概览\n\nG 线把星图从「学习分钟堆出来的视觉锤」升级为「证据驱动的成长地图」，并保证删除/纠正后图谱不残留错误派生。5/5 全部 done（tasks.json + fleet 名单 + wt759 逐卡 SHA）。\n\n**产品主张核心的亲证结论（V4 必读）——「星图数据源是学习分钟还是真证据？」答案是：三条写入路径并存，证据化是真实的但不是唯一的**：\n\n| 写入路径 | 触发 | 走哪条数学 | 主干证据 |\n|---|---|---|---|\n| ① 任务完成 spark（主流量） | TaskService.complete（task_service.py:780/803 两处）与 subtask 完成（subtasks.py:133） | **legacy 时间公式，封顶 LEGACY_TIME_MASTERY_CAP=40**（mastery_evidence.py:119）——调用**不带 outcome 参数**，study_minutes=resolve_spark_study_minutes（只认真实时长缺省 0，不再 estimated 回填，task_completion_evidence.py:157-161） | spark_node 分支亲证（stats_service.py:163-172）：`if outcome is not None: 融合 else: capped_legacy_mastery` |\n| ② 显式 outcome 证据 | spark API 请求体带 outcome（galaxy.py:437-445：EvidenceObservation(type/value/confidence)） | **Kalman 融合**（fuse_mastery，先验=重放该节点证据账本） | stats_service.py:166-170 亲证 |\n| ③ outcome.recorded 吸收（G-02） | X 线 outcome 账本事件→OutcomeAbsorptionConsumer（main.py:509-512 启动）→ absorb（幂等标记+TASK_OUTCOME 权重 0.6 融合） | **Kalman 融合** | outcome_absorption_service.py:202-207 亲证 |\n\n即：**「同样 30 分钟不同 outcome 不同 mastery」的验收在证据路径上成立（卡面核心主张真实兑现），但日常任务完成的主流量仍走封顶 40 的时间公式**——用户可见的星图亮度是三路混合结果。这不是缺陷（封顶恰恰是「无 evidence 不凭空精通」验收的实现），但 V4 若宣称「星图=证据地图」，主流量（任务完成）与证据路径（outcome.recorded）的融合比例是必须显式设计的产品参数。\n\n其他执行形态特点：\n1. **G-04 是「同一家族缺口第二遍清点」的样板**：70eb9b68（G-02 的缓存失效）修了吸收链缺口；wt314 用同一镜头清点出 6 个同族缺口（删错题/删草稿节点/任务硬删零清理零失效+三个异步事件写不失效）一次修完（consistency_service 新模块）——「修一个缺口时把同族镜头过一遍」是 V3 后期效率最高的修法（与 FIX-489/490 孤儿清查同思路）。\n2. **G-05 用一次性库做规模终验**：wt395 在 sparkle_db 容器内新建 `wt395_g05` 库（alembic 迁移到当时 head，跑完自动清理）、Redis 走 db5、真实 DashScope embedding——「真数据规模、隔离库、可复跑」的性能证据形态。\n\n---\n\n## G.1 意图（卡面目标与验收）\n\n五卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。\n\n| 卡 | Risk/Resource/Reviewers | 卡面目标（一句话） | 卡面关键验收 |\n|---|---|---|---|\n| G-01 Mastery 从「学习分钟」升级 Evidence-aware | medium/MEDIUM/1 | 节点亮度代表有证据的成长，而非时间即掌握 | 同样 30 分钟不同 outcome 不产生相同 mastery；公式透明可测；无 evidence 不凭空精通；旧数据标 legacy estimate |\n| G-02 Artifact/Outcome → Galaxy/Trajectory 接线 | medium/MEDIUM/1 | 真实成果自动成为图谱证据与用户可见成长 | GJ05/GJ08 图谱变化可解释可追 source；不重复点亮；失败/撤销 outcome 正确处理 |\n| G-03 Galaxy Goal-focused UX 重设计 | medium/HEAVY/1 | 保留视觉锤同时让图可读、可行动 | 新用户能解释星图表达什么；5 screenshots A/B=0；缩放/点击跨端稳定 |\n| G-04 对 Correction/Delete/Version 的一致性 | high/MEDIUM/2 | 删除材料/纠正 evidence 后图谱不保留错误派生结论 | 删除后相关 edge/node state 正确；不跨用户泄露；有回归测试与事件重放 |\n| G-05 性能/手势/视觉终验 | medium/HEAVY/1 | 真实数据规模下视觉资产不变成卡顿/演示风险 | 无 A/B 视觉问题；核心操作无 overlap；性能达平台可用基线，异常 graceful；语义搜索走真实 embedding |\n\n---\n\n## G.2 实际交付逐卡\n\n### G-01 · Evidence-aware Mastery（Kalman 六证据型）\n\n**交付**：`19b467ff`（Kalman 6 证据型融合+self_report 隔离通道+legacy 封顶）。\n**主干面亲证（mastery_evidence.py 603 行，纯函数零 DB/Redis 依赖——「公式透明可测」的架构载体）**：\n- 六证据型封闭词表：QUIZ 1.0 / TASK_OUTCOME 0.6 / CHAT_SIGNAL 0.35 / MATERIAL_REF 0.2 / SELF_REPORT **不参与融合**（单独通道）/ TIME_ON_TASK **0 权重**（仅活动痕迹）——EVIDENCE_WEIGHTS 字典亲证。\n- 融合数学=M 链证据引擎同构的 1D Kalman（confidence→观测方差，gain 决定每步移动量），每步暴露 prior/observation/kalman_gain/posterior。\n- **审计三分类**（V3-FIX-299 信任边界，MasteryEffectKind）：`evidence`（重放融合）/`set_point`（exam-sprint 诊断/惩罚的绝对赋值）/`projection`（shadow/trace 行，重放跳过）——**服务端定性写死，客户端伪造 reason 词表拿不到任何重放效果**；unknown/NULL fail-closed 归 projection（「宁丢效果不注入数值」）。三条客户端可控入口（/sync/mastery、/nodes/{id}/mastery、gRPC UpdateNodeMastery）默认 projection——galaxy_service.py:3170 docstring 亲证。\n- legacy 数据：`legacy_estimate` 标记保留旧值，真证据到位后清除（模块 docstring 属性 5）。\n**测试**：backend/tests/services/galaxy/test_mastery_evidence.py **36 test** + test_mastery_effect_kind_replay.py **18 test**（重放分类面）+ test_stats_service.py 14（逐文件计数）。\n**验收对照**：「同样 30 分钟不同 outcome 不产生相同 mastery」=证据路径成立（§G.0 表）；「无 evidence 不凭空精通」=TIME_ON_TASK 0 权重+legacy 封顶 40 双机制；「公式透明可测」=纯函数模块+全步骤暴露。**「兼容旧数据并标 legacy estimate」在既有节点上的存量回填状态**：读侧按 audit 行 effect_kind 重放分类（classify_audit_reason），未发现全量回填迁移——旧节点在无新证据时保持 legacy 口径，符合「标 legacy」而非「洗白」。\n\n### G-02 · Outcome → Galaxy 接线\n\n**交付（三段）**：`aced25a2`（主接线）+ `7bd6ade3`（wt381 不重复点亮：同 outcome 重放直接跳过融合——absorbed_outcomes 快照键 O(1) 极性翻转）+ `70eb9b68`（NBP-4：outcome 吸收后失效读模图缓存——吸收链失效缺口首修）。\n**主干面亲证**：outcome_absorption_service.py——消费 `outcome.recorded`（OUTCOME_RECORDED_EVENT，X 线 outcome_capture_service 同源）；幂等标记 `outcome=<outc_id>` 与 X-08 账本幂等 id 同源（append-only、无界、重放安全）；**同因合并**（任务完成 outcome 与 agent run receipt outcome 是同一逻辑 outcome 的两个事件面，D-02 契约）；极性翻转在上游 task_service._VALID_TRANSITIONS 收口；OUTCOME_EVIDENCE_AUDIT_REASON=TASK_OUTCOME 权重 0.6 融合；OUTCOME_PROVENANCE_SOURCE_TYPE=\"outcome_ledger\" 落快照溯源。\n**「图谱变化可解释可追 source」**：mastery_audit_log（reason/effect_kind/request_id/revision）+node_status 快照 provenance source_type 双承载；GJ05/GJ08 的用户可见解释经 G-03 节点详情 why/来源面。\n**「失败/撤销 outcome 正确处理」**：上游极性翻转约束+吸收面幂等键极性标记（wt381）——**「撤销后 mastery 回滚」的显式逆融合未定位到**（吸收面按「不再重复点亮+翻转不再点亮」处理；负向 Kalman 观测语义在 fuse_mastery 支持负 delta，但 outcome 撤销→自动回滚融合效果的端到端路径未在代码中定位，见 §G.4-3）。\n**测试**：test_outcome_absorption.py **16 test** + test_outcome_read_model_visibility.py 5 + api/test_task_complete_galaxy_outbox.py 4。\n\n### G-03 · Goal-focused UX 重设计\n\n**交付**：`f2fb8c2b`（wt305）——focus-follows-camera 锚（resolveNearestNodeId 纯函数：默认聚焦当前 Goal 子图，相机移动即跟随）+ Review now/controls 重叠修复+空态合理化+粒子/光效降干扰。\n**mobile 面现状（本次开文件亲证）**：`mobile/lib/features/galaxy/data/services/` 12 个服务件（force_engine/layout_engine/render_engine/spatial_index/gesture_recognizer/galaxy_accessibility_service/performance_monitor/predictive_viewport_preloader 等）+ repositories 三件（galaxy/enhanced/draft）——视觉锤工程面完整；数据源=ApiEndpoints.galaxyGraph/galaxyEvents/galaxyNodeDetail/galaxySearch 等（galaxy_repository.dart:31-275 亲证），mastery 显示来自 relational 读面（user_node_status），非 AGE。\n**「新用户能解释星图表达什么」**：G-03 的 why/来源/next step 节点详情+G-01 的 evidence_badge 面承载；「5 screenshots A/B=0」以 B-04 golden 链 android 批口径（U 线同款欠账：macOS ENV-1 豁免、真机批未采集——508 同族）。\n**「缩放/点击跨端稳定」**：headless 交互正确性由 G-05 的 7/7 flutter 交互测试承载（跨端真机未发生）。\n\n### G-04 · Correction/Delete/Version 一致性（high，双审查）\n\n**交付（三段）**：`05155fff`（wt314 六缺口清零）+ `0d7cda55`（wt718 验收补强：FIX-431 跨用户隔离收口）+ `6656df34`（wt718 收账：tasks.json 置 done）。\n**六缺口（WT314 REPORT 亲读，逐条 file:line 在 base 2421a04f 上定位）**：\n- A1 delete_error 软删零清理：溯源行悬空引用已删错题+`signal:weak_at` 弱点标记不摘除→**学习状态 WEAK 复活**（schemas/galaxy.py:511 以该标记判 WEAK）+读面失效缺失；\n- A2 delete_draft_node 零失效：被删节点在星图读面活到 TTL 600s（字面残影节点）；\n- A3 TaskService.delete 硬删零失效；\n- B1/B2/B3 三个异步事件写（error_created/task_completed/mastery_updated）不失效——B3 时序性最差：在 update_node_mastery 失效**之后**改边强/标记，读面以旧值回填存活到 TTL（失效被后写穿越）。\n**修法**：新模块 consistency_service（242 行）：provenance pruning 带节点定界+copy discipline（剪溯源不复活灯亮——红测实证）、弱点从存活错题重算、canonical invalidation；Correction/Version 自洽以 audit 行幂等门承载。\n**跨用户隔离（FIX-431，FIXED@e824a39f）**：recompute_weak_signals 的证据判据从「挂全局 keyword 的错题」改为按节点全量存活错题面——双用户共享知识节点（KnowledgeNode 全局行、keywords 全员共读）时，他用户的错题不再影响本用户弱点标记（ledger 431 行+0d7cda55 commit 亲证）。\n**测试**：test_delete_correction_consistency.py **12 test** + test_f16_galaxy_weak_node_injection.py 11 + test_galaxy_concurrency.py 3 + test_error_mastery_idempotency.py 8 + integration/test_error_book_galaxy_mastery_sync.py 21（「避免全图重建昂贵路径」=pruning 定界+弱点重算局部化）。\n\n### G-05 · 性能/手势/视觉终验\n\n**交付**：`47898b9f`（wt395）——**33/35 判定 PASS，2 FAIL 如实保留**；一次性库 wt395_g05+Redis db5+真实 DashScope embedding。\n**规模梯度（50/500/5000 真实 ORM 行，n≥30/操作，REPORT 表亲读）**：图取数冷缓存 p50 12.1/57.2/681.7ms；user_stats 恒 2-4ms；node_detail(gRPC) 恒 3-7ms err=0；语义搜索（真 embedding）域内 top1 命中 0.6（阈值边界，跨批 0.6~1.0 波动如实入档）+域外零命中 1.0。**2 FAIL=5000 档 p95 尾部**（热缓存 823.8ms 超 3%/学习路径 1141.2ms），根因=30 样本中 1-2 次 >1s 环境级停顿（离群 far=2/30 同签名、p50 仅 25.8ms），非算法缺陷。\n**恢复风暴（5000 档 16 并发×5 轮）**：断线重连冷缓存 p50 **10317ms→401.7ms**（singleflight 修后，max/单发冷中位=1.41×）；CRDT 并发首连 6/16 丢单→**16/16 并入**；混合风暴 p50=365ms 零错误。\n**5 处产品修复（全部红测先行+回归锁在库）**：①cache.py @cached singleflight（同 key in-flight 合并，异常不粘/异 key 不合并，test_g05_cached_singleflight.py 3 用例）；②galaxy_grpc 会话 get-or-create 原子化（并发首连丢单修复）；③GetLearningPath BFS parent-map 重构；④CRDT 快照二进制安全客户端（decode_responses=False，否则引擎重启后首台重连 restore 必败）；⑤retrieval_service 两处（embedding 故障显式降级——REST /galaxy/search 此前在供应商故障时 500；keyword_search jsonpath 显式 cast——asyncpg 类型化参数 UndefinedFunctionError，psql 字面量隐式转换掩盖的生产必炸面）。\n**「性能达平台可用基线，异常 graceful」**：viewport 800 上限精确生效、LOD zoom<0.5 三档收窄、向量不可用→熔断+空返回+keyword 兜底、BFS 有界 MAX_VISITED=500 远对 path_found=False 诚实返回。真机截图/FPS 段转 HUMAN_INBOX（自带 WT395-G05-GALAXY/HUMAN_INBOX_G05_VISUAL.md 清单——中央收件箱未收编，508 同族）。\n**Flutter 交互测试**：mobile/test/features/galaxy/unit/g05_galaxy_interaction_scale_test.dart 7/7 绿；galaxy 全域 flutter 测试 31 文件（find 计数）。\n\n---\n\n## G.3 设计决定与取舍\n\n1. **「封顶」而非「清零」legacy 时间路径**：保留 spark_node 时间公式但 cap 40——兼容既有用户数据与主流量（任务完成必然触发 spark），同时兑现「无 evidence 不凭空精通」。代价是「星图=证据地图」的产品宣称打了折扣（§G.0 主流量事实）；收益是迁移零风险。V4 若要强化证据主张，路径是给任务完成链接 outcome 证据（completion evidence 分型函数 expected_evidence_kinds 已在 task_completion_evidence.py:169 就绪）而非改公式。\n2. **信任边界写在写入口而非读出口**：FIX-299 把 effect_kind 定性放在 INSERT 点（服务端显式定性），重放按列分支而非猜 reason 字符串——客户端可控入口默认 projection。这把「伪造 mastery」从读侧过滤问题降维成「写侧根本没有效果」问题。\n3. **同因合并的幂等设计**：任务完成 outcome 与 agent run receipt outcome 是同一逻辑 outcome 的两个事件面（D-02）——吸收面用账本幂等 id 同源标记解决「不重复点亮」，而非在事件面去重。V4 做任何「一个事实多个事件投影」时这是现成范式。\n4. **失效是写路径的一部分**：70eb9b68（吸收后失效）→wt314（六缺口 canonical invalidation）确立「每个异步写路径自带失效」的纪律；B3 缺口（失效被后写穿越）说明失效顺序必须跟随后写顺序而非先于。\n5. **性能证据用一次性库+真实依赖**：wt395 不在演示库跑压测（零污染），也不 mock embedding（真实 DashScope）——「真数据规模」与「隔离可复跑」同时成立。\n6. **视觉锤的令牌豁免显式化**：galaxy 零 context.typo 采用是 E1 冻结豁免预算内的登记态（U 线 wt676 矩阵亲证）——视觉锤面不追令牌统一，把裁决权留给视觉 owner。V4 若动 galaxy 视觉，先解 E1 豁免再动代码。\n\n---\n\n## G.4 残差与 V4 注意点（汇总）\n\n1. **AGE 图查询的实际使用面（专项结论）**：**Galaxy 星图本体不存 AGE**——knowledge_nodes/node_relations/user_node_status/study_records 全是关系表（models/galaxy.py `__tablename__` 逐一亲证），移动端星图读 relational 读面（@cached 600s+shield 10s）。AGE（apache-age，graph `sparkle_galaxy`）的真实使用面=**两处**：①GraphRAG 检索（orchestration/graph_rag.py:1928/2114/2519 三段真 Cypher：实体邻域/用户-知识关系/路径），由 chat 编排管线活调用（orchestrator.py:2020 GraphRAGRetriever，带 timeout 与全路径异常降级——AGE 不可达时回落实体抽取/RRF 序，且 mastery rerank 反向消费 galaxy_service 的掌握度分：G 线与 chat 检索的真实耦合点）；②graph_sync_worker（main.py:585 启动，消费 stream:graph_sync 写 AGE）。**但 stream:graph_sync 的唯一生产者类 graph_knowledge_service 已是 orphan-by-design**（rule_at_exceptions.md:41：唯一消费方 graph_monitor router 随 FIX-341 撤面删除，wt646 登记；预留消费方=后续 GraphRAG 可视化/运维面）——即 **AGE 写侧镜像当前零生产流量，AGE 里的图数据新鲜度无保障**；GraphRAG 读的是「上次同步时的 AGE 态+关系表回退」。V4 决策点：GraphRAG 要吃「实时星图」就必须接写侧（或改 GraphRAG 直接查关系表）；否则应诚实把 AGE 定位为检索辅助索引。\n2. **主流量证据化是 V4 的最大产品杠杆**：任务完成链（最频繁的写入）不带 outcome（§G.0①）；expected_evidence_kinds/completion evidence 分型已在（X-01 词表复用）——把「任务完成的证据分型」接进 spark/outcome 链是让星图真变「证据地图」的最低成本路径，且 G-01/G-02 的数学与幂等面全部现成。\n3. **outcome 撤销→已吸收效果的回滚未闭环**：吸收面按幂等+上游极性约束处理「不重复点亮/翻转不再点亮」，但「撤销一个已吸收的 outcome →回退它对 mastery 的 Kalman 贡献」的端到端路径未定位到代码或测试（G-02 卡面「失败/撤销 outcome 正确处理」的部分兑现——失败面成立，撤销回滚面未证）。S-04 的 evidence 撤回（CASCADE）同样只保 schema 级。V4 若宣称「图谱可纠正」，这是显式缺口。\n4. **5000 档两个 p95 FAIL 未复验**：根因归因环境级停顿（同签名离群）且 p50 良好，如实保留 FAIL；V4 性能基线应复跑 wt395 同构脚本确认。\n5. **弱信号/WEAK 判据的跨用户语义**：FIX-431 收口后按「节点全量存活错题面」判——共享节点上的弱点标记语义（他用户错题驱动我方 WEAK 的产品合理性）是 V4 可以重新审视的产品参数（当前实现是按用户过滤后的节点全量，已防跨用户泄露）。\n6. **G-03/G-05 的真机段**：跨端缩放/点击稳定与真机 FPS 截图未采集（清单就绪：G05 自带 HUMAN_INBOX_G05_VISUAL.md）——与 U 线真机欠账同批解决。\n\n---\n\n## G.5 本次审查登记\n\n- 本次 G 线深挖**无新缺陷登记**。复核过但不构成新发现的三项：①AGE 写侧镜像零生产流量（graph_knowledge_service orphan-by-design 豁免在 rule_at_exceptions.md:41 在案、带移除条件与退役裁决条款——属已知设计态，本章 §G.4-1 已作为 V4 决策点展开）；②主流量走 legacy 封顶路径（§G.0 表，是验收「无 evidence 不凭空精通」的实现手段而非违背，产品宣称折扣已如实写入 §G.0/§G.4-2）；③G-05 两个 5000 档 p95 FAIL（wt395 如实保留并归因，属已登记运行态）。\n- 交叉登记：G 线相关的真机段转出未入中央 HUMAN_INBOX 已并入 U 线登记的 **V3-FIX-511**（G05 自带 WT395-G05-GALAXY/HUMAN_INBOX_G05_VISUAL.md 为证据锚之一）；号段使用全景见 U-line.md §U.5（507/508）与 S-line.md §S.5（506）。\n- 号占用核验：500-504 已占用；505 空闲备而不用；本线未占用新号。\n"}, {"id": "00_context/source_notes/S19_Q-line.md", "title": "Q 线（Quality 8 卡）深挖章节 —— V4 交接文档素材（wt779）", "group": "原始报告副本", "html": "<h1>Q 线（Quality 8 卡）深挖章节 —— V4 交接文档素材（wt779）<\/h1>\n<blockquote>\n<p>本文是 <code>v3/V3-COMPLETE-STATUS-FOR-V4.md<\/code> §4「各线深度状态」Q 线章节的深挖草稿，兼为 <strong>Q-08 Final Gate Audit 的执行准备清单<\/strong>（§Q.4-2 逐 gate 证据图）。\n证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n撰写：wt779（2026-09-28，基线 main@c0306be1——撰写中途主干自 b12125ed 推进，已追平后定稿；快照时点 JOURNEY day7 终门（08:00）结果未入 notes）。方法：卡面（v3/07_tasks/cards/Q-0*.md）+ wt759 报告逐卡定位 → 全部交付 SHA <code>merge-base --is-ancestor<\/code> 亲证祖先（Q-01 <code>44252b88<\/code>/Q-02 <code>c6f0b342<\/code>+复验链/Q-03 <code>837f90e2<\/code>/Q-04 <code>66ab4dbd<\/code>+<code>12ce081b<\/code>+<code>7244efb2<\/code>/Q-05 <code>4671173e<\/code>+<code>61af0f0a<\/code>+<code>5236e68d<\/code>/Q-06 <code>12e89303<\/code>+<code>3717355e<\/code>+<code>a1587328<\/code>+<code>0f017515<\/code> 全过）→ 代码/数据开文件亲证（scenarios_v3.jsonl 逐行计数/v3_scenario_eval 六文件/q04_redteam 套件/test_q05_redteam_final.py）→ <strong>测试实跑（O+Q 全部交付套件 445 passed @c0306be1）<\/strong>→ 产物抽读（WT394 raw+HUMAN_INBOX/WT400 summary/WT401 rubric/WT404 REPORT+dashboard/WT406 REPORT+facts/WT460 REPORT）→ 台账闭环逐条复核（FIX-49~58/67~81 状态逐行）。<strong>未轻信任何台账/报告结论性文字。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>Q.0 线级概览<\/h2>\n<p>Q 线是 V3 的「终验执行器」：统一 Runner（Q-01）→ 20 Golden Journeys（Q-02）→ 视觉 QA（Q-03）→ 个性化红队（Q-04）→ 安全红队（Q-05）→ 性能/成本/波动终验（Q-06）→ Chaos/Restore Storm（Q-07，未启动）→ Final Gate Audit（Q-08，未启动）。当前 <strong>6/8 done<\/strong>（tasks.json@c0306be1 亲证；主档 §3「Q 线 1/8」系 wt759 销账前的陈旧口径，该行自带 ⏳ 待复核标记，本档即复核结果：<strong>Q-01~Q-06 六卡全部有主干交付 SHA+产物<\/strong>）。<\/p>\n<p>Q 线执行形态的三个特点（V4 设计者必须先读）：<\/p>\n<ol>\n<li><strong>「诚实 FAIL」是合法交付形态，且已被行使两次<\/strong>——Q-04 总判定 FAIL（precision 0.0 / invalid 硬门违反 ×10 / overpersonalization 41.67% / uplift 0.0pp 原样交付）；Q-02 首轮 13 PASS/6 FAIL/1 RESTRICTED <strong>0 waive 全部转动态卡<\/strong>。Q 线的价值标准是「找出边界」而非「证明好」——这是全库诚实性教义最重的两个样本。<\/li>\n<li><strong>「修而不复跑」是 Q 线最大的结构残差<\/strong>——Q-02 与 Q-04 的全部修复都闭账了（FIX-49/51/53/54/55/57、67~70 逐行核验 FIXED@），但<strong>两张卡都没有一次修复后的全量重跑<\/strong>：Q-02 的终态=首轮 13/20+局部复验（wt400 只复跑 6 条 GJ，其中 GJ08 该轮 5/6）；Q-04 的终态=修前 FAIL dashboard+契约锁翻转（两锁+双失明锁）。最终状态口径=「首轮诚实判定 + 逐缺陷修复 + 局部复验/锁级证据」。<strong>Q-08 终门必须对此显式裁决<\/strong>（补全量重跑/按锁级证据判/如实判 FAIL 或 NOT_REMEASURED 三选一，两卡驱动都在库可复跑）。<\/li>\n<li><strong>证据形态好于 D/E 线<\/strong>——Q-02/03/04/06 有完整卡级产物目录（raw JSONL/REPORT/rubric/dashboard/chao­s_results），台账证据指针零死链（本档对台账引用的四个 Q 线目录逐一 <code>ls<\/code> 亲证在库）；Q-01/Q-05 无卡级目录但产物=在库测试套件+commit 内签收（wt759 已裁决合规、按 wt774 先例作形态残差不占号）。<\/li>\n<\/ol>\n<hr />\n<h2>Q.1 意图（卡面目标与验收）<\/h2>\n<p>八卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。<\/p>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>Risk/Resource/Reviewers<\/th>\n<th>卡面目标（一句话）<\/th>\n<th>卡面关键验收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Q-01 260 场景统一 Runner 与证据格式<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>scenario library 变成可运行 deterministic/model/simulator runner<\/td>\n<td>260 case 可枚举；unsupported 不算 PASS；结果 JSON schema 稳定<\/td>\n<\/tr>\n<tr>\n<td>Q-02 20 Golden Journeys 三端终验<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>核心产品真实跑通，不是模块测试拼接<\/td>\n<td>所有 required journey PASS；失败生成动态卡不用 waive；核心 GJ 三端或明确平台适用<\/td>\n<\/tr>\n<tr>\n<td>Q-03 Autonomous Visual QA 最终波<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>以用户视角对 final RC 逐屏视觉审查<\/td>\n<td>核心 journey A/B=0；其它 reachable A=0；before/after 可对比<\/td>\n<\/tr>\n<tr>\n<td>Q-04 Personalization 独立红队<\/td>\n<td>high/MEDIUM/2<\/td>\n<td>独立攻击「越用越懂我」<\/td>\n<td>达 V3-4 指标<strong>或明确 FAIL<\/strong>；invalid=0 硬门；失败案例原样保留<\/td>\n<\/tr>\n<tr>\n<td>Q-05 Security/Privacy 最终红队<\/td>\n<td>critical/MEDIUM/2<\/td>\n<td>从隔离/工具/Memory/community/entitlement 攻击<\/td>\n<td>P0/P1=0；cross-user=0；unauthorized side effect=0<\/td>\n<\/tr>\n<tr>\n<td>Q-06 Performance/Cost/Provider 波动终验<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>验证 V3 不因智能化变慢变贵到不可用<\/td>\n<td>p50/p95 only if n≥100；false smooth=0；SLO 不达即 FAIL/动态修复不剪异常<\/td>\n<\/tr>\n<tr>\n<td>Q-07 Chaos/Recovery/Offline/Restore Storm 终验<\/td>\n<td>critical/HEAVY/2<\/td>\n<td>新 Runtime/Context 下重跑故障恢复，防回归历史雪崩<\/td>\n<td>false s \n<tr>\n<td>V3-10 North Star WVPL<\/td>\n<td>定义→实现全链在库：north_star_wvpl.py 词表+D-06 fact+O-07 cost_per_wvpl（loops=0 不伪造）；「不得把 chat/send/task-click 当闭环」的判据在 north_star 词表<\/td>\n<td>生产分母=JOURNEY ns001 单用户七日（day1-6 PASS，<strong>day7 终门在快照时点未决<\/strong>）；「active users 分母」在无公网部署下只有演示语义——终门按「本地演示形态」如实标注<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>终门执行建议（成本从低到高）<\/strong>：① 先跑零成本项=O-06 release-manifest 抓取+各 gate 产物程序化索引（本档证据图即起点）；② 低成本补证=trace_timeline.py 真 GJ 重建+Q-02/Q-04 全量重跑各一次（驱动在库、真栈形制 wt400/wt460 先例，各约半窗）；③ 裁决项=portfolio 词表/V3-2 映射口径/SLO 修订/三端条款双口径——需要协调方拍板，建议随 FINAL_V3_GATE_REPORT 的 NOT_RUN/FAIL/BLOCKED 标注一并产出。<\/p>\n<hr />\n<h2>Q.3 设计决定与取舍（从提交/审查考古）<\/h2>\n<ol>\n<li><strong>诚实 FAIL 是合法交付且优于假 PASS<\/strong>（Q-04 总判定 FAIL 照登/Q-02 0 waive/Q-01 unsupported 不算 PASS/Q-06 首轮数据作废声明）：终验线的价值函数是「找到真边界」，四次行使无一次例外。<\/li>\n<li><strong>contract-simulation 语义用 schema 钉死<\/strong>（Q-01）：换来可复现/零 LLM 成本/确定性判定，代价是「260 全绿≠产品绿」——用 provenance 逐 case 记录路由与语义，把解释责任交给引用者。V4 若建新 eval 体系，这是现成的诚实性模板。<\/li>\n<li><strong>程序化判据替代模型 judge<\/strong>（Q-04 blind rubric 0 次 judge/Q-03 四类探针/Q-06 全 raw 复算）：可审计可复跑，代价是判定域受限（词面/结构判据抓不到语义级个性化伤害——Q-04 的 DEFERRED 项如实承认这一点）。<\/li>\n<li><strong>独立性靠机制不靠人头<\/strong>（blind_key 分离落盘/冻结 rubric 只读 pairs/解盲在评审后）：「Reviewer 不看实现」从纪律变成数据流结构。<\/li>\n<li><strong>修而不默认复跑——修复以契约锁钉住，全量重跑留给终门<\/strong>（Q-02/Q-04 共同形态）：省了两轮全量重跑的成本，代价是终态口径碎片化（首轮+局部复验+锁三级证据并存）。本档判断：<strong>对终门而言这个债必须一次性还掉或显式裁决<\/strong>，因为 FINAL gate 的语义就是「唯一最终状态」。<\/li>\n<li><strong>注入面完整性先于结论<\/strong>（Q-06 首轮作废声明+wt460 补齐 11 个 base_url）：chaos 结论的可信度=注入面覆盖率；「部分注入的成功样本」是最危险的 false smooth 形态。<\/li>\n<\/ol>\n<hr />\n<h2>Q.4 残差与 V4 注意点（汇总）<\/h2>\n<ol>\n<li><strong>「修而不复跑」清单（终门必清）<\/strong>：Q-02 全 20 GJ、Q-04 六路红队、FIX-57 的 GJ08/GJ15 真栈复验（在册 DEFERRED）——三个驱动（q02_run_golden_journeys.py/q04 驱动/q06 五件）全在库，补跑是执行问题不是工程问题。<\/li>\n<li><strong>两个独立 eval 同向的负面结论必须带进 V4<\/strong>：Q-04 uplift 0.0pp + A-08 no_memory 臂反超——当前记忆/个性化面在模拟人口上净贡献未被证明为正；V4 的记忆/个性化设计应以「让个性化被证明有用」为第一命题，而不是扩面。<\/li>\n<li><strong>V3-5 数据飞轮中段断链（FIX-507）<\/strong>：Q-06 的 Quality 维度、D-07 两类洞察卡、M-06 经验投影全部因此缺真实数据流；终门 V3-5 判 FAIL/PARTIAL 时的根因指针已在册，门后派修已在协调队列——V4 排期应把它当「飞轮上线」的第一块板。<\/li>\n<li><strong>三端实机证据是 V3 体验面唯一整段缺位<\/strong>（FIX-511 中央箱零覆盖）：V4 初期安排一次集中采集批次（成本在设备/浏览器权限不在代码）——U 线章 §U.4-4 已给清单索引。<\/li>\n<li><strong>Q-07 前置只有一个<\/strong>（O-05 审查回账），执行资产全部现成（§Q.2-Q-07 计划草案）；<strong>FIX-530 P1（Redis 瞬断杀引擎进程）是 Q-07 Work 1 的直接前置缺陷<\/strong>，建议先修后验。<\/li>\n<li><strong>Q-08 的四个裁决项<\/strong>（portfolio 词表/V3-2 映射/SLO 修订/三端双口径）建议在终门前由协调方预先拍板，避免审计会话变成裁决会话。<\/li>\n<li><strong>Q 线台账闭环质量自查结论<\/strong>：Q 线相关 FIX（49-58/67-81/112-113/156）状态逐行核验——除 FIX-52/56（Q-02 遗留，分诊在案）与 FIX-53 状态格问题（本档 512 收口）外全部 FIXED@主干可达；Q 线是台账与代码一致性最好的线之一。<\/li>\n<\/ol>\n<hr />\n<h2>Q.5 本次审查登记<\/h2>\n<ul>\n<li><strong>V3-FIX-512<\/strong>（P2，本次新登记并<strong>当场收口<\/strong>，Q 线章主登记）：台账 V3-FIX-53 行状态格为混合体「<code>OPEN 补记FIXED@10d3d7e8（集成时已修，行状态漏更新——2026-09-26 卫生补记…）<\/code>」——修复本体 10d3d7e8 已在主干（本档 <code>merge-base --is-ancestor<\/code> 亲证祖先），补记也在行内，但状态格仍以 OPEN 开头：机器口径（<code>grep &quot;| OPEN&quot;<\/code>）计其为 OPEN，导致「唯一 OPEN P1=FIX-53」的台账态与「修复在主干」事实矛盾（wt780 度量章「唯一 OPEN P1=FIX-53」即受此影响——该表述对代码状态误报、对台账状态属实）。与 V3-FIX-504/508/510 同族（台账低估漂移）的<strong>状态格未翻转型变体<\/strong>。修法：状态格改写 FIXED@10d3d7e8（保留补记原文），本档已按「集成即纠指」当场执行（同 commit）；ledger 工具可加「行内 FIXED@ 与行首状态枚举一致性」自检（与 504/508 的 FIXED@ 可达性抽检建议合并实施）。<\/li>\n<li><strong>V3-FIX-513<\/strong>（P3，本次新登记，OPEN，Q 线章主登记——Q-08 准备项）：<strong>42 feature portfolio 状态双真源词表分裂<\/strong>——<code>v3/V3_DEFINITION_OF_DONE.md<\/code> Gate V3-0 要求「42 个 feature 有唯一 portfolio 状态：CORE/CONTEXTUAL/LABS/HIDDEN/RETIRE」；而 <code>v3/00_context/MODULE_PORTFOLIO.md<\/code>（初始 pack 导入 0c7fa4c5，自述「desired role」）用扩展词表 CORE 15/CONTEXTUAL 15/LABS 5/SECONDARY 3/CORE_OPTIONAL 1/HIDDEN 1/INTERNAL 2 且 <strong>RETIRE=0<\/strong>（本档逐行解析亲证）；B-01 交付的 <code>v3-output/B-01/MODULE_MATRIX.csv<\/code>+portfolio.json 才是 DoD 五态口径（RECEIPT 独立复核 CORE 15/CONTEXTUAL 18/LABS 5/HIDDEN 4/RETIRE 0，42/42 EXACT MATCH）。后果：①「唯一 portfolio 状态」在文档层不可直接满足——两真源同 feature 值不同（如 achievement：CSV=CONTEXTUAL vs PORTFOLIO=SECONDARY）；②B-01 矩阵基线 a2d8a10c 距今 9+ 天，GOV-015/WS6 删除（~3,958 行）、FIX-490 LearningModeScreen 摘除等 reachability 变化未入册——终门按旧矩阵判 V3-0 会过判。修法方向：终门（Q-08）执行前裁决唯一真源（建议 B-01 矩阵为准、MODULE_PORTFOLIO.md 降级为 desired-role 参考并加注）+按 HEAD 重跑 B-01 式审计或显式钉「矩阵时点=XXX，其后变化见 FIX-490/GOV-015 等」注记；词表映射表（SECONDARY/CORE_OPTIONAL/INTERNAL→五态）随裁决产出。<\/li>\n<li>复核过但<strong>不构成新发现<\/strong>的四项：①Q-01/Q-05 无卡级 v3-output 目录且台账零死指针（本档对台账引用的 Q 线目录逐一 ls 亲证）——按 wt774 先例形态残差不占号；②Q-02 summary.json GJ08 5/6 与 commit message「6/6 回暖」的轮间波动——raw 在档、两数字各属其轮，如实并存非失实；③Q-04 FIX-70② 隐式漂移 DEFERRED——台账注记在案属产品决策留白；④主档 §3「Q 线 1/8」「O 线 4/7」陈旧口径——该行自带 ⏳ 待复核标记，本档即复核（正确值 Q 6/8、O 5/7 done+O-05 交付待审），随章并入修正不占号。<\/li>\n<li>号占用核验：512/513 占用前 grep 复核——HEAD 台账 <code>grep -c &quot;V3-FIX-512\\|V3-FIX-513&quot;<\/code> 零命中；在册号段 500-511/524-526/528-530（530=P1 OPEN，wt780 后新增），512-523 与 527 空闲；本档取 <strong>512/513<\/strong>（514 归兄弟章 O-line.md §O.5，同批登记三号两章共用）。<\/li>\n<\/ul>\n", "text": "# Q 线（Quality 8 卡）深挖章节 —— V4 交接文档素材（wt779）\n\n> 本文是 `v3/V3-COMPLETE-STATUS-FOR-V4.md` §4「各线深度状态」Q 线章节的深挖草稿，兼为 **Q-08 Final Gate Audit 的执行准备清单**（§Q.4-2 逐 gate 证据图）。\n> 证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n> 撰写：wt779（2026-09-28，基线 main@c0306be1——撰写中途主干自 b12125ed 推进，已追平后定稿；快照时点 JOURNEY day7 终门（08:00）结果未入 notes）。方法：卡面（v3/07_tasks/cards/Q-0*.md）+ wt759 报告逐卡定位 → 全部交付 SHA `merge-base --is-ancestor` 亲证祖先（Q-01 `44252b88`/Q-02 `c6f0b342`+复验链/Q-03 `837f90e2`/Q-04 `66ab4dbd`+`12ce081b`+`7244efb2`/Q-05 `4671173e`+`61af0f0a`+`5236e68d`/Q-06 `12e89303`+`3717355e`+`a1587328`+`0f017515` 全过）→ 代码/数据开文件亲证（scenarios_v3.jsonl 逐行计数/v3_scenario_eval 六文件/q04_redteam 套件/test_q05_redteam_final.py）→ **测试实跑（O+Q 全部交付套件 445 passed @c0306be1）**→ 产物抽读（WT394 raw+HUMAN_INBOX/WT400 summary/WT401 rubric/WT404 REPORT+dashboard/WT406 REPORT+facts/WT460 REPORT）→ 台账闭环逐条复核（FIX-49~58/67~81 状态逐行）。**未轻信任何台账/报告结论性文字。**\n\n---\n\n## Q.0 线级概览\n\nQ 线是 V3 的「终验执行器」：统一 Runner（Q-01）→ 20 Golden Journeys（Q-02）→ 视觉 QA（Q-03）→ 个性化红队（Q-04）→ 安全红队（Q-05）→ 性能/成本/波动终验（Q-06）→ Chaos/Restore Storm（Q-07，未启动）→ Final Gate Audit（Q-08，未启动）。当前 **6/8 done**（tasks.json@c0306be1 亲证；主档 §3「Q 线 1/8」系 wt759 销账前的陈旧口径，该行自带 ⏳ 待复核标记，本档即复核结果：**Q-01~Q-06 六卡全部有主干交付 SHA+产物**）。\n\nQ 线执行形态的三个特点（V4 设计者必须先读）：\n\n1. **「诚实 FAIL」是合法交付形态，且已被行使两次**——Q-04 总判定 FAIL（precision 0.0 / invalid 硬门违反 ×10 / overpersonalization 41.67% / uplift 0.0pp 原样交付）；Q-02 首轮 13 PASS/6 FAIL/1 RESTRICTED **0 waive 全部转动态卡**。Q 线的价值标准是「找出边界」而非「证明好」——这是全库诚实性教义最重的两个样本。\n2. **「修而不复跑」是 Q 线最大的结构残差**——Q-02 与 Q-04 的全部修复都闭账了（FIX-49/51/53/54/55/57、67~70 逐行核验 FIXED@），但**两张卡都没有一次修复后的全量重跑**：Q-02 的终态=首轮 13/20+局部复验（wt400 只复跑 6 条 GJ，其中 GJ08 该轮 5/6）；Q-04 的终态=修前 FAIL dashboard+契约锁翻转（两锁+双失明锁）。最终状态口径=「首轮诚实判定 + 逐缺陷修复 + 局部复验/锁级证据」。**Q-08 终门必须对此显式裁决**（补全量重跑/按锁级证据判/如实判 FAIL 或 NOT_REMEASURED 三选一，两卡驱动都在库可复跑）。\n3. **证据形态好于 D/E 线**——Q-02/03/04/06 有完整卡级产物目录（raw JSONL/REPORT/rubric/dashboard/chao­s_results），台账证据指针零死链（本档对台账引用的四个 Q 线目录逐一 `ls` 亲证在库）；Q-01/Q-05 无卡级目录但产物=在库测试套件+commit 内签收（wt759 已裁决合规、按 wt774 先例作形态残差不占号）。\n\n---\n\n## Q.1 意图（卡面目标与验收）\n\n八卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。\n\n| 卡 | Risk/Resource/Reviewers | 卡面目标（一句话） | 卡面关键验收 |\n|---|---|---|---|\n| Q-01 260 场景统一 Runner 与证据格式 | medium/MEDIUM/1 | scenario library 变成可运行 deterministic/model/simulator runner | 260 case 可枚举；unsupported 不算 PASS；结果 JSON schema 稳定 |\n| Q-02 20 Golden Journeys 三端终验 | medium/HEAVY/1 | 核心产品真实跑通，不是模块测试拼接 | 所有 required journey PASS；失败生成动态卡不用 waive；核心 GJ 三端或明确平台适用 |\n| Q-03 Autonomous Visual QA 最终波 | medium/HEAVY/1 | 以用户视角对 final RC 逐屏视觉审查 | 核心 journey A/B=0；其它 reachable A=0；before/after 可对比 |\n| Q-04 Personalization 独立红队 | high/MEDIUM/2 | 独立攻击「越用越懂我」 | 达 V3-4 指标**或明确 FAIL**；invalid=0 硬门；失败案例原样保留 |\n| Q-05 Security/Privacy 最终红队 | critical/MEDIUM/2 | 从隔离/工具/Memory/community/entitlement 攻击 | P0/P1=0；cross-user=0；unauthorized side effect=0 |\n| Q-06 Performance/Cost/Provider 波动终验 | medium/HEAVY/1 | 验证 V3 不因智能化变慢变贵到不可用 | p50/p95 only if n≥100；false smooth=0；SLO 不达即 FAIL/动态修复不剪异常 |\n| Q-07 Chaos/Recovery/Offline/Restore Storm 终验 | critical/HEAVY/2 | 新 Runtime/Context 下重跑故障恢复，防回归历史雪崩 | false success=0；duplicate=0；历史 restore storm SLO 不大幅退化 |\n| Q-08 V3 Final Gate Audit / Commercial RC | critical/MEDIUM/2 | 逐项审 V3 DoD，输出唯一最终状态 | DoD 每条有 evidence link+PASS/FAIL/BLOCKED；不能用「107 任务完成」替代产品 gate；输出 FINAL_V3_GATE_REPORT.md |\n\n---\n\n## Q.2 实际交付逐卡\n\n### Q-01 · 260 场景统一 Runner 与证据格式 —— done（`44252b88`，09-21，R2 PASS）\n\n**交付（本档逐项亲证）**：\n\n- **场景库**：`v3/05_metrics_eval/scenarios_v3.jsonl` **实测 260 行**；run_mode 分布 integration 54 / model 122 / simulator 84（逐行 json 解析计数，与 commit 一致）；12 类目（memory 36/first_value 24/conflict 24/ui_state 24/proactive 24/journey 24/allocation 20/agent_runtime 20/rag 18/security 18/performance 16/community 12）；case_id 恰为 V3-001..V3-260 无缺无重（scenario_schema.py:9 冻结校验）。\n- **三路由 harness**：`backend/tests/v3_scenario_eval/`（六文件 2060 行：grading 505/harnesses 778/runner 223/schema 173/gate test 380）；34 frozen checkers。\n- **unsupported 永不计 PASS**：聚合唯一出口判定；72 项诚实降级（wall-clock/L3-real-stack/ui-render 类）逐项 provenance 记录。\n- **schema 冻结**：`sparkle.v3.scenario-results.v1`（runner.py:38）+ `verdict_semantics=contract-simulation` 钉死（runner.py:42、harnesses.py docstring「确定性参考实现」）。\n- **RealModelAdapter 结构性零绕过**：无网络 import、无条件 raise（\"real model calls are forbidden this round\"）、无 env 门——真模型调用的禁止是**结构不可能**而非约定；seed sha256 per-attempt 确定性。\n\n**验证**：gate 27/27（本次实跑绿，含在 445 内）。\n\n**残差与 V4 必读**：① **「260 场景」的 verdict 语义是 contract-simulation**——跑的是确定性参考实现的判定，不是真模型/真产品全链；「260 全绿」≠「产品全绿」，V4 引用时必须带此定语（schema 里钉死的正是这个诚实性）。② model 型 122 例在 mock-provider 上跑（reference-mock-v1），simulator 型 84 例是 stub——三路由的「证据强度梯度」由 provenance 逐 case 记录，终门引用时应按路由分层引用。③ 卡面「支持 repeat/seed/provider config」：repeat/seed 在 schema（repeat 字段实测在 jsonl）；provider config 面=RealModelAdapter 的预留接口（raise 形态），真 provider 接入未发生（与 E-04/M-09 的真模型 eval 分工）。\n\n### Q-02 · 20 Golden Journeys 三端终验 —— done（`c6f0b342`，09-25；修复链+局部复验；**无修复后全量重跑**）\n\n**首轮（wt394，常驻栈双端 200 真服务 API 级 headle top:112 被 top:48 统计列压住→挂入同列流式）。\n\n**12 维 rubric 终态**：核心 13 屏逐屏 12 维打分表在库——**核心旅程 A/B 合计=0**（遗留 C：C02 density 首屏三层叠/C03 时间戳对比度 3.08/C05「普通」1.74/C06 品牌字 4.28/C11「75 分钟」2.50——全部次级信息 C 级带坐标证据）；long-tail 85 屏 12 维汇总（Clarity 1.93~Consistency 2.0）**A=0、遗留 C 7 项**；before/after 6 组成对+并排合成图。q03 套件 26/26+守卫 4/4 红→绿+analyze 601=601 零漂移。\n\n**附带登记**：V3-FIX-57（P2 连胜概览文案窗矛盾）/58（P3 星图 rail/CTA 重叠，先于本卡存在）/59/60。\n\n**残差**：① 单档单尺寸（standard 档 390x844@2x）——低刺激档属 wt399 不触碰、三端真机尺寸未渲染（转 HUMAN_INBOX）；② 「独立 visual Reviewer」的独立性=程序化 12 维 rubric+独立会话产物（非独立人类/独立模型审查者）；③ 截图基线与 U-09 的 visual_baseline.py matrix 命令的回归链是**就绪清单**非已建基线（U 线章已述，本卡同口径）。\n\n### Q-04 · Personalization / Overpersonalization 独立红队 —— done（本体 `66ab4dbd` + 修复 `7244efb2`/`12ce081b`；总判定 **FAIL 如实**；**修复后无全量重跑**）\n\n**首轮六路攻击（10/10 persona × 六路双跑，dashboard 逐字节一致）**——WT404-Q04-REDTEAM/（raw/redteam.jsonl 100 记录+blind 四件套+dashboard.json+DASHBOARD.md+REPORT.md）：\n\n| V3-4 指标 | 目标 | 实测 | 判定 |\n|---|---|---|---|\n| precision | ≥95% | **0.0**（observable uses 10 全为被否认记忆复活；纠正后偏好 0 次到达输出面——selfcheck 词面门） | NOT MET |\n| invalid memory use | =0 硬门 | **10**（patch 归因跨 scope，V3-FIX-67） | **VIOLATED** |\n| overpersonalization | ≤5% | **41.67%**（50/120） | NOT MET |\n| paired uplift | +15pp | **0.0pp**（双臂决策全同） | NOT MET |\n\nPASS 面（隐私与隔离的四路）：敏感信息零泄漏（含切题轮）/删除撤回注入三面零复活/跨用户 pack+squad+spine 零串号/无关历史零上 prompt 面。findings 4 类 50 条照登（FIX-67/68/69/70）。\n\n**paired blind review 方法（卡面「Reviewer 不看实现」的机械化）**：20 对同 context 双臂候选；臂→候选映射 seeded RNG（`pair_id::v1`）单独落 blind_key.json；pairs 文件零臂标识（契约测断言）；冻结程序化 rubric 只读 pairs 打分→评审后解盲 join；**模型 judge 0 次**（全部确定性词面/链头/差分判据）。结果：rubric 偏好 personalized 8/20、control 12/20；双臂决策质量全同——**个性化臂在决策面零增益的根因=纠正后偏好/自评主张几乎全被 selfcheck 词面门切掉，从未进入决策上下文（precision=0 的同源根因）**。\n\n**修复与锁**：FIX-67 FIXED@`7244efb2`（applied_patch_ids 对齐 situation_patches 同一 scope_matches 谓词）；FIX-68/69/70 FIXED@`12ce081b`（种子库筛查+围栏+来源标注三层；prompt_note loser 改 id 归因零原文；deny 确定性标记+72h 冷却窗）——**q04 两锁翻转为修复后形态（L1 loser 零过境/L2 deny 后零同位复活）+双失明锁（合成过境/复活记录仍须被 _invalid_events 计出）**；FIX-70②隐式漂移吸收如实 DEFERRED（行为反证阈值属产品决策）。测试：backend/tests/q04_personal_redteam/ 套件（engine/metrics/protocol/worlds+test_q04_redteam_final.py），本次实跑绿（445 内）。\n\n**残差（终门 V3-4 的直接输入）**：① **修复后无六路全量重跑**——dashboard 的 FAIL 数字是修前快照；invalid=0 硬门的「现值」只有锁级证据（两条翻转锁+失明锁），没有 dashboard 级复测；② precision 0.0 的同源根因（纠正后偏好不到输出面）与 FIX-36（渲染器不渲染偏好值）同族——M-09 侧的「真模型复验」欠账已在册（V3-FIX-503 OPEN）；③ uplift 0.0pp 的深层问题（模拟人口上个性化无增益）与 A 线章 A-08 终态（no_memory 臂双指标反超 full）**互相印证**——两个独立 eval 指向同一结论：**当前实现下记忆/个性化面对模拟人口的净贡献未被证明为正**，这是 V4 个性化设计的最重要负面输入。\n\n### Q-05 · Security/Privacy/Permission 最终红队 —— done（`4671173e` + 合并态补修 `61af0f0a` + 审查轮4 `5236e68d`，09-25/26）\n\n**交付（commit message 逐项+测试在库亲证）**：五路攻击面 **43 scenario** headless 真实链验证——跨账号/local cache/prompt injection/tool escalation/revoked memory/seed namespace；**当场修 4 缺陷**：P0 seed 跨账号私库泄漏 / P1 轨迹 revoked 复活 / P1 错误本记忆复活 / P1 日志敏感正文（合并态验证抓到工具历史失败日志带 [parameters] 正文——worker 单跑未触发路径，教训「合并态验证必须跑跨卡重叠文件组合」入 fleet notes）；`test_q05_redteam_final.py`（1145 行）+stubs 在库，本次实跑绿（445 内含 security 套件）。独立审查：wt410 审查轮 4（5236e68d）+wt424 审查轮的注入围栏变体逃逸族由 wt432 修复（cd36f682，FIX-112/113）——**Q-05 的审查不止一轮**。\n\n**残差**：① 无卡级 v3-output 目录（签收在 commit message；台账零死指针本档复核——按 wt774 先例形态残差不占号）；② 卡面「动态扫描+手工 scenario」中手工 scenario 面与「logs/trace 无敏感正文」的运行级证据未在产物层定位（判定域=43 scenario 套件覆盖面）；③ 与 O-03 分工：O-03=机制红线对抗复测+修复（词表 fail-closed），Q-05=最终面确认（跨账号/工具/Memory/community/entitlement 五路）——终门引用时按此分工。\n\n### Q-06 · Performance / Cost / Provider 波动终验 —— done（本体 `12e89303` + 修复族 `3717355e`/`a1587328`/`0f017515` + 真栈复验 wt460；**「400 样本 0.06s」的出处卡**）\n\n**路线一：分层 bench（400 真样本，L0-L3 各 n=100，50 distinct × 2 reps；真实 dashscope/deepseek/zhipu/xiaomi 上游，guest JWT→gRPC StreamChat；WT406-Q06-PERF/raw-bench.jsonl+facts-bench.json）**：\n\n| 层 | n(ok) | TTFT p50/p95 | total p95 | 首事件 p95 |\n|---|---|---|---|---|\n| L0 | 100 | 0.91s/1.88s | 22.97s | 0.04s |\n| L1 | 100 | 1.58s/2.25s | 35.01s | 0.05s |\n| L2 | 98 | 1.80s/9.36s | **48.25s** | 0.04s |\n| L3 | 95 | 7.20s/**141.40s** | **215.03s** | **0.06s** |\n\n* 代价是终态口径碎片化（首轮+局部复验+锁三级证据并存）。本档判断：**对终门而言这个债必须一次性还掉或显式裁决**，因为 FINAL gate 的语义就是「唯一最终状态」。\n6. **注入面完整性先于结论**（Q-06 首轮作废声明+wt460 补齐 11 个 base_url）：chaos 结论的可信度=注入面覆盖率；「部分注入的成功样本」是最危险的 false smooth 形态。\n\n---\n\n## Q.4 残差与 V4 注意点（汇总）\n\n1. **「修而不复跑」清单（终门必清）**：Q-02 全 20 GJ、Q-04 六路红队、FIX-57 的 GJ08/GJ15 真栈复验（在册 DEFERRED）——三个驱动（q02_run_golden_journeys.py/q04 驱动/q06 五件）全在库，补跑是执行问题不是工程问题。\n2. **两个独立 eval 同向的负面结论必须带进 V4**：Q-04 uplift 0.0pp + A-08 no_memory 臂反超——当前记忆/个性化面在模拟人口上净贡献未被证明为正；V4 的记忆/个性化设计应以「让个性化被证明有用」为第一命题，而不是扩面。\n3. **V3-5 数据飞轮中段断链（FIX-507）**：Q-06 的 Quality 维度、D-07 两类洞察卡、M-06 经验投影全部因此缺真实数据流；终门 V3-5 判 FAIL/PARTIAL 时的根因指针已在册，门后派修已在协调队列——V4 排期应把它当「飞轮上线」的第一块板。\n4. **三端实机证据是 V3 体验面唯一整段缺位**（FIX-511 中央箱零覆盖）：V4 初期安排一次集中采集批次（成本在设备/浏览器权限不在代码）——U 线章 §U.4-4 已给清单索引。\n5. **Q-07 前置只有一个**（O-05 审查回账），执行资产全部现成（§Q.2-Q-07 计划草案）；**FIX-530 P1（Redis 瞬断杀引擎进程）是 Q-07 Work 1 的直接前置缺陷**，建议先修后验。\n6. **Q-08 的四个裁决项**（portfolio 词表/V3-2 映射/SLO 修订/三端双口径）建议在终门前由协调方预先拍板，避免审计会话变成裁决会话。\n7. **Q 线台账闭环质量自查结论**：Q 线相关 FIX（49-58/67-81/112-113/156）状态逐行核验——除 FIX-52/56（Q-02 遗留，分诊在案）与 FIX-53 状态格问题（本档 512 收口）外全部 FIXED@主干可达；Q 线是台账与代码一致性最好的线之一。\n\n---\n\n## Q.5 本次审查登记\n\n- **V3-FIX-512**（P2，本次新登记并**当场收口**，Q 线章主登记）：台账 V3-FIX-53 行状态格为混合体「`OPEN 补记FIXED@10d3d7e8（集成时已修，行状态漏更新——2026-09-26 卫生补记…）`」——修复本体 10d3d7e8 已在主干（本档 `merge-base --is-ancestor` 亲证祖先），补记也在行内，但状态格仍以 OPEN 开头：机器口径（`grep \"| OPEN\"`）计其为 OPEN，导致「唯一 OPEN P1=FIX-53」的台账态与「修复在主干」事实矛盾（wt780 度量章「唯一 OPEN P1=FIX-53」即受此影响——该表述对代码状态误报、对台账状态属实）。与 V3-FIX-504/508/510 同族（台账低估漂移）的**状态格未翻转型变体**。修法：状态格改写 FIXED@10d3d7e8（保留补记原文），本档已按「集成即纠指」当场执行（同 commit）；ledger 工具可加「行内 FIXED@ 与行首状态枚举一致性」自检（与 504/508 的 FIXED@ 可达性抽检建议合并实施）。\n- **V3-FIX-513**（P3，本次新登记，OPEN，Q 线章主登记——Q-08 准备项）：**42 feature portfolio 状态双真源词表分裂**——`v3/V3_DEFINITION_OF_DONE.md` Gate V3-0 要求「42 个 feature 有唯一 portfolio 状态：CORE/CONTEXTUAL/LABS/HIDDEN/RETIRE」；而 `v3/00_context/MODULE_PORTFOLIO.md`（初始 pack 导入 0c7fa4c5，自述「desired role」）用扩展词表 CORE 15/CONTEXTUAL 15/LABS 5/SECONDARY 3/CORE_OPTIONAL 1/HIDDEN 1/INTERNAL 2 且 **RETIRE=0**（本档逐行解析亲证）；B-01 交付的 `v3-output/B-01/MODULE_MATRIX.csv`+portfolio.json 才是 DoD 五态口径（RECEIPT 独立复核 CORE 15/CONTEXTUAL 18/LABS 5/HIDDEN 4/RETIRE 0，42/42 EXACT MATCH）。后果：①「唯一 portfolio 状态」在文档层不可直接满足——两真源同 feature 值不同（如 achievement：CSV=CONTEXTUAL vs PORTFOLIO=SECONDARY）；②B-01 矩阵基线 a2d8a10c 距今 9+ 天，GOV-015/WS6 删除（~3,958 行）、FIX-490 LearningModeScreen 摘除等 reachability 变化未入册——终门按旧矩阵判 V3-0 会过判。修法方向：终门（Q-08）执行前裁决唯一真源（建议 B-01 矩阵为准、MODULE_PORTFOLIO.md 降级为 desired-role 参考并加注）+按 HEAD 重跑 B-01 式审计或显式钉「矩阵时点=XXX，其后变化见 FIX-490/GOV-015 等」注记；词表映射表（SECONDARY/CORE_OPTIONAL/INTERNAL→五态）随裁决产出。\n- 复核过但**不构成新发现**的四项：①Q-01/Q-05 无卡级 v3-output 目录且台账零死指针（本档对台账引用的 Q 线目录逐一 ls 亲证）——按 wt774 先例形态残差不占号；②Q-02 summary.json GJ08 5/6 与 commit message「6/6 回暖」的轮间波动——raw 在档、两数字各属其轮，如实并存非失实；③Q-04 FIX-70② 隐式漂移 DEFERRED——台账注记在案属产品决策留白；④主档 §3「Q 线 1/8」「O 线 4/7」陈旧口径——该行自带 ⏳ 待复核标记，本档即复核（正确值 Q 6/8、O 5/7 done+O-05 交付待审），随章并入修正不占号。\n- 号占用核验：512/513 占用前 grep 复核——HEAD 台账 `grep -c \"V3-FIX-512\\|V3-FIX-513\"` 零命中；在册号段 500-511/524-526/528-530（530=P1 OPEN，wt780 后新增），512-523 与 527 空闲；本档取 **512/513**（514 归兄弟章 O-line.md §O.5，同批登记三号两章共用）。\n"}, {"id": "00_context/source_notes/S20_O-line.md", "title": "O 线（Ops 7 卡）深挖章节 —— V4 交接文档素材（wt779）", "group": "原始报告副本", "html": "<h1>O 线（Ops 7 卡）深挖章节 —— V4 交接文档素材（wt779）<\/h1>\n<blockquote>\n<p>本文是 <code>v3/V3-COMPLETE-STATUS-FOR-V4.md<\/code> §4「各线深度状态」O 线章节的深挖草稿。\n证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n撰写：wt779（2026-09-28）。<strong>基线说明<\/strong>：本档开写时 main@b12125ed，撰写中途主干推进（wt773 O-05 交付集成轮#269、wt777 探针收口轮#270、wt780 度量章轮#271、wt778 mypy 批十一），本档已随 <code>git reset --hard<\/code> 追平至 main@c0306be1 后定稿——O-05 的「交付待审」态、FIX-524~530 等新账均按新基线收录。方法：卡面（v3/07_tasks/cards/O-0*.md）+ <code>git log<\/code>/wt759 报告逐卡定位 → 全部交付 SHA <code>merge-base --is-ancestor<\/code> 亲证祖先（O-02 <code>1ac2ec17<\/code>/O-03 <code>d475d8be<\/code>/O-04 <code>c86a6237<\/code>/O-07 <code>ea0167ca<\/code>+<code>864edcb1<\/code>/O-06 <code>1ca6c2dc<\/code>+<code>a376dbdb<\/code>+<code>e \n<\/ul>\n<p><strong>后续演进的存活证明（本档追踪）<\/strong>：D-REDEEM 兑换码闭环（<code>e375ed62<\/code>）给 entitlement 加了 <code>entitlement_expires_at<\/code> 到期面——<code>entitlement_effective<\/code> 引擎/网关双侧同步扩展（NULL=永久，过期降级方向仍恒 pro→free），<strong>解耦契约在扩展中存活<\/strong>；wt688 mypy 批四只动类型。这是「单一判官+两侧同步义务」设计对后续演进的韧性实证。<\/p>\n<p><strong>残差<\/strong>：「付费状态变化正确生效」的运行级证据=测试面；V3 无真实支付 provider（商业面只有兑换码），staging 级真实支付流验收天然不存在——V4 若接支付，判级面已就绪、支付通道面全新。<\/p>\n<h3>O-05 · Backup/Restore + 一致性演练 —— <strong>交付待审<\/strong>（<code>1680d16c<\/code> 已在主干，独立审查 wt782 在航）<\/h3>\n<p><strong>状态<\/strong>：tasks.json 仍 TODO（审查未回，销账待 wt782 receipt——符合「worker 自称完成不算完成」验收模型）。交付本体随轮#269 集成（ fleet notes 原文「重大发现：既有备份链静默失效」）。<\/p>\n<p><strong>重大发现（运维面最高价值的单笔发现）<\/strong>：<strong>V3 的生产备份链此前是静默失效的<\/strong>——① backup pg_dump 缺 <code>--clean --if-exists<\/code>，恢复进非空库=假成功混合态（RED 实录：exit 0 + <strong>2156 条被吞 SQL 错误<\/strong>、漂移 ghost 行/硬删行缺失/run 状态推进全残留）；② MinIO 归档依赖容器内 tar，生产镜像（RELEASE.2025-09-07）无 tar → backup 实跑 exit 127，<strong>cron 每晚 03:15 的备份从未产出完整包<\/strong>（sha256sums/manifest 从未存在）。两者均已修复：dump 精确快照+restore ON_ERROR_STOP=1+连接排空+STRICT_SCHEMA 代差门+MinIO 改宿主 tar+manifest 增 alembic_head/pg 版本/耗时。<\/p>\n<p><strong>演练实录（v3-output/WT773-O05/drill/ 四件产物，本次抽读亲证）<\/strong>：一次性容器栈（零触碰常驻栈）——backup_manifest.json（PG 16.15/<code>--clean --if-exists<\/code>/alembic wt598_20260927/<strong>backup 5s<\/strong>）；restore 6s；7 表快照等价 12 项全过（ghost 清零/硬删行 PITR 找回/run 脊柱/outbox/processed_events 回备份点）；<strong>restore_consistency_check.py INV-1..7 全 PASS verdict=PASS<\/strong>（词表封闭/末条迁移投影/per-intent 活跃唯一/序列计数器不回填/墓碑完整/零孤儿/基线快照等价——479 行校验器+362 行 14 测在库）；恢复栈起 uvicorn+网关后 <strong>GJ03 11/11 全真链路 PASS<\/strong>、run query 三面 200；<strong>GJ08 4/6 如实<\/strong>（两个 real_llm chat 步无 key 走引擎 demo-mode 空回，引擎日志在案不伪造）。「无已删 memory 复活」由 INV-5 墓碑完整+Q-04 2b/2c 探针族双保险。<\/p>\n<p><strong>RPO/RTO 如实判读<\/strong>：RPO 由 cron 周期决定=<strong>最坏 24h 丢失窗<\/strong>（收紧/异地化属容量决策，install_backup_cron.sh 头注已登记 mc mirror 待办）；RTO 实测≈restore 6s+栈起。<\/p>\n<p><strong>新增台账<\/strong>：<strong>V3-FIX-505<\/strong>（P2，OPEN）——redis-stack 持久化 dir=/var/lib/redis-stack 与 compose 卷挂载 /data 错位：旧 restore 写 /data/dump.rdb 是<strong>静默无效恢复<\/strong>（keys loaded: 0 实录），prod 容器重建即 Redis 全损；脚本面已修（CONFIG GET dir 动态落盘，keys loaded: 2 实录），<strong>compose/启动参数裁决 OPEN<\/strong>——不加 <code>--dir /data<\/code> 或改挂载，prod Redis 耐久性=容器生命周期。<strong>这是 O-05 留给 V4 的最高优先运维裁决项。<\/strong><\/p>\n<p><strong>编号占位混乱（本档登记 V3-FIX-514，见 §O.5）<\/strong>：交付 commit message 自称「V3-FIX-504/505」——其 504（备份脚本缺陷，卡内已修 RESOLVED）与 wt769 已占的 504 撞号，轮#269 记「撞号 504→520 已闭」但<strong>台账从未存在 520 行<\/strong>（本次 <code>git show<\/code> 于 1680d16c/9a4ea3d4/deb5e27c/7dfe1577 四个时点 grep 全零亲证）；卡内已修项无台账行本身合规（停手登记纪律的反面=修了不用登记），但 commit message 的 504 引用成了幻影指针——检索者会撞到 wt769 的 FIX-258 行。<\/p>\n<h3>O-06 · Kill Switch / Release / Rollback 统一操作面 —— done（交付 <code>1ca6c2dc<\/code> → 独立审查 <code>a376dbdb<\/code> PARTIAL → 补丁采纳 <code>e06d50ff<\/code> 升 APPROVE → 销账 101/107）<\/h3>\n<p><strong>V3 后期唯一走完「实现→独立审查抓真运行级缺陷→补丁→APPROVE」全链的高风险卡<\/strong>，审查链三笔全部主干祖先亲证。<\/p>\n<p><strong>交付面（wt765 notes 逐项+本档复核）<\/strong>：<\/p>\n<ul>\n<li><strong>注册表<\/strong>：<code>ops_surface.py<\/code>（885 行）<code>CAPABILITY_SPECS<\/code> 对 <strong>64 个既有三态绑定<\/strong>（散在 27 模块，AST 扫描实测）做惰性走径索引（importlib+getattr，引用绑定对象本身零复制定义）；capability_id=<code>&lt;binding.stage&gt;.&lt;binding.feature&gt;<\/code> 与 Prometheus <code>KILL_SWITCH_MODE{stage,feature}<\/code> 标签逐字对齐（「flag 状态可观测」与既有 gauge 同一坐标系）；domain 封闭词表 aurora 53/memory 4/fme 2/infra 5。<strong>registered-iff-read 机器化<\/strong>：AST 生成式对账测试（漏登 spec 红/删绑定留幽灵 spec 红——wt771 双向变异抽验 7 failed 实录咬合）。<\/li>\n<li><strong>诚实补注册<\/strong>：<code>AURORA_META_LEARNING_ROUTING_PARAMS_MODE<\/code> 声明在绑定而 Settings 权威字段缺席（env 通道死路）→ settings.py 补字段默认 &quot;off&quot;（与缺席等价零行为变化）——「注册新 flags」在本仓现实中的诚实落点是<strong>补齐已声明未落地的 flag<\/strong> 而非无读者造新旗。<\/li>\n<li><strong>未受控 live 实验扫雷两项，如实登记不顺手修<\/strong>：<strong>V3-FIX-500<\/strong>（P4，OPEN）<code>AURORA_DEFAULT_MODE<\/code>「总默认」全仓零读者；<strong>V3-FIX-501<\/strong>（P3，OPEN）5 个元认知 confidence proxy 直读 settings 绕开 kill switch 核心（无 Redis 翻转/无 gauge/非法值判「启用」与三态回落语义相悖）。<\/li>\n<li><strong>per-capability 回滚<\/strong>：写前快照压史（LPUSH/LTRIM 20/TTL 30 天）→ 步进恢复（rollback 标记非恢复点防震荡、损坏条目跳过、史尽 409）；词表外 mode 显式 400 不静默回落；Redis 缺席 503 拒写（不把 no-op 冒充成功）。<\/li>\n<li><strong>release manifest<\/strong>：model/config/migration 三段只读装配，任一源缺席→null+error 注记绝不伪造；<strong>不含 git SHA 是设计决定<\/strong>（「运行时进程不可靠自证构建 SHA，伪造不如缺席；build-time 注入属部署面 O-01 域」）——Q-08 做 RC manifest 时必须处理这个缺口。<\/li>\n<li><strong>安全姿态<\/strong>：<code>/api/internal/ops<\/code> 五端点 INTERNAL_API_KEY 常数时间比较；smoke 脚本默认进程内 fakeredis、真栈需双显式确认且<strong>硬编码只翻 shadow 并自回滚、无批量端点<\/strong>。<\/li>\n<\/ul>\n<p><strong>独立审查价值实录（WT771 receipt，本档全文抽读）<\/strong>：wt771 按「真栈 shadow 回滚实录铁律」执行，<strong>抓获交付版实锤缺陷<\/strong>——<code>--redis-url<\/code> 分支 <code>aioredis.from_url<\/code> 缺 <code>decode_responses=True<\/code>，bytes 客户端下 read_mode 取回 <code>b'shadow'<\/code> 被 normalize 成 fallback <code>&quot;live&quot;<\/code> → 回滚判无恢复点 → NoRollbackPointError 崩出且<strong>翻转旗滞留 shadow<\/strong>；审查现场字节级恢复（DEL 自建 3 键，扫描双空）+离线 fakeredis bytes 探针证实根因；reviewer patch 后同栈复跑 exit 0。 Forbidden #3「不以静态阅读宣称通过」被评「部分违反（轻）」——wt765 声称「栈面证据脚本已备好」恰是静态结论。补丁采纳（<code>e06d50ff<\/code>：decode_responses+异常时恢复 baseline 非零退出）后升 APPROVE 销账。<strong>这是验收模型（独立审查必须独立执行关键验收）价值的一次教科书级兑现。<\/strong><\/p>\n<p><strong>后续<\/strong>：层21 CI 红揭示 O-06 五路由未登记网关 parity → 修复 <code>8d59598c<\/code> 登记 <strong>ENGINE_ONLY<\/strong>（设计判断原文：「kill switch 必须在网关自身被回滚时仍可达，控制面不依赖被控面」——本档认为这是本卡最重要的架构裁决，V4 的控制面设计应继承）。<\/p>\n<p><strong>残差<\/strong>：① 回滚史 TTL 30 天/20 条为工程取值无数据支撑；② 5 个 SLO 绑定的自动化写方（auto_degrade webhook）不经 ops_surface、不写史（自动化动作审计归自身事件面）；③ <strong>字面量 prefix 守卫洞<\/strong>（receipt §5-5 建议的对 <code>&quot;sparkle:&quot;/&quot;aurora:&quot;<\/code> 字面量家族调用点 AST 扫描，至今未采纳——test_ops_surface_registry.py:101 整族跳过亲证；若 spec 抄错字面量 prefix 会产生「翻一个没人读的键」的静默 no-op）；④ <strong>钉住值语义<\/strong>（receipt §5-2b）：翻转+回滚会在 Redis 留下与 settings 同值的钉，此后改 env 默认不再生效且本面无 DEL 键操作——建议的 OPS_SURFACE.md 运维注记未见追加；⑤ 升栈演练证据（staging+<code>--redis-url<\/code>）待 O-01。<\/p>\n<h3>O-07 · 成本/配额/Queue 生产预算与 Graceful Degradation —— done（本体 <code>ea0167ca<\/code> + P2-7 <code>864edcb1<\/code>，验收 PASS_WITH_P2）<\/h3>\n<p><strong>交付（六件套，全部开文件亲证）<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>面<\/th>\n<th>内容<\/th>\n<th>关键判据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>budget_matrix<\/td>\n<td>entitlement→四维 run 限额薄派生（free 150k tok/$0.5/50 tools/1800s；pro 600k/$2/200/3600s）；<strong>判级唯一走 entitlement、派生值过 X-06 normalize_budget 单一校验面<\/strong>（不造第二套预算形状）<\/td>\n<td>settings.py:515-519 默认值在库；<code>RUN_BUDGET_DEFAULTS_ENABLED<\/code> 可关；配置为空→「run stays unlimited this creation」<strong>仅 WARNING<\/strong>（模块自定位「best-effort 收紧非可用性闸门」——诚实但 V4 应知此 fail-open 边界）<\/td>\n<\/tr>\n<tr>\n<td>queue_backpressure<\/td>\n<td>celery_dispatch 投递 choke point：LLEN 超限丢弃不 send_task+<code>sparkle_queue_backpressure_drops_total<\/code>+WARNING；glm_batch 上限 200/默认 1000；LLEN 与 send_task 同 broker 连接<\/td>\n<td>queue_backpressure.py（现 335 行）结构亲证；上限默认 settings.py:527-530<\/td>\n<\/tr>\n<tr>\n<td>预算熔断<\/td>\n<td>BudgetCircuitBreaker：Redis 故障退<strong>进程内保守累计<\/strong>（成本仍有 per-process 上界，非 fail-open），恢复回落真值+fallback metric 留痕<\/td>\n<td>test_o07_cost_redis_bounded_degrade.py 9 测<\/td>\n<\/tr>\n<tr>\n<td>超预算 UX<\/td>\n<td>chat 流式补发确定性双语收尾说明（零 LLM）+gRPC 错误映射「发生了什么+怎么办」（RATE_LIMITED+retryable），变异红证钉死不被 provider 分支误吸<\/td>\n<td>safe_error_messages.py（现 191 行）<\/td>\n<\/tr>\n<tr>\n<td>cost/WVPL metrics<\/td>\n<td>日成本/D-06 loops_total→<code>sparkle_cost_per_wvpl_usd<\/code>；<strong>loops=0 不写不伪造<\/strong>；beat 05:10 low_priority<\/td>\n<td>cost_wvpl_metrics.py+worker 亲证；分母注释「7 日窗口 WVPL loop 数」<\/td>\n<\/tr>\n<tr>\n<td>P2-7 背压收口<\/td>\n<td>摸底 37 处直发点：36 改接统一背压投递面（dispatch_task_async 薄壳化）；<strong>保留 1<\/strong>：users.py purge_deleted_account（30 天 ETA GDPR 硬删除——丢弃=静默取消删除语义不可接受）+静态守卫 allowlist<\/td>\n<td><code>864edcb1<\/code>；禁新增直发点守卫 <code>test_no_direct_dispatch_outside_allowlist<\/code> :341 亲证<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>验收实录（commit message）<\/strong>：单员全权 PASS_WITH_P2——224 重跑零失败、4 变异 11 红证、真 broker 201 深度拒投探针、超预算 UX 全链探针；默认限额裁决 ACCEPT（dev 实测均值 2856 tok/req，余量 9×）；P2×7 登记→P2-7 即时收口（上表）。<\/p>\n<p><strong>跨线供血（本档追踪）<\/strong>：O-07 的 queue_backpressure/celery_dispatch/safe_error_messages 是 Q-06 波动注入修复（FIX-78 全断供快速失败/FIX-79 过载背压，<code>3717355e<\/code>）的落点——safe_error_messages.py 50→191 行的增长即 Q-06 修复所致。其观察移交项「generate_capsules_batch 显式 default 队列（疑似事故同模式漏改）」由后续 P3 sweep <code>a8937be9<\/code> 修复（celery_app.py task_routes 现指向 glm_batch，本档亲证）——<strong>O-07 的观察-移交-闭环链完整<\/strong>。<\/p>\n<p><strong>残差<\/strong>：① cost/WVPL 指标有计数器面无运行级读数在档（分母依赖 D-06 north-star fact 的生产数据——JOURNEY ns001 七日驱动是唯一真实分母来源）；② 预算派生的空配置 fail-open 边界（见上表）；③ 全链运行级「额度耗尽 UX」验收是探针级（A2 预算 UX 全链探针），无长周期真实耗尽案例。<\/p>\n<hr />\n<h2>O.3 设计决定与取舍（从提交/审查考古）<\/h2>\n<ol>\n<li><strong>宁降不升的 fail-safe 指向全线一致<\/strong>（O-04 判级/O-07 预算派生/O-06 词表外 400）：判级/预算/翻转的故障方向恒为「丢权益/不 flip/拒绝」，绝不「送成本/静默改写/冒充成功」——O-06 notes 把它说成「成本 fail-safe」哲学，是本线最一致的设计签名。<\/li>\n<li><strong>不重建权威——薄派生+惰性走径+单一判官<\/strong>（Forbidden #1 的正面执行）：O-06 注册表引用绑定对象本身、O-07 派生值过既有 normalize_budget、O-04 单一 judge 双侧同语义+成文同步义务。代价：字面量形态的对账盲区（O-06 prefix 守卫洞）与两侧漂移风险（靠 docstring 纪律维持）。<\/li>\n<li><strong>控制面与被控面分离<\/strong>（O-06 + 层21 ENGINE_ONLY 裁决）：kill switch 控制面挂引擎 INTERNAL_API_KEY 且不依赖网关存活——「网关被回滚时仍可翻旗」。V4 的运维面拓扑应继承此判断。<\/li>\n<li><strong>危险操作的多层确认与不可逆操作的结构性排除<\/strong>（O-06 smoke 双显式+只 shadow+无批量端点+503 拒写；O-07 P2-7 对 GDPR 删除任务的唯一豁免+静态守卫）：不是靠流程纪律而是靠「脚本里没有那个能力」。<\/li>\n<li><strong>观测/降级永不伪造<\/strong>（O-02 span 吞异常但 PII 指纹化；O-06 manifest fail-soft null+error；O-07 loops=0 不写不伪造；O-05 GJ08 4/6 如实空回）：失败可见、缺席诚实，与全库「不静默兜底」教义同源。<\/li>\n<li><strong>演练宁可一次性容器栈也不碰常驻栈<\/strong>（O-05）与<strong>审查必须真栈执行<\/strong>（O-06 wt771 铁律）：两条纪律合力把「运维能力」从代码存在性推进到运行级证据，同时也暴露了 staging 缺位时运行级证据的天花板（全部 localhost 形态）。<\/li>\n<\/ol>\n<hr />\n<h2>O.4 残差与 V4 注意点（汇总）<\/h2>\n<ol>\n<li><strong>O-01 是单点也是天花板<\/strong>：V3-9 gate、Q-02 GJ19、Q-07 remote 腿、全部 staging 级演练都挂在用户 TCC 一个动作上；弹药（secrets/ECS/部署脚本）全部就绪且部分易失（/tmp）。<strong>V4 排期应把「凭据到手」建模为随机事件：先做本地容器栈能做的一切（O-05 判例），remote 段显式 RESTRICTED。<\/strong><\/li>\n<li><strong>O-05 交付待审 + FIX-505 OPEN 残差是当前最高优先运维项<\/strong>：prod Redis 耐久性=容器生命周期（redis dir≠compose 卷）待 compose/启动参数裁决；RPO 最坏 24h。这两个是「数据会不会丢」级的问题，优先级高于本线其余全部残差。<\/li>\n<li><strong>O-02 的运行级证据缺一口<\/strong>：trace 脊柱机制真实（445 测内绿），但「真 GJ 用 trace_id 重建时间线」的运行级产物全库没有——终门/审计前用在库脚本 trace_timeline.py 跑一条真实 GJ 即可补上，成本极低。<\/li>\n<li><strong>O-06 的三个未采纳建议<\/strong>（prefix 守卫洞/钉住值运维注记/DB 级审计史）都在 receipt 里写明修法，属低成本收尾；FIX-500/501 两处声明-行为脱节仍 OPEN（A 线章亦引用）。<\/li>\n<li><strong>O-03 的审查强度背景<\/strong>：worker 额度窗死亡、reviewer 唯一独立闸——审查结论成立但孤例；V4 扩对抗面时应对本套件做一次双审查复跑。<\/li>\n<li><strong>O-04 的契约韧性已验证<\/strong>（D-REDEEM 扩展存活），V4 动权益面时唯一必须遵守的是「引擎/网关双侧同步」的成文义务（entitlement.py:19-20 / user_context.go:85 双侧注释）。<\/li>\n<li><strong>O 线卡级 v3-output 证据目录形态<\/strong>：O-06 有 WT765/WT771 目录、O-05 有 WT773-O05 目录（均为深挖/审查期产物）；O-02/03/04/07 首批四卡无卡级目录（签收在 commit message，wt759 已裁决合规形态）——无台账死指针（本档 grep 复核），按 wt774 先例作形态残差不占号。<\/li>\n<\/ol>\n<hr />\n<h2>O.5 本次审查登记<\/h2>\n<ul>\n<li><strong>V3-FIX-514<\/strong>（P4，本次新登记，O 线章主登记）：O-05 交付 commit <code>1680d16c<\/code> 的 message 自称「V3-FIX-504/505」，其中 504 为<strong>幻影号<\/strong>——该号实属 wt769（FIX-258 行闭账指针）；轮#269 fleet note 记「撞号 504→520 已闭」，但 <strong>V3-FIX-520 行在任何时点的台账中都不存在<\/strong>（本档对 1680d16c/9a4ea3d4/deb5e27c/main-tip 四时点 <code>git show<\/code> grep 全零亲证）。后果：备份链静默失效（cron 夜备份从未产出完整包+restore 吞 2156 SQL 错）这笔 O 线最有运维价值的发现，在台账里<strong>无行可稽<\/strong>（缺陷本体已卡内修复故无 OPEN 行合规），唯二检索入口=commit message（错号）与 fleet note（对不上号的「520」）；V4 考古按号检索会错配到 wt769 行。可证伪判据：<code>git show 1680d16c --format=%B -s | grep 504<\/code> 命中而台账 <code>grep -c &quot;V3-FIX-520&quot;<\/code>=0；<code>grep &quot;V3-FIX-504&quot; v3/06_agent_fleet/DYNAMIC_ISSUES.md<\/code> 唯一内容为 wt769 的 258 行笔。修法方向：不动台账（无账可改）；在 O-05 独立审查 receipt（wt782 在航）与本章（已写）双处注记「备份脚本缺陷=卡内修复无台账行，检索锚=commit 1680d16c 本体，号 504/520 均无效」；ledger 工具可加「commit message 引用号 vs 台账行存在性」抽检（与 504/508 行修法建议同族合并）。<\/li>\n<li><strong>零号新登记两项（形态/残差照登不占号）<\/strong>：①O-02/03/04/07 无卡级 v3-output 目录且无台账死指针——按 wt774 A 线先例作形态残差（§O.4-7）；②O-06 receipt 三条未采纳建议+FIX-500/501 OPEN——已在册或在 receipt 在案，本章 §O.4-4 复述不占号。<\/li>\n<li>号占用核验：512-523/527 起空闲——<code>grep -c &quot;V3-FIX-512\\|V3-FIX-513&quot;<\/code> HEAD 台账零命中；在册最高 530（530=wt780 后新 P1）；本档取 <strong>514<\/strong>（512/513 归兄弟章 Q-line.md，同批登记三号两章共用）。<\/li>\n<\/ul>\n", "text": "# O 线（Ops 7 卡）深挖章节 —— V4 交接文档素材（wt779）\n\n> 本文是 `v3/V3-COMPLETE-STATUS-FOR-V4.md` §4「各线深度状态」O 线章节的深挖草稿。\n> 证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n> 撰写：wt779（2026-09-28）。**基线说明**：本档开写时 main@b12125ed，撰写中途主干推进（wt773 O-05 交付集成轮#269、wt777 探针收口轮#270、wt780 度量章轮#271、wt778 mypy 批十一），本档已随 `git reset --hard` 追平至 main@c0306be1 后定稿——O-05 的「交付待审」态、FIX-524~530 等新账均按新基线收录。方法：卡面（v3/07_tasks/cards/O-0*.md）+ `git log`/wt759 报告逐卡定位 → 全部交付 SHA `merge-base --is-ancestor` 亲证祖先（O-02 `1ac2ec17`/O-03 `d475d8be`/O-04 `c86a6237`/O-07 `ea0167ca`+`864edcb1`/O-06 `1ca6c2dc`+`a376dbdb`+`e06d50ff`/O-05 `1680d16c` 全过）→ 代码开文件亲证（trace_spine.py/entitlement.py 双侧/budget_matrix.py/queue_backpressure.py/ops_surface 注册表面/llm_safety._mask_match/memory_storage_gate R9 前闸/gateway user_context.go 判官）→ 测试实跑（**O+Q 线全部交付测试套件 445 passed** @c0306be1，含 O 线 10 文件 359 用例与 Q 线 4 套件）→ receipt/演练产物抽读（WT765 notes、WT771 receipt、WT773-O05/drill 四件产物、HUMAN_INBOX/HANDOVER）→ 台账闭环逐条复核。**未轻信任何台账/报告结论性文字。**\n\n---\n\n## O.0 线级概览\n\nO 线是 V3 的「运维真实线」：可观测脊柱（O-02）→ 安全终审（O-03）→ 付费解耦（O-04）→ 成本/配额/背压（O-07）→ 统一操作面（O-06）→ 备份恢复演练（O-05）→ 公网部署（O-01）。当前 **5/7 done + O-05 交付待独立审查**（tasks.json@c0306be1 亲证：O-01/O-05 TODO，O-02/03/04/06/07 done；O-05 交付本体 `1680d16c` 已在主干）。\n\nO 线执行形态最重要的特点（V4 设计者必须先读）：**O 线的「就绪度」必须按三层分开看，混读会高估**——\n\n1. **机制层（代码+测试，全部在库且本次实跑绿）**：O-02/03/04/07 四卡（09-21 首批，R2 PASS 签收在 commit）+ O-06（09-28 双审查链）。这一层是真实且可复跑的。\n2. **演练层（运行级实录，环境受限）**：O-06 的真栈 shadow 回滚是 wt771 审查用**本机 docker sparkle_redis** 跑出来的（事故与恢复全记录）；O-05 的演练是 wt773 **一次性容器栈**（零触碰常驻栈）跑出来的。两次演练都是 localhost 形态——**staging 级演练从未发生**（等 O-01）。\n3. **生产部署层（零交付）**：O-01 未启动。本地 docke
