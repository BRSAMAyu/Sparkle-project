ec111c4`（wt686） | FIX-376（demo 首屏理解快照错误裸露）+ FIX-377（chat 令牌双态撕裂首批） |\n| 独立审查 | `61239f06`（wt694，与 U-02 联合） | 376 **APPROVE 但限定口径**：home provider 门控为真；**作为 B-04-L-01 的收口不成立**——golden 首屏回执卡消费的是 experience 孪生 provider（experience_provider.dart:5，无 demo 分支），wt696 补完（FIX-376 FIXED@bd576cd7 收口孪生） |\n\n**卡面验收**：「5 秒测试」「CTA 唯一」无真机实测记录（headless 结构断言+golden 承载）；「功能不退化」以触达测试族承载（wt694 亲跑 37 绿邻域回归在案）。\n\n**一句话用户可见行为**：首页只突出 Primary Action/Why/Stuck/Run；chat 长建议转 proposal/receipt 结构；demo 模式首屏不再裸露错误快照。\n\n### U-06 · L4 状态完备性注入（「闸门面达标 ≠ 全屏覆盖」的样板卡）\n\n**交付（主体 + 续做，两轮如实登记残余）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 主体 | `f644de3a`（wt358） | `mobile/lib/core/state/` 四件套：surface_state.dart（STATE_MATRIX 22 相位 1:1 代码化+14 失败族）、surface_state_injection.dart（debug-only 注入探针）、surface_state_view.dart（统一渲染+死胡同守卫）、staged_loading.dart（>500ms 分阶升格）；三测件（本次逐文件计数：coverage 5+matrix 13+view 17 = 35 个 test 入口，wt358 报告口径 50 用例含循环展开） |\n| 续做 | `04867998`+`74962798`（wt673） | cognitive 三面接 StagedSurfaceLoader（裸 spinner+手写双语字面量清零，含一个「英文用户也见中文」的 i18n 缺陷）；14 文件原始异常透传清零；REPORT+patch 入库（交付物必须 commit 硬条款） |\n\n**闸门注册表现状（本次开文件亲证）**：surface_state_injection.dart 登记 seam 共 **8 个**：cognitive.capsules/capsuleJobs/capsuleDetail、community.feed、home.dashboard、plan.diagnosticQuiz、profile.context、shared.loadingState。**chat/galaxy 主屏未整面接闸**（wt358 登记→wt673 维持：chat 自有 ws 状态机已齐 reconnecting/error 分支，整面换闸=重构级，如实不实施）。覆盖率验收「≥95%」的口径=**注册闸门面的真实渲染覆盖率 1.0**（coverage 测试聚合断言恒成立），不是「全 app 95% surfaces 已接闸」。\n**其余验收**：34 处残余 CircularProgressIndicator 逐一复核为有界/确定性/已带文案（wt673 §二C，`.when(` 括号平衡扫描 0 缺口）；「无 terminal spinner」同口径成立。simulator 段 DEFERRED（诚实登记）。\n\n**一句话用户可见行为**：已接闸的 8 个 seam 面，加载 >500ms 出现阶段文案升格+可离开提示，错误必有下一步按钮；核心面不再有终结态裸转圈。\n\n### U-07 · 长尾 Contextualization 与导航减负\n\n**交付（主体 + 双证判本体完成续做）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 主体 | `8ac6bad5`（wt356） | portfolio 分档执行：LABS 走 unlisted；routes.dart 路由真源零 diff；五 Tab 零改动；只摘 CORE journey 无关入口 |\n| 续做 | `233c494a`（wt675） | 双证判本体已完成不重做；DEFERRED 定向六文件 swap 窗内补跑全绿；LABS 暴露边收口（commit 内明示「tasks.json U-07=TODO 脱节报请规格权威核正」——后经协调面核正） |\n\n**与 B-01/wt639 的互证**：B-01 波 2 审计（wt639，690 ALIVE/12 DEAD/2 ORPHAN）在 U-07 之后仍抓出 onboarding 4 屏（FIX-342）、learning-mode（FIX-490）、WS6（FIX-489）等孤儿面——说明 U-07 的「HIDDEN 用户不可达」是**导航层成立**（路由/Tab/搜索/深链不暴露），不是「仓库里没有死屏」；死屏清理走 GOV-015/孤儿面族（wt729/wt762 共 ~3,958 行纯删，见 §U.4）。\n\n**一句话用户可见行为**：五 Tab 不增；Calendar/Focus/ErrorBook 等长尾经 context CTA 到达并返回原 Goal；leaderboard/shop/photon 保持 HIDDEN。\n\n### U-08 · Accessibility 全链升级\n\n**交付（返工重验 + 续做清零）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 主体+返工 | `3f8299eb`+`f6357fae`（wt365） | U-06 渲染面补 liveRegion（失败族/横幅/分阶等待：状态突变自动播报）；返工后 6/6 真跑全绿（断言手法按 Flutter 语义装配实证校准——debugSemantics 同源，防「改测试凑绿」）+ wt358 30/30 = **36/36** |\n| 续做 | `01585b78`（wt674，FIX-359） | 58 处占位语义标签全清 + 21 处无名图标可点节点补名 + 标签质量守卫（防回潮） |\n\n**残差**：① 「GJ01/GJ03/GJ08 辅助技术可完成」以 widget/semantics 层测试承载；真机 TalkBack/VoiceOver 走查未发生（无设备，同 U 线共性）；② WCAG AA 的 contrast 面由 U-02 rubric 承载（可计算口径 8/8），全量 WCAG 审计未做。\n\n**一句话用户可见行为**：状态突变有 liveRegion 播报；图标按钮有名字；触达目标/动效尊重系统设置。\n\n### U-09 · L5 三端一致性 Diff（本线最需要 V4 读清楚的一张卡）\n\n**证据形态（卡面「三端真实对比」的实际承载，三层）**：\n1. **headless 契约层（主干，可复跑）**：`60366592`（wt390）——mobile/lib 全量平台分支审计表（kIsWeb/条件导入/Platform 门控三分类逐文件判定）；2 处真修（responsive_utils 平台判定接缝 dart:io→defaultTargetPlatform，红测先行；B-04 naming 注册表补 macos 段）；`mobile/test/widget/u09_platform_render_contract_test.dart` **11 契约用例**（C1 状态管线三端渲染指纹逐字一致×11 相位、C2 URL/网端、C3 平台判定同源、C4 session 双后端等价、C5 keyboard 偏好非平台分支、C6 三端 viewport 零 overflow、C7 允许差异登记表机器可读）；canonical fixture 与 B-04 states.py 同源。\n2. **盘点矩阵+机械统一（主干）**：`774a048b`+`c817e64e`（wt676）——跨表面一致性矩阵（typography/spacing 消费盘点表，本节 U-01 引用的数据源）+ home/insights/settings 三面 92 处圆角字面量指认既有 DS 令牌（33 文件）。\n3. **真机 diff 层（未发生，诚实转出）**：45 张三端截图矩阵=**就绪的执行清单**（9 surfaces×3 平台×viewport，逐行采集入口+断言点+命名模板，`visual_baseline.py matrix` 命令可复跑）+ DIFF_REPORT 模板；wt390/wt676 两轮均明示无浏览器/模拟器权限不伪造，「真机段转 HUMAN_INBOX+主会话」——**中央 HUMAN_INBOX 未收编此交接**（→ V3-FIX-511）。\n\n**卡面验收口径对照**：「核心状态三端无 A/B visual issue」=契约层成立（渲染指纹逐字一致）+真机层未验证；「生成 final screenshot matrix 与 diff report」=**模板与清单已生成，final 数据未产生**。允许差异登记表在 `v3/04_ux/MULTIPLATFORM.md`（5 类：转场/触觉音频/网端别名/token 存储后端/IME 视觉，逐条 reason）——「对允许差异写 reason 而非强行像素一致」验收以文档+机器可读 fixture 双承载兑现。\n\n**一句话用户可见行为**：无直接新增行为；「android 目标在 macOS 宿主被判非移动端」类宿主相关判定缺陷已修；三端 canonical 状态语义由契约测试锁住。\n\n### U-10 · 全产品文案与术语终审\n\n**交付（主卡双证成立 + 增量终审）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 主卡 | `d85e9a9a`（wt363） | 死键收割 42 键（零引用逐键 grep 实证，arb+gen 三件套外科纯删除 **+0/−738**；gen 手改同步——wt363 判例：gen-l10n 重生成含全量 formatter 翻搅，弃重生成） |\n| 增量 | `633fdacd`+`d87ea8fd`（wt672） | 文案红线 2 键值去黑话 + 记忆详情 13 处硬编码英文标签清零（改真话不改行为，零业务逻辑）；REPORT 双证 wt363 首轮成立（死键账目 10029 活/49 冻结闭环） |\n| 集成 | `fda4f975` | 187 轮四卡集成（含 U-10），三批 renumber |\n\n**残差**：① EXACT 带 8 草稿键（chatConfidence×3/chatCompletion×5）+ l10n 49 冻结键仍在（H-005 等用户文案裁决）；② wt685 L10N 债与 en/zh 10061 键双向零缺失是后续守卫面（非 U-10 卡内）。\n\n**一句话用户可见行为**：核心 journey 无 raw key/占位符；记忆详情不再出现硬编码英文标签；「0 memories/5 correctable claims/75%」类黑话主呈现已被 U-03 的理解视图替换。\n\n---\n\n## U.3 设计决定与取舍（从提交/审查考古）\n\n1. **「续做不重做」双证判据**：每个续做会话先证前轮交付在主干祖先链+树内产物齐备，只补真实缺口（wt673/675/672/676 四连）。代价是每张卡的交付分散在 2-4 个 commit 波次，V4 读账必须逐波读；收益是 10/4 红线内零重做浪费。\n2. **守卫冻结优于一次性迁移**：U-01 的真正产物是「只降不升」的 ratchet 基线+新文件零违例闸，而非把 22k 处 DS 引用一次性清完。存量撕裂面（chat 80 字面量、galaxy 零 typo 采用）以矩阵盘点显式留档，迁移裁决权留给视觉 owner（E1 冻结豁免）。\n3. **低刺激的验证钉在渲染树而非设置页**：U-02/374/384 三轮把「reduceMotion 下不得出现零时长 AnimatedSize 壳」做成渲染树枚举断言+「禁动效不装壳」修法范式——reviewer（wt694）亲跑红绿复核并纠正普查归因，这是「独立审查抓出真缺陷」的正面样本。\n4. **诚实化优于死键**：U-04/379②③ 的裁定——提示文案在唯一活面永不可渲染时，撤 docstring 许诺+留幂等不变量测试，而不是造新 l10n 死面。「不虚占键位」与 U-10 死键收割同律。\n5. **允许差异显式登记**：U-09 把「平台差异是资产不是缺陷」写成机器可读 fixture（platformDivergences 逐条 point/platforms/reason）+文档双承载，C7 契约测试保证登记表非空且形合规——为 V4 的多端策略提供了现成的裁决框架。\n6. **真机段不伪造**：全线以「headless 承载+转出清单就绪」收束真机验收；但转出登记链断裂（508），V4 若接手三端走查，执行清单都在（U-09 §5、B-04 harness、G-05 HUMAN_INBOX_G05_VISUAL.md），缺的只是统一入口登记与采集执行。\n\n---\n\n## U.4 残差与 V4 注意点（汇总）\n\n1. **GOV-015/WS6 两大删除后的 UI 面健康度（专项结论）**：wt729（FIX-440，data_usage_dashboard 655 行纯删）+ wt762（FIX-489 WS6 透明画像孤儿屏 2636 行纯删 + FIX-490 learning-mode 667 行纯删，共 ~3,958 行 0 增）删除的全部是**从未接线的孤儿面**——WS6 的 wire-or-purge 裁决证据链亲证「路由两代仓库从未注册、stage7 只翻 flag 未触 routes；设计意图已由已接线 UserPersonaScreen /profile/persona 承担（读/纠正/回滚/偏好更新四面齐备）」。删除后：analyze E0、full_route_coverage 116 路由全绿、a11y 守卫 allowlist 同步摘行（防僵尸豁免）、独占 l10n 键逐键亲证零外部消费者后删除、i18n 100%。**UI 面健康度未受伤害，反而消除了「不可达承诺面」**；重做路径原子留档在 commit message（git 恢复+注册路由+补入口三步）。V4 教训：删面前先证「设计意图是否已由他面承担」，且删除必须是屏+provider+flags+tests+l10n 全链原子。\n2. **U-06 闸门覆盖是 8 个 seam 不是全部核心屏**：chat（自有 ws 状态机）与 galaxy（视觉锤）的整面接入是 V4 的显式决策点，不是「已完成只需要维护」。\n3. **令牌存量迁移无主**：chat 80 处 fontSize 字面量+galaxy 零 context.typo（E1 豁免）在 FIX-377 首批后无承接计划；台账 377 行缺失（507）使这个尾更不可见。\n4. **真机面欠账集中**：U-06 simulator、U-08 三端辅助技术、U-09 45 张矩阵、U-02/05 的 5 秒测试 rubric——全部只有 headless 承载。执行清单与 harness 齐备，V4 初期应安排一次集中采集批次（成本主要在设备/浏览器权限而非代码）。\n5. **FIX-375 OPEN**（FirstActionCard 无标题层，journey 面 rubric FAIL 保持必红放行）与 FIX-379②③ OPEN——两个 U 线挂账都是「需要产品/视觉裁决」而非机械修。\n6. **验收语义的口径差异要带进 V4**：「≥95% covered」=注册面覆盖率 1.0；「A/B issue=0」=golden android 批口径+macOS ENV-1 豁免；「三端一致」=契约指纹一致。V4 验收设计应显式写清口径，避免把 headless 口径误读为真机结论。\n\n---\n\n## U.5 本次审查登记\n\n- **V3-FIX-510**（本次新登记，台账行已入本 worktree commit）：台账 V3-FIX-377 行缺失——370-376/378/379 在册而 377 跳号零行；修复本体在主干（分支 commit 3d00aec9，集成 3ec111c4「V3-FIX-377 chat 令牌双态撕裂机械收口首批」，WT686 REPORT §「→ FIXED@3d00aec9」、wt694 review 引用一致）。与 504 同向的台账低估漂移；且行缺失使「首批」后的令牌迁移尾（本次复测 chat 仍有 80 处 fontSize 字面量）失去依附面。\n- **V3-FIX-511**（本次新登记）：真机段交接承诺未入中央 HUMAN_INBOX——U-09 45 张三端截图矩阵、G-05 真机截图/FPS 批（自带 v3-output/WT395-G05-GALAXY/HUMAN_INBOX_G05_VISUAL.md）、U-08 三端辅助技术走查、B-04 L2-L5 走查等「转 HUMAN_INBOX」承诺均早于中央收件箱创建（09-27 wt695），从未回填；现行 H-001~008 无一覆盖。V4 从中央收件箱出发会系统性漏看这批未完成面。\n- 复核过但**不构成新发现**的两项：chat/galaxy 未接状态闸（wt358/wt673 两轮如实登记，属已知设计态）；demo 首屏孪生 provider 面（wt694 抓出且 wt696 已补完收口 bd576cd7）。\n- 号占用核验：500-504 已占用（wt765/wt770/wt769）；505 grep 全仓零命中但仍空置——按派单纪律自 506 起用，本登记取 507/508（506 预留给并行的 wt775 S/G 章内先发现项，见 S-line.md §S.5）。\n"}, {"id": "00_context/source_notes/S16_P-line.md", "title": "P 线（Proactive 6 卡）深挖章节 —— V4 交接文档素材（wt775）", "group": "原始报告副本", "html": "<h1>P 线（Proactive 6 卡）深挖章节 —— V4 交接文档素材（wt775）<\/h1>\n<blockquote>\n<p>本文是 <code>v3/V3-COMPLETE-STATUS-FOR-V4.md<\/code> §4「各线深度状态」P 线章节的深挖草稿。\n证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n撰写：wt775（2026-09-28，基线 main@ed072fd2）。方法：卡面（v3/07_tasks/cards/P-0*.md）+ wt759 报告逐卡 SHA → <code>git log -1<\/code> 全部 8 个交付 SHA 重验在主干 → 关键代码开文件亲证（pipeline/suppression/relevance/autoexec/notification_settings/config/main.py 接线）→ 测试逐文件计数 → v3-output/WT384-P05-EVAL REPORT 全读 → 台账 FIX-48/120/121/152 逐行复核。<strong>未轻信任何台账/报告结论性文字。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>P.0 线级概览<\/h2>\n<p>P 线回答的是「AI 陪伴产品最容易翻车的自愿问题」：主动式触达如何不打扰。6/6 全部 done（tasks.json + fleet 名单 + wt759 逐卡 SHA）。<\/p>\n<p>执行形态的显著特点（V4 设计者需要知道）：<\/p>\n<ol>\n<li><strong>P 线的「灵魂不变量」是零 LLM + fail-closed<\/strong>：P-01 管线全链（分类/抑制/相关性/记录/投递）没有任何模型调用（pipeline.py 模块 docstring 亲证「本模块不 import 任何 LLM 客户端，测试以 mock 计数器断言调用数 = 0」）；抑制状态 store 在 Redis 故障时全抑制（「宁可少发不可误发」）。<\/li>\n<li><strong>两条主动面通道并存（V4 最重要的结构事实）<\/strong>：\n<ul>\n<li><strong>nudge 家族（活、真投递、被 P-05 纵向评估）<\/strong>：<code>comeback_nudge_task<\/code>（celery）→ get_comeback_context → suppression → NotificationService.create——P-05 的 14 天评估驱动面就是它；P-03 的四要素 UX 与反馈回路（今天不看/mute/cooldown）明确声明「在既有 nudge 真源之上补齐，不重建真源」（proactive_suggestion_service.py 模块 docstring 亲证）。<\/li>\n<li><strong>P-01 事件管线（已接线、默认 shadow、不真投递）<\/strong>：main.py:423-440 亲证 lifespan 里构建 ProactiveEventPipeline 并 attach EventBus；<code>PROACTIVE_PIPELINE_SHADOW<\/code> 默认 <strong>True<\/strong>（config.py:43）——would-notify 只记 Prometheus 计数+有界环形缓冲+可注入 sink，不触发真实出口；live 需显式 env 翻 0，投递经 SystemUpdateService.enqueue（journey consumers 同款系统更新通道，Redis list <code>system_updates:{user}<\/code>），<strong>与 nudge 家族的 NotificationService 是两个出口<\/strong>。<\/li>\n<li>V4 若做「统一主动面」，第一决策就是这两族的合并/分工——P 线交付没有裁决它，而是把两族各自做实。<\/li>\n<\/ul>\n<\/li>\n<li><strong>卡面场景全部落在确定性管线里<\/strong>：7 触发器（deadline/overdue/slot_missed/user_active/upstream_completed/goal_stalled/run_awaiting，triggers.py:56-62 亲证）由 10 个事件名映射（task.started/created/abandoned/status_changed、focus.session.completed、plan.health.alerted、task.completed、run.status_changed、run.awaiting_user、galaxy.study.recorded，triggers.py 分类分支逐条亲证）。<\/li>\n<\/ol>\n<hr />\n<h2>P.1 意图（卡面目标与验收）<\/h2>\n<p>六卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。<\/p>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>Risk/Resource/Reviewers<\/th>\n<th>卡面目标（一句话）<\/th>\n<th>卡面关键验收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>P-01 Event-trigger + Suppression Pipeline<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>主动式做成 event→filter→Aurora，不是定时问 LLM<\/td>\n<td>mute/quiet/cooldown 抑制=100%；无需 LLM 的事件不调用模型；shadow metrics 可审<\/td>\n<\/tr>\n<tr>\n<td>P-02 NO_ACTION / Relevance Decision<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>让 Aurora 学会保持安静<\/td>\n<td>20+ suppression/relevance cases 违规=0；false positive 受控<\/td>\n<\/tr>\n<tr>\n<td>P-03 Proactive Suggestion UX<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>建议以可忽略、可解释、可 mute 方式呈现<\/td>\n<td>重复建议不刷屏；拒绝后 cooldown 生效；离线/过期通知点击有合理恢复<\/td>\n<\/tr>\n<tr>\n<td>P-04 低风险 Auto-execute 授权模型<\/td>\n<td>critical/MEDIUM/2<\/td>\n<td>仅预授权低风险操作允许 proactive auto execution<\/td>\n<td>未授权=0 auto；revoke 后立即失效；重复 trigger 不重复 side effect<\/td>\n<\/tr>\n<tr>\n<td>P-05 Proactive Longitudinal Evaluation<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>验证主动带来目标恢复而非通知负担<\/td>\n<td>precision 达阈值并报告；quiet violations=0；不只报 open rate<\/td>\n<\/tr>\n<tr>\n<td>P-06 Notification Burden / Quiet / Low-stimulation 终局<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>用户主动控制与关系策略完全接通<\/td>\n<td>24h test-clock 0 超 cap；mute 生效；低刺激默认更保守；in-flight 关停真生效<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>P.2 实际交付逐卡<\/h2>\n<h3>P-01 · 事件触发 + 确定性抑制管线<\/h3>\n<p><strong>交付<\/strong>：<code>fa96be0d<\/code>（R2 CHANGES reworked delta-verified；独立审查 R2 在 commit 标注）。\n<strong>真实数据流（代码亲证，<code>backend/app/aurora/proactive/<\/code> 共 2,912 行六模块）<\/strong>：<\/p>\n<pre><code>EventBus(sparkle_events) 消费者组 aurora_proactive_pipeline（继承 idempotency/DLQ/retry）\n  → classify_event（9 事件名 → 7 触发器）\n  → ProactiveSuppressionStore.load_snapshot（fail-closed：Redis 故障全抑制）\n      + per-user 统一设置注入（P-06：quiet_window/daily_cap/timezone，解析失败回退 env 保守基线并告警）\n  → evaluate_suppression（quiet window / mute / daily cap / cooldown / recent rejection / novelty，\n     suppression.py：in_quiet_window 亲证 22:00-08:00 Asia/Shanghai 默认、cap 3、cooldown 240min、rejection 阈值 2）\n  → evaluate_relevance（P-02，四问裁决）\n  → ProactiveDecisionRecord → _record（Prometheus PROACTIVE_PIPELINE_DECISIONS_TOTAL 按 trigger/event/decision/reason 分桶\n     + deque 有界 recent_records + 可注入 DecisionSink）\n  → shadow=True：logger would-notify 记录即止；shadow=False：_default_deliver → SystemUpdateService.enqueue\n     （payload 带 pipeline=proactive_v1/trigger/subject_key/correlation 元数据）\n<\/code><\/pre>\n<ul>\n<li><strong>失败语义<\/strong>：<code>_on_bus_event<\/code> 失败<strong>上抛<\/strong>（EVENT-ACK-2 判例亲证在 pipeline.py:383-401：原 blanket-except 吞异常使总线恒 ack、失败 metric/重试/DLQ 永不触发——已修为交给总线失败管线；管线内部逐处 contain）。<\/li>\n<li><strong>测试<\/strong>：backend/tests/aurora/test_proactive_event_pipeline.py <strong>32 个 test<\/strong>；抑制/相关性/投递通道族另有 nudge_channel_delivery 14、proactive_suggestion_feedback 12+3+3、burden_p06 21、inflight_wake_suppression 10、24h_clock 5（逐文件 grep 计数）。<\/li>\n<li><strong>shadow metrics 可审<\/strong>：Prometheus 分桶计数+decision record 结构化（event/trigger/user/decision/reason/step/subject_key/shadow/occurred_at/details）亲证在 pipeline.py:196-247。<\/li>\n<\/ul>\n<p><strong>残差<\/strong>：默认 shadow 是文档化的 by-design（main.py 注释「接通即安全；真实投递需显式 PROACTIVE_PIPELINE_SHADOW=0」），但<strong>当前无任何环境配置翻它<\/strong>（全仓 grep 该 env 仅 config/pipeline/main 注释三处）——事件管线的用户可见投递为零，V4 必须<strong>显式决策<\/strong>何时翻 live（见 §P.4-2）。<\/p>\n<h3>P-02 · NO_ACTION / 相关性裁决<\/h3>\n<p><strong>交付<\/strong>：<code>a8567153<\/code>（R2 PASS）。\n<strong>真实数据流（relevance.py 473 行亲证）<\/strong>：位于 P-01 抑制链<strong>之后<\/strong>、出口之前；四问裁决固定短路序（新信息？有行动价值？未被看过/处理过？用户近况允许？）——每个 no_action 带稳定结构化 reason，reason ∈ <code>RELEVANCE_REASONS<\/code> 封闭词表（:87「新增值必须进此元组并过契约测试」）；<code>derive_information_digest<\/code>/<code>derive_information_onset<\/code> 确定性派生（同一输入永远同一输出）；USER_ACTIVE 直通语义保持（bare user_active 零改动）；<code>ProactiveRelevanceStore<\/code> Redis 承载 reminder/view/interaction/change 四类记录（scope 分 live/shadow）。\n<strong>「仅逾期不够」验收<\/strong>：has_actionable_step 默认 True 的<strong>正向证据原则<\/strong>（仅当载荷显式 <code>actionable=False<\/code> 才判非行动）+ 信息摘要/onset 双通道亲证在 pipeline.py:409-449。\n<strong>测试<\/strong>：backend/tests/aurora/test_proactive_relevance.py <strong>29 个 test<\/strong>（含词表冻结契约）。\n<strong>「20+ cases 违规=0」<\/strong>：用例数 29≥20 达标；违规=0 以封闭词表+契约测试承载。<\/p>\n<h3>P-03 · 主动建议 UX（四要素+反馈回路）<\/h3>\n<p><strong>交付（三波）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>波次<\/th>\n<th>主干 SHA<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>四要素 UX<\/td>\n<td><code>78ff5538<\/code>（wt370）<\/td>\n<td>每条建议卡四要素：why now（引擎侧事实构建，只述计划状态/任务账本/下一步，零 guilt 零诊断）/ suggested action / today ignore / mute this type；deep link 到正确 Goal/Proposal<\/td>\n<\/tr>\n<tr>\n<td>复核修复<\/td>\n<td><code>cc84094e<\/code>（wt379）<\/td>\n<td>P-03/J-04 六项猎缺修复（含 P-03 抑制态读写诚实化）<\/td>\n<\/tr>\n<tr>\n<td>审查轮<\/td>\n<td>wt424/450/468<\/td>\n<td>摩擦门族轮 5/6/7 连续覆盖（wt759 报告口径）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>主干面亲证<\/strong>：<code>mobile/lib/features/notification_center/presentation/widgets/unified_notification_card.dart:687<\/code> 注释即「P-03 四要素：why now / suggested action / today ignore / mute this type」——<code>whyNow<\/code>（:691-716）、<code>onSuggestionIgnoreToday<\/code>、<code>onSnooze<\/code>（:58）三 handler 在树；反馈持久层=UserPreferencesCenter.explicit JSONB 独立命名空间（零迁移）；抑制在生成源头（真源不产新通知，非渲染层遮蔽——服务 docstring 亲证）。\n<strong>测试<\/strong>：feedback 12+3+3、concurrent_merge 3、nudge_channel_delivery 14（计数见上）。\n<strong>残差<\/strong>：「离线/过期通知点击有合理恢复」的端到端真机验证未定位到运行级记录（deep link 解析在 <code>resolve_comeback_destination<\/code> 纯函数层有测试：goal_id→Goal 页→Plan 页→chat 回退链，F-7 判例防 plan_id 误用）。<\/p>\n<h3>P-04 · 低风险 Auto-execute 授权模型（critical，双审查）<\/h3>\n<p><strong>交付（双波双审）<\/strong>：<code>15bd350e<\/code>（主卡，R2 PASS）+ <code>322988ce<\/code>（wt376：类别级预授权面+五条件门/fail-closed）。\n<strong>主干面亲证（autoexec.py 981 行）<\/strong>：<\/p>\n<ul>\n<li><strong>allowlist 是封闭词表 + import 期校验<\/strong>：<code>AutoExecOperation<\/code> StrEnum；每条目 <code>AutoExecOpMetadata<\/code> 必 <code>risk=&quot;low&quot;<\/code> 且 <code>reversible=True<\/code>——<code>validate_autoexec_allowlist<\/code> 在 import 期跑，违宪直接 raise ValueError（:206-208「high-risk ops are forbidden」「irreversible ops are forbidden」）；注册表冻结映射+契约测试 sha 双钉。<\/li>\n<li><strong>授权面<\/strong>：<code>AutoExecGrantStore<\/code> grant/revoke 前置校验只有词表内操作可授予（越界 ValueError——「授权面不可能铸出 allowlist 外的能力」）；<code>compute_grant_policy_version<\/code> 授权态指纹。<\/li>\n<li><strong>幂等<\/strong>：<code>derive_autoexec_idempotency_key<\/code>（重复 trigger 不重复 side effect 的机制载体）。<\/li>\n<li><strong>receipt<\/strong>：receipt 三要素（commit 明示）+ receipt_key 存储。<\/li>\n<li>五条件门/fail-closed 语义：wt376 commit「高风险/不可逆永远 proposal；revoke 时序」。\n<strong>测试<\/strong>：backend/tests/aurora/test_proactive_autoexec.py <strong>36 个 test<\/strong>。\n<strong>「未授权=0 auto」的运行级背书<\/strong>：P-05 纵向评估不变量「revoke 后 auto 直通=0」全零（§P.2-P-05）。<\/li>\n<\/ul>\n<h3>P-05 · 主动面纵向评估（14 天可控时钟 24v24）<\/h3>\n<p><strong>交付<\/strong>：<code>761e75a1<\/code>（wt384）；产物 v3-output/WT384-P05-EVAL/{summary.json, EVAL_RESULTS.md, raw/*.jsonl}；复跑脚本 scripts/devtools/p05_run_proactive_longitudinal_eval.py（--summarize-only 可从 raw 复算）。\n<strong>核心数字（REPORT 全读，全部程序化复算非手填）<\/strong>：restart 率 0.875 vs 0.542（Δ+0.333）、重启中位 2 vs 7 天、deadline 达成 0.417 vs 0.0、期末账本进度 0.773 vs 0.412；负担轴 112 条建议/14 天（人均 4.67、最坏 14）、disposition accept 45.5%/silent 19.6%/dismiss 26.8%/mute 8.0%；<strong>正确性不变量全零<\/strong>（mute 后跨天复发=0、沉默&lt;3 天投放=0、revoke 后 auto 直通=0、accept 次日复发=0）。\n<strong>诚实声明（REPORT 原文）<\/strong>：persona 决策是 <strong>seeded 显式模型<\/strong>（参数全量落 raw/events_timeline.json）——「上述量化是该模型与真实主动面行为的联合结果，不是真人 RCT；效应方向与主动面行为正确性不依赖模型参数，效应量级不可外推为真实用户指标」。这条诚实边界必须带进 V4：<strong>P-05 证明的是「主动面机制行为正确」，不是「真人指标改善」<\/strong>。\n<strong>驱动面口径<\/strong>：直调生产 celery 任务 comeback_nudge_task（真实 get_comeback_context→suppression→duplicate 窗→NotificationService.create 全链，仅 AsyncSessionLocal 重定向 sqlite）+ 真实 ActionCommandService/ProactiveSuggestionFeedbackService/ActionPermissionService——<strong>驱动的是 nudge 家族，不是 P-01 事件管线<\/strong>（后者 shadow 默认且评估时点已存在；两族关系见 §P.0-2）。\n<strong>反例如实回流<\/strong>：FIX-48（P3，OPEN 待拍板）——「今天不再看」在每日扫描节奏下只买同日安静（30 dismiss 中 26 次次日仍投放；IGNORE_TODAY_COOLDOWN_HOURS=24h 与 24h 重复窗在两次日 tick 间双双过期）+ 过期窗口每日继续打扰（4 次实证）。完成谱正控：账本 100%→sprint auto-archive→主动面源头停（完成后投放=0）。<\/p>\n<h3>P-06 · 通知负担 / Quiet / 低刺激终局<\/h3>\n<p><strong>交付<\/strong>：<code>05cc6328<\/code>（wt387：统一设置一处真源+多设备服务端权威+in-flight 关停真生效+统一解析器/quiet 交集/24h cap）。\n<strong>主干面亲证<\/strong>：<\/p>\n<ul>\n<li><strong>用户设置真接入管线<\/strong>：<code>notification_settings.py<\/code>（runtime_v1）EffectiveNotificationPolicy（quiet_supresses/allow_proactive_push/proactive_suppress_hours/to_payload）+ NotificationSettingsResolver（DB）+ widen_quiet_window（低刺激把 quiet 窗<strong>加宽<\/strong>——「低刺激默认更保守」的机制载体）；main.py:431-440 <code>make_db_settings_provider(AsyncSessionLocal)<\/code> 注入 P-01 管线（P-06 commit 注释亲证「用户设置不再只是展示面，事件管线抑制链据此判定」）。<\/li>\n<li><strong>in-flight 关停<\/strong>：backend/tests/aurora/test_inflight_wake_suppression.py（10 test）——用户关闭后已排程通知被取消/抑制的语义锁；24h cap：test_notification_burden_24h_clock.py（5 test，24h test-clock 口径）+ test_notification_burden_p06.py（21 test）。<\/li>\n<li>FIX-150 同族守卫（main.py:429-434 注释）：函数级 import AsyncSessionLocal 会致 UnboundLocalError 的红测实录在案。\n<strong>残差<\/strong>：「多设备 state 一致」以服务端权威（DB resolver）承载，真多设备并发实测未定位到运行级记录。<\/li>\n<\/ul>\n<hr />\n<h2>P.3 设计决定与取舍<\/h2>\n<ol>\n<li><strong>确定性优先于智能<\/strong>：整条管线零 LLM；「无需 LLM 的事件不调用模型」不是验收副产品而是模块红线（import 面+mock 计数断言双钉）。LLM 只可能出现在管线之外的内容生成，决策面全是规则。V4 若加语义相关性判断，应作为 P-02 四问之外的旁路证据而非替换短路序。<\/li>\n<li><strong>fail-closed 全链<\/strong>：快照读失败=全抑制；设置解析失败=回退保守基线+告警；授权词表违宪=import 期崩溃。方向统一为「宁可少发/不执行，不可误发/越权」。<\/li>\n<li><strong>shadow-first 接线<\/strong>：管线先以默认 shadow 接进 main，出口适配器可注入——把「接通即安全」做成默认态。代价是 live 化成为需要显式决策的悬置面（见 §P.4-2）。<\/li>\n<li><strong>P-03 不重建真源<\/strong>：在 nudge 家族之上补反馈回路与四要素 payload——尊重「不得重建已存在的权威真源」Forbidden 的正面样本；副作用是「主动面」在架构上仍是两族（§P.0-2），统一裁决被留给了未来。<\/li>\n<li><strong>评估的诚实分层<\/strong>：P-05 把「机制正确性」（不变量全零，可复用）与「效应量级」（seeded persona 模型，不可外推）显式分离；反例不剪照登进台账（FIX-48 OPEN）。<\/li>\n<li><strong>时间敏感测试的隔离纪律<\/strong>：p05_proactive 4 例 CI 红的根因是上海 quiet 窗挂钟面——按在库先例补 <code>PROACTIVE_QUIET_HOURS_ENABLED=False<\/code> fixture 收口（FIX-121@eca6493b 内处置，台账亲证）；P 线测试从此对挂钟免疫。<\/li>\n<\/ol>\n<hr />\n<h2>P.4 残差与 V4 注意点（汇总）<\/h2>\n<ol>\n<li><strong>FIX-120/121 隔离审计族的 P 线相关现状<\/strong>：两族均 FIXED（120@765c9b16 wt444 / 121@eca6493b wt446）。与 P 线直接相关的两点已收口：①SRL 族 24 例污染源（裸赋值 settings.AURORA_SRL_MODE 不恢复）以 autouse 复位 fixture 收口——kill_switch/cache_service 进程级共享单例的复位基建从此存在；②p05_proactive 4 例时钟敏感以 quiet 窗关断 fixture 收口。<strong>V4 注意<\/strong>：autouse 复位 fixture 是后加的，新增全局态仍可能重演——新增 settings 级开关时同步进复位 fixture 是纪律不是选项（台账 120 行协调方补记的 auth 双测互扰同族）。<\/li>\n<li><strong>P-01 管线的 live 化是悬置决策<\/strong>：shadow 默认+无环境配置翻面+投递通道（SystemUpdateService）与 nudge 家族（NotificationService）并存。V4 设计主动面时必须先裁决：两族合并 or 分工（管线管事件驱动短周期、nudge 管召回/回归长周期）？投递出口统一 or 各自维护？P-05 的纵向评估只覆盖 nudge 族——管线 live 化前应补一次同构纵向评估。<\/li>\n<li><strong>FIX-48 OPEN（待拍板）<\/strong>：「今天不再看」的 24h 语义在每日扫描节奏下失效（26/30 次日复发）+过期窗口每日打扰。修法涉及产品语义裁决（ignored_until 的锚点从「时刻」改「日界」或扫描节奏改事件驱动），不是机械修。<\/li>\n<li><strong>quiet/mute 状态存储在 UserPreferencesCenter.explicit JSONB<\/strong>：独立命名空间零迁移是 V3 的速度取舍；V4 若做主动面统一，建议把抑制态提升为一等实体（带审计与跨设备一致性测试），现在的 JSONB 面缺独立观测。<\/li>\n<li><strong>P-03 的恢复路径真机验证欠账<\/strong>：离线/过期通知点击恢复只有纯函数层测试；建议随 U 线真机批次一并采集。<\/li>\n<li><strong>允许差异<\/strong>：卡面「shadow metrics 可审」的 Prometheus 分桶已在，但<strong>无 Grafana/告警面<\/strong>（O 线未覆盖主动面指标看板）——V4 运维设计应把 PROACTIVE_PIPELINE_DECISIONS_TOTAL 的 would-notify 比例作为 live 化前的观察指标。<\/li>\n<\/ol>\n<hr />\n<h2>P.5 本次审查登记<\/h2>\n<ul>\n<li>本次 P 线深挖<strong>无新缺陷登记<\/strong>。复核过但不构成新发现的三项：①P-01 默认 shadow（main.py/config.py 文档化 by-design，非隐性脱钩——对照 FIX-500 的 AURORA_DEFAULT_MODE 判例，该例是「声明面零读者」，本例是显式注释+无误导声明）；②P-05 评估驱动 nudge 族而非事件管线（REPORT 口径声明明确，非证据失实）；③FIX-48 反例回流（已在账 OPEN）。<\/li>\n<li>交叉登记：P 线无关但本次发现的 U 线台账缺行（377）与 HUMAN_INBOX 回填缺口见 U-line.md §U.5（507/508）；S 线 demo 群标记见 S-line.md §S.5（506）。<\/li>\n<li>号占用核验：500-504 已占用；505 空闲备而不用；本线未占用新号。<\/li>\n<\/ul>\n", "text": "# P 线（Proactive 6 卡）深挖章节 —— V4 交接文档素材（wt775）\n\n> 本文是 `v3/V3-COMPLETE-STATUS-FOR-V4.md` §4「各线深度状态」P 线章节的深挖草稿。\n> 证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n> 撰写：wt775（2026-09-28，基线 main@ed072fd2）。方法：卡面（v3/07_tasks/cards/P-0*.md）+ wt759 报告逐卡 SHA → `git log -1` 全部 8 个交付 SHA 重验在主干 → 关键代码开文件亲证（pipeline/suppression/relevance/autoexec/notification_settings/config/main.py 接线）→ 测试逐文件计数 → v3-output/WT384-P05-EVAL REPORT 全读 → 台账 FIX-48/120/121/152 逐行复核。**未轻信任何台账/报告结论性文字。**\n\n---\n\n## P.0 线级概览\n\nP 线回答的是「AI 陪伴产品最容易翻车的自愿问题」：主动式触达如何不打扰。6/6 全部 done（tasks.json + fleet 名单 + wt759 逐卡 SHA）。\n\n执行形态的显著特点（V4 设计者需要知道）：\n\n1. **P 线的「灵魂不变量」是零 LLM + fail-closed**：P-01 管线全链（分类/抑制/相关性/记录/投递）没有任何模型调用（pipeline.py 模块 docstring 亲证「本模块不 import 任何 LLM 客户端，测试以 mock 计数器断言调用数 = 0」）；抑制状态 store 在 Redis 故障时全抑制（「宁可少发不可误发」）。\n2. **两条主动面通道并存（V4 最重要的结构事实）**：\n   - **nudge 家族（活、真投递、被 P-05 纵向评估）**：`comeback_nudge_task`（celery）→ get_comeback_context → suppression → NotificationService.create——P-05 的 14 天评估驱动面就是它；P-03 的四要素 UX 与反馈回路（今天不看/mute/cooldown）明确声明「在既有 nudge 真源之上补齐，不重建真源」（proactive_suggestion_service.py 模块 docstring 亲证）。\n   - **P-01 事件管线（已接线、默认 shadow、不真投递）**：main.py:423-440 亲证 lifespan 里构建 ProactiveEventPipeline 并 attach EventBus；`PROACTIVE_PIPELINE_SHADOW` 默认 **True**（config.py:43）——would-notify 只记 Prometheus 计数+有界环形缓冲+可注入 sink，不触发真实出口；live 需显式 env 翻 0，投递经 SystemUpdateService.enqueue（journey consumers 同款系统更新通道，Redis list `system_updates:{user}`），**与 nudge 家族的 NotificationService 是两个出口**。\n   - V4 若做「统一主动面」，第一决策就是这两族的合并/分工——P 线交付没有裁决它，而是把两族各自做实。\n3. **卡面场景全部落在确定性管线里**：7 触发器（deadline/overdue/slot_missed/user_active/upstream_completed/goal_stalled/run_awaiting，triggers.py:56-62 亲证）由 10 个事件名映射（task.started/created/abandoned/status_changed、focus.session.completed、plan.health.alerted、task.completed、run.status_changed、run.awaiting_user、galaxy.study.recorded，triggers.py 分类分支逐条亲证）。\n\n---\n\n## P.1 意图（卡面目标与验收）\n\n六卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。\n\n| 卡 | Risk/Resource/Reviewers | 卡面目标（一句话） | 卡面关键验收 |\n|---|---|---|---|\n| P-01 Event-trigger + Suppression Pipeline | medium/MEDIUM/1 | 主动式做成 event→filter→Aurora，不是定时问 LLM | mute/quiet/cooldown 抑制=100%；无需 LLM 的事件不调用模型；shadow metrics 可审 |\n| P-02 NO_ACTION / Relevance Decision | medium/MEDIUM/1 | 让 Aurora 学会保持安静 | 20+ suppression/relevance cases 违规=0；false positive 受控 |\n| P-03 Proactive Suggestion UX | medium/HEAVY/1 | 建议以可忽略、可解释、可 mute 方式呈现 | 重复建议不刷屏；拒绝后 cooldown 生效；离线/过期通知点击有合理恢复 |\n| P-04 低风险 Auto-execute 授权模型 | critical/MEDIUM/2 | 仅预授权低风险操作允许 proactive auto execution | 未授权=0 auto；revoke 后立即失效；重复 trigger 不重复 side effect |\n| P-05 Proactive Longitudinal Evaluation | medium/MEDIUM/1 | 验证主动带来目标恢复而非通知负担 | precision 达阈值并报告；quiet violations=0；不只报 open rate |\n| P-06 Notification Burden / Quiet / Low-stimulation 终局 | medium/HEAVY/1 | 用户主动控制与关系策略完全接通 | 24h test-clock 0 超 cap；mute 生效；低刺激默认更保守；in-flight 关停真生效 |\n\n---\n\n## P.2 实际交付逐卡\n\n### P-01 · 事件触发 + 确定性抑制管线\n\n**交付**：`fa96be0d`（R2 CHANGES reworked delta-verified；独立审查 R2 在 commit 标注）。\n**真实数据流（代码亲证，`backend/app/aurora/proactive/` 共 2,912 行六模块）**：\n\n```\nEventBus(sparkle_events) 消费者组 aurora_proactive_pipeline（继承 idempotency/DLQ/retry）\n  → classify_event（9 事件名 → 7 触发器）\n  → ProactiveSuppressionStore.load_snapshot（fail-closed：Redis 故障全抑制）\n      + per-user 统一设置注入（P-06：quiet_window/daily_cap/timezone，解析失败回退 env 保守基线并告警）\n  → evaluate_suppression（quiet window / mute / daily cap / cooldown / recent rejection / novelty，\n     suppression.py：in_quiet_window 亲证 22:00-08:00 Asia/Shanghai 默认、cap 3、cooldown 240min、rejection 阈值 2）\n  → evaluate_relevance（P-02，四问裁决）\n  → ProactiveDecisionRecord → _record（Prometheus PROACTIVE_PIPELINE_DECISIONS_TOTAL 按 trigger/event/decision/reason 分桶\n     + deque 有界 recent_records + 可注入 DecisionSink）\n  → shadow=True：logger would-notify 记录即止；shadow=False：_default_deliver → SystemUpdateService.enqueue\n     （payload 带 pipeline=proactive_v1/trigger/subject_key/correlation 元数据）\n```\n\n- **失败语义**：`_on_bus_event` 失败**上抛**（EVENT-ACK-2 判例亲证在 pipeline.py:383-401：原 blanket-except 吞异常使总线恒 ack、失败 metric/重试/DLQ 永不触发——已修为交给总线失败管线；管线内部逐处 contain）。\n- **测试**：backend/tests/aurora/test_proactive_event_pipeline.py **32 个 test**；抑制/相关性/投递通道族另有 nudge_channel_delivery 14、proactive_suggestion_feedback 12+3+3、burden_p06 21、inflight_wake_suppression 10、24h_clock 5（逐文件 grep 计数）。\n- **shadow metrics 可审**：Prometheus 分桶计数+decision record 结构化（event/trigger/user/decision/reason/step/subject_key/shadow/occurred_at/details）亲证在 pipeline.py:196-247。\n\n**残差**：默认 shadow 是文档化的 by-design（main.py 注释「接通即安全；真实投递需显式 PROACTIVE_PIPELINE_SHADOW=0」），但**当前无任何环境配置翻它**（全仓 grep 该 env 仅 config/pipeline/main 注释三处）——事件管线的用户可见投递为零，V4 必须**显式决策**何时翻 live（见 §P.4-2）。\n\n### P-02 · NO_ACTION / 相关性裁决\n\n**交付**：`a8567153`（R2 PASS）。\n**真实数据流（relevance.py 473 行亲证）**：位于 P-01 抑制链**之后**、出口之前；四问裁决固定短路序（新信息？有行动价值？未被看过/处理过？用户近况允许？）——每个 no_action 带稳定结构化 reason，reason ∈ `RELEVANCE_REASONS` 封闭词表（:87「新增值必须进此元组并过契约测试」）；`derive_information_digest`/`derive_information_onset` 确定性派生（同一输入永远同一输出）；USER_ACTIVE 直通语义保持（bare user_active 零改动）；`ProactiveRelevanceStore` Redis 承载 reminder/view/interaction/change 四类记录（scope 分 live/shadow）。\n**「仅逾期不够」验收**：has_actionable_step 默认 True 的**正向证据原则**（仅当载荷显式 `actionable=False` 才判非行动）+ 信息摘要/onset 双通道亲证在 pipeline.py:409-449。\n**测试**：backend/tests/aurora/test_proactive_relevance.py **29 个 test**（含词表冻结契约）。\n**「20+ cases 违规=0」**：用例数 29≥20 达标；违规=0 以封闭词表+契约测试承载。\n\n### P-03 · 主动建议 UX（四要素+反馈回路）\n\n**交付（三波）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 四要素 UX | `78ff5538`（wt370） | 每条建议卡四要素：why now（引擎侧事实构建，只述计划状态/任务账本/下一步，零 guilt 零诊断）/ suggested action / today ignore / mute this type；deep link 到正确 Goal/Proposal |\n| 复核修复 | `cc84094e`（wt379） | P-03/J-04 六项猎缺修复（含 P-03 抑制态读写诚实化） |\n| 审查轮 | wt424/450/468 | 摩擦门族轮 5/6/7 连续覆盖（wt759 报告口径） |\n\n**主干面亲证**：`mobile/lib/features/notification_center/presentation/widgets/unified_notification_card.dart:687` 注释即「P-03 四要素：why now / suggested action / today ignore / mute this type」——`whyNow`（:691-716）、`onSuggestionIgnoreToday`、`onSnooze`（:58）三 handler 在树；反馈持久层=UserPreferencesCenter.explicit JSONB 独立命名空间（零迁移）；抑制在生成源头（真源不产新通知，非渲染层遮蔽——服务 docstring 亲证）。\n**测试**：feedback 12+3+3、concurrent_merge 3、nudge_channel_delivery 14（计数见上）。\n**残差**：「离线/过期通知点击有合理恢复」的端到端真机验证未定位到运行级记录（deep link 解析在 `resolve_comeback_destination` 纯函数层有测试：goal_id→Goal 页→Plan 页→chat 回退链，F-7 判例防 plan_id 误用）。\n\n### P-04 · 低风险 Auto-execute 授权模型（critical，双审查）\n\n**交付（双波双审）**：`15bd350e`（主卡，R2 PASS）+ `322988ce`（wt376：类别级预授权面+五条件门/fail-closed）。\n**主干面亲证（autoexec.py 981 行）**：\n- **allowlist 是封闭词表 + import 期校验**：`AutoExecOperation` StrEnum；每条目 `AutoExecOpMetadata` 必 `risk=\"low\"` 且 `reversible=True`——`validate_autoexec_allowlist` 在 import 期跑，违宪直接 raise ValueError（:206-208「high-risk ops are forbidden」「irreversible ops are forbidden」）；注册表冻结映射+契约测试 sha 双钉。\n- **授权面**：`AutoExecGrantStore` grant/revoke 前置校验只有词表内操作可授予（越界 ValueError——「授权面不可能铸出 allowlist 外的能力」）；`compute_grant_policy_version` 授权态指纹。\n- **幂等**：`derive_autoexec_idempotency_key`（重复 trigger 不重复 side effect 的机制载体）。\n- **receipt**：receipt 三要素（commit 明示）+ receipt_key 存储。\n- 五条件门/fail-closed 语义：wt376 commit「高风险/不可逆永远 proposal；revoke 时序」。\n**测试**：backend/tests/aurora/test_proactive_autoexec.py **36 个 test**。\n**「未授权=0 auto」的运行级背书**：P-05 纵向评估不变量「revoke 后 auto 直通=0」全零（§P.2-P-05）。\n\n### P-05 · 主动面纵向评估（14 天可控时钟 24v24）\n\n**交付**：`761e75a1`（wt384）；产物 v3-output/WT384-P05-EVAL/{summary.json, EVAL_RESULTS.md, raw/*.jsonl}；复跑脚本 scripts/devtools/p05_run_proactive_longitudinal_eval.py（--summarize-only 可从 raw 复算）。\n**核心数字（REPORT 全读，全部程序化复算非手填）**：restart 率 0.875 vs 0.542（Δ+0.333）、重启中位 2 vs 7 天、deadline 达成 0.417 vs 0.0、期末账本进度 0.773 vs 0.412；负担轴 112 条建议/14 天（人均 4.67、最坏 14）、disposition accept 45.5%/silent 19.6%/dismiss 26.8%/mute 8.0%；**正确性不变量全零**（mute 后跨天复发=0、沉默<3 天投放=0、revoke 后 auto 直通=0、accept 次日复发=0）。\n**诚实声明（REPORT 原文）**：persona 决策是 **seeded 显式模型**（参数全量落 raw/events_timeline.json）——「上述量化是该模型与真实主动面行为的联合结果，不是真人 RCT；效应方向与主动面行为正确性不依赖模型参数，效应量级不可外推为真实用户指标」。这条诚实边界必须带进 V4：**P-05 证明的是「主动面机制行为正确」，不是「真人指标改善」**。\n**驱动面口径**：直调生产 celery 任务 comeback_nudge_task（真实 get_comeback_context→suppression→duplicate 窗→NotificationService.create 全链，仅 AsyncSessionLocal 重定向 sqlite）+ 真实 ActionCommandService/ProactiveSuggestionFeedbackService/ActionPermissionService——**驱动的是 nudge 家族，不是 P-01 事件管线**（后者 shadow 默认且评估时点已存在；两族关系见 §P.0-2）。\n**反例如实回流**：FIX-48（P3，OPEN 待拍板）——「今天不再看」在每日扫描节奏下只买同日安静（30 dismiss 中 26 次次日仍投放；IGNORE_TODAY_COOLDOWN_HOURS=24h 与 24h 重复窗在两次日 tick 间双双过期）+ 过期窗口每日继续打扰（4 次实证）。完成谱正控：账本 100%→sprint auto-archive→主动面源头停（完成后投放=0）。\n\n### P-06 · 通知负担 / Quiet / 低刺激终局\n\n**交付**：`05cc6328`（wt387：统一设置一处真源+多设备服务端权威+in-flight 关停真生效+统一解析器/quiet 交集/24h cap）。\n**主干面亲证**：\n- **用户设置真接入管线**：`notification_settings.py`（runtime_v1）EffectiveNotificationPolicy（quiet_supresses/allow_proactive_push/proactive_suppress_hours/to_payload）+ NotificationSettingsResolver（DB）+ widen_quiet_window（低刺激把 quiet 窗**加宽**——「低刺激默认更保守」的机制载体）；main.py:431-440 `make_db_settings_provider(AsyncSessionLocal)` 注入 P-01 管线（P-06 commit 注释亲证「用户设置不再只是展示面，事件管线抑制链据此判定」）。\n- **in-flight 关停**：backend/tests/aurora/test_inflight_wake_suppression.py（10 test）——用户关闭后已排程通知被取消/抑制的语义锁；24h cap：test_notification_burden_24h_clock.py（5 test，24h test-clock 口径）+ test_notification_burden_p06.py（21 test）。\n- FIX-150 同族守卫（main.py:429-434 注释）：函数级 import AsyncSessionLocal 会致 UnboundLocalError 的红测实录在案。\n**残差**：「多设备 state 一致」以服务端权威（DB resolver）承载，真多设备并发实测未定位到运行级记录。\n\n---\n\n## P.3 设计决定与取舍\n\n1. **确定性优先于智能**：整条管线零 LLM；「无需 LLM 的事件不调用模型」不是验收副产品而是模块红线（import 面+mock 计数断言双钉）。LLM 只可能出现在管线之外的内容生成，决策面全是规则。V4 若加语义相关性判断，应作为 P-02 四问之外的旁路证据而非替换短路序。\n2. **fail-closed 全链**：快照读失败=全抑制；设置解析失败=回退保守基线+告警；授权词表违宪=import 期崩溃。方向统一为「宁可少发/不执行，不可误发/越权」。\n3. **shadow-first 接线**：管线先以默认 shadow 接进 main，出口适配器可注入——把「接通即安全」做成默认态。代价是 live 化成为需要显式决策的悬置面（见 §P.4-2）。\n4. **P-03 不重建真源**：在 nudge 家族之上补反馈回路与四要素 payload——尊重「不得重建已存在的权威真源」Forbidden 的正面样本；副作用是「主动面」在架构上仍是两族（§P.0-2），统一裁决被留给了未来。\n5. **评估的诚实分层**：P-05 把「机制正确性」（不变量全零，可复用）与「效应量级」（seeded persona 模型，不可外推）显式分离；反例不剪照登进台账（FIX-48 OPEN）。\n6. **时间敏感测试的隔离纪律**：p05_proactive 4 例 CI 红的根因是上海 quiet 窗挂钟面——按在库先例补 `PROACTIVE_QUIET_HOURS_ENABLED=False` fixture 收口（FIX-121@eca6493b 内处置，台账亲证）；P 线测试从此对挂钟免疫。\n\n---\n\n## P.4 残差与 V4 注意点（汇总）\n\n1. **FIX-120/121 隔离审计族的 P 线相关现状**：两族均 FIXED（120@765c9b16 wt444 / 121@eca6493b wt446）。与 P 线直接相关的两点已收口：①SRL 族 24 例污染源（裸赋值 settings.AURORA_SRL_MODE 不恢复）以 autouse 复位 fixture 收口——kill_switch/cache_service 进程级共享单例的复位基建从此存在；②p05_proactive 4 例时钟敏感以 quiet 窗关断 fixture 收口。**V4 注意**：autouse 复位 fixture 是后加的，新增全局态仍可能重演——新增 settings 级开关时同步进复位 fixture 是纪律不是选项（台账 120 行协调方补记的 auth 双测互扰同族）。\n2. **P-01 管线的 live 化是悬置决策**：shadow 默认+无环境配置翻面+投递通道（SystemUpdateService）与 nudge 家族（NotificationService）并存。V4 设计主动面时必须先裁决：两族合并 or 分工（管线管事件驱动短周期、nudge 管召回/回归长周期）？投递出口统一 or 各自维护？P-05 的纵向评估只覆盖 nudge 族——管线 live 化前应补一次同构纵向评估。\n3. **FIX-48 OPEN（待拍板）**：「今天不再看」的 24h 语义在每日扫描节奏下失效（26/30 次日复发）+过期窗口每日打扰。修法涉及产品语义裁决（ignored_until 的锚点从「时刻」改「日界」或扫描节奏改事件驱动），不是机械修。\n4. **quiet/mute 状态存储在 UserPreferencesCenter.explicit JSONB**：独立命名空间零迁移是 V3 的速度取舍；V4 若做主动面统一，建议把抑制态提升为一等实体（带审计与跨设备一致性测试），现在的 JSONB 面缺独立观测。\n5. **P-03 的恢复路径真机验证欠账**：离线/过期通知点击恢复只有纯函数层测试；建议随 U 线真机批次一并采集。\n6. **允许差异**：卡面「shadow metrics 可审」的 Prometheus 分桶已在，但**无 Grafana/告警面**（O 线未覆盖主动面指标看板）——V4 运维设计应把 PROACTIVE_PIPELINE_DECISIONS_TOTAL 的 would-notify 比例作为 live 化前的观察指标。\n\n---\n\n## P.5 本次审查登记\n\n- 本次 P 线深挖**无新缺陷登记**。复核过但不构成新发现的三项：①P-01 默认 shadow（main.py/config.py 文档化 by-design，非隐性脱钩——对照 FIX-500 的 AURORA_DEFAULT_MODE 判例，该例是「声明面零读者」，本例是显式注释+无误导声明）；②P-05 评估驱动 nudge 族而非事件管线（REPORT 口径声明明确，非证据失实）；③FIX-48 反例回流（已在账 OPEN）。\n- 交叉登记：P 线无关但本次发现的 U 线台账缺行（377）与 HUMAN_INBOX 回填缺口见 U-line.md §U.5（507/508）；S 线 demo 群标记见 S-line.md §S.5（506）。\n- 号占用核验：500-504 已占用；505 空闲备而不用；本线未占用新号。\n"}, {"id": "00_context/source_notes/S17_S-line.md", "title": "S 线（Community 5 卡）深挖章节 —— V4 交接文档素材（wt775）", "group": "原始报告副本", "html": "<h1>S 线（Community 5 卡）深挖章节 —— V4 交接文档素材（wt775）<\/h1>\n<blockquote>\n<p>本文是 <code>v3/V3-COMPLETE-STATUS-FOR-V4.md<\/code> §4「各线深度状态」S 线章节的深挖草稿。\n证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n撰写：wt775（2026-09-28，基线 main@ed072fd2）。方法：卡面（v3/07_tasks/cards/S-0*.md）+ wt759 报告逐卡 SHA → <code>git log -1<\/code> 全部 8 个交付 SHA 重验在主干 → 关键代码开文件亲证（community_context_boundary 528 行 import 面/两证据表/community_sync worker/guest_seed 演示群标记）→ 测试逐文件计数 → v3-output/WT760-S01 REPORT 全读 + WT763 独立审查 receipt 抽读 + WT307/WT312/WT314 报告抽读 → 台账 FIX-495 逐行复核。<strong>未轻信任何台账/报告结论性文字。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>S.0 线级概览<\/h2>\n<p>S 线把社群从「公共 feed 社交产品」收敛为「围绕 Goal outcome 的小队协作」，并立起群上下文隐私红线。5/5 全部 done（tasks.json + fleet 名单 + wt759 逐卡 SHA；S-01 另有 wt763 独立审查 APPROVE 销账，V3-COMPLETE-STATUS §3 已载）。<\/p>\n<p>执行形态的显著特点（V4 设计者需要知道）：<\/p>\n<ol>\n<li><strong>S 线是「真相先行」的样板线<\/strong>：S-01（真相复测）排在线首且卡面明示「先确认 V2.5 当前 M-3/502 等是否仍存在，不直接重写」——其结论直接改写了后四卡的前提（实时面已健康、CQRS 投影是闲置面，不需要救援式重写）。<\/li>\n<li><strong>S-01 的两段式交付<\/strong>：段一（wt361，09-23）headless 读模审计实锤「CQRS 双向死链」；live 段（wt760，09-27）两真实账号经 :8080 网关全环实测；wt763 独立审查 APPROVE（独立复跑 26 passed+五面探针重放+驱动脚本静态审查）后销账。<strong>一段 headless+一段 live+一段独立审查<\/strong>是本线最高的证据密度。<\/li>\n<li><strong>「红线先立、消费面后建」<\/strong>：S-02 的 528 行守卫面在群 AI 面存在之前就交付并登记 orphan-by-design 豁免（rule_at_exceptions.md:39——B 线章已载，本章 §S.2-S-02 亲证复核）——守卫的「生产消费方=后续群 AI 面」。<\/li>\n<\/ol>\n<hr />\n<h2>S.1 意图（卡面目标与验收）<\/h2>\n<p>五卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。<\/p>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>Risk/Resource/Reviewers<\/th>\n<th>卡面目标（一句话）<\/th>\n<th>卡面关键验收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>S-01 Community Realtime/Read-model 真相复测<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>先确认 V2.5 遗留疑项是否仍存在，不直接重写<\/td>\n<td>当前状态有可重复 report；live 失败不 fallback 假 realtime<\/td>\n<\/tr>\n<tr>\n<td>S-02 Community Context Privacy Boundary<\/td>\n<td>critical/MEDIUM/2<\/td>\n<td>群聊/小队绝不能自动访问私人 Memory/Profile<\/td>\n<td>private memory leakage=0（两账户 adversarial）；群内 AI 说明它看到什么<\/td>\n<\/tr>\n<tr>\n<td>S-03 Squad/Sprint/Check-in 表面收敛<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>从公共 feed 转向围绕 Goal outcome 的小组协作<\/td>\n<td>单人核心 journey 不受依赖；小组 journey 自解释；seed/demo group 明确标演示<\/td>\n<\/tr>\n<tr>\n<td>S-04 Artifact Feedback → Outcome/Evidence<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>同伴反馈变成可选择的 Goal evidence 而非社交孤岛<\/td>\n<td>GJ16 能从 check-in 回到 Goal trajectory；撤回后派生引用更新；feedback/ack 不自动成为 mastery<\/td>\n<\/tr>\n<tr>\n<td>S-05 Reconnect/Retract/Two-account E2E<\/td>\n<td>high/HEAVY/2<\/td>\n<td>真实验证实时、权限、撤回、离线和跨用户隔离<\/td>\n<td>WS 真实通过；cross-user/private memory leak=0；duplicate check-in=0；失败态不冒充 live<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>S.2 实际交付逐卡<\/h2>\n<h3>S-01 · Realtime/Read-model 真相复测（「五面真相」——本卡是 V4 读社群面的第一入口）<\/h3>\n<p><strong>交付（两段+独立审查）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>段<\/th>\n<th>主干 SHA<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>段一 headless<\/td>\n<td><code>02515b39<\/code>（wt361）<\/td>\n<td>读模审计：<strong>gateway CQRS 社区读模投影双向死链实锤<\/strong>（outbox.Insert 全仓零非测试调用方→cqrs:stream 零投递）<\/td>\n<\/tr>\n<tr>\n<td>live 段<\/td>\n<td><code>5e7a2443<\/code>（wt760，READY_FOR_REVIEW；源码零改动，交付=报告+证据+495 登记）<\/td>\n<td>两真实测试账号（wt760s01_a/b）经 :8080 网关 join/chat/checkin/reconnect 全环 90.5s 时间线全绿（evidence.jsonl 逐帧+可复跑驱动脚本 wt760_s01_live.py/followup.py）<\/td>\n<\/tr>\n<tr>\n<td>独立审查<\/td>\n<td><code>51b9c659<\/code>（wt763）<\/td>\n<td><strong>APPROVE<\/strong>：独立复跑 sqlite security 12+e2e 14=26 passed、go cqrs/worker 5 包 ok、evidence.jsonl 75 行逐项对账一致、live 只读抽验（A 重登录同 uid、群/8 消息 nonce 全链、火堆 29）+ CQRS 五面探针重放全复现；no-mock-fallback 代码级核验（isDemoMode 默认 false+WS 失败 error/重连/终态）；3 轻微备注不阻塞<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>五面逐面结论（v3-output/WT760-S01/report.md §2 亲读+关键点代码复核）<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>面<\/th>\n<th>结论<\/th>\n<th>本次复核锚点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① WS path<\/td>\n<td><strong>健康<\/strong>：群/个人双端点 5 次握手 24-65ms 全 OPEN；非成员 4003 闸+401 闸在位；<strong>V2.5 快照 M-3（社群 WS 502）已消解<\/strong><\/td>\n<td>report §2①②<\/td>\n<\/tr>\n<tr>\n<td>② Gateway 转发<\/td>\n<td><strong>健康<\/strong>：WsAuthMiddleware→HandleCommunityWS（websocket_proxy.go:127 UUID 防穿越）反向代理；消息/typing/checkin 帧双向逐帧可达<\/td>\n<td>report §2②<\/td>\n<\/tr>\n<tr>\n<td>③ Projection<\/td>\n<td><strong>闲置但健在<\/strong>：XLEN=0、consumer group last-delivered-id 0-0（自建组从未投递）、pending=0、post:view:* 0 键、feed:global ZCARD=0；群聊/打卡实时<strong>不经过<\/strong>投影——走引擎进程内 ConnectionManager+Redis pub/sub 直达<\/td>\n<td>report §2③；backend/gateway/internal/worker/community_sync.go 在树亲证<\/td>\n<\/tr>\n<tr>\n<td>④ Outbox<\/td>\n<td><code>event_outbox<\/code> 521 行全部 published（galaxy 321/memory 142/action 31/run 27），<em><em>community.post.<\/em> 0 行<\/em>*——posts 写路径不产 outbox 行；网关 UnitOfWork 写入方仅 galaxy/task/user_preferences 三服务<\/td>\n<td>report §2④（galaxy CQRS 是活的、community CQRS 是死的——同仓对照）<\/td>\n<\/tr>\n<tr>\n<td>⑤ DLQ<\/td>\n<td>XLEN=0 无死信；PEL 恒空——<strong>461/469/481 三代耐久幂等修复在 community 流上零真实流量可锻炼<\/strong>，正确性由单测承载（base_pel_redelivery_test.go 等三文件本卡点名重跑过）<\/td>\n<td>report §2 尾段<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>M-3 消解/引擎内实时/CQRS 闲置三点的 V4 读法<\/strong>：①「实时是引擎内进程实时」=ConnectionManager 单进程广播+Redis pub/sub 个人通道——单引擎实例内成立；<strong>多实例/跨进程扩 stride 时这套实时面是第一个要重设计的点<\/strong>（群 WS 不注册 user_connections 表，nonce ACK 只在个人通道可达是设计语义非缺陷，wt760 followup 双向钉死）。②CQRS community 投影是「零生产者+零读取者」的完整闲置接线→ <strong>V3-FIX-495 OPEN<\/strong>（P3）。③live 失败路径无 mock 回退（mobile mock 仅 demo 开关门控、WS 失败走 error 态+调度重连、feed 断网回退带 fromCache/asOf 时点标记的诚实降级）——wt763 代码级核验在案。\n<strong>seed/mock 清单（卡面 Work 3）<\/strong>：guest 登录播种 6 演示群+演示用户（friend 行共享）+种子痕迹（flame_level=15 非真实 earned）——<strong>其中 6 个演示群无任何 demo 标记<\/strong>（→ 本次登记 V3-FIX-506，§S.5）。<\/p>\n<h3>S-02 · Community Context Privacy Boundary（critical，双审查）<\/h3>\n<p><strong>交付<\/strong>：<code>83ed09ee<\/code>（wt375；4 文件 +1,092 行：守卫 528 行+测试 551 行+business_metrics 计量 12 行+豁免登记 1 行）。\n<strong>主干面亲证<\/strong>：<\/p>\n<ul>\n<li><code>backend/app/services/community_context_boundary.py<\/code> 528 行在树；<strong>生产 import 面为零<\/strong>（本次全仓 grep：仅 3 个测试文件 import——unit/test_community_context_privacy_boundary.py 16 test、security/test_q05_redteam_final.py、api/test_s05_community_reconnect_retract_two_account_e2e.py 复用）；orphan-by-design 豁免在 docs/aurora/rule_at_exceptions.md:39（B 线章登记处复核一致，移除条件=群 AI prompt/tool 面接入时）。<\/li>\n<li>守卫语义（commit message 逐条亲证）：shared context allowlist 单一守卫面——群 prompt/tool 组装只收用户<strong>主动分享进群<\/strong>的 Goal/Action/Artifact（真源=既有 SharedResource 群分享行；词表外载体 seed/cognitive 族永不进群 AI 上下文）；纯函数滤芯（固定维度 identity→type→share→lifecycle+封闭 reason 词表冻结+Prometheus 逐维度计量 sparkle_community_group_context_rejections_total）；resolve_prompt_context/group_tool_context_permits 只读群 permission 面，fail-closed（非活跃成员/群不存在即拒、无 ctx 全拒 no_group_surface）；revoke 软删+分享者离群即失效（陈旧候选精确归因 share_revoked/sharer_left_group）；owner 绑定校验（伪造借道他人 share 行→owner_mismatch）+payload 七键形状冻结（零私人 memory/profile 字段）。<\/li>\n<li>证据：红测 base 78ff5538（ModuleNotFoundError 无守卫实证+私人 llm_context 面 surface-blind 对照）→绿（定向 16/16）；邻域回归 129+989 passed；冷 mypy 基线零漂移。\n<strong>「群内 AI 说明它看到什么」<\/strong>：payload 形状冻结+语义提示文案的守卫侧承载在库；<strong>群 AI 会话面本身不存在<\/strong>（无群 AI prompt 组装生产方）——该验收项的完整兑现以 V4 群 AI 面接线为前提（这是豁免条款的「移除条件」本体）。<\/li>\n<\/ul>\n<h3>S-03 · Squad/Sprint/Check-in 表面收敛<\/h3>\n<p><strong>交付（两波收口）<\/strong>：<code>41d83f83<\/code>（wt307 v1）+ <code>83f599ff<\/code>（wt377 收口+四入口契约锁）。\n<strong>交付内容（WT307 REPORT 亲读+commit 双证）<\/strong>：社群主屏 tab 从 [伙伴(默认), 动态, 群组] 重排为 <strong>[群组协作(默认), 伙伴, 动态]<\/strong>——公共 feed 让出核心位（FAB 随 feed 新索引）；新增 <code>_TodayCheckinSection<\/code>（我的群组今日打卡段：冲刺群排前、真源计数直显、复用群聊同款打卡对话框，回执「+N 火苗喂进群火堆」把 Flame 锚定群活跃）；孤儿组件 <code>SharedResourceCard<\/code> 接回产品面（fetchSharedResources/adoptResource 此前产线零调用方）；demo 模式顶部常驻 <code>_DemoModeBanner<\/code>（不可关闭）；BonfireWidget 包 Semantics（gdFlameSemantics：火苗代表群活跃度——「Flame 不与付费绑定」的后端 entitlement 守卫早已在 core/entitlement.py，mobile 全库 grep 零 flame→付费耦合）；mock 仓库 4 个 demo 群名追加「（演示）」后缀（l10n demoGroupSuffix）。\n<strong>验收「seed/demo group 明确标演示」的双面现状<\/strong>：mobile demo-mode 组有标记（mock 仓库后缀+横幅）；<strong>guest_seed_service 后端播种的 6 个真·访客可见演示群无任何标记<\/strong>（本次开文件亲证：guest_seed_service.py:2815-2867 <code>_ensure_group(name=&quot;算法冲刺小队&quot;...)<\/code> defaults 无 is_demo/marker 字段，models/community.py 无 is_demo 列；wt760 §5 同口径发现并指向「S-03 验收承接」——但 S-03 当时已销账，承接链断裂）→ V3-FIX-506。\n<strong>「单人核心 journey 不受依赖」<\/strong>：单人群组外全功能可走（S-01 两账号走的就是纯社群路径；核心 GJ01-GJ08 均无社群依赖——B-01 CORE 15 项映射在案）。<\/p>\n<h3>S-04 · Artifact Feedback → Outcome/Evidence<\/h3>\n<p><strong>交付（两波）<\/strong>：<code>c026f0c1<\/code>（wt312 v1：新表 shared_resource_feedbacks + Alembic 迁移）+ <code>8656eaa9<\/code>（wt382：结构化证据+flywheel）。\n<strong>主干面亲证<\/strong>：backend/app/models/community.py:574 <code>shared_resource_feedbacks<\/code> + :625 <code>community_outcome_evidence<\/code>（FK→shared_resource_feedbacks.id ondelete=CASCADE——撤回级联的 schema 层载体）两表在树。\n<strong>「feedback/ack 不自动成为 mastery」<\/strong>：wt382 commit 语义——同伴反馈采纳才落<strong>结构化 outcome evidence<\/strong>（用户可选择采纳为 Goal evidence，走 evidence 族权重面），ack/like 本身不写 mastery；与 G-01 的 SELF_REPORT 单独通道原则同构（G-line 章互证）。\n<strong>「事件进入 flywheel」<\/strong>：8656eaa9 明示 S-03 第 4 入径上加两块结构化不留断头路+flywheel 事件。\n<strong>测试<\/strong>：backend/tests/api/test_s04_community_outcome_evidence.py 4 test + tests/test_s04_community_feedback_evidence.py 9 test（逐文件计数）。\n<strong>「撤回后派生引用更新」<\/strong>：CASCADE FK 承载 schema 级；应用层撤回路径的显式测试未逐条定位（S-05 的 retract 谱系覆盖 retract 行为本身）。<\/p>\n<h3>S-05 · Reconnect/Retract/Two-account E2E（high，双审查）<\/h3>\n<p><strong>交付（两轮）<\/strong>：<code>911dbeb7<\/code>（wt383：<strong>30 case 全谱 headless 真实验证+当场修 3 缺陷<\/strong>）+ <code>64e6cdff<\/code>（wt396 轮 3 清扫 F5/F6/F7：里程碑位置 join 错位/离群 kick 无补偿/评估引擎事件通道污染——三项独立复核全 CONFIRMED 红绿修复）。\n<strong>主干面亲证<\/strong>：backend/tests/api/test_s05_community_reconnect_retract_two_account_e2e.py <strong>30 个 test<\/strong>（逐文件计数，覆盖 reconnect/dup event/out-of-order/leave/revoke/block 谱系）+ security/test_q05_redteam_final.py 跨用户隔离对抗面复用。\n<strong>卡面「Android/Web/macOS applicable flows」<\/strong>：headless 谱系承载；三端实机流未发生（无设备——U 线同款欠账，转出链缺口见 508）。\n<strong>「失败态不冒充 live」<\/strong>：与 S-01 的 no-mock-fallback 代码级核验同构（isDemoMode 默认 false+WS 失败终态）。\n<strong>「duplicate check-in=0」<\/strong>：S-01 live 时间线双打卡 streak=1→count=2、12+17=29 火堆对账平（幂等/计数控）+wt383 谱系内 dup case。<\/p>\n<hr />\n<h2>S.3 设计决定与取舍<\/h2>\n<ol>\n<li><strong>「先测真相再动刀」<\/strong>：S-01 卡面明示不直接重写；结果是 M-3 免了一次救援重写、CQRS 闲置面从「疑项」变「实锤登记」（495）——后四卡的前提全部建立在实测上。V4 群面设计应从 S-01 报告出发而非从 V2.5 快照出发。<\/li>\n<li><strong>红线先行、豁免显式<\/strong>：S-02 在消费面（群 AI）存在前立守卫+登记 orphan-by-design 豁免（带移除条件）——把「V4 接线义务」写成机器可查的登记而非口头承诺。这是「验收模型前置」的变体：守卫的红测（16/16）在无生产流量时就跑通。<\/li>\n<li><strong>实时面复用引擎进程内基建<\/strong>：群聊/打卡实时走 ConnectionManager+pub/sub，不迁 CQRS——「不重建真源」+「闲置接线如实登记」的组合取舍。代价是 495 的悬置与多实例扩展的未决。<\/li>\n<li><strong>Flame 语义主动去货币化<\/strong>：S-03 把火焰显式锚定为群活跃（Semantics 文案+回执话术），配合既有 entitlement 守卫（flame_level 永久禁作权益判据）——「付费绑定」从产品语言层和后端判据层双向封死。<\/li>\n<li><strong>两段真实账号+nonce 逐帧对账<\/strong>：S-01/wt760 的 live 方法论（guest 账号明标测试身份、步进≥1.2s、逐帧 JSONL、A/B 交叉读侧核验、火堆总数对账）是可复用的社群面验收 harness——wt763 独立审查能逐项重放正因证据链是机器可读的。<\/li>\n<li><strong>收口而非铺开<\/strong>：S-03/S-04/S-05 都经历「v1（wt307/312/383）→收口轮（wt377/382/396）」两波——v1 交付主体，收口轮修 v1 真红面（如 wt377 亲证 v1 改 TabBarView children 漏改 tabController.length 的真缺陷）+ 补契约锁。<\/li>\n<\/ol>\n<hr />\n<h2>S.4 残差与 V4 注意点（汇总）<\/h2>\n<ol>\n<li><strong>FIX-495 的裁量建议素材（主会话待产品裁决项，本章供给料）<\/strong>：\n<ul>\n<li><strong>事实面<\/strong>：community post CQRS 投影=完整闲置接线（零生产者+零消费者+零流量）；461/469/481 耐久幂等链在 community 流零真实流量锻炼（单测承载）；而 posts/feed 功能本身经引擎 API+网关纯代理正常服务（S-01 live 全绿）。<\/li>\n<li><strong>留档接线（keep）的论据<\/strong>：V4 若做 feed 规模化/多实例（ConnectionManager 跨进程失效时投影是现成的读扩展路径）；galaxy 流（321 行）证明同构管线在真流量下工作；拆除后再建成本高于维护。<\/li>\n<li><strong>拆除（remove）的论据<\/strong>：零流量管线自带腐烂风险（461/469/481 的修复在真实流量为零时回归锚只剩单测）；「死接线」对 V4 新人是误导性复杂度；wt639 审计的 ORPHAN 判据（入口可达/下游消费/测试在测/宣称 vs 实现）四问全不过。<\/li>\n<li><strong>折中建议<\/strong>：post-RC（10/7 后）裁决；若 V4 群 AI/feed 面立项则接线并补集成测试，否则按 FIX-341 判例走「撤面+AT 豁免+重建须三件齐上」的 by-design 收口。<\/li>\n<\/ul>\n<\/li>\n<li><strong>群 AI 面的接线义务<\/strong>：community_context_boundary 豁免（rule_at_exceptions.md:39）的移除条件=群 AI prompt/tool 面接入。V4 做群 AI 时第一件事就是接它（fail-closed 语义+七键 payload+Prometheus 计量全部现成），否则隐私宣称持续大于保障面。<\/li>\n<li><strong>实时面的多实例边界<\/strong>：引擎内 ConnectionManager 是单实例语义；V4 若横向扩引擎，群广播/个人通道/ACK 路由需重设计（495 的投影是候选承载之一——与 1 的裁决联动）。<\/li>\n<li><strong>演示群标记（506）<\/strong>：guest 可见的 6 个种子群无 demo 标记；V4 若动 guest/演示面，随 S-03 语义（横幅+后缀）补齐后端标记。<\/li>\n<li><strong>461/469/481 的流量真空<\/strong>：不只 community——任何 CQRS 流的真实故障注入演练（Q-07 chaos 终验未做）之前，耐久链的运行级置信度都来自单测。V4 排期 chaos 面时应把 community 流的故障注入纳入（若 495 裁决为保留）。<\/li>\n<li><strong>S-04 的应用层撤回测试<\/strong>：CASCADE FK 承载了 schema 级撤回；「撤回后派生引用更新」的显式应用层测试未逐条定位——V4 若扩展 evidence 派生面（引用/快照/聚合），补一条端到端 retract 测试。<\/li>\n<\/ol>\n<hr />\n<h2>S.5 本次审查登记<\/h2>\n<ul>\n<li><strong>V3-FIX-506<\/strong>（本次新登记，台账行已入本 worktree commit）：S-03 验收「seed/demo group 明确标演示」对 guest_seed_service 后端播种的 6 个演示群未兑现——<code>_ensure_group<\/code> defaults 无任何 demo 标记字段（guest_seed_service.py:2815-2867），models/community.py 无 is_demo 列；wt760（09-27）发现后注记「→S-03 验收承接（S-03.md:27）」，但 S-03 已于 wt377（09-25）销账——<strong>承接链断裂：指向一张已 done 的卡<\/strong>。mobile 侧 demo-mode 组有标记（mock 仓库「（演示）」后缀+常驻横幅），真实访客经 guest 登录看到的种子群反而无标记。修法方向：种子群名追加演示后缀或加 is_demo 列+读面透传（与 O1 种子计划「示例」来源标记同构）。<\/li>\n<li>复核过但<strong>不构成新发现<\/strong>的三项：①CQRS 闲置面（已登记 FIX-495 OPEN，本章 §S.4-1 供裁量素材）；②community_context_boundary 零生产 import（orphan-by-design 豁免在案 rule_at_exceptions.md:39，属已知设计态）；③wt763 receipt 三轻微备注（live_run1_full.log 指针失实未入库/握手计数口径/members 装饰性断言）——均不阻塞且已由 receipt 在案，不重复登记。<\/li>\n<li>号占用核验：500-504 已占用；505 空闲备而不用；本线取 506（grep 全仓 <code>V3-FIX-506<\/code> 零命中后占用）。507/508 见 U-line.md §U.5。<\/li>\n<\/ul>\n", "text": "# S 线（Community 5 卡）深挖章节 —— V4 交接文档素材（wt775）\n\n> 本文是 `v3/V3-COMPLETE-STATUS-FOR-V4.md` account E2E | high/HEAVY/2 | 真实验证实时、权限、撤回、离线和跨用户隔离 | WS 真实通过；cross-user/private memory leak=0；duplicate check-in=0；失败态不冒充 live |\n\n---\n\n## S.2 实际交付逐卡\n\n### S-01 · Realtime/Read-model 真相复测（「五面真相」——本卡是 V4 读社群面的第一入口）\n\n**交付（两段+独立审查）**\n\n| 段 | 主干 SHA | 内容 |\n|---|---|---|\n| 段一 headless | `02515b39`（wt361） | 读模审计：**gateway CQRS 社区读模投影双向死链实锤**（outbox.Insert 全仓零非测试调用方→cqrs:stream 零投递） |\n| live 段 | `5e7a2443`（wt760，READY_FOR_REVIEW；源码零改动，交付=报告+证据+495 登记） | 两真实测试账号（wt760s01_a/b）经 :8080 网关 join/chat/checkin/reconnect 全环 90.5s 时间线全绿（evidence.jsonl 逐帧+可复跑驱动脚本 wt760_s01_live.py/followup.py） |\n| 独立审查 | `51b9c659`（wt763） | **APPROVE**：独立复跑 sqlite security 12+e2e 14=26 passed、go cqrs/worker 5 包 ok、evidence.jsonl 75 行逐项对账一致、live 只读抽验（A 重登录同 uid、群/8 消息 nonce 全链、火堆 29）+ CQRS 五面探针重放全复现；no-mock-fallback 代码级核验（isDemoMode 默认 false+WS 失败 error/重连/终态）；3 轻微备注不阻塞 |\n\n**五面逐面结论（v3-output/WT760-S01/report.md §2 亲读+关键点代码复核）**：\n\n| 面 | 结论 | 本次复核锚点 |\n|---|---|---|\n| ① WS path | **健康**：群/个人双端点 5 次握手 24-65ms 全 OPEN；非成员 4003 闸+401 闸在位；**V2.5 快照 M-3（社群 WS 502）已消解** | report §2①② |\n| ② Gateway 转发 | **健康**：WsAuthMiddleware→HandleCommunityWS（websocket_proxy.go:127 UUID 防穿越）反向代理；消息/typing/checkin 帧双向逐帧可达 | report §2② |\n| ③ Projection | **闲置但健在**：XLEN=0、consumer group last-delivered-id 0-0（自建组从未投递）、pending=0、post:view:* 0 键、feed:global ZCARD=0；群聊/打卡实时**不经过**投影——走引擎进程内 ConnectionManager+Redis pub/sub 直达 | report §2③；backend/gateway/internal/worker/community_sync.go 在树亲证 |\n| ④ Outbox | `event_outbox` 521 行全部 published（galaxy 321/memory 142/action 31/run 27），**community.post.* 0 行**——posts 写路径不产 outbox 行；网关 UnitOfWork 写入方仅 galaxy/task/user_preferences 三服务 | report §2④（galaxy CQRS 是活的、community CQRS 是死的——同仓对照） |\n| ⑤ DLQ | XLEN=0 无死信；PEL 恒空——**461/469/481 三代耐久幂等修复在 community 流上零真实流量可锻炼**，正确性由单测承载（base_pel_redelivery_test.go 等三文件本卡点名重跑过） | report §2 尾段 |\n\n**M-3 消解/引擎内实时/CQRS 闲置三点的 V4 读法**：①「实时是引擎内进程实时」=ConnectionManager 单进程广播+Redis pub/sub 个人通道——单引擎实例内成立；**多实例/跨进程扩 stride 时这套实时面是第一个要重设计的点**（群 W
