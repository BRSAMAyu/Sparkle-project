td>\n<td>20 canonical stuck scenarios ≥18 合理；同一句「做不下去」不同 Context 不同处理<\/td>\n<\/tr>\n<tr>\n<td>A-04 Human/Agent/Hybrid 联合决策<\/td>\n<td>high/2<\/td>\n<td>intervention 与 execution allocation 联合而非两系统各猜；用户 explicit delegation 优先<\/td>\n<td>paired cases 不出现「intervention 合理但执行权错误」；high-risk auto=0<\/td>\n<\/tr>\n<tr>\n<td>A-05 Bounded Policy Patches<\/td>\n<td>high/2<\/td>\n<td>Aurora 从 outcome 更新白名单策略，而非改系统 Prompt/代码；candidate→evidence→confirm→active→expire/revoke<\/td>\n<td>非法 patch field 被拒绝；用户纠正可撤销；同 scope 历史有效 intervention 可改变 ranking 且有 evidence refs<\/td>\n<\/tr>\n<tr>\n<td>A-06 Why-this / Calibration Receipt<\/td>\n<td>high/2（HEAVY）<\/td>\n<td>让用户感知理解与可纠正性；receipt 支持 not relevant/wrong/change scope/delete<\/td>\n<td>GJ08 用户可从建议直接纠偏；receipt 与真实 Context 一致；不泄露 hidden CoT<\/td>\n<\/tr>\n<tr>\n<td>A-07 Comeback + Low-stimulation Policies<\/td>\n<td>medium/1<\/td>\n<td>回来恢复目标状态而非模板问候；低刺激控制 UI/主动/游戏化，不能心理诊断<\/td>\n<td>3/7/14-day test clock 回归合理、不显示陈旧任务为当前；用户 explicit setting 最高优先<\/td>\n<\/tr>\n<tr>\n<td>A-08 Longitudinal/Ablation Evaluation<\/td>\n<td>medium/1<\/td>\n<td>证明 Aurora 比固定模板/无历史基线更好并找到失败边界；10 Persona multi-session 四臂<\/td>\n<td>输出 raw+summary；目标指标达到或诚实未达；不把模型 judge 单独作为结论<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>A.2 实际交付逐卡<\/h2>\n<h3>A-01 · AuroraDecision 契约与 Runtime 映射<\/h3>\n<p><strong>交付<\/strong>：合入 <code>873ba1a4<\/code>（ACCEPT merge，dual-review + rework，2026-09-19）。<code>backend/app/core/aurora_decision.py<\/code>（488 行，aurora_decision.v1）——3 个 frozen dataclass + 7 个封闭词表（17 干预名与 AURORA_V3 逐字核对）；ref schemes 从 X-01 结构性派生（growth 自动 surface）；<strong>shadow/live 共享同一 decision_id<\/strong>（内容寻址）= 对比锚点；44 组件 runtime map（25 决策点 + 23 kill switch，RUNTIME_MAP.md，P3-5 勘误 22→23）——kill switch 全部基于 <code>app/core/kill_switch.py<\/code> 三态原语（off/shadow/live），settings.py:334-348 逐项在案（AURORA_STAGE18/19/21_*_MODE 族）。测试：契约 30 测试（test_aurora_decision_contract.py）+ L2 接线 15 测试（test_a01_aurora_decision_l2_wiring.py），交付时 70 targeted + 177 suite 绿（双 hashseed）。<\/p>\n<p><strong>shadow/live 对比验收的诚实边界（本次亲证，V4 重点）<\/strong>：机制在库——<code>migration.py<\/code> shadow cohort 治理链 + <code>record_shadow_divergence<\/code> 计数器（<code>sparkle_aurora_shadow_divergence_total<\/code>，observability/metrics.py:51）+ decision_id 对比锚；但 <strong>fleet state notes 全文 0 次 shadow divergence 运行记录<\/strong>——V3 期间没有做过一次真实 shadow/live 对比运行。「现有聊天不因 shadow Aurora 退化」以「shadow 分段 kill switch 默认不改变现役路径」的构造性方式保证，而非实测对比。V4 若做 Aurora 灰度/迁移，这套机制是现成的，但需要真正跑起来。<\/p>\n<p><strong>残差<\/strong>：① 23 个 kill switch 三态面之外，wt765（O-06 扫雷）发现 <code>AURORA_DEFAULT_MODE<\/code>「总默认」声明零读者（<strong>V3-FIX-500 OPEN<\/strong>）与 5 个 metacognition proxy 绕开 kill switch 核心（<strong>V3-FIX-501 OPEN<\/strong>）——A-01 的三态治理面存在两处声明与行为脱节，登记在案待修；② FIX-30 的 P3-2/P3-4/P3-5 follow-ups 备忘型未深查（台账行在案）。<\/p>\n<p><strong>一句话用户可见行为<\/strong>：无直接可见行为（契约+治理层）；它让后续所有 A 线卡共享同一决策词汇与 decision_id 追踪锚。<\/p>\n<h3>A-02 · Intervention Catalog + Policy Engine V1<\/h3>\n<p><strong>交付<\/strong>：合入 <code>0c56a96f<\/code>（ACCEPT merge，single deep review，2026-09-19）。<code>backend/app/aurora/intervention_catalog.py<\/code>（443 行）——catalog 从 <code>AURORA_INTERVENTION_TYPES<\/code> 结构性派生（零拷贝、漂移即 fail-fast；卡面拼写地雷 R0 拒绝）；<code>intervention_policy.py<\/code>（674 行→现 683）——10 个纯函数守卫 + 16 个封闭 reason codes（sha256 双钉）；<strong>feasible-set-then-LLM<\/strong>（合法集先过滤、LLM 只在集合内选——与 X-02 同构）；spine 34 条策略字符串全投影（双向契约）；no_action 确定性出口；P3-8 缺失/脏 allocation mode → 确定性拒绝。场景面：<code>backend/tests/aurora/fixtures/intervention_policy_scenarios.json<\/code> <strong>45 场景<\/strong>（卡面要求 ≥30，超额兑现，本次读文件亲证 <code>_count: 45<\/code>）。测试：目录契约 13 + 策略引擎 24；交付时 106 targeted + 349 回归绿。<\/p>\n<p><strong>残差<\/strong>：catalog 的「每个 item 有 capability/permission/expected outcome」以结构字段兑现；LLM 真模型上的选择质量属 A-08 评估域（见该卡——四臂驱动为确定性服务面+模型 judge 0 次，真模型干预选择质量未独立测量）。<\/p>\n<p><strong>一句话用户可见行为<\/strong>：AI 的干预动作不再「字符串自由发挥」——所有出面都是目录内词表项且带守卫。<\/p>\n<h3>A-03 · Friction Diagnosis + Sufficiency / One Best Question<\/h3>\n<p><strong>交付（v1 三轮演进，全部主干在案）<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>版本<\/th>\n<th>主干 SHA<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>v1<\/td>\n<td><code>fd2d4a45<\/code>（reviewed，2026-09-20）<\/td>\n<td><code>friction_diagnosis.py<\/code>（1588 行）aurora_friction_diagnosis.v1：15 类摩擦分类→充分性判定→One Best Question→追问预算，纯函数零 IO never-raises；决策敏感封闭形式 <code>_flip_changes_primary<\/code>；负信息增益保留（认识论诚实）；答案种子零先验吸收+证据量均摊（冷启动两问收敛）；hard_family：同句「做不下去」三 Context 三处理（问/问一次对/直出 pause）。20 canonical 场景 + hard_family 6（fixture 本次读文件亲证，含 rubric 注释）；73 targeted + 6 变异必红。R2 PASS（1 P2→FIX-43 P1 接线条目 + 6 P3）。<strong>无 v3-output 目录，签收在 commit message<\/strong><\/td>\n<\/tr>\n<tr>\n<td>v1_1<\/td>\n<td><code>7c6cb867<\/code>（WIRING-1）<\/td>\n<td>负向分支遮蔽根修（最长词牌算法）+指纹 bump<\/td>\n<\/tr>\n<tr>\n<td>v1_2<\/td>\n<td><code>28442a5a<\/code>（wt412）<\/td>\n<td>B1 exact-tie 降级 B3.budget_exhausted_tie_no_action（宽分支零事实平权不再按字母序偶然型行动；TIE_DISCRIMINATION_EPSILON=1e-9 入指纹+子进程换 seed 测试锁死）——修复 A-08 实锤的 FIX-50<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>生产接线（本次开文件亲证）<\/strong>：<code>friction_chat_wiring.py<\/code>（677 行）在 chat 决策环消费引擎；FIX-49 出口词牌门（ask/act 出面必须携带 utterance_matches 正向词牌否则静默 no_action）、FIX-110 否定感知、FIX-111 answer_replay 置信门、FIX-115 卡住族词表补齐——四条摩擦门语义缺陷族 FIXED@<code>8541ddde<\/code>（wt428）；FIX-142 出口载荷剔除 input_snapshot（用户原话不进 response metadata）FIXED@<code>4e8b226b<\/code>。旅程面消费：J-05 stuck_journey_service 全部选问/主干预交冻结 A-03 引擎（LLM 0 次）。A-03 冻结面现值 112 测试（FIX-142 行注记「A-03 冻结面 112/112」）+ test_a03_friction_diagnosis.py 77 函数 + wiring 45 函数（本次逐文件计数）。<\/p>\n<p><strong>卡面验收兑现<\/strong>：20 场景 ≥18 合理=fixture rubric+变异实证；「同一句不同 Context 不同处理」=hard_family 6 例契约锁；「UNKNOWN 时不假诊断」=缺事实保持 None 不猜（J-05 集成实录再证）。<\/p>\n<p><strong>残差<\/strong>：FIX-52 <strong>OPEN<\/strong>——行为事实证据无双刃消解（历史失败痕迹把新类型卡点系统性带偏，A-08 记忆面反例 p07 的机制成因），随 A-03 迭代处理；FIX-97 <strong>OPEN 待产品拍板<\/strong>——诚实化后 journey-first persona 的错位行动消失→「不是这个原因」纠正通道饿死（见 §A.4-4）。<\/p>\n<p><strong>一句话用户可见行为<\/strong>：用户说「做不下去」时，AI 只在证据够时问一个高价值问题、在零证据时诚实 no_action（不再问卷式追问、不再凭空猜原因）。<\/p>\n<h3>A-04 · Aurora Human/Agent/Hybrid 联合决策<\/h3>\n<p><strong>交付<\/strong>：合入 <code>e943e08b<\/code>（dual-reviewed，2026-09-20）。<code>backend/app/aurora/joint_decision.py<\/code>（1078 行→现 1125）——纯函数两步联合（policy×allocation→结构性约束→A-01 契约），D1-D4/X1 确定性裁决序+对抗归因，<strong>high-risk auto=0<\/strong>，交叉边界 8×3×2 穷举；<code>joint_factor_projection.py<\/code>（300 行）——严格 bool 因子装配投影器（闭合 A-02 验收 N3 缺口）；L2 生产决策点完整链接线（投影→联合→契约 P3-8 ref→<code>spine:aurora_decisions<\/code> 真落键，<code>signals/spine_orchestrator.py<\/code> +152）；语义通道三重隔离默认关+shadow read 门；12 canonical scenarios 冻结（真实引擎实跑）。测试：契约 10 + 联合 40 + 投影 27 + spine 接线 7（本次计数）；交付时 139 targeted/558 回归绿（双 hash 种子）。R2 ACCEPT（零 P1/P2）+ R1 PASS；follow-ups→FIX-30。<strong>无 v3-output 目录，签收在 commit message。<\/strong><\/p>\n<p><strong>验收的下游再证<\/strong>：「high-risk auto=0」后来被 X-10 的 77 场景 eval 以 allocation 100%、high-risk auto=0、false success=0 再证（详 X 线章 §X.2-X-10）；J-04 的学习守卫（LLM 建议 agent 被分配策略拦回 human/hybrid）是本引擎 decide_allocation 的生产路径实证（<code>02b82cd2<\/code> 5-Persona 断言）。<\/p>\n<p><strong>残差<\/strong>：FIX-30 三条 P3 备忘（decide_joint 步绑定提名陷阱/AllocationDecision.to_dict 缺 annotations/7 个待落投影点）——「均不阻塞」自登记，与执行面投影点接线同批处理，V4 做执行面深化时应先读该行。<\/p>\n<p><strong>一句话用户可见行为<\/strong>：用户在学习类任务上永远不会被 AI 自动代执行高风险步骤；AI 建议的执行权分配可从 decision log 溯源。<\/p>\n<h3>A-05 · Bounded Policy Patches / Adaptive Preferences<\/h3>\n<p><strong>交付<\/strong>：合入 <code>64678a2b<\/code>（dual-reviewed，2026-09-20）。四件套：<code>backend/app/core/policy_patch.py<\/code>（869 行纯契约层）+ <code>models/policy_patch.py<\/code>（59 行）+ <code>services/policy_patch_service.py<\/code>（889 行）+ 迁移 a05_20260919。R2 CHANGES→返修（scope 三面+审计 append-only+FOR UPDATE）→delta PASS+R1 PASS；<strong>REPORT.md 入库但两份 review receipt 未入库<\/strong>（见 §A.0 形态说明）。<\/p>\n<p><strong>「边界」实际由什么保证（卡面灵魂，本次逐条开文件亲证）——五层硬约束面<\/strong>：<\/p>\n<ol>\n<li><strong>六面白名单封闭<\/strong>（<code>POLICY_PATCH_SURFACES<\/code>，冻结）：granularity/clarification/explanation/intervention_preference/proactive_cadence/allocation_preference <strong>恰好六面<\/strong>，精确集+sha256 被契约测试双钉；surface 不在集合→<code>V1.surface_not_whitelisted<\/code> 拒绝（fail-closed）。「改 prompt/改代码/改模型参数」没有合法 surface 名，<strong>走不到任何写路径<\/strong>（模块 docstring 原文：「提示词边界不是边界……本模块把可塑性面也做成代码边界」；变异守卫：放开白名单必红）。<\/li>\n<li><strong>payload 封闭<\/strong>：每面独立键集+值域（<code>SURFACE_PAYLOAD_SCHEMAS<\/code> 冻结）——未知键 <code>V2.payload_field_unknown<\/code>、词表外值 <code>V3.payload_value_out_of_vocabulary<\/code>，无静默修正。<\/li>\n<li><strong>patch 是决策输入不是代码<\/strong>：六面消费契约全部是确定性投影——3 面进 A-02 提名重排、allocation_preference 进 X-02 因子（<code>AllocationFactors.user_preference<\/code> 既有入参，不绕过 A-04 联合约束层）、proactive_cadence 进主动门因子、explanation 进解释参数化。<\/li>\n<li><strong>生命周期状态机封闭<\/strong>：candidate→evidenced→active→expired/revoked（+rejected 终态），非法迁移 <code>T6.illegal_transition<\/code> 拒绝；revoked 即时生效+版本立即 bump，复活需新 patch（M-01 supersede 哲学）。<\/li>\n<li><strong>证据门只认真源<\/strong>：evidence_refs 封闭 scheme <code>memory://experience/&lt;id&gt;<\/code>（M-06）与 <code>decision://aurora_&lt;32hex&gt;<\/code>（A-01/D-05）；方向敏感（prefer 需正向共同出现证据、demote 需负向）；档位真源=D-05 <code>association_evidence_tier<\/code>，消费 M-06 <code>completeness_adjusted_strength<\/code> 保守值；single_observation 需用户 confirm，≥repeated 才可自动激活。<\/li>\n<\/ol>\n<p><strong>策略版本与缓存正确性（卡面 Work 3）<\/strong>：<code>compute_policy_patch_version<\/code> 内容寻址 <code>polpatch_&lt;sha256[:16]&gt;<\/code>，active 集任一变化版本必变；<code>context_cache_key.py:89<\/code> 亲证消费 PolicyPatchService——策略版本进缓存键，bump 即失效。归因：<code>applied_patch_ids<\/code> 走与 situation_patches 同一 <code>scope_matches<\/code> 谓词（FIX-67 修，FIXED@<code>7244efb2<\/code>——修前归因面曾用全量 effective patches 过报）。<\/p>\n<p><strong>生产接线实证<\/strong>：WIRING-1 <code>7c6cb867<\/code>——patched_decision_inputs 真实进决策环，<strong>prefer-patch 翻转 practice→explain e2e 实录<\/strong>（FIX-34 FIXED@同 commit）；测试现值契约 30 + 服务 39 + 迁移 sqlite 3 = 72 函数。下游消费：A-08 评估 harness 以 A-05 patch 证据门为四臂驱动面之一；D-08 数据飞轮（<code>46762b31<\/code>）复用同门实证「反馈→未来行为真实变化」14 条链。<\/p>\n<p><strong>残差<\/strong>：FIX-31 P3 子项（inputs 缓存 120s TTL 陈旧/进程级缓存单进程契约/is_effective 边界）已随 D-05 增量批收口（FIXED@49d81fb2 复验口径）；patch 面的用户直接可见管理 UI 未见交付（V3 的 patch 由引擎证据门驱动，用户面只有「纠正可撤销」语义——V4 若做个性化设置面板，这里是现成后端+缺前端）。<\/p>\n<p><strong>一句话用户可见行为<\/strong>：用户的纠正与结果反馈能在<strong>白名单六面<\/strong>内改变后续 AI 行为（如解释详略、主动频率），且撤销立即生效；AI 永远不能借 patch 改系统提示词或代码。<\/p>\n<h3>A-06 · Aurora &quot;Why this?&quot; / Calibration Receipt<\/h3>\n<p><strong>交付（两波）<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>波次<\/th>\n<th>主干 SHA<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>wt311 机制面<\/td>\n<td><code>d8a89bec<\/code>（2026-09-24）<\/td>\n<td><code>aurora/calibration_receipt.py<\/code>（323 行，pure frozen-v1）：4 动作封闭词表+authority-delegation map+uncertainty 标签覆盖 AURORA_UNCERTAINTY_KINDS+呈现门 hidden/ambient/surfaced+3/day 预算；<strong>降档只降强度、绝不吞纠正<\/strong>。<code>api/v1/aurora_receipts.py<\/code>（111 行，POST /aurora/receipts/respond）+<code>services/aurora_receipt_service.py<\/code>（146 行）——<strong>四动作全部委托既有权威<\/strong>：not_relevant→M-06 denied 飞轮、wrong(带内容)→M-01 supersede、wrong(无内容)→降置信、change_scope→scope pause、delete→M-07 撤销链；<strong>零新写路径零新表零新迁移<\/strong>。response_builder 接线（rationale 组成摘要+GraphRAG 真实 refs+uncertainties，Redis 日计数 fail-open）。mobile：独立 AuroraReceiptApiService+aurora_receipt_chip（235 行）+CoT 红线 STRUCTURAL（decision-ring 代码不可进入模块数据流，测试双钉 JSON 无内部码）。32 backend+7 widget 绿<\/td>\n<\/tr>\n<tr>\n<td>wt388 旅程级验收锁<\/td>\n<td><code>b9bc60ae<\/code>（2026-09-2x）<\/td>\n<td>test_a06_gj08_calibration_journey.py（16 个测试函数，交付注记 17 用例）：①<strong>receipt↔真实 Context 一致正测<\/strong>（经 ResponseBuilderMixin 真实装配路径，refs⊆该用户 Context 行且内容一致）；②<strong>编造 ref 必败负测<\/strong>（随机 UUID 四动作必败+HTTP 404 与越权同形态无存在性泄漏）；③GJ08 四路纠偏→下一轮适配链（change_scope/delete→召回真源排除；supersede→旧内容不再召回新内容可引用；not_relevant/wrong→降噪 0.65→0.55→下轮回执升格 uncertain——<strong>被纠正后能变<\/strong>）；④按需展开三态（未自然引用→hidden 无回执；全高置信→ambient；不确定→surfaced）；⑤CoT 硬红线负测（reasoning 脏字段经 gRPC 同款编码零泄露）。<strong>变异实验 5 组全部拦截<\/strong>（摘除召回排除→红/阈值改动→红/去 user_id→越权红）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>数据流真实性核验（本次亲证代码链）<\/strong>：<code>response_builder.py:273<\/code> 从检索面取 <code>retrieval[&quot;context_receipt&quot;][&quot;used_names&quot;]<\/code>（真实 GraphRAG 检索的引用记录）→ <code>:300<\/code> <code>_build_memory_reference_receipt<\/code> → <code>:345<\/code> <code>build_calibration_receipt<\/code>（纯模块装配 rationale 摘要+refs+uncertainties，呈现门+日预算）→ chat 响应 metadata 附带 receipt → 用户点四动作 → <code>/aurora/receipts/respond<\/code>（404 无存在性泄漏/409 非 ACTIVE/422 词表外）→ 委托权威真源生效 → wt388 钉死的「下一轮适配」链可观测。<strong>结论：A-06 的数据流是真实检索驱动的，不是模板回显<\/strong>；「receipt 与真实 Context 一致」有变异实验级测试锁。<\/p>\n<p><strong>验证证据<\/strong>：test_a06_calibration_receipt 23 + test_a06_receipt_respond 13 + GJ08 旅程 16 = <strong>52 测试函数<\/strong>（本次逐文件计数）；HTTP 入口面 200/404/422/409 全谱；v3-output/WT311-A06/REPORT.md 在库（receipt 文件缺，形态说明见 §A.0）。<\/p>\n<p><strong>残差<\/strong>：wt388 DEFERRED「定向 widget 真跑」（free swap 837M&lt;1.2G 门，补跑命令在 REPORT）——widget 测试文件已入库，现由 CI flutter 面覆盖；卡片「避免每条回复都强制展示历史」以 3/day 预算+hidden/ambient 三态兑现，但收据在真实对话中的自然出现率（用户实际多久能看到一次 why-this）无运行级统计（unknown）。<\/p>\n<p><strong>一句话用户可见行为<\/strong>：AI 推荐旁边有「为什么是这条」收据；用户可以就任意一条记忆引用直接「不相关/说错了/改范围/删掉」，且被纠正后下一轮对话真实改变。<\/p>\n<h3>A-07 · Comeback + Low-stimulation Relationship Policies<\/h3>\n<p><strong>交付<\/strong>：合入 <code>9ce23e55<\/code>（wt362，2026-09-25）+ mypy 收口 <code>fe947483<\/code> + 交付物入库 <code>16d7583d<\/code>。三块：①<strong>回来恢复目标状态而非模板问候<\/strong>——comeback payload 新增 goal_state 读侧真源投影（Goal 标题/status/诚实进度 completed/total 含冻结 0，零写库）+ComebackBanner 目标状态行；②<strong>陈旧任务守卫 3/7/14-day clock<\/strong>——plan_expired/next_task_overdue_days/stale_focus 入 payload，checkpoint_debrief 与 personalized_return 文案诚实化（计划窗口已结束不再宣称「还来得及/收尾窗口」，改如实呈报+指向重新校准 replan 端点）；3 天阈值触发+焦点逾期≥3 天标记 stale，<strong>红测=goal_state 缺失/陈旧伪装当前即红+变异实验实证拦截力<\/strong>；③<strong>low-stimulation 关系策略<\/strong>——<code>aurora_stimulation_mode<\/code>（auto/low/standard）显式偏好入 AuroraUserPreferencesService+PUT /aurora/preferences，<code>stimulation_policy<\/code> 模块（explicit low→主动 nudge 不推送仅入通知中心+重复抑制 24h→72h+标题去敦促化；explicit standard→行为零变化；<strong>绝不心理诊断<\/strong>）；移动端三选档经 EmotionStateNotifier.setMode 同步引擎。测试：引擎定向 23（comeback 13+stimulation 7+nudge 3，本次计数一致）；flutter 定向交付时 DEFERRED（swap 门三次实测）——测试文件全部入库，现由 CI flutter 面覆盖。<\/p>\n<p><strong>下游协同（亲证）<\/strong>：P-06（<code>05cc6328<\/code>）统一通知设置以 <code>aurora_stimulation_mode<\/code> 为真源之一做低刺激交集语义（quiet 窗两端外扩 60min+cap 3→2）；U-02（<code>22f99776<\/code>）低刺激视觉/动效档与 A-07 引擎档分属两层（<strong>解锁 A-07→A-08 全线的卡<\/strong>）；J-07（wt385）复用本卡 payload 三块并补齐 ComebackContextResponse 模型（见 J 线章）。<\/p>\n<p><strong>残差<\/strong>：①<strong>FIX-48 OPEN（待产品拍板）<\/strong>——P-05 纵向评估反例：A-07 的 stale 诚实文案生效但过期计划（非完成）的建议投放不停（最坏 persona 14 天收 14 条、dismiss 4 次仍每日一条，唯一有效停运杆是 mute）——「低刺激」与「主动面打扰」的权衡缺产品裁决；②「低刺激截图/interaction 通过」验收以 U-02 的 9 widget 两档真实差异测试+CI 覆盖兑现，实机截图走查转 HUMAN_INBOX。<\/p>\n<p><strong>一句话用户可见行为<\/strong>：离开几天回来，看到的是自己目标的真实进度和「计划窗口已结束、重新校准」的诚实建议，而不是「还来得及！」的敦促模板；开了低刺激档后主动推送安静下来。<\/p>\n<h3>A-08 · Aurora Longitudinal / Ablation Evaluation<\/h3>\n<p><strong>交付（主卡 + 行为修复组 + 飞轮复用，三轮主干在案）<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>轮次<\/th>\n<th>主干 SHA<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>wt393 主卡<\/td>\n<td><code>2d2336ea<\/code>（2026-09-25）<\/td>\n<td>消融 harness 四文件（engine 701/metrics 378/persona 419/world 363，<code>backend/tests/aurora_ablation/<\/code>）+ 契约锁 13 测试 + runner <code>scripts/devtools/a08_run_aurora_ablation_eval.py<\/code>（187 行）；产物 <code>v3-output/WT393-A08-ABLATION/<\/code>（REPORT+EVAL_RESULTS+raw/*.jsonl 四臂 348 行+summary.json 3186 行，全部入库）。<strong>10 persona×14 模拟日×20 卡点段+25 对照会话<\/strong>；驱动面=真实 Aurora 服务面（StuckJourneyService+FrictionChatWiringService+D-05 lifecycle+A-05 patch 证据门+StateRegister），sqlite 隔离+fakeredis+backdate 可控时钟，<strong>产品代码零改动<\/strong>；确定性判据为主、模型 judge 0 次；summary 全由 raw 程序化复算（--verify-repro 双跑一致 exit 0）；反例照登回流 V3-FIX-49..52<\/td>\n<\/tr>\n<tr>\n<td>wt412 行为修复组<\/td>\n<td><code>28442a5a<\/code>（2026-09-26）<\/td>\n<td>修 A-08 实锤的 FIX-49/50/51（词牌门/B3 tie 降级/delivery=recommendation 契约）+FIX-59；<strong>A-08 全人口四臂复跑不回退证明<\/strong>，产物 <code>v3-output/WT412-FRICTION-FIXES/a08-post-fix/<\/code>（EVAL_RESULTS+summary.json+raw 入库）<\/td>\n<\/tr>\n<tr>\n<td>D-08 复用<\/td>\n<td><code>46762b31<\/code>（wt397）<\/td>\n<td>A-08 人口/harness 零重建复用做数据飞轮纵向证明：Day0/3/7 双臂配对证实「反馈→未来行为真实变化」14+10 条链，25 条无效个性化照登（含 4 条有害适应），A-05 证据门为被评面之一<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>方法论与数字可信度（本次产物数值级读验）<\/strong>：<\/p>\n<ul>\n<li><strong>可信面<\/strong>：①驱动全部走真实服务面（非脚本重放）；②判据确定性（resolution_requires_match/budget_respected 不变量每臂报告，fixed_arm_zero_engine_calls=true 钉死对照臂零引擎调用）；③效用权重冻结并印在产物头；④summary 由 raw 程序化复算且 --verify-repro 双跑一致——<strong>数字是可复现的<\/strong>；⑤模型 judge 0 次（卡面「不把模型 judge 单独作为结论」超额兑现）。<\/li>\n<li><strong>边界面<\/strong>：人口是 10 个合成 persona（静态时间线，DEFERRED 明示「外推力有限」）；判据是引擎自身冻结契约（评的是「机制按设计收敛」，非真实用户价值）；<strong>无真实 LLM 参与<\/strong>（hermetic 是刻意设计——CI 可跑可复算），「Aurora 比固定模板好」的结论适用于机制层，不构成真模型效用证明。<\/li>\n<li><strong>头条数字的时点（V4 必读）<\/strong>：v0.3 文档引用的「0.65 vs 0.30」是 wt393 修前值。<strong>wt412 行为修复后，入库终态（gate+B3）为 accuracy 0.45/0.55/0.45/0.30（full/no_memory/no_experience/fixed_policy）<\/strong>（a08-post-fix/summary.json 本次读验）；full 效用 -16.2→-9.2（提交信息的 -3.6 是「去除侵入罚项」的 gate-only 分解值，REPORT.md 分解表在案，非终值）；对照侵入率 84%→0。accuracy 0.65→0.45 的回落全部归因为 B3 移除平权偶然蒙对（5 个 journey 幸运段逐一入档）——<strong>full 仍稳定优于 fixed（0.45 vs 0.30），但修后复跑中 no_memory 臂 accuracy 0.55、效用 0.0，双指标高于 full（0.45/-9.2）<\/strong>：在这套模拟人口上，记忆面的净贡献在行为修复后是负向的（与 wt393 原始记录「记忆面净收益 +0.10/+5.2 但含个体伤害反例」方向相反）。这是 V4 设计个性化记忆面时最应直视的一组数字。<\/li>\n<\/ul>\n<p><strong>残差<\/strong>：①FIX-52 OPEN（历史失败痕迹带偏新类型卡点——no_memory 反超 full 的机制成因之一）；②FIX-97 OPEN 待产品拍板（纠正通道饿死）；③「经验面收益未证」（chat-first+错型+同 tag 历史交集未覆盖——DEFERRED 原文），D-08 已部分补证飞轮行为链但效用因果联动仍 reserved；④卡片 Work 1 的「A/B no-memory/no-experience/fixed-policy/full」以四臂兑现 ✅，但「multi-session」的纵向面由 D-08 承接而非本卡独立完成（分工而非缺口）。<\/p>\n<p><strong>一句话用户可见行为<\/strong>：无直接可见行为（评估卡）；它产生了 V3 最重要的自我否定证据（侵入门缺失/B1 平权 tie/记忆双刃），并直接塑造了 A-03 v1_2 与 wiring v2 的现行行为。<\/p>\n<hr />\n<h2>A.3 设计决定与取舍（从提交/审查考古）<\/h2>\n<ol>\n<li><strong>白名单即代码边界（A-05）<\/strong>：卡面「而非改系统 Prompt/代码」没有落在提示词纪律上，而是落在「六面精确集 sha256 双钉+变异必红」——设计立场是「提示词边界不是边界」。代价是个性化表达力被压到六面；收益是「AI 能自己改什么」变成可机器断言的封闭问题。<\/li>\n<li><strong>feasible-set-then-LLM（A-02）<\/strong>：规则先定合法集、LLM 只在集合内选——与 X-02 同构。V3 从不信任 LLM 的动作空间，只信任它的排序与参数化；V4 扩干预目录时这条次序应保持。<\/li>\n<li><strong>契约先行+shadow 锚（A-01）<\/strong>：shadow/live 共享内容寻址 decision_id，把「对比」从 ad-hoc 观测变成键级锚。取舍：V3 期间一次真实 shadow 对比都没跑（机制在库、运行未发生）——契约的完备性跑在了运维采用前面。<\/li>\n<li><strong>确定性优先（A-03/A-04/A-08 一致）<\/strong>：摩擦诊断纯函数零 IO never-raises、联合决策 D1-D4/X1 确定性裁决序、A-08 模型 judge 0 次+程序化复算——A 线的「智能」面全部做成可复现的规则层，LLM 只在授权的推导/起草点（J-04/J-06）出场。「不把模型 judge 单独作为结论」不是口号是结构。<\/li>\n<li><strong>反例照登+回流修（A-08 教义）<\/strong>：评估卡交付时同时登记 FIX-49..52 四条自家缺陷（含「无门全量触发 100% 侵入」这种丢脸数字），随后 wt412 修复并复跑不回退证明——<strong>V3 的评估卡的价值标准是「找出自己的边界」而非「证明自己好」<\/strong>。V4 的 eval 卡应沿用此验收形态。<\/li>\n<li><strong>证据门消费真源而非自报（A-05）<\/strong>：patch 激活的证据只认 M-06 投影行与 D-05 关联行，方向敏感（prefer/demote 分向）、档位保守（截断降档后取值）——「Aurora 从 outcome 学习」的每一步都可溯源到真实记录。<\/li>\n<li><strong>呈现预算与降档不吞纠正（A-06）<\/strong>：3/day 预算+hidden/ambient/surfaced 三态解决「理解收据」的打扰问题；「降档只降强度、绝不吞纠正」保证可纠正性不被省电策略牺牲。<\/li>\n<li><strong>诚实性取舍<\/strong>：A-07 宁可把「还来得及」全删改成如实呈报（被打扰问题转到 FIX-48 待拍板），A-03 宁可 no_action 饿死纠正通道（FIX-97 待拍板）也不回退到猜测——两处 OPEN 都是「诚实与体验的权衡被显式留给产品」，V4 应作为设计议题接手而非当 bug 修。<\/li>\n<\/ol>\n<hr />\n<h2>A.4 残差与 V4 注意点（汇总）<\/h2>\n<ol>\n<li><strong>A-08 终态数字与文档口径<\/strong>：引用消融结论时以 a08-post-fix/summary.json 终态为准（full 0.45/-9.2 vs fixed 0.30/-24.8，no_memory 0.55/0.0 反超 full）；v0.3 文档的「0.65 vs 0.30」是 wt412 修前值。在模拟人口上「记忆面净贡献为负」是现行最硬的自我认知，V4 做记忆/个性化设计时应从这里出发（结合 M 线 M-09 缺陷发现器叙事）。<\/li>\n<li><strong>两个 OPEN 的产品裁决<\/strong>：FIX-97（无行动出口的第二纠正入口形态——诚实 no_action 让「不是这个原因」纠正通道饿死）与 FIX-48（低刺激与主动打扰的权衡、过期计划建议衰减）——都是「诚实边界与体验的冲突」，需产品拍板而非机械修。<\/li>\n<li><strong>两个 OPEN 的三态治理缺口<\/strong>：FIX-500（AURORA_DEFAULT_MODE 零读者）/FIX-501（5 个 metacog proxy 绕开 kill switch 核心）——A-01 的治理面有两处声明与行为脱节，wt765 已登记待修。<\/li>\n<li><strong>shadow/live 对比从未真实运行<\/strong>：机制齐备（decision_id 锚+divergence 计数器+cohort 治理链），运行记录为零。V4 若做 Aurora 灰度/迁移，第一张卡应是「真跑一次 shadow 对比」。<\/li>\n<li><strong>真模型效用层整体缺位<\/strong>：A-08 四臂是确定性服务面模拟（hermetic 刻意设计）；「Aurora 干预在真实 LLM 用户上的效用」与 A-02「LLM 在合法集内的选择质量」都没有真模型数据。V4 若要证明个性化价值，A-08 harness 换真模型驱动是现成起点（同 C-08 context_eval 的复用逻辑）。<\/li>\n<li><strong>A 线核心测试面<\/strong>：本次逐文件计数 16 个 A 线主测试文件 355 个测试函数，加 friction_chat_wiring 45 与 A-06 收据 52，A 线轨道合计约 452 个测试函数（不含迁移/邻域）。<\/li>\n<li><strong>审查 receipt 文件化缺口（形态残差）<\/strong>：A-03 起 receipt 以 commit message 承载（wt759 判合规、台账无断链指针）；追溯成本高，V4 若要求文件化按 FIX-502 三选一同构处理。<\/li>\n<\/ol>\n<hr />\n<h2>A.5 本次审查登记<\/h2>\n<ul>\n<li><strong>零新登记<\/strong>。本次深挖复核过的候选发现均判定不构成台账级新账：①A-03/A-04 无 v3-output 目录、A-05 双审 receipt 未入库——属 wt759 已裁决合规的「commit 内签收」形态且台账零断链指针（区别于 M/X 线 FIX-502 的指针腐烂），按 wt769 C 线先例作形态残差记录；②「0.65 vs 0.30」时点漂移——两轮数字均诚实入库（a08-post-fix 产物在主干），属文档引用口径问题，本文件 §A.4-1 已给终态口径，随章并入 v0.4 即修正；③J-01 机会图未处置项归 J 线章（见 J-line.md §J.4-2）。<\/li>\n<li>号占用核验：505 起空闲——<code>grep -rn &quot;V3-FIX-50[5-9]|V3-FIX-5[1-9][0-9]&quot; v3/ v3-output/ docs/ backend/<\/code> 零命中（499=wt767、500/501=wt765、502/503=wt770、504=wt769 均已占用）。<\/li>\n<li>A 线相关 FIX 全链状态复核：FIX-30 备忘在案｜FIX-31 FIXED@49d81fb2｜FIX-33/34/43 FIXED@7c6cb867｜FIX-49/50/51/59 FIXED@28442a5a｜FIX-52 OPEN｜FIX-67 FIXED@7244efb2｜FIX-97 OPEN 待拍板｜FIX-110/111/115 FIXED@8541ddde｜FIX-142 FIXED@4e8b226b｜FIX-48 OPEN 待拍板｜FIX-500/501 OPEN（wt765 登记）。<\/li>\n<\/ul>\n", "text": "# A 线（Aurora 8 卡）深挖章节 —— V4 交接文档素材（wt774）\n\n> 本文是 `v3/V3-COMPLETE-STATUS-FOR-V4.md` §4「各线深度状态」A 线章节的深挖草稿。\n> 证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n> 撰写：wt774（2026-09-28，基线 main@5307cbb3）。方法：卡面（v3/07_tasks/cards/A-0*.md）+ `git log --grep` 逐卡定位 → 当前主干代码存在性与消费方开文件核实（policy_patch 白名单面/response_builder 收据装配/kill switch 三态逐处亲证）→ 测试文件逐个 `def test_` 计数 → v3-output REPORT/receipt 抽读 → 台账闭环逐条复核 → A-08 两轮 ablation 产物（raw jsonl/summary.json）数值级读验。**未轻信任何台账/报告结论性文字。**\n\n---\n\n## A.0 线级概览\n\nA 线把「Aurora 从元数据 sidecar 升级为显式控制决策」做成八层工程：决策契约（A-01）→ 干预目录与策略引擎（A-02）→ 摩擦诊断与单问（A-03）→ Human/Agent/Hybrid 联合决策（A-04）→ 有界策略补丁（A-05）→ Why-this 收据（A-06）→ 回访/低刺激关系策略（A-07）→ 纵向/消融评估（A-08）。8/8 全部 ionDecision.to_dict 缺 annotations/7 个待落投影点）——「均不阻塞」自登记，与执行面投影点接线同批处理，V4 做执行面深化时应先读该行。\n\n**一句话用户可见行为**：用户在学习类任务上永远不会被 AI 自动代执行高风险步骤；AI 建议的执行权分配可从 decision log 溯源。\n\n### A-05 · Bounded Policy Patches / Adaptive Preferences\n\n**交付**：合入 `64678a2b`（dual-reviewed，2026-09-20）。四件套：`backend/app/core/policy_patch.py`（869 行纯契约层）+ `models/policy_patch.py`（59 行）+ `services/policy_patch_service.py`（889 行）+ 迁移 a05_20260919。R2 CHANGES→返修（scope 三面+审计 append-only+FOR UPDATE）→delta PASS+R1 PASS；**REPORT.md 入库但两份 review receipt 未入库**（见 §A.0 形态说明）。\n\n**「边界」实际由什么保证（卡面灵魂，本次逐条开文件亲证）——五层硬约束面**：\n\n1. **六面白名单封闭**（`POLICY_PATCH_SURFACES`，冻结）：granularity/clarification/explanation/intervention_preference/proactive_cadence/allocation_preference **恰好六面**，精确集+sha256 被契约测试双钉；surface 不在集合→`V1.surface_not_whitelisted` 拒绝（fail-closed）。「改 prompt/改代码/改模型参数」没有合法 surface 名，**走不到任何写路径**（模块 docstring 原文：「提示词边界不是边界……本模块把可塑性面也做成代码边界」；变异守卫：放开白名单必红）。\n2. **payload 封闭**：每面独立键集+值域（`SURFACE_PAYLOAD_SCHEMAS` 冻结）——未知键 `V2.payload_field_unknown`、词表外值 `V3.payload_value_out_of_vocabulary`，无静默修正。\n3. **patch 是决策输入不是代码**：六面消费契约全部是确定性投影——3 面进 A-02 提名重排、allocation_preference 进 X-02 因子（`AllocationFactors.user_preference` 既有入参，不绕过 A-04 联合约束层）、proactive_cadence 进主动门因子、explanation 进解释参数化。\n4. **生命周期状态机封闭**：candidate→evidenced→active→expired/revoked（+rejected 终态），非法迁移 `T6.illegal_transition` 拒绝；revoked 即时生效+版本立即 bump，复活需新 patch（M-01 supersede 哲学）。\n5. **证据门只认真源**：evidence_refs 封闭 scheme `memory://experience/<id>`（M-06）与 `decision://aurora_<32hex>`（A-01/D-05）；方向敏感（prefer 需正向共同出现证据、demote 需负向）；档位真源=D-05 `association_evidence_tier`，消费 M-06 `completeness_adjusted_strength` 保守值；single_observation 需用户 confirm，≥repeated 才可自动激活。\n\n**策略版本与缓存正确性（卡面 Work 3）**：`compute_policy_patch_version` 内容寻址 `polpatch_<sha256[:16]>`，active 集任一变化版本必变；`context_cache_key.py:89` 亲证消费 PolicyPatchService——策略版本进缓存键，bump 即失效。归因：`applied_patch_ids` 走与 situation_patches 同一 `scope_matches` 谓词（FIX-67 修，FIXED@`7244efb2`——修前归因面曾用全量 effective patches 过报）。\n\n**生 X-48 OPEN（待产品拍板）**——P-05 纵向评估反例：A-07 的 stale 诚实文案生效但过期计划（非完成）的建议投放不停（最坏 persona 14 天收 14 条、dismiss 4 次仍每日一条，唯一有效停运杆是 mute）——「低刺激」与「主动面打扰」的权衡缺产品裁决；②「低刺激截图/interaction 通过」验收以 U-02 的 9 widget 两档真实差异测试+CI 覆盖兑现，实机截图走查转 HUMAN_INBOX。\n\n**一句话用户可见行为**：离开几天回来，看到的是自己目标的真实进度和「计划窗口已结束、重新校准」的诚实建议，而不是「还来得及！」的敦促模板；开了低刺激档后主动推送安静下来。\n\n### A-08 · Aurora Longitudinal / Ablation Evaluation\n\n**交付（主卡 + 行为修复组 + 飞轮复用，三轮主干在案）**：\n\n| 轮次 | 主干 SHA | 内容 |\n|---|---|---|\n| wt393 主卡 | `2d2336ea`（2026-09-25） | 消融 harness 四文件（engine 701/metrics 378/persona 419/world 363，`backend/tests/aurora_ablation/`）+ 契约锁 13 测试 + runner `scripts/devtools/a08_run_aurora_ablation_eval.py`（187 行）；产物 `v3-output/WT393-A08-ABLATION/`（REPORT+EVAL_RESULTS+raw/*.jsonl 四臂 348 行+summary.json 3186 行，全部入库）。**10 persona×14 模拟日×20 卡点段+25 对照会话**；驱动面=真实 Aurora 服务面（StuckJourneyService+FrictionChatWiringService+D-05 lifecycle+A-05 patch 证据门+StateRegister），sqlite 隔离+fakeredis+backdate 可控时钟，**产品代码零改动**；确定性判据为主、模型 judge 0 次；summary 全由 raw 程序化复算（--verify-repro 双跑一致 exit 0）；反例照登回流 V3-FIX-49..52 |\n| wt412 行为修复组 | `28442a5a`（2026-09-26） | 修 A-08 实锤的 FIX-49/50/51（词牌门/B3 tie 降级/delivery=recommendation 契约）+FIX-59；**A-08 全人口四臂复跑不回退证明**，产物 `v3-output/WT412-FRICTION-FIXES/a08-post-fix/`（EVAL_RESULTS+summary.json+raw 入库） |\n| D-08 复用 | `46762b31`（wt397） | A-08 人口/harness 零重建复用做数据飞轮纵向证明：Day0/3/7 双臂配对证实「反馈→未来行为真实变化」14+10 条链，25 条无效个性化照登（含 4 条有害适应），A-05 证据门为被评面之一 |\n\n**方法论与数字可信度（本次产物数值级读验）**：\n- **可信面**：①驱动全部走真实服务面（非脚本重放）；②判据确定性（resolution_requires_match/budget_respected 不变量每臂报告，fixed_arm_zero_engine_calls=true 钉死对照臂零引擎调用）；③效用权重冻结并印在产物头；④summary 由 raw 程序化复算且 --verify-repro 双跑一致——**数字是可复现的**；⑤模型 judge 0 次（卡面「不把模型 judge 单独作为结论」超额兑现）。\n- **边界面**：人口是 10 个合成 persona（静态时间线，DEFERRED 明示「外推力有限」）；判据是引擎自身冻结契约（评的是「机制按设计收敛」，非真实用户价值）；**无真实 LLM 参与**（hermetic 是刻意设计——CI 可跑可复算），「Aurora 比固定模板好」的结论适用于机制层，不构成真模型效用证明。\n- **头条数字的时点（V4 必读）**：v0.3 文档引用的「0.65 vs 0.30」是 wt393 修前值。**wt412 行为修复后，入库终态（gate+B3）为 accuracy 0.45/0.55/0.45/0.30（full/no_memory/no_experience/fixed_policy）**（a08-post-fix/summary.json 本次读验）；full 效用 -16.2→-9.2（提交信息的 -3.6 是「去除侵入罚项」的 gate-only 分解值，REPORT.md 分解表在案，非终值）；对照侵入率 84%→0。accuracy 0.65→0.45 的回落全部归因为 B3 移除平权偶然蒙对（5 个 journey 幸运段逐一入档）——**full 仍稳定优于 fixed（0.45 vs 0.30），但修后复跑中 no_memory 臂 accuracy 0.55、效用 0.0，双指标高于 full（0.45/-9.2）**：在这套模拟人口上，记忆面的净贡献在行为修复后是负向的（与 wt393 原始记录「记忆面净收益 +0.10/+5.2 但含个体伤害反例」方向相反）。这是 V4 设计个性化记忆面时最应直视的一组数字。\n\n**残差**：①FIX-52 OPEN（历史失败痕迹带偏新类型卡点——no_memory 反超 full 的机制成因之一）；②FIX-97 OPEN 待产品拍板（纠正通道饿死）；③「经验面收益未证」（chat-first+错型+同 tag 历史交集未覆盖——DEFERRED 原文），D-08 已部分补证飞轮行为链但效用因果联动仍 reserved；④卡片 Work 1 的「A/B no-memory/no-experience/fixed-policy/full」以四臂兑现 ✅，但「multi-session」的纵向面由 D-08 承接而非本卡独立完成（分工而非缺口）。\n\n**一句话用户可见行为**：无直接可见行为（评估卡）；它产生了 V3 最重要的自我否定证据（侵入门缺失/B1 平权 tie/记忆双刃），并直接塑造了 A-03 v1_2 与 wiring v2 的现行行为。\n\n---\n\n## A.3 设计决定与取舍（从提交/审查考古）\n\n1. **白名单即代码边界（A-05）**：卡面「而非改系统 Prompt/代码」没有落在提示词纪律上，而是落在「六面精确集 sha256 双钉+变异必红」——设计立场是「提示词边界不是边界」。代价是个性化表达力被压到六面；收益是「AI 能自己改什么」变成可机器断言的封闭问题。\n2. **feasible-set-then-LLM（A-02）**：规则先定合法集、LLM 只在集合内选——与 X-02 同构。V3 从不信任 LLM 的动作空间，只信任它的排序与参数化；V4 扩干预目录时这条次序应保持。\n3. **契约先行+shadow 锚（A-01）**：shadow/live 共享内容寻址 decision_id，把「对比」从 ad-hoc 观测变成键级锚。取舍：V3 期间一次真实 shadow 对比都没跑（机制在库、运行未发生）——契约的完备性跑在了运维采用前面。\n4. **确定性优先（A-03/A-04/A-08 一致）**：摩擦诊断纯函数零 IO never-raises、联合决策 D1-D4/X1 确定性裁决序、A-08 模型 judge 0 次+程序化复算——A 线的「智能」面全部做成可复现的规则层，LLM 只在授权的推导/起草点（J-04/J-06）出场。「不把模型 judge 单独作为结论」不是口号是结构。\n5. **反例照登+回流修（A-08 教义）**：评估卡交付时同时登记 FIX-49..52 四条自家缺陷（含「无门全量触发 100% 侵入」这种丢脸数字），随后 wt412 修复并复跑不回退证明——**V3 的评估卡的价值标准是「找出自己的边界」而非「证明自己好」**。V4 的 eval 卡应沿用此验收形态。\n6. **证据门消费真源而非自报（A-05）**：patch 激活的证据只认 M-06 投影行与 D-05 关联行，方向敏感（prefer/demote 分向）、档位保守（截断降档后取值）——「Aurora 从 outcome 学习」的每一步都可溯源到真实记录。\n7. **呈现预算与降档不吞纠正（A-06）**：3/day 预算+hidden/ambient/surfaced 三态解决「理解收据」的打扰问题；「降档只降强度、绝不吞纠正」保证可纠正性不被省电策略牺牲。\n8. **诚实性取舍**：A-07 宁可把「还来得及」全删改成如实呈报（被打扰问题转到 FIX-48 待拍板），A-03 宁可 no_action 饿死纠正通道（FIX-97 待拍板）也不回退到猜测——两处 OPEN 都是「诚实与体验的权衡被显式留给产品」，V4 应作为设计议题接手而非当 bug 修。\n\n---\n\n## A.4 残差与 V4 注意点（汇总）\n\n1. **A-08 终态数字与文档口径**：引用消融结论时以 a08-post-fix/summary.json 终态为准（full 0.45/-9.2 vs fixed 0.30/-24.8，no_memory 0.55/0.0 反超 full）；v0.3 文档的「0.65 vs 0.30」是 wt412 修前值。在模拟人口上「记忆面净贡献为负」是现行最硬的自我认知，V4 做记忆/个性化设计时应从这里出发（结合 M 线 M-09 缺陷发现器叙事）。\n2. **两个 OPEN 的产品裁决**：FIX-97（无行动出口的第二纠正入口形态——诚实 no_action 让「不是这个原因」纠正通道饿死）与 FIX-48（低刺激与主动打扰的权衡、过期计划建议衰减）——都是「诚实边界与体验的冲突」，需产品拍板而非机械修。\n3. **两个 OPEN 的三态治理缺口**：FIX-500（AURORA_DEFAULT_MODE 零读者）/FIX-501（5 个 metacog proxy 绕开 kill switch 核心）——A-01 的治理面有两处声明与行为脱节，wt765 已登记待修。\n4. **shadow/live 对比从未真实运行**：机制齐备（decision_id 锚+divergence 计数器+cohort 治理链），运行记录为零。V4 若做 Aurora 灰度/迁移，第一张卡应是「真跑一次 shadow 对比」。\n5. **真模型效用层整体缺位**：A-08 四臂是确定性服务面模拟（hermetic 刻意设计）；「Aurora 干预在真实 LLM 用户上的效用」与 A-02「LLM 在合法集内的选择质量」都没有真模型数据。V4 若要证明个性化价值，A-08 harness 换真模型驱动是现成起点（同 C-08 context_eval 的复用逻辑）。\n6. **A 线核心测试面**：本次逐文件计数 16 个 A 线主测试文件 355 个测试函数，加 friction_chat_wiring 45 与 A-06 收据 52，A 线轨道合计约 452 个测试函数（不含迁移/邻域）。\n7. **审查 receipt 文件化缺口（形态残差）**：A-03 起 receipt 以 commit message 承载（wt759 判合规、台账无断链指针）；追溯成本高，V4 若要求文件化按 FIX-502 三选一同构处理。\n\n---\n\n## A.5 本次审查登记\n\n- **零新登记**。本次深挖复核过的候选发现均判定不构成台账级新账：①A-03/A-04 无 v3-output 目录、A-05 双审 receipt 未入库——属 wt759 已裁决合规的「commit 内签收」形态且台账零断链指针（区别于 M/X 线 FIX-502 的指针腐烂），按 wt769 C 线先例作形态残差记录；②「0.65 vs 0.30」时点漂移——两轮数字均诚实入库（a08-post-fix 产物在主干），属文档引用口径问题，本文件 §A.4-1 已给终态口径，随章并入 v0.4 即修正；③J-01 机会图未处置项归 J 线章（见 J-line.md §J.4-2）。\n- 号占用核验：505 起空闲——`grep -rn \"V3-FIX-50[5-9]|V3-FIX-5[1-9][0-9]\" v3/ v3-output/ docs/ backend/` 零命中（499=wt767、500/501=wt765、502/503=wt770、504=wt769 均已占用）。\n- A 线相关 FIX 全链状态复核：FIX-30 备忘在案｜FIX-31 FIXED@49d81fb2｜FIX-33/34/43 FIXED@7c6cb867｜FIX-49/50/51/59 FIXED@28442a5a｜FIX-52 OPEN｜FIX-67 FIXED@7244efb2｜FIX-97 OPEN 待拍板｜FIX-110/111/115 FIXED@8541ddde｜FIX-142 FIXED@4e8b226b｜FIX-48 OPEN 待拍板｜FIX-500/501 OPEN（wt765 登记）。\n"}, {"id": "00_context/source_notes/S11_M-line.md", "title": "M 线（Memory，10 卡）深挖章 —— V3-COMPLETE-STATUS-FOR-V4 §4 素材", "group": "原始报告副本", "html": "<h1>M 线（Memory，10 卡）深挖章 —— V3-COMPLETE-STATUS-FOR-V4 §4 素材<\/h1>\n<blockquote>\n<p>作者：wt770（文档深挖）｜基线：main@ce9846a3（2026-09-28）｜方法：卡面 + <code>git log --grep<\/code> 逐卡定位 → 读现势代码核实 → 目标测试在 worktree 实跑 → REPORT/REVIEW_RECEIPT/FIX 台账抽读。\n<strong>本章事实判据<\/strong>：所有 SHA 均已在 main 可达（<code>git show<\/code> 亲验）；运行级证据 = 本 worktree 实跑（见 §2.0）；推断/待验证项显式标注「推测」。\n本轮新登记：<strong>V3-FIX-502<\/strong>（M/X 线卡级 receipt 断链）、<strong>V3-FIX-503<\/strong>（M-09 真模型复验承诺未兑现），见 §5。<\/p>\n<\/blockquote>\n<h2>0. 逐卡验证口径（本章通用）<\/h2>\n<ul>\n<li><strong>实跑验证（2026-09-28，worktree wt770-docmx = main HEAD）<\/strong>：M 线核心测试 273 用例全绿——\n<code>test_memory_epistemic_contract + test_memory_invalidation_pipeline + test_memory_storage_gate + test_memory_retrieval_prefilter + test_memory_use_selfcheck<\/code> = 183 passed；\n<code>tests/memory_eval/test_memory_eval_gate + test_memory_provenance_api + test_experience_memory_contract + test_experience_memory_projector<\/code> = 90 passed（18.9s，sqlite in-memory，零 LLM）。<\/li>\n<li><strong>评审证据形态<\/strong>：M-01..M-07、M-10 有入库 receipt/REPORT；<strong>M-06/M-08/M-09 的 receipt 原件未入库<\/strong>（评审结论在 commit message 内，经 wt759 三源核验）→ 已登记 V3-FIX-502。<\/li>\n<li>tasks.json 20 张卡 status=done（wt759 核正 8d4291aa 落库），fleet done 名单 20/20 在册。<\/li>\n<\/ul>\n<h2>1. 意图（卡面提炼）<\/h2>\n<p>M 线 10 卡（MEMORY stream，V3-2~V3-4 门）要回答一个问题：<strong>系统对用户的「理解」如何做到正确、可纠正、可删除、可信任<\/strong>。设计骨架（MEMORY_V3.md / USER_WORLD_MODEL.md）：<\/p>\n<ol>\n<li><strong>认识论分型<\/strong>：每条记忆可归入 FACT / CONFIRMED_PREFERENCE / OBSERVATION / HYPOTHESIS / EXPERIENCE 五型之一，且可指出 source/scope/status（M-01）；<strong>推断永远不能覆盖用户陈述的事实<\/strong>（M-01 红线）。<\/li>\n<li><strong>该不该记<\/strong>：写入前用规则+快速语义门判定 store/current_state/event/ignore/confirm，瞬态（「今天下午3点有课」）不得默认长期化（M-02）。<\/li>\n<li><strong>该不该用<\/strong>：检索在 LLM 之前用确定性规则预筛（wrong-user/revoked/expired 在语义检索前为 0，M-03）；合法召回后再判断「该不该说出来」（over-personalization ≤5% 目标，M-05）。<\/li>\n<li><strong>冲突仲裁<\/strong>：多来源/多时间证据显式仲裁，explicit correction 胜过旧 inference，scope 不同可共存，高增益不确定时出澄清而非静默选（M-04）。<\/li>\n<li><strong>经验投影<\/strong>：从真实 intervention→outcome 投影「何种帮助曾有效」，无 outcome 不标 effective，失败同样保留（M-06）。<\/li>\n<li><strong>纠正/删除终局<\/strong>：删除/纠正贯穿派生状态、缓存、后续检索——删除后新请求 0 使用、旧 derived summary 不复活、重复删除幂等（M-07，risk=critical）。<\/li>\n<li><strong>用户主权 API<\/strong>：list/detail/source/scope/update/revoke/why-this，UI 不读内部 ORM，跨用户零泄露，source 不存在诚实 unknown（M-08）。<\/li>\n<li><strong>回归门禁<\/strong>：≥80 multi-session cases × 10 Persona、paired 无历史基线、关键 case 真模型 ×5，失败不被平均掩盖（M-09）。<\/li>\n<li><strong>全链到 UI<\/strong>：用户无需知道 Memory 内部结构即可查看来源、纠正、删除，且删除后当前/未来个性化正确变化（M-10）。<\/li>\n<\/ol>\n<p><strong>Forbidden（全卡共性，执行中逐卡核验）<\/strong>：不重建既有权威真源（不建第二记忆库）；不用 mock/seed 冒充真实行为；不以静态代码阅读宣称用户体验通过；不弱化既有安全/幂等/隔离/审计守卫。<\/p>\n<h2>2. 实际交付逐卡表<\/h2>\n<h3>2.1 总表<\/h3>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>主干 SHA（评审签收）<\/th>\n<th>关键交付<\/th>\n<th>用户可见行为一句话<\/th>\n<th>验证证据<\/th>\n<th>残差<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M-01<\/td>\n<td><code>7ef808ee<\/code>（dual-review+rework）<\/td>\n<td>契约模块 <code>memory_epistemic_contract.py<\/code>（362L）+ 迁移 <code>m01a<\/code> + 写路守卫<\/td>\n<td>推断值不再顶替用户显式偏好；导出/面板可见每条记忆的类型/状态/范围<\/td>\n<td>红 7F/3P→绿 10/10 守卫；R2 返修后 23 passed；并发 bump 测试 {2,3,4}<\/td>\n<td>FIX-10 F2-F7 → M-04 已收口@<code>fa4e5837<\/code><\/td>\n<\/tr>\n<tr>\n<td>M-02<\/td>\n<td><code>10fde918<\/code>（ACCEPT）+ FIX-41@<code>1ae6a9e1<\/code><\/td>\n<td><code>memory_storage_gate.py<\/code>（1038L）规则门 + 默认关的语义层<\/td>\n<td>「明早8点考试」落短窗事件而非终身事实；敏感推断不直接入库需确认<\/td>\n<td>64 场景规则层 P/R=1.0/类（EVAL_RESULTS）；13 对抗负例钉单测<\/td>\n<td>FIX-15/FIX-44 词表残留 OPEN<\/td>\n<\/tr>\n<tr>\n<td>M-03<\/td>\n<td><code>1ea854c9<\/code>（dual-review+2 rework）<\/td>\n<td><code>memory_retrieval_prefilter.py<\/code>（716L）+ context_builder/context_pack 接线<\/td>\n<td>已删除/过期/他人记忆在进入 LLM 前为 0<\/td>\n<td>1165L 测试；红态实漏实证（superseded 行穿越 SQL）<\/td>\n<td>守卫测试曾因 worktree 缺 app.gen 静默不可收集（FIX-35 成因之一，流程教训）<\/td>\n<\/tr>\n<tr>\n<td>M-04<\/td>\n<td><code>fa4e5837<\/code>（R2 dual-pass+Leader verify）<\/td>\n<td><code>conflict_resolver_service.py<\/code> +855L 仲裁接线<\/td>\n<td>用户纠正胜过旧推断；冲突可出澄清；每条裁决带 resolution record<\/td>\n<td>1391 务原子<\/strong>（关闭 M-01 best-effort 缺口），提交后异步 DEL 派生缓存。勘察出的<strong>复活主通道（真 bug）<\/strong>：面板删偏好只撤 memory_preferences 链，而提示词装配真源是 live 表 user_preferences——删后每次编译永久复活；修法=链头删除同事务摘 live 键+version+1。读侧双 epoch 门（profile_context 缓存 + inline snapshot，缺 epoch/不一致/读失败一律 fail-closed）使「DEL 失败只剩 TTL 有界陈旧且被门拒绝」。幂等：FOR UPDATE + derive_status!=active 复查，重复删除收敛恰一次 bump/审计/事件。事件词表 33→34 登记 <code>memory.invalidated<\/code>（payload 零内容：只有 ids/action/epoch/reason_code）。实现中还抓到并修掉一个真实生产 bug：DEL 协程从未被 await（FakeRedis 暴露 RuntimeWarning）。本 worktree 亲验：管线在 memory_service 4 入口在场、profile_context_service epoch 门在场（:149/:421-441）。Q-05 红队（<code>4671173e<\/code>）后来用 43 场景对抗复测「轨迹 revoked 复活/错误本记忆复活」两类缺陷并当场修——失效承诺经受了独立对抗复核。<\/p>\n<p><strong>M-08（cbd7e44d）<\/strong>——路由面（本 worktree 亲验）：<code>GET /memory/provenance/items<\/code>、<code>/items/{kind}/{id}<\/code>、<code>/source<\/code>、<code>/scope<\/code>、<code>POST /update<\/code>（=supersede）、<code>POST /revoke<\/code>、<code>POST /why-this<\/code>（按 M-05 memory_use_receipt 结构查「为什么当时用这条」）。跨用户隔离与「source 不存在诚实 unknown」由 1171L API 测试承载（含变异 A/B/C 必红）。m08 迁移给 memory_goals 补 source_type（无回填，迁移头披露——FIX-39 OBS-2）。A-06（<code>d8a89bec<\/code>）的 Aurora 四动作回执把「拒绝 flywheel/M-01 supersede/scope pause/M-07 revoke」全部委托给本卡权威面，零新写路径——M-08 是 UI 治理动作的唯一后端权威。<\/p>\n<p><strong>M-09（7d1eedd3）<\/strong>——套件形态：82 case×10 Persona（每 persona 五维度全数覆盖、全 multi-session）、paired 无历史对照臂、三指标（invalid use/overpersonalization/valid-use precision+uplift）、<strong>per-case 门禁不被平均掩盖<\/strong>、变异自证非空洞。真模型探针（硬预算 25 次，qwen3.8-flash dashscope 真实 API，<code>has_key: true<\/code>）：5 关键 case×5 重复，<strong>4/5 稳定 5/5 通过；P01-D1-evening_plan 0/5 失败<\/strong>——根因=生产渲染器 format_user_context 不渲染偏好值（正确值在 M-01..M-07 全链正确，但最终 prompt 不可见）→ 登记 FIX-36（P1）。82 case 门禁合入时 RED（20 失败=FIX-35 supersede 反杀链签名）→ <code>3c2ca32c<\/code> 双修后 <strong>82/82 全绿、REGISTERED_BUG_CASE_IDS 永久清空<\/strong>（台账亲证+本 worktree 门禁实跑绿）。<strong>残差（V3-FIX-503，本轮登记）<\/strong>：FIX-36 注记「真模型复验由 E-05 下窗口补」至今未兑现——库内 stability report 仍是修前快照。<\/p>\n<p><strong>M-10（90cda638 + bff5a816）<\/strong>——接缝缺口盘点（报告 §0）五项全处置：G1 chat 回执无深链→<code>memory://&lt;kind&gt;/&lt;id&gt;<\/code> 开 U-03 why-this sheet（真实 API+真实纠正环）；G2 无入口→home/chat「查看完整理解」；G3 <strong>诚实性红线<\/strong>——U-03 删改同步链只失效 1 面，dashboard 理解快照/persona/透明档案/推断偏好 4 面删改后继续展示旧个性化→扩为五面级联失效；G4 置信百分比黑话两处清除（阈值与后端 <code>_confidence_label<\/code> 同口径 0.75/0.45）；G5 网关 <code>/memory<\/code> 纯代理零缓存（声明）。DEFERRED 的 6 测试用例（swap 门）由 CI 首跑兑现并暴露 1 个测试 fake 类型 bug（<code>bff5a816<\/code> 修后 7/7 绿）。<strong>未做<\/strong>：GJ08/GJ09 三端实机走查（无设备，headless 断言已尽；wt759 结论 ⚠「待人工裁」）；UnderstandingSnapshotCard「可信度 X%」文案残留（§8.4 自登记，features/experience 锁外）。<\/p>\n<h2>3. 设计决定与取舍（考古）<\/h2>\n<ol>\n<li><strong>派生而非复制<\/strong>：五型/七态/scope 全部从既有列派生，唯一新列是 <code>epistemic_class<\/code>/<code>superseded_by_id<\/code>/epoch 三列——「不建第二库」落在 schema 层。CONFIRMED_PREFERENCE 甚至不加列（表成员资格即类型）。代价：状态是读时计算（O(列) 无聚合），收益：零回填漂移、迁移最小（m01a 全加法可逆，sqlite 重放验证）。<\/li>\n<li><strong>保守分类学<\/strong>：NULL epistemic_class 按 lane 保守派生（未知→HYPOTHESIS）；机器写行落 OBSERVATION 不冒领 FACT（R2 以 dev 库 184 行构成实证收紧）。 extending USER_STATEMENT_SOURCE_TYPES 被显式声明为产品决策。<\/li>\n<li><strong>epoch = 廉价单调计数器 + 读侧 fail-closed 门<\/strong>（E-05 version-key 先例）：DEL 是加速、门是保证。这个「双保险分层」是 M-07 最重要的架构决定——失效链不再依赖任何单点（DEL/事件/缓存版本）全中。<\/li>\n<li><strong>评测先行抓真 bug<\/strong>：M-09 不是「补测试」而是产品缺陷发现器——合入时 RED 20 case 直指 FIX-35（P1）、真模型探针 0/5 直指 FIX-36（P1）。两个 P1 都在 demo 前修掉（<code>3c2ca32c<\/code>）。V4 值得沿用「评测套件=门禁+缺陷猎场」双职能。<\/li>\n<li><strong>语义层默认关<\/strong>（M-02 gate / M-05 fast-model 降档 / X-02 allocation 同款哲学）：规则层是可复现、可审计的生产决策面；LLM 只在规则层标记的灰区残差上生效，且只能在可行集内选、带熔断/限频/超时。代价：生产语义兜底缺位（FIX-41 修复前 R10 fail-open 曾靠语义层当借口的假设不成立）；收益：CI 无 key 环境可复现全部判定。<\/li>\n<li><strong>lane 注册表单一真源 + 保留位红线<\/strong>：aurora_calibration_receipt 刻意不注册（FIX-06 裁决迁移写入点），作为「新写方必须先登记档位」的文档化 fixture，并有注册完备性守卫测试（test_all_app_source_lane_literals_are_registered）。<\/li>\n<li><strong>快捷旗标与权威纠正环并存<\/strong>：chat 快捷「不对」（lower_confidence）不 bump epoch 是 epistemic contract 有意设计（置信微调≠破坏性变更）；M-10 不改契约，改为让权威环（supersede/revoke）从深链可达。取舍记录在 M-10 报告 §8.2，V4 若要改须动 test_memory_epistemic_contract 钉。<\/li>\n<\/ol>\n<h2>4. 残差与 V4 注意点<\/h2>\n<p><strong>活性残差（有台账号的）<\/strong>：<\/p>\n<ul>\n<li>FIX-15/44（M-02 词表打磨，OPEN 备忘）：「每天/每周」不稳、网词过宽——保守方向，随评测迭代。<\/li>\n<li>FIX-38（M-09 harness 打磨，OPEN 备忘）：to_row 丢 detail（eval_results 与报告口径差）、harness 语义门 fail-open 未显式钉死、.env 绝对路径硬编码、21/82 case 同构双写 supersede（偏好路径信号密度低）。<\/li>\n<li>FIX-39（M-08，OPEN 备忘）：revoke 端点旗标组合面 500（默认配置不可达）；m08 迁移无历史回填。<\/li>\n<li>V3-FIX-502/501（本轮登记，见 §5）。<\/li>\n<\/ul>\n<p><strong>结构性事实（V4 设计输入）<\/strong>：<\/p>\n<ol>\n<li><strong>生产决策面=规则层<\/strong>。存储门/使用自检/分配策略的语义层全部默认关；真模型证据集中在三处：M-09 探针（25 次）、E-04 五面探针（memory.gate/memory.extract 含注入对抗，收敛轮 15/15）、JOURNEY 真实驱动。<strong>没有常态化的真模型记忆回归<\/strong>（CI 无 key）——V4 若把语义层开进生产，需先建带 key 环境的常驻评测位。<\/li>\n<li><strong>合法个性化的实际通过率由 M-05 主导<\/strong>：生产逐轮降档率 66.67%（WIRING-1 起 metric 可读）。V4 调「个性化感知强度」时先看这条曲线，不要再造第二套过滤。<\/li>\n<li><strong>失效链三层保证<\/strong>（同事务 bump+事件 / 后置 DEL / 读侧 epoch 门）是 V4 可直接继承的范式；任何新派生面（新缓存/新快照）接入时必须：写侧钉 epoch、读侧 fail-closed。<\/li>\n<li><strong>真源地图<\/strong>：偏好链=memory_preferences（版本+replaced_by_id）；陈述=episodic_memories（lane+epistemic_class+superseded_by_id）；瞬态=working_memory（Redis 即真源）；live 提示词真源=user_preferences（删链头必须摘 live 键）。V4 新增任何「对用户的理解」面，先回答落在哪一格，禁止第四真源。<\/li>\n<li><strong>M-10 之后的 UX 债<\/strong>：三端实机走查（GJ08/GJ09）+ UnderstandingSnapshotCard「可信度 X%」残留。V4 做理解面时以 U-03/M-10 已建立的语言为准（定性层级词、零百分比黑话），并把两处残留一并清。<\/li>\n<\/ol>\n<h2>5. 本轮发现问题登记（号段复核后占用）<\/h2>\n<table>\n<thead>\n<tr>\n<th>号<\/th>\n<th>定性<\/th>\n<th>一句话<\/th>\n<th>证据硬点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>V3-FIX-502<\/strong><\/td>\n<td>实现漂移（证据面）<\/td>\n<td>M-06/M-08/M-09 与 X-03..X-09 卡级 REPORT/REVIEW_RECEIPT 从未入库，台账 FIX-33/38/39/28/29/32/40/42 引用死路径<\/td>\n<td><code>git log --all --diff-filter=A<\/code> 0 命中；v3-output/ 现存目录清单亲验；wt759 以 commit message 签收核验故结论不受影响<\/td>\n<\/tr>\n<tr>\n<td><strong>V3-FIX-503<\/strong><\/td>\n<td>承诺未兑现<\/td>\n<td>FIX-36 修法注记「真模型复验由 E-05 下窗口补」，至今无复验产物；库内 stability report 仍是修前失败快照，会误导 V4 读者以为渲染缺口仍存活<\/td>\n<td>real_model_stability_report.json@HEAD P01-D1 0/5 在册；E-05 产物与 fleet notes 全扫无复验记录；代码面修复有 8 单测钉（风险低）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>（号段复核：500/501 在册 0 占用，仅 FIX-499 行内「备用号 500 未用」提及。）<\/p>\n", "text": "# M 线（Memory，10 卡）深挖章 —— V3-COMPLETE-STATUS-FOR-V4 §4 素材\n\n> 作者：wt770（文档深挖）｜基线：main@ce9846a3（2026-09-28）｜方法：卡面 + `git log --grep` 逐卡定位 → 读现势代码核实 → 目标测试在 worktree 实跑 → REPORT/REVIEW_RECEIPT/FIX 台账抽读。\n> **本章事实判据**：所有 SHA 均已在 main 可达（`git show` 亲验）；运行级证据 = 本 worktree 实跑（见 §2.0）；推断/待验证项显式标注「推测」。\n> 本轮新登记：**V3-FIX-502**（M/X 线卡级 receipt 断链）、**V3-FIX-503**（M-09 真模型复验承诺未兑现），见 §5。\n\n## 0. 逐卡验证口径（本章通用）\n\n- **实跑验证（2026-09-28，worktree wt770-docmx = main HEAD）**：M 线核心测试 273 用例全绿——\n  `test_memory_epistemic_contract + test_memory_invalidation_pipeline + test_memory_storage_gate + test_memory_retrieval_prefilter + test_memory_use_selfcheck` = 183 passed；\n  `tests/memory_eval/test_memory_eval_gate + test_memory_provenance_api + test_experience_memory_contract + test_experience_memory_projector` = 90 passed（18.9s，sqlite in-memory，零 LLM）。\n- **评审证据形态**：M-01..M-07、M-10 有入库 receipt/REPORT；**M-06/M-08/M-09 的 receipt 原件未入库**（评审结论在 commit message 内，经 wt759 三源核验）→ 已登记 V3-FIX-502。\n- tasks.json 20 张卡 status=done（wt759 核正 8d4291aa 落库），fleet done 名单 20/20 在册。\n\n## 1. 意图（卡面提炼）\n\nM 线 10 卡（MEMORY stream，V3-2~V3-4 门）要回答一个问题：**系统对用户的「理解」如何做到正确、可纠正、可删除、可信任**。设计骨架（MEMORY_V3.md / USER_WORLD_MODEL.md）：\n\n1. **认识论分型**：每条记忆可归入 FACT / CONFIRMED_PREFERENCE / OBSERVATION / HYPOTHESIS / EXPERIENCE 五型之一，且可指出 source/scope/status（M-01）；**推断永远不能覆盖用户陈述的事实**（M-01 红线）。\n2. **该不该记**：写入前用规则+快速语义门判定 store/current_state/event/ignore/confirm，瞬态（「今天下午3点有课」）不得默认长期化（M-02）。\n3. **该不该用**：检索在 LLM 之前用确定性规则预筛（wrong-user/revoked/expired 在语义检索前为 0，M-03）；合法召回后再判断「该不该说出来」（over-personalization ≤5% 目标，M-05）。\n4. **冲突仲裁**：多来源/多时间证据显式仲裁，explicit correction 胜过旧 inference，scope 不同可共存，高增益不确定时出澄清而非静默选（M-04）。\n5. **经验投影**：从真实 intervention→outcome 投影「何种帮助曾有效」，无 outcome 不标 effective，失败同样保留（M-06）。\n6. **纠正/删除终局**：删除/纠正贯穿派生状态、缓存、后续检索——删除后新请求 0 使用、旧 derived summary 不复活、重复删除幂等（M-07，risk=critical）。\n7. **用户主权 API**：list/detail/source/scope/update/revoke/why-this，UI 不读内部 ORM，跨用户零泄露，source 不存在诚实 unknown（M-08）。\n8. **回归门禁**：≥80 multi-session cases × 10 Persona、paired 无历史基线、关键 case 真模型 ×5，失败不被平均掩盖（M-09）。\n9. **全链到 UI**：用户无需知道 Memory 内部结构即可查看来源、纠正、删除，且删除后当前/未来个性化正确变化（M-10）。\n\n**Forbidden（全卡共性，执行中逐卡核验）**：不重建既有权威真源（不建第二记忆库）；不用 mock/seed 冒充真实行为；不以静态代码阅读宣称用户体验通过；不弱化既有安全/幂等/隔离/审计守卫。\n\n## 2. 实际交付逐卡表\n\n### 2.1 总表\n\n| 卡 | 主干 SHA（评审签收） | 关键交付 | 用户可见行为一句话 | 验证证据 | 残差 |\n|---|---|---|---|---|---|\n| M-01 | `7ef808ee`（dual-review+rework） | 契约模块 `memory_epistemic_contract.py`（362L）+ 迁移 `m01a` + 写路守卫 | 推断值不再顶替用户显式偏好；导出/面板可见每条记忆的类型/状态/范围 | 红 7F/3P→绿 10/10 守卫；R2 返修后 23 passed；并发 bump 测试 {2,3,4} | FIX-10 F2-F7 → M-04 已收口@`fa4e5837` |\n| M-02 | `10fde918`（ACCEPT）+ FIX-41@`1ae6a9e1` | `memory_storage_gate.py`（1038L）规则门 + 默认关的语义层 | 「明早8点考试」落短窗事件而非终身事实；敏感推断不直接入库需确认 | 64 场景规则层 P/R=1.0/类（EVAL_RESULTS）；13 对抗负例钉单测 | FIX-15/FIX-44 词表残留 OPEN |\n| M-03 | `1ea854c9`（dual-review+2 rework） | `memory_retrieval_prefilter.py`（716L）+ context_builder/context_pack 接线 | 已删除/过期/他人记忆在进入 LLM 前为 0 | 1165L 测试；红态实漏实证（superseded 行穿越 SQL） | 守卫测试曾因 worktree 缺 app.gen 静默不可收集（FIX-35 成因之一，流程教训） |\n| M-04 | `fa4e5837`（R2 dual-pass+Leader verify） | `conflict_resolver_service.py` +855L 仲裁接线 | 用户纠正胜过旧推断；冲突可出澄清；每条裁决带 resolution record | 1391L 类目测试；M-01 遗留 F2/F4/F6/F7 同卡收口 | aurora_calibration_receipt lane 红线经 FIX-06 迁移写入点@`a28a5b8c` |\n| M-05 | `b9a48bdb`（single deep review） | `memory_use_selfcheck.py`（735L）+ OP-Bench 46 case | 无关记忆可召回但不再每轮刷屏；谄媚性附和被拦 | 规则层盲跑过度个性化 0.0%（0/21，目标≤5%）；1066L 测试 | FIX-35 第二失败模式（irrelevant_to_query 降档链头）已随 `3c2ca32c` 收口 |\n| M-06 | `e56be400`（R2-reviewed, P2-1 fixed） | `experience_memory.py`（735L）+ projector（346L） | 「上次这样帮你有效/无效」进上下文（WIRING-1 后） | 1290L 契约+服务测试；无 outcome 不标 effective 有契约钉 | **交付时未接 chat（FIX-33）**，`7c6cb867` 补接线；生产降档率 66.67%（selfcheck 收紧，设计内） |\n| M-07 | `0ea1e198`（dual-review+rework+delta） | `memory_invalidation_pipeline.py`（477L）统一失效管线 | 用户删除一条偏好，所有个性化面（含缓存）立即不再使用它 | 红 13F/4P→绿 17/17（863L 测试）；live 键复活主通道红→绿 | semantic_cache/state_aggregator 豁免经源码核对登记（不含记忆内容） |\n| M-08 | `cbd7e44d`（dual-reviewed, rev2） | `/memory/provenance/*` API（277L）+ service（1186L）+ m08 迁移 | U-03 理解面的每条来源可查、可改、可删、可问「为什么当时用它」 | 1171L API 测试（21 定向测+变异 A/B/C） | FIX-39 OPEN：revoke 端点旗标组合 500 面 + m08 迁移无回填（迁移头已披露） |\n| M-09 | `7d1eedd3`（R2-reviewed） | `tests/memory_eval/` 评测套件：82 case×10 Persona + 真模型 25 次预算探针 | （对内）记忆正确性成为可重复门禁 | 门禁在库且现绿（REGISTERED_BUG_CASE_IDS 已清空）；真模型报告 5case×5 入库 | FIX-38 OPEN（to_row 丢 detail、fail-open 语义门未声明、.env 绝对路径、21 case 同构） |\n| M-10 | `90cda638`（wt354）+ 债兑现 `bff5a816` | mobile 15 文件：chat 回执「为什么有这条」深链 + 五面失效级联 + 黑话清除 | 用户在聊天里点「不对」可直达来源并真删；删除后各面板同步重算 | 4 测试文件 analyze 0 错；DEFERRED 债由 CI 首跑兑现（7/7 绿@`bff5a816`） | **GJ08/GJ09 三端实机走查未做**（headless 口径，wt759 标 ⚠）；UnderstandingSnapshotCard「可信度 X%」文案残留（报告 §8.4 自登记） |\n\n### 2.2 逐卡要点与证据细节\n\n**M-01（7ef808ee）**——交付四层：\n1. `EpistemicClass` 五型；CONFIRMED_PREFERENCE 由表成员资格承载（memory_preferences/memory_goals 即该型），不加列——「不建第二库」的具体落法。\n2. `derive_status` 七态状态机（revoked>superseded>retracted>archived>expired>resolved>active），全部从既有列派生，零新增存储（episodic 仅加 `epistemic_class`/`superseded_by_id` 两列）。\n3. **红→绿守卫（真 bug 实证）**：`upsert_preference` 原实现无条件建新版并压链头——推断写（ai_inferred）会把用户显式偏好 supersede 掉；修后 inferred→explicit 拒写（指标 `MEMORY_WRITE_TOTAL{status=\"blocked_inferred_over_fact\"}`）。报告 §1.1 有完整代码链。\n4. R2 返修两点（有 dev 库只读证据）：F1 回填写收——184 direct_capture 行仅 1 行（user_registered）是用户陈述，机器行（chat_turn=164 等）落 OBSERVATION 不冒领 FACT；F3 epoch bump 原子化（单条 `UPDATE..RETURNING`），并发探针旧算法 [2,2]→2 丢增量复现、新算法 {2,3,4} 稳定。\n残差处理：F2/F4/F5-F7 经主会话裁决登记 FIX-10 作 M-04 前置，随 `fa4e5837` 全部收口（wt474 扫陈确认 + 逐 F 项 file:line）。\n\n**M-02（10fde918 + 1ae6a9e1）**——规则层 R1-R10+B2/B3 决策五出口（store/current_state/event/ignore/confirm）；R4 敏感推断→confirm、R5 一次性约束→event+bounded_scope（decay 压 7d）。评测：64 场景人工标注（store15/event12/current_state11/ignore14/confirm12），规则层独跑五类 P/R 全 1.0（阈值守 （`49d81fb2`）。\n\n**M-07（0ea1e198，critical）**——统一管线 `apply_in_txn`：correction/revoke/supersede/bulk_revoke（+working_memory_forget）四动作全部「状态变更+审计行+epoch bump+`memory.invalidated` 事件」**同事务原子**（关闭 M-01 best-effort 缺口），提交后异步 DEL 派生缓存。勘察出的**复活主通道（真 bug）**：面板删偏好只撤 memory_preferences 链，而提示词装配真源是 live 表 user_preferences——删后每次编译永久复活；修法=链头删除同事务摘 live 键+version+1。读侧双 epoch 门（profile_context 缓存 + inline snapshot，缺 epoch/不一致/读失败一律 fail-closed）使「DEL 失败只剩 TTL 有界陈旧且被门拒绝」。幂等：FOR UPDATE + derive_status!=active 复查，重复删除收敛恰一次 bump/审计/事件。事件词表 33→34 登记 `memory.invalidated`（payload 零内容：只有 ids/action/epoch/reason_code）。实现中还抓到并修掉一个真实生产 bug：DEL 协程从未被 await（FakeRedis 暴露 RuntimeWarning）。本 worktree 亲验：管线在 memory_service 4 入口在场、profile_context_service epoch 门在场（:149/:421-441）。Q-05 红队（`4671173e`）后来用 43 场景对抗复测「轨迹 revoked 复活/错误本记忆复活」两类缺陷并当场修——失效承诺经受了独立对抗复核。\n\n**M-08（cbd7e44d）**——路由面（本 worktree 亲验）：`GET /memory/provenance/items`、`/items/{kind}/{id}`、`/source`、`/scope`、`POST /update`（=supersede）、`POST /revoke`、`POST /why-this`（按 M-05 memory_use_receipt 结构查「为什么当时用这条」）。跨用户隔离与「source 不存在诚实 unknown」由 1171L API 测试承载（含变异 A/B/C 必红）。m08 迁移给 memory_goals 补 source_type（无回填，迁移头披露——FIX-39 OBS-2）。A-06（`d8a89bec`）的 Aurora 四动作回执把「拒绝 flywheel/M-01 supersede/scope pause/M-07 revoke」全部委托给本卡权威面，零新写路径——M-08 是 UI 治理动作的唯一后端权威。\n\n**M-09（7d1eedd3）**——套件形态：82 case×10 Persona（每 persona 五维度全数覆盖、全 multi-session）、paired 无历史对照臂、三指标（invalid use/overpersonalization/valid-use precision+uplift）、**per-case 门禁不被平均掩盖**、变异自证非空洞。真模型探针（硬预算 25 次，qwen3.8-flash dashscope 真实 API，`has_key: true`）：5 关键 case×5 重复，**4/5 稳定 5/5 通过；P01-D1-evening_plan 0/5 失败**——根因=生产渲染器 format_user_context 不渲染偏好值（正确值在 M-01..M-07 全链正确，但最终 prompt 不可见）→ 登记 FIX-36（P1）。82 case 门禁合入时 RED（20 失败=FIX-35 supersede 反杀链签名）→ `3c2ca32c` 双修后 **82/82 全绿、REGISTERED_BUG_CASE_IDS 永久清空**（台账亲证+本 worktree 门禁实跑绿）。**残差（V3-FIX-503，本轮登记）**：FIX-36 注记「真模型复验由 E-05 下窗口补」至今未兑现——库内 stability report 仍是修前快照。\n\n**M-10（90cda638 + bff5a816）**——接缝缺口盘点（报告 §0）五项全处置：G1 chat 回执无深链→`memory://<kind>/<id>` 开 U-03 why-this sheet（真实 API+真实纠正环）；G2 无入口→home/chat「查看完整理解」；G3 **诚实性红线**——U-03 删改同步链只失效 1 面，dashboard 理解快照/persona/透明档案/推断偏好 4 面删改后继续展示旧个性化→扩为五面级联失效；G4 置信百分比黑话两处清除（阈值与后端 `_confidence_label` 同口径 0.75/0.45）；G5 网关 `/memory` 纯代理零缓存（声明）。DEFERRED 的 6 测试用例（swap 门）由 CI 首跑兑现并暴露 1 个测试 fake 类型 bug（`bff5a816` 修后 7/7 绿）。**未做**：GJ08/GJ09 三端实机走查（无设备，headless 断言已尽；wt759 结论 ⚠「待人工裁」）；UnderstandingSnapshotCard「可信度 X%」文案残留（§8.4 自登记，features/experience 锁外）。\n\n## 3. 设计决定与取舍（考古）\n\n1. **派生而非复制**：五型/七态/scope 全部从既有列派生，唯一新列是 `epistemic_class`/`superseded_by_id`/epoch 三列——「不建第二库」落在 schema 层。CONFIRMED_PREFERENCE 甚至不加列（表成员资格即类型）。代价：状态是读时计算（O(列) 无聚合），收益：零回填漂移、迁移最小（m01a 全加法可逆，sqlite 重放验证）。\n2. **保守分类学**：NULL epistemic_class 按 lane 保守派生（未知→HYPOTHESIS）；机器写行落 OBSERVATION 不冒领 FACT（R2 以 dev 库 184 行构成实证收紧）。 extending USER_STATEMENT_SOURCE_TYPES 被显式声明为产品决策。\n3. **epoch = 廉价单调计数器 + 读侧 fail-closed 门**（E-05 version-key 先例）：DEL 是加速、门是保证。这个「双保险分层」是 M-07 最重要的架构决定——失效链不再依赖任何单点（DEL/事件/缓存版本）全中。\n4. **评测先行抓真 bug**：M-09 不是「补测试」而是产品缺陷发现器——合入时 RED 20 case 直指 FIX-35（P1）、真模型探针 0/5 直指 FIX-36（P1）。两个 P1 都在 demo 前修掉（`3c2ca32c`）。V4 值得沿用「评测套件=门禁+缺陷猎场」双职能。\n5. **语义层默认关**（M-02 gate / M-05 fast-model 降档 / X-02 allocation 同款哲学）：规则层是可复现、可审计的生产决策面；LLM 只在规则层标记的灰区残差上生效，且只能在可行集内选、带熔断/限频/超时。代价：生产语义兜底缺位（FIX-41 修复前 R10 fail-open 曾靠语义层当借口的假设不成立）；收益：CI 无 key 环境可复现全部判定。\n6. **lane 注册表单一真源 + 保留位红线**：aurora_calibration_receipt 刻意不注册（FIX-06 裁决迁移写入点），作为「新写方必须先登记档位」的文档化 fixture，并有注册完备性守卫测试（test_all_app_source_lane_literals_are_registered）。\n7. **快捷旗标与权威纠正环并存**：chat 快捷「不对」（lower_confidence）不 bump epoch 是 epistemic contract 有意设计（置信微调≠破坏性变更）；M-10 不改契约，改为让权威环（supersede/revoke）从深链可达。取舍记录在 M-10 报告 §8.2，V4 若要改须动 test_memory_epistemic_contract 钉。\n\n## 4. 残差与 V4 注意点\n\n**活性残差（有台账号的）**：\n- FIX-15/44（M-02 词表打磨，OPEN 备忘）：「每天/每周」不稳、网词过宽——保守方向，随评测迭代。\n- FIX-38（M-09 harness 打磨，OPEN 备忘）：to_row 丢 detail（eval_results 与报告口径差）、harness 语义门 fail-open 未显式钉死、.env 绝对路径硬编码、21/82 case 同构双写 supersede（偏好路径信号密度低）。\n- FIX-39（M-08，OPEN 备忘）：revoke 端点旗标组合面 500（默认配置不可达）；m08 迁移无历史回填。\n- V3-FIX-502/501（本轮登记，见 §5）。\n\n**结构性事实（V4 设计输入）**：\n1. **生产决策面=规则层**。存储门/使用自检/分配策略的语义层全部默认关；真模型证据集中在三处：M-09 探针（25 次）、E-04 五面探针（memory.gate/memory.extract 含注入对抗，收敛轮 15/15）、JOURNEY 真实驱动。**没有常态化的真模型记忆回归**（CI 无 key）——V4 若把语义层开进生产，需先建带 key 环境的常驻评测位。\n2. **合法个性化的实际通过率由 M-05 主导**：生产逐轮降档率 66.67%（WIRING-1 起 metric 可读）。V4 调「个性化感知强度」时先看这条曲线，不要再造第二套过滤。\n3. **失效链三层保证**（同事务 bump+事件 / 后置 DEL / 读侧 epoch 门）是 V4 可直接继承的范式；任何新派生面（新缓存/新快照）接入时必须：写侧钉 epoch、读侧 fail-closed。\n4. **真源地图**：偏好链=memory_preferences（版本+replaced_by_id）；陈述=episodic_memories（lane+epistemic_class+superseded_by_id）；瞬态=working_memory（Redis 即真源）；live 提示词真源=user_preferences（删链头必须摘 live 键）。V4 新增任何「对用户的理解」面，先回答落在哪一格，禁止第四真源。\n5. **M-10 之后的 UX 债**：三端实机走查（GJ08/GJ09）+ UnderstandingSnapshotCard「可信度 X%」残留。V4 做理解面时以 U-03/M-10 已建立的语言为准（定性层级词、零百分比黑话），并把两处残留一并清。\n\n## 5. 本轮发现问题登记（号段复核后占用）\n\n| 号 | 定性 | 一句话 | 证据硬点 |\n|---|---|---|---|\n| **V3-FIX-502** | 实现漂移（证据面） | M-06/M-08/M-09 与 X-03..X-09 卡级 REPORT/REVIEW_RECEIPT 从未入库，台账 FIX-33/38/39/28/29/32/40/42 引用死路径 | `git log --all --diff-filter=A` 0 命中；v3-output/ 现存目录清单亲验；wt759 以 commit message 签收核验故结论不受影响 |\n| **V3-FIX-503** | 承诺未兑现 | FIX-36 修法注记「真模型复验由 E-05 下窗口补」，至今无复验产物；库内 stability report 仍是修前失败快照，会误导 V4 读者以为渲染缺口仍存活 | real_model_stability_report.json@HEAD P01-D1 0/5 在册；E-05 产物与 fleet notes 全扫无复验记录；代码面修复有 8 单测钉（风险低） |\n\n（号段复核：500/501 在册 0 占用，仅 FIX-499 行内「备用号 500 未用」提及。）\n"}, {"id": "00_context/source_notes/S12_X-line.md", "title": "X 线（Action，10 卡）深挖章 —— V3-COMPLETE-STATUS-FOR-V4 §4 素材", "group": "原始报告副本", "html": "<h1>X 线（Action，10 卡）深挖章 —— V3-COMPLETE-STATUS-FOR-V4 §4 素材<\/h1>\n<blockquote>\n<p>作者：wt770（文档深挖）｜基线：main@ce9846a3（2026-09-28）｜方法：卡面 + <code>git log --grep<\/code> 逐卡定位 → 读现势代码核实 → 目标测试在 worktree 实跑 → REPORT/RECEIPT/FIX 台账抽读。\n<strong>本章事实判据<\/strong>：所有 SHA 均已在 main 可达（<code>git show<\/code> 亲验）；运行级证据 = 本 worktree 实跑（§2.0）；「真模型 vs demo」逐处标注。\n本轮新登记：<strong>V3-FIX-502<\/strong>（M/X 线卡级 receipt 断链——X-03..X-09 在列）与 <strong>V3-FIX-503<\/strong>（M-09 真模型复验，涉 X 侧引证）见 §5；另有多项已在册残差汇总于 §4。<\/p>\n<\/blockquote>\n<h2>0. 逐卡验证口径（本章通用）<\/h2>\n<ul>\n<li><strong>实跑验证（2026-09-28，worktree wt770-docmx = main HEAD）<\/strong>：X 线核心测试 403 用例全绿——\n<code>test_action_plan_contract + test_action_allocation_policy + test_action_allocation_guard + test_action_allocation_eval<\/code> = 141 passed；\n<code>test_action_command_service + test_agent_run_service + test_run_state_machine + test_hybrid_run_steps + test_failure_semantics + test_x09_failure_recovery + tests/v3_action_eval/test_x10_action_eval_gate<\/code> = 262 passed（156s，sqlite in-memory，零 LLM）。<\/li>\n<li><strong>评审证据形态<\/strong>：X-01/X-02/X-10 有入库 REPORT/RECEIPT；X07-P21 有 REPORT；<strong>X-03/X-04/X-05/X-05B/X-06/X-07/X-08/X-09 的 receipt 原件未入库<\/strong>——评审结论在 ACCEPT merge commit message 内（「dual-reviewed」「R2 PASS」等），经 wt759 三源核验；断链本体已登记 <strong>V3-FIX-502<\/strong>。<\/li>\n<li>真源注记（FIX-330 裁决引文）：生产的 agent 执行账本=X-05 AgentRun/AgentRunTransition + X-06 AgentToolCall + outcome_ledger 三套；模板件 agent_execution_stats 零写侧、已如实标 unavailable。<\/li>\n<\/ul>\n<h2>1. 意图（卡面提炼）<\/h2>\n<p>X 线 10 卡（ACTION stream，V3-2~V3-5 门）把「AI 陪伴学习」落成<strong>可执行的行动引擎<\/strong>，核心主张是 V3 的第 2 条：<strong>Human/Agent/Hybrid 执行模型——AI 降摩擦但不偷走目标<\/strong>。设计骨架（ACTION_AND_INTERVENTION_ENGINE / HUMAN_AGENT_HYBRID / AGENT_RUNTIME）：<\/p>\n<ol>\n<li><strong>契约<\/strong>：在既有 Task/Plan/Proposal 上加 V3 语义（desired_outcome/smallest_useful_step/completion_evidence/execution_mode/cognitive_ownership/source_refs/risk），不重建 task system；关键字段不得仅以自然语言携带（X-01）。<\/li>\n<li><strong>分配<\/strong>：delegation rubric 而非模型随口「我来帮你做」——八维因子输出 mode；high-risk auto=0；学习目标不默认 Agent 写完整答案（X-02）。<\/li>\n<li><strong>授权<\/strong>：proposal→approve→validate version/permission→commit→receipt 统一权威路径，所有入口同路；重复确认不重复写、冲突不覆盖、未授权不执行（X-03，critical）。<\/li>\n<li><strong>人执行面<\/strong>：start/complete/abandon/rescope + 按类型取完成证据；实际时长永不从 estimated 回填（X-04）。<\/li>\n<li><strong>Run 真源<\/strong>：统一 run_id/state 持久化，App 内存与 OpenClaw 不成第二真源；WebSocket 仅通知（X-05，critical）。<\/li>\n<li><strong>工具边界<\/strong>：工具元数据（read/write/risk/reversible/permission/cost）+ side effect 强制幂等键 + run budget（X-06，critical）。<\/li>\n<li><strong>混合交接<\/strong>：Agent 做一部分→轮到用户→继续；owner 纪律；用户操作两次不 resume 两次（X-07）。<\/li>\n<li><strong>结果回写<\/strong>：无论谁执行，完成统一产 Outcome 进 Outcome Ledger；失败不点亮成果（X-08）。<\/li>\n<li><strong>失败语义<\/strong>：false success=0、duplicate side effect=0、20+ chaos case 终态正确（X-09，critical）。<\/li>\n<li><strong>端到端评测<\/strong>：≥60 场景 allocation ≥90%、high-risk auto=0、false success=0、Simulator 无需开发者介入（X-10）。<\/li>\n<\/ol>\n<p><strong>Forbidden（全卡共性）<\/strong>：不重建既有真源；不用 mock 冒充真实行为；不以静态阅读宣称 UX 通过；不弱化既有安全/幂等/隔离/审计守卫。<\/p>\n<h2>2. 实际交付逐卡表<\/h2>\n<h3>2.1 总表<\/h3>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>主干 SHA（评审签收）<\/th>\n<th>关键交付<\/th>\n<th>用户可见行为一句话<\/th>\n<th>验证证据<\/th>\n<th>残差<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>X-01<\/td>\n<td><code>43942d23<\/code>（dual-review+rework）<\/td>\n<td>x01 迁移（tasks 8 nullable V3 列）+ <code>core/action_plan.py<\/code>（448L 冻结契约）<\/td>\n<td>任务可携带「期望结果/最小有效步/完成证据/谁执行」结构化字段<\/td>\n<td>640L 测试含迁移 sqlite 重放；F1 探针（脏枚举行曾致全端点 500）红→绿<\/td>\n<td>card_protocol 映射停留在文档级（B-06 ENTITY_MAP 后续补齐真源审计）<\/td>\n<\/tr>\n<tr>\n<td>X-02<\/td>\n<td><code>c0e02bf8<\/code>（dual-review+rework）<\/td>\n<td><code>action_allocation_policy.py<\/code>（995L）：纯函数 decide_allocation 四层<\/td>\n<td>学习类请求永不自动代写；高风险永不自动执行；每次分配带 why+confidence<\/td>\n<td>85 场景盲评规则层 100%（目标≥90%）；1392L 测试；E-04 真模型 5 面收敛轮 15/15<\/td>\n<td>语义层默认关（生产=规则层）；实机 5-Persona 观感转 HUMAN_INBOX<\/td>\n<\/tr>\n<tr>\n<td>X-03<\/td>\n<td><code>7fc507fd<\/code>（dual-reviewed, rev2）<\/td>\n<td>x03/x03b 迁移 + proposals API + <code>action_command_service.py<\/code>（897L）统一命令路径<\/td>\n<td>重复确认不重复写、版本冲突不覆盖、过期/取消明确、UI 拿权威 receipt<\/td>\n<td>1577L 测试；X-10 proposal 族 12 场景全 PASS<\/td>\n<td>chat 卡片命令分发缺口由 wt687（FIX-378）收口；P-04 在其上加低风险 auto-execute 授权层（<code>322988ce<\/code>）<\/td>\n<\/tr>\n<tr>\n<td>X-04<\/td>\n<td><code>6a6363f8<\/code><\/td>\n<td><code>task_completion_evidence.py<\/code>（275L）+ task_service +387L + mobile
