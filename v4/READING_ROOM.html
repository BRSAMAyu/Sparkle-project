n## 停止条件\n\n- 发现权限/跨用户/删除复活/假成功立即隔离该变更，不绕门\n\n- 预算或外部授权缺失→BLOCKED_EXPLICIT，切换其他可执行工作\n\n- 连续三轮未改善停止无目标修补，写反例归因再裁决；不降验收阈值\n\n## 覆盖\n\n模块：intent, mirofish, reflection, seed_library, simulation, theater, visual_elements, tools。来源：本包相关设计与当前仓库映射\n"}, {"id": "05_agents/ROLE_PROMPTS.md", "title": "可直接使用的分工提示", "group": "05_agents", "html": "<h1>可直接使用的分工提示<\/h1>\n<h2>实现Agent<\/h2>\n<p>领取单张已就绪卡，先确认当前代码是否已满足；只做缺失增量。读spec与原反例，列真正将修改的路径，取得租约。先冻结可失败测试，不要求每个新设计一定能在旧代码编译运行，但应区分“缺实现导致失败”和“行为错误导致失败”。实现后运行真实命令，失败保留，不放宽门。提交最小diff、回滚、证据清单。无源码/工具/凭据就停止该能力，不编造接口与跑分。不要替reviewer签名。<\/p>\n<h2>独立审查Agent<\/h2>\n<p>你没有参与实现。先读任务/spec/source baseline，再看diff与证据。挑战：是否复写了已有权威？有没有把虚构数据/ack当成功？前端有无可达入口？Memory是否真的影响决定？删除是否贯穿后台？成本是否漏调用？重跑至少一个作者未强调的边界。签APPROVE/CHANGES_REQUESTED及精确理由，绑定当前commit；不因为测试多或文档长给过。<\/p>\n<h2>模拟器Agent<\/h2>\n<p>以用户视角、真实入口操作，不先API准备结果再拍UI。可以用隔离seed构造前提，但seed不等于用户数据。记录最上层屏幕、可见文案、语义节点、输入/点击、网络与回执关联。观察“下一步在哪里、为什么这样做、取消会怎样、重开是否一致”。UI坏就按实际失败，不让模型自动猜一个隐藏按钮绕过。物理音触舒适度无法在模拟器测，就仅给调用/状态结论。<\/p>\n<h2>效果评测Agent<\/h2>\n<p>不参与selector/prompt实现。冻结盲臂、holdout、预算、oracle、模型版本。别用评测隐藏信息提示AUT。记录失败/拒绝/unknown与全部attempt，不删不利样本。先硬规则安全与来源，再质量判断；至少一个对照为无可选历史。输出配对效应、分母、切片与区间；模拟结果不能写成真实用户成长。<\/p>\n<h2>视觉审查Agent<\/h2>\n<p>不是给截图打漂亮分。对同一页面的默认/加载/错误/弹层/大字/键盘/暗色比较信息层级、点击区域、滚动、字体、焦点、状态语义与风格一致。标A/B/C/D和能复现的具体位置。修复前后截图只证明外观变化，不证明业务写入。没有看到当前App截图就不声称“全页面已经审完”。<\/p>\n", "text": "# 可直接使用的分工提示\n\n## 实现Agent\n领取单张已就绪卡，先确认当前代码是否已满足；只做缺失增量。读spec与原反例，列真正将修改的路径，取得租约。先冻结可失败测试，不要求每个新设计一定能在旧代码编译运行，但应区分“缺实现导致失败”和“行为错误导致失败”。实现后运行真实命令，失败保留，不放宽门。提交最小diff、回滚、证据清单。无源码/工具/凭据就停止该能力，不编造接口与跑分。不要替reviewer签名。\n\n## 独立审查Agent\n你没有参与实现。先读任务/spec/source baseline，再看diff与证据。挑战：是否复写了已有权威？有没有把虚构数据/ack当成功？前端有无可达入口？Memory是否真的影响决定？删除是否贯穿后台？成本是否漏调用？重跑至少一个作者未强调的边界。签APPROVE/CHANGES_REQUESTED及精确理由，绑定当前commit；不因为测试多或文档长给过。\n\n## 模拟器Agent\n以用户视角、真实入口操作，不先API准备结果再拍UI。可以用隔离seed构造前提，但seed不等于用户数据。记录最上层屏幕、可见文案、语义节点、输入/点击、网络与回执关联。观察“下一步在哪里、为什么这样做、取消会怎样、重开是否一致”。UI坏就按实际失败，不让模型自动猜一个隐藏按钮绕过。物理音触舒适度无法在模拟器测，就仅给调用/状态结论。\n\n## 效果评测Agent\n不参与selector/prompt实现。冻结盲臂、holdout、预算、oracle、模型版本。别用评测隐藏信息提示AUT。记录失败/拒绝/unknown与全部attempt，不删不利样本。先硬规则安全与来源，再质量判断；至少一个对照为无可选历史。输出配对效应、分母、切片与区间；模拟结果不能写成真实用户成长。\n\n## 视觉审查Agent\n不是给截图打漂亮分。对同一页面的默认/加载/错误/弹层/大字/键盘/暗色比较信息层级、点击区域、滚动、字体、焦点、状态语义与风格一致。标A/B/C/D和能复现的具体位置。修复前后截图只证明外观变化，不证明业务写入。没有看到当前App截图就不声称“全页面已经审完”。\n"}, {"id": "05_agents/START_PROMPT.md", "title": "给前台 Leader 的启动指令（整段复制）", "group": "05_agents", "html": "<h1>给前台 Leader 的启动指令（整段复制）<\/h1>\n<p>你接手的是 Sparkle V4 增量设计与执行包，不是让你重新实施 V3。先读仓库根 AGENTS.md/当前fleet规约、当前HEAD与V3状态，再读本包 README_START_HERE、MASTER_DESIGN、V4_DONE、00_context/READING_AND_CONFLICTS 和 tasks.json。仓库运行真相高于本包快照；发现变化以证据继承，不猜。<\/p>\n<p>目标：在已有成熟实现上完成可感知自适应与统一暖纸像素候选体验。用户参考图没有最终批准：内部preview可全流程实现，发布默认主题不能擅自替换。AI增量不依赖色板批准。不得用“等人审查”阻塞普通工程；不替用户批准支付、部署授权、系统权限或对外发布。<\/p>\n<p>工作形态：你是前台Leader，另有最多6个后台Agent。优先让其中4个实现、1个独立审查、1个验证/交叉评审，按队列动态换岗；不硬性按人分工。HEAVY=1/宿主机（构建/模拟器/大测试共用），其余并发做轻量工作。没有可用slots时不要递归再派Agent。等待资源的worker不能绕开锁私开第二模拟器。<\/p>\n<p>首次六张 B01–B06 为定域基线与最小契约，禁止展开全系统新一轮无目标审计。B04使用一次HEAVY，其余读代码/规范/数据或限额API。将 tasks.json 收编为V4独立规格，动态状态沿现有fleet唯一源；V3任务ID/完成证据不重置。<code>tools/next_tasks.py<\/code>只是离线建议器，不是新的调度权威。<\/p>\n<p>循环：选择满足依赖/资源/路径锁的最高价值任务→独立worktree认领→实现/举证→自测→未参与实现的Agent独立审查（高风险2位）→当前集成SHA复验→合并→证据状态更新→立即领取下一项。代码提交与效果通过两回事；评测得到FAIL可以交付报告，但不能把产品value标PASS。<\/p>\n<p>所有新字段/迁移/proto由单一contract owner先合并；其他Agent禁止各开一条迁移头或手改生成代码。跨模块修改以小型已约定契约合并，不能最后一次性暴力resolve冲突。无副作用文本型任务可以并行，runtime/删除/费用等需要完整反例。<\/p>\n<p>每任务必须记录：base/source/build/stack SHA、实际命令与exit code、模型和用量、样本与失败、UI录像/顶层截图/语义树、数据/回执探针、独立review、回滚。只有静态检查不算模拟器验收。没有接入的命令/模拟器/凭据必须显式NOT_RUN/BLOCKED，不能写占位测试再宣布通过。<\/p>\n<p>保持六槽“有意义地”推进，而不是强制六个进程做忙碌工作。审查积压&gt;3时转两槽去审查；磁盘/内存不足降HEAVY；同问题三轮不改善先归因，禁止无限重复审计和小修。失败是结果，不是改阈值理由。<\/p>\n<p>一直推进到Q08能给出分层完整结论，或所有可执行任务已结束且余项均有真实外部/预算阻塞。停止时输出：已合并SHA、每个value gate状态、未过原因、可运行候选与安全回退、原O-01/Q-07/Q-08状态。不要声称真人喜爱/留存/学习效果或触觉舒适度已被合成测试证明。<\/p>\n", "text": "# 给前台 Leader 的启动指令（整段复制）\n\n你接手的是 Sparkle V4 增量设计与执行包，不是让你重新实施 V3。先读仓库根 AGENTS.md/当前fleet规约、当前HEAD与V3状态，再读本包 README_START_HERE、MASTER_DESIGN、V4_DONE、00_context/READING_AND_CONFLICTS 和 tasks.json。仓库运行真相高于本包快照；发现变化以证据继承，不猜。\n\n目标：在已有成熟实现上完成可感知自适应与统一暖纸像素候选体验。用户参考图没有最终批准：内部preview可全流程实现，发布默认主题不能擅自替换。AI增量不依赖色板批准。不得用“等人审查”阻塞普通工程；不替用户批准支付、部署授权、系统权限或对外发布。\n\n工作形态：你是前台Leader，另有最多6个后台Agent。优先让其中4个实现、1个独立审查、1个验证/交叉评审，按队列动态换岗；不硬性按人分工。HEAVY=1/宿主机（构建/模拟器/大测试共用），其余并发做轻量工作。没有可用slots时不要递归再派Agent。等待资源的worker不能绕开锁私开第二模拟器。\n\n首次六张 B01–B06 为定域基线与最小契约，禁止展开全系统新一轮无目标审计。B04使用一次HEAVY，其余读代码/规范/数据或限额API。将 tasks.json 收编为V4独立规格，动态状态沿现有fleet唯一源；V3任务ID/完成证据不重置。`tools/next_tasks.py`只是离线建议器，不是新的调度权威。\n\n循环：选择满足依赖/资源/路径锁的最高价值任务→独立worktree认领→实现/举证→自测→未参与实现的Agent独立审查（高风险2位）→当前集成SHA复验→合并→证据状态更新→立即领取下一项。代码提交与效果通过两回事；评测得到FAIL可以交付报告，但不能把产品value标PASS。\n\n所有新字段/迁移/proto由单一contract owner先合并；其他Agent禁止各开一条迁移头或手改生成代码。跨模块修改以小型已约定契约合并，不能最后一次性暴力resolve冲突。无副作用文本型任务可以并行，runtime/删除/费用等需要完整反例。\n\n每任务必须记录：base/source/build/stack SHA、实际命令与exit code、模型和用量、样本与失败、UI录像/顶层截图/语义树、数据/回执探针、独立review、回滚。只有静态检查不算模拟器验收。没有接入的命令/模拟器/凭据必须显式NOT_RUN/BLOCKED，不能写占位测试再宣布通过。\n\n保持六槽“有意义地”推进，而不是强制六个进程做忙碌工作。审查积压>3时转两槽去审查；磁盘/内存不足降HEAVY；同问题三轮不改善先归因，禁止无限重复审计和小修。失败是结果，不是改阈值理由。\n\n一直推进到Q08能给出分层完整结论，或所有可执行任务已结束且余项均有真实外部/预算阻塞。停止时输出：已合并SHA、每个value gate状态、未过原因、可运行候选与安全回退、原O-01/Q-07/Q-08状态。不要声称真人喜爱/留存/学习效果或触觉舒适度已被合成测试证明。\n"}, {"id": "05_agents/WORKFLOW.md", "title": "六后台Agent持续工作规约", "group": "05_agents", "html": "<h1>六后台Agent持续工作规约<\/h1>\n<h2>权威<\/h2>\n<p>规格：收编后仓库内V4 tasks.json。运行状态：沿现有fleet单一真源，不同时维护ZIP、TASK_INDEX和手写表三份事实。原V3 ID只引用，原开放义务继续原号。新发现用V4子编号，先查重复，避免历史FIX撞号。<\/p>\n<h2>角色流动<\/h2>\n<p>Leader负责依赖、全局裁决、合并与证据；六后台槽通常为四实现+一review+一测试，也可三实现+两review+一测试。模型名称不等于质量：使用当前可用GLM/Codex/Gemini，但独立审查必须不同会话、未参与实现、看原验收而不是只听作者解释。Leader不能用同一作者自评替代独立review。<\/p>\n<h2>任务租约与路径<\/h2>\n<p>每次claim写node_id/session_id/base_sha/actual_paths/resource/lease_generation；同路径写互斥，读允许。失效租约接管后老Agent不能继续提交权威状态；其代码可作为未验证patch再审。单机不需要新外部协调服务，已有仓库的fleet状态工具足够。跨机启用必须共享同一个状态权威，不各自拿相同卡；当前远端被冻结就不绕禁令推送，用允许的bundle/局域同步并校验SHA。<\/p>\n<h2>资源<\/h2>\n<p>HEAVY=1/宿主（Flutter构建、原生模拟器、全量/大分片测试、内存密集profile共用）。API测量同样有独立预算与provider限流。轻量分析/单元测试可并行，但不能借“小测试”名义启动另一份数据库或Docker堆栈。低磁盘保护沿仓库值，未知则先检测不删除日志；保留近期failed原件与哈希清单，归档后才按已授权策略清理。<\/p>\n<h2>每张卡四个状态轴<\/h2>\n<ul>\n<li>implementation：NOT_STARTED/WORKING/REVIEW_READY/INTEGRATED。<\/li>\n<li>evidence：NOT_RUN/PASS/FAIL/BLOCKED。<\/li>\n<li>release：INTERNAL_ONLY/ELIGIBLE/EXTERNAL_BLOCKED。<\/li>\n<li>design：PROPOSED/APPROVED（只对风格）。<\/li>\n<\/ul>\n<p>依赖默认要求前驱implementation已INTEGRATED且其适用evidence=PASS；设计卡PASS只代表契约完整，不代表真人批准。Q类评测FAIL不阻止归档报告，但阻止相关live启用与最终value gate。发现已有实现满足则evidence-only；禁止无意义重新编码。<\/p>\n<h2>有界修复<\/h2>\n<p>同卡首轮定位→修复→同原例验证→受影响slice→集成复验。最多3轮未改善就停扩散，记录最小反例、候选原因、需要新实验；能做其他卡就继续。不得为关闭状态把FAIL改成“诚实PASS”，不得调整oracle/移除难例/把生成流标成no_model。golden更新必须附变更原因。<\/p>\n<h2>交接五行<\/h2>\n<p>当前任务与base/integrated SHA；已完成行为及证据；明确失败/未测；持有锁与释放条件；下一条可执行动作。上下文压缩前写入，下一Agent从证据文件恢复，不重听几十页聊天。<\/p>\n", "text": "# 六后台Agent持续工作规约\n\n## 权威\n规格：收编后仓库内V4 tasks.json。运行状态：沿现有fleet单一真源，不同时维护ZIP、TASK_INDEX和手写表三份事实。原V3 ID只引用，原开放义务继续原号。新发现用V4子编号，先查重复，避免历史FIX撞号。\n\n## 角色流动\nLeader负责依赖、全局裁决、合并与证据；六后台槽通常为四实现+一review+一测试，也可三实现+两review+一测试。模型名称不等于质量：使用当前可用GLM/Codex/Gemini，但独立审查必须不同会话、未参与实现、看原验收而不是只听作者解释。Leader不能用同一作者自评替代独立review。\n\n## 任务租约与路径\n每次claim写node_id/session_id/base_sha/actual_paths/resource/lease_generation；同路径写互斥，读允许。失效租约接管后老Agent不能继续提交权威状态；其代码可作为未验证patch再审。单机不需要新外部协调服务，已有仓库的fleet状态工具足够。跨机启用必须共享同一个状态权威，不各自拿相同卡；当前远端被冻结就不绕禁令推送，用允许的bundle/局域同步并校验SHA。\n\n## 资源\nHEAVY=1/宿主（Flutter构建、原生模拟器、全量/大分片测试、内存密集profile共用）。API测量同样有独立预算与provider限流。轻量分析/单元测试可并行，但不能借“小测试”名义启动另一份数据库或Docker堆栈。低磁盘保护沿仓库值，未知则先检测不删除日志；保留近期failed原件与哈希清单，归档后才按已授权策略清理。\n\n## 每张卡四个状态轴\n- implementation：NOT_STARTED/WORKING/REVIEW_READY/INTEGRATED。\n- evidence：NOT_RUN/PASS/FAIL/BLOCKED。\n- release：INTERNAL_ONLY/ELIGIBLE/EXTERNAL_BLOCKED。\n- design：PROPOSED/APPROVED（只对风格）。\n\n依赖默认要求前驱implementation已INTEGRATED且其适用evidence=PASS；设计卡PASS只代表契约完整，不代表真人批准。Q类评测FAIL不阻止归档报告，但阻止相关live启用与最终value gate。发现已有实现满足则evidence-only；禁止无意义重新编码。\n\n## 有界修复\n同卡首轮定位→修复→同原例验证→受影响slice→集成复验。最多3轮未改善就停扩散，记录最小反例、候选原因、需要新实验；能做其他卡就继续。不得为关闭状态把FAIL改成“诚实PASS”，不得调整oracle/移除难例/把生成流标成no_model。golden更新必须附变更原因。\n\n## 交接五行\n当前任务与base/integrated SHA；已完成行为及证据；明确失败/未测；持有锁与释放条件；下一条可执行动作。上下文压缩前写入，下一Agent从证据文件恢复，不重听几十页聊天。\n"}, {"id": "06_evaluation/CLAIMS_LEDGER.md", "title": "对外主张与证据账本", "group": "06_evaluation", "html": "<h1>对外主张与证据账本<\/h1>\n<table>\n<thead>\n<tr>\n<th>主张<\/th>\n<th>当前允许程度<\/th>\n<th>所需新证据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sparkle采用暖纸像素设计<\/td>\n<td>只能称候选设计/内部预览<\/td>\n<td>团队设计决定+实际build多端截图<\/td>\n<\/tr>\n<tr>\n<td>纠正后会影响后续安排<\/td>\n<td>设计目标；V3有机制不等于V4效果<\/td>\n<td>M13含跨scope/撤回的运行结果<\/td>\n<\/tr>\n<tr>\n<td>越用越懂、越用越好<\/td>\n<td>尚未被当前负结果证明<\/td>\n<td>M08–M14联合通过，真实用户证据另列<\/td>\n<\/tr>\n<tr>\n<td>自适应优于不用记忆<\/td>\n<td>不能引用修前0.65或单一基线<\/td>\n<td>新holdout同预算四臂，效应与区间<\/td>\n<\/tr>\n<tr>\n<td>数据飞轮已接通<\/td>\n<td>可归因于S07的实现/测试报告，不外推全流量<\/td>\n<td>呈现→结果→有效策略真实追踪与覆盖<\/td>\n<\/tr>\n<tr>\n<td>104/104真模型请求成功<\/td>\n<td>只说明指定gRPC测量无传输error<\/td>\n<td>质量/有效内容/App链路独立验证<\/td>\n<\/tr>\n<tr>\n<td>每次成本$0.00122<\/td>\n<td>不采用，统计边界不足<\/td>\n<td>全attempt+核验价格+unknown清单<\/td>\n<\/tr>\n<tr>\n<td>学习效果提升<\/td>\n<td>未验证<\/td>\n<td>真实独立学习检验，不能用Agent解题代替<\/td>\n<\/tr>\n<tr>\n<td>像素风比所有竞品更好<\/td>\n<td>不允许<\/td>\n<td>无客观通用排序；只报明确对照的用户结果<\/td>\n<\/tr>\n<tr>\n<td>商业可上线<\/td>\n<td>原外部发布门未全闭<\/td>\n<td>O-01/Q-07/Q-08与V4发布条件均具备证据<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>无来源的不贴“已验证”印章。示例账号、模拟数据、预录回放、真实推理分别标识；不要把演示里的种子人生称用户自己的历史。<\/p>\n", "text": "# 对外主张与证据账本\n\n| 主张 | 当前允许程度 | 所需新证据 |\n|---|---|---|\n| Sparkle采用暖纸像素设计 | 只能称候选设计/内部预览 | 团队设计决定+实际build多端截图 |\n| 纠正后会影响后续安排 | 设计目标；V3有机制不等于V4效果 | M13含跨scope/撤回的运行结果 |\n| 越用越懂、越用越好 | 尚未被当前负结果证明 | M08–M14联合通过，真实用户证据另列 |\n| 自适应优于不用记忆 | 不能引用修前0.65或单一基线 | 新holdout同预算四臂，效应与区间 |\n| 数据飞轮已接通 | 可归因于S07的实现/测试报告，不外推全流量 | 呈现→结果→有效策略真实追踪与覆盖 |\n| 104/104真模型请求成功 | 只说明指定gRPC测量无传输error | 质量/有效内容/App链路独立验证 |\n| 每次成本$0.00122 | 不采用，统计边界不足 | 全attempt+核验价格+unknown清单 |\n| 学习效果提升 | 未验证 | 真实独立学习检验，不能用Agent解题代替 |\n| 像素风比所有竞品更好 | 不允许 | 无客观通用排序；只报明确对照的用户结果 |\n| 商业可上线 | 原外部发布门未全闭 | O-01/Q-07/Q-08与V4发布条件均具备证据 |\n\n无来源的不贴“已验证”印章。示例账号、模拟数据、预录回放、真实推理分别标识；不要把演示里的种子人生称用户自己的历史。\n"}, {"id": "06_evaluation/EVALUATION_PROTOCOL.md", "title": "V4 验证协议：画面、行为、效用分别验", "group": "06_evaluation", "html": "<h1>V4 验证协议：画面、行为、效用分别验<\/h1>\n<h2>五层证据<\/h2>\n<p>L0=静态/合约；L1=可控服务模拟；L2=真实模型调用但合成用户；L3=真实App/运行栈/模拟器或桌面交互；L4=物理设备/真实用户。每份报告写明层级。L0全绿不能替L3；L3角色扮演不能替真实学习或商业留存；感官调用正确不能替硬件感觉舒适。<\/p>\n<h2>原始证据<\/h2>\n<p>每个run写代码SHA、栈启动SHA、build、迁移头、config flags、模型requested/actual、root_request/attempt、设备/分辨率/DPR/网络、开始结束、时区、真实/控制钟、测试输入、oracle来源、失败与重试。引用的截图必须是最上层实际window/overlay，不从首个RepaintBoundary盲抓。关键路径UI操作，不通过API建好账号/完成任务后说用户能做到；只读DB探针是证明，不替代交互。<\/p>\n<h2>四臂效用实验<\/h2>\n<p>A=冻结V3当前部署逻辑（仅剔除已知不合法安全输入，不人为削弱）；B=无可选历史；C=V4语义控制+所有<strong>合法<\/strong>历史；D=V4语义控制+效用筛选历史。相同当前约束、资料、工具、模型和最大预算；token实际差异单报。不能给D更多历史后称算法更好。<\/p>\n<p>先用30开发episode找协议错误，冻结schema/阈值/prompt/model；再独立生成至少30profile×4episode=120 holdout episode，每臂相同生命周期。按profile簇bootstrap置信区间；两次seed检查敏感性。每episode最多4个决策轮，必要时3seed仅在离线轻量回放，避免未经授权放大live成本。默认分批20episode，在额度允许范围按原顺序运行；超预算暂停并保留全部，不能换简单样本。<\/p>\n<p>测试生成者与实现者隔离。测试operator可读隐藏真值，但AUT只能收到真实用户会说的话和已授权历史；用户模拟器不读取AUT策略名字来迎合。LLM judge若使用，匿名打乱臂顺序、冻结rubric、核对引用，以硬规则检查安全/权限/证据；分歧样本保留，不能用同一实现Agent自夸做终审。<\/p>\n<p>结果指标M08–M14联合判定。推荐同时报告原冻结utility：resolved+1/unresolved−1/wrong decision−0.4/question−0.15/control intrusion−0.6，避免通过乱问或无限输出行动刷成功。该utility是协议，不是心理学效用。不能只比较比自己更弱的fixed_policy。<\/p>\n<h2>UI/UX闭环<\/h2>\n<p>基线→相同数据/route新风格→独立审查→具体缺陷→修复→同状态重截。严重度：A=无法完成/误导成功/隐私破坏；B=核心操作被遮挡、难定位、关键信息不可读、页面语义冲突；C=非核心装饰/一致性差；D=偏好建议。A/B=0方可发布。不同审查者意见不能平均掩盖A缺陷。<\/p>\n<p>矩阵：Android主设备配置、Web、macOS；各主旅程至少默认/离线/失败/取消/未知/过期/重开。组件层覆盖theme×font×DPR组合，旅程层用风险组合/成对覆盖减少笛卡尔爆炸。profile帧测与golden静态测分开；音/震默认不在自动回归中真的反复播放。<\/p>\n<h2>回归预算与任务分割<\/h2>\n<p>沿现有测试片区运行，风险映射到整链串行分片。大批次只允许1HEAVY；轻量selectors/contract/unit可与其并行。每修复先最小红例→改动→绿→受影响slice→集成SHA复验，禁止为绿而删断言/放宽基线/重新命名fallback。视觉golden变更需独立签理由。<\/p>\n<h2>不能自动证明的事<\/h2>\n<p>“用户觉得温暖”“一眼惊艳”“喜欢像素风”“长期离不开”“商业付费”“音质舒适”“学习真的提高”。本阶段不派人工任务，但也不捏造Agent代理这些证据；报告写NOT_MEASURED_HUMAN/DEVICE_UNVERIFIED。产品可达到工程候选，不能因此宣称PMF。<\/p>\n<h2>失败处理<\/h2>\n<p>只要硬边界失败，隔离相关flag，保留V3其他功能。效果门不通过，保留观察结果并启动本范围最多三轮归因修正；三轮无进展→交付反例和下一实验，不继续无限audit farm。Q任务的implementation可完成，value verdict仍FAIL；终门读取后者。Budget/权限缺失记明确BLOCKED，不是PASS或无声SKIP。<\/p>\n", "text": "# V4 验证协议：画面、行为、效用分别验\n\n## 五层证据\nL0=静态/合约；L1=可控服务模拟；L2=真实模型调用但合成用户；L3=真实App/运行栈/模拟器或桌面交互；L4=物理设备/真实用户。每份报告写明层级。L0全绿不能替L3；L3角色扮演不能替真实学习或商业留存；感官调用正确不能替硬件感觉舒适。\n\n## 原始证据\n每个run写代码SHA、栈启动SHA、build、迁移头、config flags、模型requested/actual、root_request/attempt、设备/分辨率/DPR/网络、开始结束、时区、真实/控制钟、测试输入、oracle来源、失败与重试。引用的截图必须是最上层实际window/overlay，不从首个RepaintBoundary盲抓。关键路径UI操作，不通过API建好账号/完成任务后说用户能做到；只读DB探针是证明，不替代交互。\n\n## 四臂效用实验\nA=冻结V3当前部署逻辑（仅剔除已知不合法安全输入，不人为削弱）；B=无可选历史；C=V4语义控制+所有**合法**历史；D=V4语义控制+效用筛选历史。相同当前约束、资料、工具、模型和最大预算；token实际差异单报。不能给D更多历史后称算法更好。\n\n先用30开发episode找协议错误，冻结schema/阈值/prompt/model；再独立生成至少30profile×4episode=120 holdout episode，每臂相同生命周期。按profile簇bootstrap置信区间；两次seed检查敏感性。每episode最多4个决策轮，必要时3seed仅在离线轻量回放，避免未经授权放大live成本。默认分批20episode，在额度允许范围按原顺序运行；超预算暂停并保留全部，不能换简单样本。\n\n测试生成者与实现者隔离。测试operator可读隐藏真值，但AUT只能收到真实用户会说的话和已授权历史；用户模拟器不读取AUT策略名字来迎合。LLM judge若使用，匿名打乱臂顺序、冻结rubric、核对引用，以硬规则检查安全/权限/证据；分歧样本保留，不能用同一实现Agent自夸做终审。\n\n结果指标M08–M14联合判定。推荐同时报告原冻结utility：resolved+1/unresolved−1/wrong decision−0.4/question−0.15/control intrusion−0.6，避免通过乱问或无限输出行动刷成功。该utility是协议，不是心理学效用。不能只比较比自己更弱的fixed_policy。\n\n## UI/UX闭环\n基线→相同数据/route新风格→独立审查→具体缺陷→修复→同状态重截。严重度：A=无法完成/误导成功/隐私破坏；B=核心操作被遮挡、难定位、关键信息不可读、页面语义冲突；C=非核心装饰/一致性差；D=偏好建议。A/B=0方可发布。不同审查者意见不能平均掩盖A缺陷。\n\n矩阵：Android主设备配置、Web、macOS；各主旅程至少默认/离线/失败/取消/未知/过期/重开。组件层覆盖theme×font×DPR组合，旅程层用风险组合/成对覆盖减少笛卡尔爆炸。profile帧测与golden静态测分开；音/震默认不在自动回归中真的反复播放。\n\n## 回归预算与任务分割\n沿现有测试片区运行，风险映射到整链串行分片。大批次只允许1HEAVY；轻量selectors/contract/unit可与其并行。每修复先最小红例→改动→绿→受影响slice→集成SHA复验，禁止为绿而删断言/放宽基线/重新命名fallback。视觉golden变更需独立签理由。\n\n## 不能自动证明的事\n“用户觉得温暖”“一眼惊艳”“喜欢像素风”“长期离不开”“商业付费”“音质舒适”“学习真的提高”。本阶段不派人工任务，但也不捏造Agent代理这些证据；报告写NOT_MEASURED_HUMAN/DEVICE_UNVERIFIED。产品可达到工程候选，不能因此宣称PMF。\n\n## 失败处理\n只要硬边界失败，隔离相关flag，保留V3其他功能。效果门不通过，保留观察结果并启动本范围最多三轮归因修正；三轮无进展→交付反例和下一实验，不继续无限audit farm。Q任务的implementation可完成，value verdict仍FAIL；终门读取后者。Budget/权限缺失记明确BLOCKED，不是PASS或无声SKIP。\n"}, {"id": "08_release/ROLLOUT_AND_OPERATIONS.md", "title": "上线、改风格与可回退部署", "group": "08_release", "html": "<h1>上线、改风格与可回退部署<\/h1>\n<h2>阶段<\/h2>\n<ol>\n<li>Contract与取证：绑定V3现状，原修复不重做。<\/li>\n<li>单垂直切片：首页→卡住→校准→Hybrid→证据；pixel仅内部preview。<\/li>\n<li>家族迁移与AI效用影子：逐家族接统一组件；shadow策略不改变生产动作。<\/li>\n<li>受限live：硬边界、效用门、同预算对照通过的scope才启用；保留V3 fallback。<\/li>\n<li>发布候选：全部活跃模块覆核、各flags/model/schema/assets与证据同版本；原外部发布门仍有效。<\/li>\n<\/ol>\n<p>每阶段为依赖门，不按日历强行推进。用户未定视觉方向不阻塞内部实现与AI工作，但默认公开界面不能替团队拍板；“approved”必须有明确决定记录，不能由Agent看到自己做得漂亮就改字段。<\/p>\n<h2>可替换配置<\/h2>\n<p><code>pixel.preview<\/code>、<code>memory.utility_gate<\/code>、<code>aurora.semantic_selector<\/code>、<code>experience.feedback_v4<\/code>、<code>episode.resume_v4<\/code>按既有manifest登记（名字需适配当前仓库）。每项off/shadow/live，配置版本和最后变更来源可查。shadow不得偷偷改任务/记忆/提示频率。关像素只换呈现，不改变账本；关selector回V3安全策略，撤回与权限永远不能关。<\/p>\n<h2>服务运维<\/h2>\n<p>沿现有服务监督与启动脚本修复CWD依赖/上游掉线检测（FIX530/542），不要以Agent会持续看终端代替守护。网关、HTTP、gRPC、Celery/Redis/DB分别health与ready；恢复动作有限重试和告警，不能通过反复重启隐藏根因。公网HTTPS/WSS、证书、系统权限、费用授权在原O-01中处理，V4不复制一张“申请账号”工程卡。<\/p>\n<h2>回滚<\/h2>\n<p>UI profile版本可立即回classic；AI策略按版本回退；新字段向后兼容先扩后缩；数据撤回不能回滚成重新可用。artifact/index重建不碰源文件；非线性投影按有效事件回放。备份要做真实restore检查exit code/行计数/关键样本，不能“脚本返回0”就认成功。日志/截图不泄露用户私有内容，匿名化保留源证据哈希。<\/p>\n<h2>发布工件<\/h2>\n<p>build ID、git SHA、迁移头、proto版本、主题token版本、合法资产账本、flags、模型配置与价格版本、指标报告、完整失败清单、已知外部门、回滚命令、启动/复位说明。zip与源仓库冻结版本一致，不自动推公开仓库/提交赛事/接受条款。<\/p>\n<h2>演示<\/h2>\n<p>演示展示一条真实闭环，不快剪隐藏等待；示例人生/预录/真实调用各自标识。为稳定性预热服务可行，但报告冷启动和warm结果不同。禁止宣称“决赛10/4—10/7”或复用未经核验赛程；本包只做产品工程与演示载体，不决定赛事事实。<\/p>\n", "text": "# 上线、改风格与可回退部署\n\n## 阶段\n1. Contract与取证：绑定V3现状，原修复不重做。\n2. 单垂直切片：首页→卡住→校准→Hybrid→证据；pixel仅内部preview。\n3. 家族迁移与AI效用影子：逐家族接统一组件；shadow策略不改变生产动作。\n4. 受限live：硬边界、效用门、同预算对照通过的scope才启用；保留V3 fallback。\n5. 发布候选：全部活跃模块覆核、各flags/model/schema/assets与证据同版本；原外部发布门仍有效。\n\n每阶段为依赖门，不按日历强行推进。用户未定视觉方向不阻塞内部实现与AI工作，但默认公开界面不能替团队拍板；“approved”必须有明确决定记录，不能由Agent看到自己做得漂亮就改字段。\n\n## 可替换配置\n`pixel.preview`、`memory.utility_gate`、`aurora.semantic_selector`、`experience.feedback_v4`、`episode.resume_v4`按既有manifest登记（名字需适配当前仓库）。每项off/shadow/live，配置版本和最后变更来源可查。shadow不得偷偷改任务/记忆/提示频率。关像素只换呈现，不改变账本；关selector回V3安全策略，撤回与权限永远不能关。\n\n## 服务运维\n沿现有服务监督与启动脚本修复CWD依赖/上游掉线检测（FIX530/542），不要以Agent会持续看终端代替守护。网关、HTTP、gRPC、Celery/Redis/DB分别health与ready；恢复动作有限重试和告警，不能通过反复重启隐藏根因。公网HTTPS/WSS、证书、系统权限、费用授权在原O-01中处理，V4不复制一张“申请账号”工程卡。\n\n## 回滚\nUI profile版本可立即回classic；AI策略按版本回退；新字段向后兼容先扩后缩；数据撤回不能回滚成重新可用。artifact/index重建不碰源文件；非线性投影按有效事件回放。备份要做真实restore检查exit code/行计数/关键样本，不能“脚本返回0”就认成功。日志/截图不泄露用户私有内容，匿名化保留源证据哈希。\n\n## 发布工件\nbuild ID、git SHA、迁移头、proto版本、主题token版本、合法资产账本、flags、模型配置与价格版本、指标报告、完整失败清单、已知外部门、回滚命令、启动/复位说明。zip与源仓库冻结版本一致，不自动推公开仓库/提交赛事/接受条款。\n\n## 演示\n演示展示一条真实闭环，不快剪隐藏等待；示例人生/预录/真实调用各自标识。为稳定性预热服务可行，但报告冷启动和warm结果不同。禁止宣称“决赛10/4—10/7”或复用未经核验赛程；本包只做产品工程与演示载体，不决定赛事事实。\n"}, {"id": "07_research/RESEARCH_AND_CHOICES.md", "title": "前沿依据、采用与边界", "group": "07_research", "html": "<h1>前沿依据、采用与边界<\/h1>\n<p>这里的研究支持设计动机，不代替产品试验；本包自己的方案明确为提案。没有“超越所有系统”的证据。<\/p>\n<h2>R01 · Effective context engineering for AI agents<\/h2>\n<p>Anthropic｜2025-09-29｜<a href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\">原始来源<\/a><\/p>\n<p>工程建议：上下文有限，按任务选择高信号资料；支持渐进加载。<\/p>\n<p><strong>Sparkle选择：<\/strong> 采用小而相关的context与来源；不能把少token自动等于更智能。<\/p>\n<h2>R02 · MemRL: Self-Evolving Agents via Runtime Reinforcement Learning on Episodic Memory<\/h2>\n<p>arXiv｜2026-02-12 v2｜<a href=\"https://arxiv.org/abs/2601.03192\">原始来源<\/a><\/p>\n<p>研究把稳定推理与可塑记忆分开，检索结合语义和环境反馈效用。<\/p>\n<p><strong>Sparkle选择：<\/strong> 借鉴效用选择；不照搬基准奖励到人的学习，不宣称Sparkle已有论文收益。<\/p>\n<h2>R03 · Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models<\/h2>\n<p>arXiv / ICLR2026｜2026-03-29 v3｜<a href=\"https://arxiv.org/abs/2510.04618\">原始来源<\/a><\/p>\n<p>使用增量生成、反思、整理形成可演化context/playbook，避免反复整体改写丢细节。<\/p>\n<p><strong>Sparkle选择：<\/strong> 映射到受限经验卡与版本；不让线上模型任意改权限或系统prompt。<\/p>\n<h2>R04 · Hindsight is 20/20: Building Agent Memory that Retains, Recalls, and Reflects<\/h2>\n<p>arXiv｜2025-12｜<a href=\"https://arxiv.org/abs/2512.12818\">原始来源<\/a><\/p>\n<p>区分多种记忆信息并组织retain/recall/reflect过程。<\/p>\n<p><strong>Sparkle选择：<\/strong> 作为现有五层模型的对照，不重复造新的记忆数据库。<\/p>\n<h2>R05 · Web Content Accessibility Guidelines 2.2<\/h2>\n<p>W3C｜2024-12-12 recommendation｜<a href=\"https://www.w3.org/TR/WCAG22/\">原始来源<\/a><\/p>\n<p>可测的对比、焦点、目标尺寸、缩放和替代操作要求。<\/p>\n<p><strong>Sparkle选择：<\/strong> 工程测关键条款；48dp为项目标准，不称是全部WCAG条款或已全面认证。<\/p>\n<h2>R06 · CustomPainter.semanticsBuilder<\/h2>\n<p>Flutter API｜accessed 2026-09-28｜<a href=\"https://api.flutter.dev/flutter/rendering/CustomPainter/semanticsBuilder.html\">原始来源<\/a><\/p>\n<p>自绘图形的可访问语义需显式构建，不能假设像素画布自带节点。<\/p>\n<p><strong>Sparkle选择：<\/strong> 装饰与操作分开，星图有语义列表；不把所有原生控件画成一张图。<\/p>\n<h2>R07 · Playing haptics<\/h2>\n<p>Apple HIG｜accessed 2026-09-28｜<a href=\"https://developer.apple.com/design/human-interface-guidelines/playing-haptics\">原始来源<\/a><\/p>\n<p>触觉使用一致的语义、短促、克制并让用户可关闭，与视觉声音互补。<\/p>\n<p><strong>Sparkle选择：<\/strong> 按回执统一反馈，支持平台差异；不证明模拟器可评价真实触感。<\/p>\n<h2>R08 · Android haptics API reference<\/h2>\n<p>Android Developers｜accessed 2026-09-28｜<a href=\"https://developer.android.com/develop/ui/views/haptics/haptics-apis\">原始来源<\/a><\/p>\n<p>不同设备支持不同反馈能力，应选择语义接口并探测适配。<\/p>\n<p><strong>Sparkle选择：<\/strong> unsupported静默等价，不借长震动制造“有反馈”。<\/p>\n<h2>R09 · Habitica — Gamify Your Life<\/h2>\n<p>Habitica｜accessed 2026-09-28｜<a href=\"https://habitica.com/\">原始来源<\/a><\/p>\n<p>官方产品把任务、习惯与角色、奖励、社交玩法结合。<\/p>\n<p><strong>Sparkle选择：<\/strong> 像素/RPG任务不是独创护城河；不复制惩罚机制和游戏资产。<\/p>\n<h2>R10 · About Finch<\/h2>\n<p>Finch｜accessed 2026-09-28｜<a href=\"https://finchcare.com/about-finch\">原始来源<\/a><\/p>\n<p>官方产品把虚拟伙伴、目标、反思和陪伴式成长相连。<\/p>\n<p><strong>Sparkle选择：<\/strong> 视觉陪伴已有竞品；Sparkle应靠可校准学习协作而非更黏人的宠物。<\/p>\n<h2>R11 · Generative AI without guardrails can harm learning: Evidence from high school mathematics<\/h2>\n<p>PNAS｜2025｜<a href=\"https://doi.org/10.1073/pnas.2422633122\">原始来源<\/a><\/p>\n<p>特定高中数学实验区分AI辅助练习与移除AI后的独立表现，提示工具设计影响技能获得。<\/p>\n<p><strong>Sparkle选择：<\/strong> 保留human_required和独立检验；不把该研究外推为本产品已提高大学生成绩。<\/p>\n<h2>R12 · LongMemEval: Benchmarking Chat Assistants on Long-Term Interactive Memory<\/h2>\n<p>arXiv｜2024-10｜<a href=\"https://arxiv.org/abs/2410.10813\">原始来源<\/a><\/p>\n<p>覆盖长期记忆中的多会话、时序、更新、抽取与拒答等能力。<\/p>\n<p><strong>Sparkle选择：<\/strong> 借鉴测试切片，另加行动效用；记忆问答高分不等于用户成长。<\/p>\n<h2>R13 · Hidden in Memory: Sleeper Memory Poisoning in LLM Agents<\/h2>\n<p>arXiv｜2026-05｜<a href=\"https://arxiv.org/abs/2605.15338\">原始来源<\/a><\/p>\n<p>研究持久记忆可能将不可信输入转化为后续影响，提示来源权限必须保留。<\/p>\n<p><strong>Sparkle选择：<\/strong> 测试资料→反思→假用户偏好的污染链；不提供进攻性产品能力。<\/p>\n<h2>R14 · Performance best practices<\/h2>\n<p>Flutter｜accessed 2026-09-28｜<a href=\"https://docs.flutter.dev/perf/best-practices\">原始来源<\/a><\/p>\n<p>关注布局/构建/绘制开销及昂贵saveLayer等路径，需实际profile。<\/p>\n<p><strong>Sparkle选择：<\/strong> 像素装饰需预算，不能用debug截图证明帧率。<\/p>\n<h2>R15 · Effective harnesses for long-running agents<\/h2>\n<p>Anthropic｜2025-11-26｜<a href=\"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents\">原始来源<\/a><\/p>\n<p>长期agent需要持续状态、增量工作和可检查交接，而非仅一条长prompt。<\/p>\n<p><strong>Sparkle选择：<\/strong> 沿用当前fleet/worktree/证据，不再造一个多Agent管理平台。<\/p>\n<h2>我们提出的组合<\/h2>\n<p>把合法来源、历史效用、决策性澄清、六字段策略、真实回执与统一感官语义连成一条链，是针对Sparkle现有工程的设计综合，不声称原创科学定理或专利。首要实验是该组合是否赢过更简单的无历史基线。风险不是缺少最新术语，而是选用了无用经验、把代理指标当学习结果、用漂亮动效掩盖慢响应。<\/p>\n", "text": "# 前沿依据、采用与边界\n\n这里的研究支持设计动机，不代替产品试验；本包自己的方案明确为提案。没有“超越所有系统”的证据。\n\n## R01 · Effective context engineering for AI agents\n\nAnthropic｜2025-09-29｜[原始来源](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n\n工程建议：上下文有限，按任务选择高信号资料；支持渐进加载。\n\n**Sparkle选择：** 采用小而相关的context与来源；不能把少token自动等于更智能。\n\n## R02 · MemRL: Self-Evolving Agents via Runtime Reinforcement Learning on Episodic Memory\n\narXiv｜2026-02-12 v2｜[原始来源](https://arxiv.org/abs/2601.03192)\n\n研究把稳定推理与可塑记忆分开，检索结合语义和环境反馈效用。\n\n**Sparkle选择：** 借鉴效用选择；不照搬基准奖励到人的学习，不宣称Sparkle已有论文收益。\n\n## R03 · Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models\n\narXiv / ICLR2026｜2026-03-29 v3｜[原始来源](https://arxiv.org/abs/2510.04618)\n\n使用增量生成、反思、整理形成可演化context/playbook，避免反复整体改写丢细节。\n\n**Sparkle选择：** 映射到受限经验卡与版本；不让线上模型任意改权限或系统prompt。\n\n## R04 · Hindsight is 20/20: Building Agent Memory that Retains, Recalls, and Reflects\n\narXiv｜2025-12｜[原始来源](https://arxiv.org/abs/2512.12818)\n\n区分多种记忆信息并组织retain/recall/reflect过程。\n\n**Sparkle选择：** 作为现有五层模型的对照，不重复造新的记忆数据库。\n\n## R05 · Web Content Accessibility Guidelines 2.2\n\nW3C｜2024-12-12 recommendation｜[原始来源](https://www.w3.org/TR/WCAG22/)\n\n可测的对比、焦点、目标尺寸、缩放和替代操作要求。\n\n**Sparkle选择：** 工程测关键条款；48dp为项目标准，不称是全部WCAG条款或已全面认证。\n\n## R06 · CustomPainter.semanticsBuilder\n\nFlutter API｜accessed 2026-09-28｜[原始来源](https://api.flutter.dev/flutter/rendering/CustomPainter/semanticsBuilder.html)\n\n自绘图形的可访问语义需显式构建，不能假设像素画布自带节点。\n\n**Sparkle选择：** 装饰与操作分开，星图有语义列表；不把所有原生控件画成一张图。\n\n## R07 · Playing haptics\n\nApple HIG｜accessed 2026-09-28｜[原始来源](https://developer.apple.com/design/human-interface-guidelines/playing-haptics)\n\n触觉使用一致的语义、短促、克制并让用户可关闭，与视觉声音互补。\n\n**Sparkle选择：** 按回执统一反馈，支持平台差异；不证明模拟器可评价真实触感。\n\n## R08 · Android haptics API reference\n\nAndroid Developers｜accessed 2026-09-28｜[原始来源](https://developer.android.com/develop/ui/views/haptics/haptics-apis)\n\n不同设备支持不同反馈能力，应选择语义接口并探测适配。\n\n**Sparkle选择：** unsupported静默等价，不借长震动制造“有反馈”。\n\n## R09 · Habitica — Gamify Your Life\n\nHabitica｜accessed 2026-09-28｜[原始来源](https://habitica.com/)\n\n官方产品把任务、习惯与角色、奖励、社交玩法结合。\n\n**Sparkle选择：** 像素/RPG任务不是独创护城河；不复制惩罚机制和游戏资产。\n\n## R10 · About Finch\n\nFinch｜accessed 2026-09-28｜[原始来源](https://finchcare.com/about-finch)\n\n官方产品把虚拟伙伴、目标、反思和陪伴式成长相连。\n\n**Sparkle选择：** 视觉陪伴已有竞品；Sparkle应靠可校准学习协作而非更黏人的宠物。\n\n## R11 · Generative AI without guardrails can harm learning: Evidence from high school mathematics\n\nPNAS｜2025｜[原始来源](https://doi.org/10.1073/pnas.2422633122)\n\n特定高中数学实验区分AI辅助练习与移除AI后的独立表现，提示工具设计影响技能获得。\n\n**Sparkle选择：** 保留human_required和独立检验；不把该研究外推为本产品已提高大学生成绩。\n\n## R12 · LongMemEval: Benchmarking Chat Assistants on Long-Term Interactive Memory\n\narXiv｜2024-10｜[原始来源](https://arxiv.org/abs/2410.10813)\n\n覆盖长期记忆中的多会话、时序、更新、抽取与拒答等能力。\n\n**Sparkle选择：** 借鉴测试切片，另加行动效用；记忆问答高分不等于用户成长。\n\n## R13 · Hidden in Memory: Sleeper Memory Poisoning in LLM Agents\n\narXiv｜2026-05｜[原始来源](https://arxiv.org/abs/2605.15338)\n\n研究持久记忆可能将不可信输入转化为后续影响，提示来源权限必须保留。\n\n**Sparkle选择：** 测试资料→反思→假用户偏好的污染链；不提供进攻性产品能力。\n\n## R14 · Performance best practices\n\nFlutter｜accessed 2026-09-28｜[原始来源](https://docs.flutter.dev/perf/best-practices)\n\n关注布局/构建/绘制开销及昂贵saveLayer等路径，需实际profile。\n\n**Sparkle选择：** 像素装饰需预算，不能用debug截图证明帧率。\n\n## R15 · Effective harnesses for long-running agents\n\nAnthropic｜2025-11-26｜[原始来源](https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents)\n\n长期agent需要持续状态、增量工作和可检查交接，而非仅一条长prompt。\n\n**Sparkle选择：** 沿用当前fleet/worktree/证据，不再造一个多Agent管理平台。\n\n## 我们提出的组合\n\n把合法来源、历史效用、决策性澄清、六字段策略、真实回执与统一感官语义连成一条链，是针对Sparkle现有工程的设计综合，不声称原创科学定理或专利。首要实验是该组合是否赢过更简单的无历史基线。风险不是缺少最新术语，而是选用了无用经验、把代理指标当学习结果、用漂亮动效掩盖慢响应。\n"}, {"id": "00_context/LATEST_ISSUE_EXCERPTS.md", "title": "最新台账片段", "group": "00_context", "html": "<h1>最新台账片段<\/h1>\n<p>来源 v3/06_agent_fleet/DYNAMIC_ISSUES.md；保留原状态而不合并猜测。<\/p>\n<p>原文件行 57<\/p>\n<p>| V3-FIX-52 | P3 | 行为事实证据无双刃消解：历史失败痕迹把「新类型」卡点系统性带偏（A-08 记忆面反例） | CONTEXT_FACT_RULES 的 recent_failure_count≥3 → skill/difficulty 证据无时间/类型关联消解——p07（plan_drift 段失败留下 ABANDONED 痕迹后，entry 真值段被历史偏差拉向 skill → 全臂 fail；no_memory 臂无痕迹反而 primary 一次解决）：记忆净收益 +0.10 accuracy 的同时存在可证伪的个体伤害案例；「当前卡点类型≠近期失败类型」的场景记忆面是负资产 | wt393 v3-output/WT393-A08-ABLATION/REPORT.md §5-4 + raw/{full,no_memory}.jsonl（p07 对照） | T-friction-fact-decay（组员批：失败痕迹与当前 utterance/spine 证据冲突时的降权或类型关联消解；随 A-03 迭代） | OPEN [wt474分诊:可派发|friction_diagnosis.py:1290 recent_failure_count≥阈值直给 skill/difficulty 证据、无时间/类型消解仍在场——降权或类型关联消解，随 A-03 迭代] |<\/p>\n<p>原文件行 76<\/p>\n<p>| V3-FIX-97 | P2 | 纠正通道以「错位行动」为唯一输入源：诚实 no_action 饿死纠正记忆回路（wt412 修 V3-FIX-50① 的结构性新发现 en的 no_generation_model 7条<\/td>\n<td>标签和成本口径需再校验<\/td>\n<td>所有调用均低价、fallback=0可信<\/td>\n<td>修语义与全调用计量，不改标签伪装成功<\/td>\n<\/tr>\n<tr>\n<td>S08 修后首卡6/6可见、A1a均≤180s<\/td>\n<td>指定macOS场景首卡路径有改善<\/td>\n<td>全端首价值达标、已证明留存<\/td>\n<td>继承修复；登录落点、真实回执可见性与手机窄屏增量<\/td>\n<\/tr>\n<tr>\n<td>S09 基础43目录 + F20/F26最新增量<\/td>\n<td>leaderboard自我锚/photon受限兑换有实际承载<\/td>\n<td>旧包“全关榜单和光子”仍是最终决策<\/td>\n<td>保留最新 D-COMM 语义，重新套统一视觉；不做全站综合榜<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>时间冲突消解规则<\/h2>\n<ol>\n<li>原始结果 &gt; 总结散文；较新独立复验 &gt; 较旧“待修”；当前仓库实证（由 V4 Agent 执行）&gt; 本包快照。<\/li>\n<li>FIX507、539、540、543 已有较新修复与复验，不重新派同一修复。台账 FIX52/97/535/536/541/542/545 尚在开放或裁决中；V4 按增量卡覆盖，开工再核当前代码。<\/li>\n<li>全局任务 done 表示一次工程/评测工作完成，不把诚实 FAIL 改成 PASS。V4 采用双状态：implementation 与 evidence_verdict。<\/li>\n<li>V3 的 260 场景通过主要是合约/模拟层；7日生命周期记录不是7日真人留存。资料中的 alias/model名不是本轮核验过的供应商产品名。<\/li>\n<li>旧“42模块”和较新43目录不同：onboarding已归入user，journey/recovery加入。以本包 <code>01_product/MODULE_MATRIX.json<\/code> 保留最新口径；仓库实际新增再差量登记，不凭目录存在自动开放。<\/li>\n<li>日期只作快照。此处不重复旧材料把10/4—10/7称为决赛的说法；官方赛程/资格仍需官方确认，本包不自动提交或改对外文案。<\/li>\n<\/ol>\n<h2>已有能力必须复用<\/h2>\n<p>Aurora六策略字段、五层用户模型、撤销epoch/记忆版本、真实命令回执、Human/Agent/Hybrid契约、OpenClaw唯一Runtime、dual-core路由、关系型星图真源、sprint_task_ledger/goal_today_view、context.*令牌入口，均非V4新发明。不另造Memory服务、不另造任务主表、不把主聊天图改成另一框架。<\/p>\n<h2>本轮观点的地位<\/h2>\n<p>像素风命名、页面语法、记忆效用门与学习模式都是本轮方案，不是资料里已经实现的事实。效果目标是发布验收要求，不能当现有数据写进比赛页。安全、权限与旧账本语义固定；色板、角色、声音、角切样式和导航文案可替换。<\/p>\n", "text": "# V3 基线复核与 V4 裁决\n\n## 证据范围\n本包依据 2026-09-28 LITE 信息包、当前对话与一张前端风格参考图。LITE 为文档/表格/日志性数据集合，不含可运行的产品源码，也未包含当前 App 截图；不能拿参考图当成 V3 实际屏幕。`INPUT_MANIFEST.json` 记录每个条目的哈希，`SOURCE_INDEX.json` 指向精选原始报告副本。本文中的 S 编号是用户提供的报告，不是本轮独立运行结果。\n\n## 哪些结论改变 V4\n| 基线发现 | 可支持的结论 | 不能推导的结论 | V4 增量 |\n|---|---|---|---|\n| tasks.json 104/107 done；O-01/Q-07/Q-08 TODO | 大量实现完成，仍有发布外部依赖 | 全部产品能力均实测有效/商业上线完成 | 继承，不重开；保留外部门槛 |\n| S03 修后消融 full 9/20，no_memory 11/20，四臂均零澄清 | 模拟机制中旧经验可成为负资产；纠正通路可能被 abstain 饿死 | 真实用户记忆必然有害、V3 完全无价值 | 语义判别、无提案也可纠正、记忆效用筛选与负迁移测试 |\n| S04 Q04 首轮 precision=0、invalid=10、overpersonalization=50/120、uplift=0pp | 原快照未通过自己的个性化门；后续局部修复需整体复验 | 当前代码仍精确是这些数值、所有场景都泄露 | 冻结原反例 + 新 holdout，分别报时间/版本/证据层级 |\n| S07/FIX507 后补生产写入，状态 FIXED@8e503cd8 | 生命周期已接线并有服务级证据 | 任意 delivered=用户真的看到，所有 outcome 已正确因果归因 | 保留接线；增加渲染曝光、归因完整性、延迟/缺失结果与用户可见解释 |\n| S05/S06 104 条 gRPC 真模型：L2 final p95=65.4s；L3=126.7s | 该环境存在慢深推理；ack快不等于价值快 | App全链SLO达标、质量68/104就是用户满意率 | 真有用首内容、长任务可离开、调用级成本/标签实账 |\n| S06/FIX545 带token的 no_generation_model 7条 | 标签和成本口径需再校验 | 所有调用均低价、fallback=0可信 | 修语义与全调用计量，不改标签伪装成功 |\n| S08 修后首卡6/6可见、A1a均≤180s | 指定macOS场景首卡路径有改善 | 全端首价值达标、已证明留存 | 继承修复；登录落点、真实回执可见性与手机窄屏增量 |\n| S09 基础43目录 + F20/F26最新增量 | leaderboard自我锚/photon受限兑换有实际承载 | 旧包“全关榜单和光子”仍是最终决策 | 保留最新 D-COMM 语义，重新套统一视觉；不做全站综合榜 |\n\n## 时间冲突消解规则\n1. 原始结果 > 总结散文；较新独立复验 > 较旧“待修”；当前仓库实证（由 V4 Agent 执行）> 本包快照。\n2. FIX507、539、540、543 已有较新修复与复验，不重新派同一修复。台账 FIX52/97/535/536/541/542/545 尚在开放或裁决中；V4 按增量卡覆盖，开工再核当前代码。\n3. 全局任务 done 表示一次工程/评测工作完成，不把诚实 FAIL 改成 PASS。V4 采用双状态：implementation 与 evidence_verdict。\n4. V3 的 260 场景通过主要是合约/模拟层；7日生命周期记录不是7日真人留存。资料中的 alias/model名不是本轮核验过的供应商产品名。\n5. 旧“42模块”和较新43目录不同：onboarding已归入user，journey/recovery加入。以本包 `01_product/MODULE_MATRIX.json` 保留最新口径；仓库实际新增再差量登记，不凭目录存在自动开放。\n6. 日期只作快照。此处不重复旧材料把10/4—10/7称为决赛的说法；官方赛程/资格仍需官方确认，本包不自动提交或改对外文案。\n\n## 已有能力必须复用\nAurora六策略字段、五层用户模型、撤销epoch/记忆版本、真实命令回执、Human/Agent/Hybrid契约、OpenClaw唯一Runtime、dual-core路由、关系型星图真源、sprint_task_ledger/goal_today_view、context.*令牌入口，均非V4新发明。不另造Memory服务、不另造任务主表、不把主聊天图改成另一框架。\n\n## 本轮观点的地位\n像素风命名、页面语法、记忆效用门与学习模式都是本轮方案，不是资料里已经实现的事实。效果目标是发布验收要求，不能当现有数据写进比赛页。安全、权限与旧账本语义固定；色板、角色、声音、角切样式和导航文案可替换。\n"}, {"id": "prototype/README.md", "title": "暖纸像素交互草图", "group": "prototype", "html": "<h1>暖纸像素交互草图<\/h1>\n<p>打开 DESIGN_LAB.html。页面可切换纸昼、暮色、低刺激；五个导航可点；可体验“卡住→范围选择→变化预览→本地回执→示例成果→撤回”。允许试听提示音默认关闭；打开后仅在成功的本地演示回执之后发出两段短合成音。不播放背景音乐，不调用振动接口。<\/p>\n<p>这是系统交互语法和候选色板的<strong>草图<\/strong>，不是高保真定稿，不是当前 Sparkle 的运行截图。像素插画、角色、声音资产、原生组件以及最终布局仍需设计取舍。所有内容为显式示例：没有模型、后端、用户数据和真实记忆写入，也没有模型“看懂”输入框；输入框用于展示预设场景的交互位置。<\/p>\n<p>关闭等待中的草图弹窗会取消本地模拟计时器。这只属于本地演示；产品中的取消必须遵守真实命令状态及回执，不能简单取消计时器冒充撤销已发生的提交。<\/p>\n<p><code>evidence/preview_*.png<\/code> 是本轮用Chromium运行本草图生成的截图，不是用户已有App截图。该草图无需网络，未打包字体或第三方图形资源；页内SVG为本轮程序绘制的简易符号。<\/p>\n", "text": "# 暖纸像素交互草图\n\n打开 DESIGN_LAB.html。页面可切换纸昼、暮色、低刺激；五个导航可点；可体验“卡住→范围选择→变化预览→本地回执→示例成果→撤回”。允许试听提示音默认关闭；打开后仅在成功的本地演示回执之后发出两段短合成音。不播放背景音乐，不调用振动接口。\n\n这是系统交互语法和候选色板的**草图**，不是高保真定稿，不是当前 Sparkle 的运行截图。像素插画、角色、声音资产、原生组件以及最终布局仍需设计取舍。所有内容为显式示例：没有模型、后端、用户数据和真实记忆写入，也没有模型“看懂”输入框；输入框用于展示预设场景的交互位置。\n\n关闭等待中的草图弹窗会取消本地模拟计时器。这只属于本地演示；产品中的取消必须遵守真实命令状态及回执，不能简单取消计时器冒充撤销已发生的提交。\n\n`evidence/preview_*.png` 是本轮用Chromium运行本草图生成的截图，不是用户已有App截图。该草图无需网络，未打包字体或第三方图形资源；页内SVG为本轮程序绘制的简易符号。\n"}, {"id": "reference/README.md", "title": "离线参考，不是产品实现", "group": "reference", "html": "<h1>离线参考，不是产品实现<\/h1>\n<p>contract_reference.py 仅说明可选历史先过滤后排序、真实回执再触发成功反馈、0分母N/A三个合同。分数权重未经训练校准，不证明记忆效用；内存seen集合不代替生产持久化去重；Receipt参数假定来自可信读取，不实现认证。<\/p>\n<p>生产代码必须接到已有Context Compiler、权限/epoch、账本和平台反馈能力，按任务卡在实际仓库实现。包级测试通过不能记为Sparkle V4测试通过。<\/p>\n", "text": "# 离线参考，不是产品实现\n\ncontract_reference.py 仅说明可选历史先过滤后排序、真实回执再触发成功反馈、0分母N/A三个合同。分数权重未经训练校准，不证明记忆效用；内存seen集合不代替生产持久化去重；Receipt参数假定来自可信读取，不实现认证。\n\n生产代码必须接到已有Context Compiler、权限/epoch、账本和平台反馈能力，按任务卡在实际仓库实现。包级测试通过不能记为Sparkle V4测试通过。\n"}, {"id": "tools/README.md", "title": "包工具说明", "group": "tools", "html": "<h1>包工具说明<\/h1>\n<p>默认工具仅依赖 Python 标准库；不启动 Agent、不开模型、不变更 Sparkle 仓库。<\/p>\n<ul>\n<li><code>python tools/validate_pack.py<\/code>：结构/依赖/模块/场景/原始来源副本/配色数值检查。<\/li>\n<li><code>python -m unittest discover -s tests -v<\/code>：离线参考语义与包工具测试。<\/li>\n<li><code>python tools/next_tasks.py<\/code>：建议当前可领取任务；不是调度器，不替代已有共享状态和路径锁。<\/li>\n<li><code>python tools/test_design_lab.py<\/code>：<strong>可选<\/strong>，需要 Playwright 与 Chromium。环境变量 <code>CHROMIUM_PATH<\/code> 可指定本地浏览器。仅在浏览器中测试本包HTML草图，截图和JSON写到 evidence/。这不是Flutter测试。<\/li>\n<\/ul>\n<p>若浏览器不允许 file://，此测试用 set_content 装载同一HTML；页面无远程资源。手动体验可以直接打开HTML，也可以在本目录以 <code>python -m http.server 8765 --bind 127.0.0.1<\/code> 启动仅本地服务后打开 prototype/DESIGN_LAB.html。不要暴露此预览服务到公网。<\/p>\n<p><code>packlib.check_receipt<\/code> 只核对证据结构、相对路径、哈希和不同会话声明，不能鉴别伪造运行结果；独立审查/实际复跑仍必需。参考代码不是授权、数据一致性或模型效果的完整生产实现。<\/p>\n", "text": "# 包工具说明\n\n默认工具仅依赖 Python 标准库；不启动 Agent、不开模型、不变更 Sparkle 仓库。\n\n- `python tools/validate_pack.py`：结构/依赖/模块/场景/原始来源副本/配色数值检查。\n- `python -m unittest discover -s tests -v`：离线参考语义与包工具测试。\n- `python tools/next_tasks.py`：建议当前可领取任务；不是调度器，不替代已有共享状态和路径锁。\n- `python tools/test_design_lab.py`：**可选**，需要 Playwright 与 Chromium。环境变量 `CHROMIUM_PATH` 可指定本地浏览器。仅在浏览器中测试本包HTML草图，截图和JSON写到 evidence/。这不是Flutter测试。\n\n若浏览器不允许 file://，此测试用 set_content 装载同一HTML；页面无远程资源。手动体验可以直接打开HTML，也可以在本目录以 `python -m http.server 8765 --bind 127.0.0.1` 启动仅本地服务后打开 prototype/DESIGN_LAB.html。不要暴露此预览服务到公网。\n\n`packlib.check_receipt` 只核对证据结构、相对路径、哈希和不同会话声明，不能鉴别伪造运行结果；独立审查/实际复跑仍必需。参考代码不是授权、数据一致性或模型效果的完整生产实现。\n"}, {"id": "00_context/source_notes/S01_V3-COMPLETE-STATUS-FOR-V4.md", "title": "V3 全量状态报告 —— V4 设计唯一入口文档", "group": "原始报告副本", "html": "<h1>V3 全量状态报告 —— V4 设计唯一入口文档<\/h1>\n<blockquote>\n<p><strong>文档契约<\/strong>：V4 设计者只看这一份文档做判断。因此本文档承载：V3 真实意图、全部实施细节、完成度证据、已知问题与诚实边界。持续更新（协调会话每轮维护），版本号+日期在文首。<strong>本文档只写有三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；推测与待验证项显式标注。<\/strong><\/p>\n<p><strong>终门结果：PASS（2026-09-28 08:19，JOURNEY 7/7）<\/strong><\/p>\n<p><strong>当前版本<\/strong>：v0.8（2026-09-28 04:36——冷读可用性轮：名词表 24 条/O-Q 线长句拆解/§10 散点收敛/changelog 时序修复；v0.7 已修 5 项 P0）\n<strong>维护者<\/strong>：Sparkle v3 舰队协调会话（主会话）｜<strong>权威数据源<\/strong>：v3/.sparkle_v3_fleet_state.json notes 流、v3/07_tasks/tasks.json（102/107 已核正）、v3/06_agent_fleet/DYNAMIC_ISSUES.md（FIX 台账 364 行，口径=状态格行首枚举）<\/p>\n<\/blockquote>\n<hr />\n<h2>0. 阅读指南与诚实声明<\/h2>\n<ul>\n<li><strong>完成度判据<\/strong>：tasks.json status + fleet done 名单 + git 主干交付 SHA 三源核验（wt759 全量核验报告 v3-output/WT759-RECON/report.md，逐卡 SHA 证据链在案）。<strong>零假账<\/strong>：90 张 fleet 声称 done 全部有主干交付。<\/li>\n<li><strong>验收模型（ADR-0011，原文在 sparkle-cosmos 仓 docs/，本仓无副本）<\/strong>：普通任务 DONE = 独立未参与会话审查 + 当前集成 SHA 可失败测试；高风险 = 2 份独立审查。worker 自称完成不算完成。<\/li>\n<li><strong>诚实红线（贯穿 V3 全程执行）<\/strong>：不以 Mock/人工改库冒充模型结果；无真实凭据/设备时交付阻塞证据；报告数字以实测为准（「2 秒」「59 项全绿」类旧报告宣称不当作实现事实）。<\/li>\n<li><strong>本文档的已知局限<\/strong>：各产品线的「用户体验级」验证深度不一（多数卡有 headless/单测级证据，三端实机走查类受设备限制转 HUMAN_INBOX）；性能数字仅在标注处有真模型 bench 支撑。<\/li>\n<\/ul>\n<h2>0.5 名词表（冷读者必读，24 条）<\/h2>\n<ul>\n<li><strong>wtNNN<\/strong>：舰队 worker 会话编号；交付物在 <code>v3-output/WTNNN-&lt;任务名&gt;/<\/code>，工作分支 <code>agent/&lt;node&gt;/wtNNN/&lt;task&gt;<\/code>。<\/li>\n<li><strong>门 / 门后<\/strong>：day7 JOURNEY 终门（2026-09-28 08:00，/tmp/gate_day7.py）；「门后」=终门后的集中执行窗口。<\/li>\n<li><strong>TCC<\/strong>：macOS 隐私与安全性授权（用户勾选 ZCode 辅助功能权限+重启 App）——O-01 浏览器取阿里云凭据的前置，<strong>非云侧机制<\/strong>。<\/li>\n<li><strong>L0/L1/L2/L3（E 线口径）<\/strong>：请求分层——L0 直答/L1 轻量/L2 中量/L3 重（SLO 六项挂其上）；「L0 首帧前移」=L0 层首帧优化。<\/li>\n<li><strong>L1–L5（U 线口径）<\/strong>：UI 质量闸门层级（L2=双审查 APPROVE、L4=闸门注册、L5=headless 契约层，详 U-line.md）——<strong>与 E 线 L 层不同体系<\/strong>。<\/li>\n<li><strong>台账<\/strong>：v3/06_agent_fleet/DYNAMIC_ISSUES.md，V3 缺陷/动态登记表；FIX-NNN=行号。<\/li>\n<li><strong>销账<\/strong>：任务卡状态 TODO→done 并留三源证据（非删账）。<\/li>\n<li><strong>三源核验<\/strong>：tasks.json status + fleet done 名单 + git 主干交付 SHA（wt759 全量一次）。<\/li>\n<li><strong>五源核验<\/strong>：三源+代码开文件亲证+测试实跑（深挖章口径）。<\/li>\n<li><strong>GJ<\/strong>：Golden Journey，Q-02 的 20 条核心旅程终验用例（GJ01-GJ20）。<\/li>\n<li><strong>M1-M4<\/strong>：JOURNEY 日循环四个里程碑门（定义在 fleet state notes 流）。<\/li>\n<li><strong>R2 / receipt<\/strong>：第二轮独立审查 / 审查回执文档（REVIEW_RECEIPT.md）。<\/li>\n<li><strong>INV-1..7<\/strong>：O-05 restore 一致性校验器七条不变量。<\/li>\n<li><strong>诚实 FAIL<\/strong>：验收卡合法交付形态——评测照实判 FAIL 且失败证据原样保留（Q-04/Q-02 行使过）。<\/li>\n<li><strong>contract-simulation<\/strong>：Q-01 260 场景判定语义——跑确定性参考实现而非真模型全链（「260 全绿」≠「产品全绿」）。<\/li>\n<li><strong>orphan-by-design<\/strong>：交付时如实留白的未接线面（带豁免条件，如「群 AI 面接入时接线」）。<\/li>\n<li><strong>HEAVY/MEDIUM/LIGHT<\/strong>：卡资源档位（并发/时长约束；HEAVY 同期至多一张）。<\/li>\n<li><strong>满编铁律<\/strong>：舰队恒 6 并发槽不空转的调度纪律。<\/li>\n<li><strong>ADR-0011<\/strong>：v2 执行包架构裁决（原文在 sparkle-cosmos 仓 docs/，本仓无副本）。<\/li>\n<li><strong>DoD<\/strong>：Definition of Done，v3/V3_DEFINITION_OF_DONE.md（V3-0..V3-10 逐 gate）。<\/li>\n<li><strong>SLO / tier 塌缩 / TTFT<\/strong>：服务级目标 / LLM 分层路由失效全落同档 / 首 token 时间。<\/li>\n<li><strong>ratchet（棘轮）<\/strong>：质量基线只许变好不许回退的门禁。<\/li>\n<li><strong>shadow/live<\/strong>：新能力三态发布 off/shadow/live；shadow=影子运行不生效可观测。<\/li>\n<li><strong>fail-closed<\/strong>：异常时拒绝服务而非放行（安全默认）。<\/li>\n<\/ul>\n<h2>1. V3 是什么（真实意图）<\/h2>\n<p><strong>一句话<\/strong>：三层架构 AI 学习成长系统（Flutter Mobile → Go Gateway :8080 → Python AI Engine gRPC :50051 + FastAPI :8000；PG16+AGE+pgvector/Redis/MinIO/Celery）的参赛冲刺版本——把「AI 陪伴学习成长」从可用推向可交付的产品完整度。<\/p>\n<p><strong>V3 的核心主张（来自 MASTER_DESIGN 与卡面体系，107 卡 14 条产品线（tasks.json stream 权威口径；文档早期误记 13，v0.7 勘正））<\/strong>：<\/p>\n<ol>\n<li><strong>主链<\/strong>：任务卡住 → 澄清/用户纠正 → 实际任务改变 → 重开后可见 → 完成反馈（学习成长的真实闭环，不是聊天玩具）<\/li>\n<li><strong>Human/Agent/Hybrid 执行模型<\/strong>：AI 降摩擦但不偷走目标（J-06 旗舰旅程；X 线 ActionPlan 契约族）<\/li>\n<li><strong>Aurora 受限自适应<\/strong>：有边界的个性化（A 线 8 卡：决策契约/干预目录/摩擦诊断/有界策略补丁）<\/li>\n<li><strong>State/Memory/Knowledge/Events 四分上下文<\/strong>（C 线 8 卡 + M 线 10 卡）<\/li>\n<li><strong>可恢复 Run<\/strong>：chat 轨去重命中改返结果（FIX-334→wt640 修复链），跨重启幂等（461/469/487 耐久链）<\/li>\n<li><strong>真实结果与可纠正记忆<\/strong>：证据融合（evidence/ 贝叶斯族）、Memory Epoch/Provenance（M-07/M-08）<\/li>\n<li><strong>Galaxy 星系可视化<\/strong>：Evidence-aware 的掌握度成长地图（G 线）<\/li>\n<li><strong>诚实性作为产品价值<\/strong>：失败可见、不静默兜底、模板不冒充模型输出（贯穿 FIX 族的修复方向）<\/li>\n<\/ol>\n<p><strong>阶段目标<\/strong>：内部交付 10/4，官方截止 10/7（天马 hackathon）；JOURNEY 七日真实驱动验证 <strong>7/7 收官（day7 终门 PASS 2026-09-28 08:19，升栈当日代码后 M1-M4 全 200，state day7_done+自动备份，/tmp/day7_gate_run.log 在案）<\/strong>。本文「门后」=终门后执行窗口（已开始）。<\/p>\n<h2>2. 系统架构现状<\/h2>\n<pre><code>Flutter Mobile (Riverpod+GoRouter, :app)\n  └─ WS/HTTP → Go Gateway :8080 (鉴权/限流/CQRS worker/WS 代理/幂等去重)\n       ├─ gRPC → Python AI Engine :50051 (ChatOrchestrator/AgentService.StreamChat)\n       │            └─ FastAPI :8000 (REST API 全量)\n       └─ PostgreSQL 16 (AGE 图 + pgvector) / Redis (streams+pub/sub+cache) / MinIO / Celery\n<\/code><\/pre>\n<ul>\n<li><strong>proto 单一事实来源<\/strong>（buf 管理，三语言生成；含 GetRequestResult 回放 RPC）<\/li>\n<li><strong>DB schema 唯一入口 Alembic<\/strong>（当前单头 wt598_20260927）<\/li>\n<li><strong>CQRS 侧<\/strong>：community/galaxy 两组 BaseWorker 消费 Redis streams；outbox/DLQ/processed_events 三清理器齐备（487 后）<\/li>\n<li>⏳ 深挖中：各模块内细节（本节将随轮次扩充为模块清单+关键设计决定）<\/li>\n<\/ul>\n<h2>3. 107 卡全景与完成度<\/h2>\n<p><strong>当前：102/107 done<\/strong>。三源核验（wt759，2026-09-28）：15 张三源齐 + 84 张销账核正；此后 S-01（wt763 APPROVE）→100、O-05（wt782 APPROVE+销账前置全履）→102。余 5 张见下表。<\/p>\n<p><strong>剩余 3 张（104/107，2026-09-28 12:00）——J-02/E-08 已销账（见上划线条目），wt802 补测批在航做 J-02 全量闭环<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>状态<\/th>\n<th>阻塞点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>~~J-02~~<\/td>\n<td><strong>done（2026-09-28）<\/strong>：E3 实测销账（wt792 降级口径+wt800/799 双修+wt802 补测批在航闭环）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>~~E-08~~<\/td>\n<td><strong>done（2026-09-28）<\/strong>：四段证据链销账（wt372+修正波+wt798 重采+wt801 验收复测 SLO 4P/2F+wt803 APPROVE；C1 义务=FIX-545）<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>O-01 公网 Staging HTTPS/WSS 一键部署<\/td>\n<td>未启动<\/td>\n<td>云凭据（用户 TCC 授权解锁后立即可做；ECS i-2ze439t934c2gsdqm778 已配）<\/td>\n<\/tr>\n<tr>\n<td>Q-07 Chaos/Recovery/Offline/Restore Storm 终验<\/td>\n<td>未启动<\/td>\n<td>依赖 O-01<\/td>\n<\/tr>\n<tr>\n<td>Q-08 V3 Final Gate Audit / Commercial RC<\/td>\n<td>未启动<\/td>\n<td>压轴（Q-07 后；day7 终门 09-28 08:00 先行）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>已销账补记（均为 v0.5-v0.5.1 时点）：<\/p>\n<ul>\n<li><strong>O-06<\/strong>：wt765 交付 + wt771 审查 APPROVE（真栈 shadow 回滚事故实录=验收模型教科书样本）；ops 面 OPS_SURFACE.md。<\/li>\n<li><strong>O-05<\/strong>：wt773 交付 1680d16c + wt782 独立审查 APPROVE（14/14 复跑 + 变异 M1/M1b/M2/M4 红 + CLI e2e rc=1）。<\/li>\n<li><strong>O-05 销账前置三项全履<\/strong>：①被撞号顶丢的原 FIX-504 行补登为 FIX-531（FIXED@1680d16c）②FIX-505 范围纠偏（prod compose 已 <code>--dir /data<\/code>，真错位面=dev compose；AOF yes + RDB-only backup 新残差转 ops）③FIX-532 审查附带四项登记（bash3.2 空数组崩溃等）。<\/li>\n<\/ul>\n<p><strong> TCC**：macOS 隐私与安全性授权（用户勾选 ZCode 辅助功能权限+重启 App）——O-01 浏览器取阿里云凭据的前置，**非云侧机制**。\n- **L0/L1/L2/L3（E 线口径）**：请求分层——L0 直答/L1 轻量/L2 中量/L3 重（SLO 六项挂其上）；「L0 首帧前移」=L0 层首帧优化。\n- **L1–L5（U 线口径）**：UI 质量闸门层级（L2=双审查 APPROVE、L4=闸门注册、L5=headless 契约层，详 U-line.md）——**与 E 线 L 层不同体系**。\n- **台账**：v3/06_agent_fleet/DYNAMIC_ISSUES.md，V3 缺陷/动态登记表；FIX-NNN=行号。\n- **销账**：任务卡状态 TODO→done 并留三源证据（非删账）。\n- **三源核验**：tasks.json status + fleet done 名单 + git 主干交付 SHA（wt759 全量一次）。\n- **五源核验**：三源+代码开文件亲证+测试实跑（深挖章口径）。\n- **GJ**：Golden Journey，Q-02 的 20 条核心旅程终验用例（GJ01-GJ20）。\n- **M1-M4**：JOURNEY 日循环四个里程碑门（定义在 fleet state notes 流）。\n- **R2 / receipt**：第二轮独立审查 / 审查回执文档（REVIEW_RECEIPT.md）。\n- **INV-1..7**：O-05 restore 一致性校验器七条不变量。\n- **诚实 FAIL**：验收卡合法交付形态——评测照实判 FAIL 且失败证据原样保留（Q-04/Q-02 行使过）。\n- **contract-simulation**：Q-01 260 场景判定语义——跑确定性参考实现而非真模型全链（「260 全绿」≠「产品全绿」）。\n- **orphan-by-design**：交付时如实留白的未接线面（带豁免条件，如「群 AI 面接入时接线」）。\n- **HEAVY/MEDIUM/LIGHT**：卡资源档位（并发/时长约束；HEAVY 同期至多一张）。\n- **满编铁律**：舰队恒 6 并发槽不空转的调度纪律。\n- **ADR-0011**：v2 执行包架构裁决（原文在 sparkle-cosmos 仓 docs/，本仓无副本）。\n- **DoD**：Definition of Done，v3/V3_DEFINITION_OF_DONE.md（V3-0..V3-10 逐 gate）。\n- **SLO / tier 塌缩 / TTFT**：服务级目标 / LLM 分层路由失效全落同档 / 首 token 时间。\n- **ratchet（棘轮）**：质量基线只许变好不许回退的门禁。\n- **shadow/live**：新能力三态发布 off/shadow/live；shadow=影子运行不生效可观测。\n- **fail-closed**：异常时拒绝服务而非放行（安全默认）。\n\n## 1. V3 是什么（真实意图）\n\n**一句话**：三层架构 AI 学习成长系统（Flutter Mobile → Go Gateway :8080 → Python AI Engine gRPC :50051 + FastAPI :8000；PG16+AGE+pgvector/Redis/MinIO/Celery）的参赛冲刺版本——把「AI 陪伴学习成长」从可用推向可交付的产品完整度。\n\n**V3 的核心主张（来自 MASTER_DESIGN 与卡面体系，107 卡 14 条产品线（tasks.json stream 权威口径；文档早期误记 13，v0.7 勘正））**：\n1. **主链**：任务卡住 → 澄清/用户纠正 → 实际任务改变 → 重开后可见 → 完成反馈（学习成长的真实闭环，不是聊天玩具）\n2. **Human/Agent/Hybrid 执行模型**：AI 降摩擦但不偷走目标（J-06 旗舰旅程；X 线 ActionPlan 契约族）\n3. **Aurora 受限自适应**：有边界的个性化（A 线 8 卡：决策契约/干预目录/摩擦诊断/有界策略补丁）\n4. **State/Memory/Knowledge/Events 四分上下文**（C 线 8 卡 + M 线 10 卡）\n5. **可恢复 Run**：chat 轨去重命中改返结果（FIX-334→wt640 修复链），跨重启幂等（461/469/487 耐久链）\n6. **真实结果与可纠正记忆**：证据融合（evidence/ 优先叙事+D-07 供给断链（FIX-507 P2：intervention lifecycle 写路径零生产调用方——数据飞轮中段断链被测试全绿掩盖）；E 线三层证据方法论+E-08 完整性能图景（修前/已修/未修/复测路径）。**FIX-508 账实不符实锤并收口**：491/492/493 行 OPEN 而修复在主干（行内容于跨批合并丢失，FIX-504 同族第四例）——当场补闭@1e3b6ebf；FIX-509（D/E receipt 断链同型）。深挖章的独立审查价值二次实证：文档过程本身在抓真问题。\n- v0.3（2026-09-28 02:40）：**B/C 线深挖并入**（wt769 五源核验）：B 线诚实性红线执行者叙事+残差六项；C 线 10 模块亲证全活+「就绪未激活」面三项；**FIX-258 行补闭**（@52fbed29，闭账曾被行重建回退——台账指针会腐烂的实证）；新登 FIX-504。\n- v0.2（2026-09-28 02:10）：**M/X 线深挖并入**（wt770，代码亲验级）：Memory Epoch/Provenance 真实数据流、M-09 缺陷发现器叙事、X 线真模型证据分层、V4 教材级考古三条；新登记 FIX-502（M/X 卡级 receipt 断链）/FIX-503（FIX-36 真模型复验承诺未兑现）。详章 v3-output/WT770-DOC-MX/。\n- v0.1（2026-09-28 02:03，git 实取 b3e3068b；原文误写 03:00）：首版。骨架+当日三源核验快照+FIX 族谱初版+诚实边界。各线深挖章节标注 ⏳ 待填充。\n"}, {"id": "00_context/source_notes/S02_FLEET-BRIEF.md", "title": "Sparkle 舰队使命简报（FLEET-BRIEF v1）", "group": "原始报告副本", "html": "<h1>Sparkle 舰队使命简报（FLEET-BRIEF v1）<\/h1>\n<blockquote>\n<p>主会话维护，每轮唤醒更新。所有任务卡的共同上下文源——派卡时相关节直接嵌入，卡内写明「本卡在战役中的位置」。<\/p>\n<\/blockquote>\n<h2>一、产品愿景（一句话）<\/h2>\n<p><strong>期末只剩一周的大学生，用 Sparkle 备考效果最好、能拿的分最高<\/strong>——比裸用 GPT/Claude/豆包/DeepSeek 好得多。一切工作以这个北极星排序。<\/p>\n<h2>二、当前战役（2026-09-23 凌晨起）：「北极星全旅程」<\/h2>\n<p>C 线 API 级压缩轮已 <strong>fail=0<\/strong> 收官（CP-01/CP-03 稳定 pass，TTFT 1-2s、投影 0.6s、星图经网关全链可见）。战役目标：把验证从「单日 API 闭环」推进到**「7 天完整旅程 + 新功能协同成体」**，让北极星从工程指标绿变成用户旅程真。<\/p>\n<p>战役三纵队：<\/p>\n<ol>\n<li><strong>JOURNEY（旅程纵深）<\/strong>：驱动器补 Day2-Day7 相位——CP-04~08（次日计划适应/复习命中率/覆盖度/后测增益/遗忘率）全部 blocked 的唯一原因是压缩轮无多天数据。制高点卡。<\/li>\n<li><strong>TOUR（功能成体）<\/strong>：今晚落地的 6 个新面（计划确认/冲刺小队/自习室/小队榜/自我锚/光子兑换）<strong>作为一条用户旅程串测<\/strong>——单独绿 ≠ 协同可用。<\/li>\n<li><strong>MOBILE（用户可见）<\/strong>：新后端面在 mobile 的入口盘点与补齐——功能没入口等于不存在。<\/li>\n<\/ol>\n<h2>三、四线现状图（2026-09-23 04:5x）<\/h2>\n<table>\n<thead>\n<tr>\n<th>线<\/th>\n<th>状态<\/th>\n<th>下一步<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A 设计语言<\/td>\n<td>SPEC v1.0 定稿；B3-CHAT/批3 落地（面积 71.8%/76.3%）；批4 收件箱桥在跑（wt160）<\/td>\n<td>批4 余项、H2 真人访谈（待用户/组员）<\/td>\n<\/tr>\n<tr>\n<td>B 模型<\/td>\n<td>Qwen 主力+MiniMax batch+GLM 保留，全链验证完<\/td>\n<td>观察期，无卡<\/td>\n<\/tr>\n<tr>\n<td>C 北极星<\/td>\n<td>压缩轮 fail=0；TTFT/投影/星图/幂等全链闭合<\/td>\n<td><strong>本战役主战场<\/strong><\/td>\n<\/tr>\n<tr>\n<td>D 商业化<\/td>\n<td>D-COMMUNITY 六卡落地五卡（学出会员/小队/自习室/小队榜/自我锚）<\/td>\n<td>D-COMM-5/6 待价值评估；云端部署已备<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>四、共同约束（每卡必守，违反=返工）<\/h2>\n<ol>\n<li><strong>口径单一事实源<\/strong>：任务/完成度=<code>sprint_task_ledger<\/code>（BP-4）；今日视图=<code>goal_today_view<\/code>；galaxy 写路径失效必须走 <code>invalidate_galaxy_graph_view_cache<\/code>+shield 回调（SHIELD-INVAL 模式）。新聚合<strong>禁止<\/strong>自算一套。<\/li>\n<li><strong>反刷分红线<\/strong>：任何榜/队内比较只准用 sprint-completion 口径，XP/光子/photon_balance/flame_level 禁入（AST+行为双钉模式照 D-COMM-3/4）。<\/li>\n<li><strong>价值增量红线<\/strong>：免费闭环行为零变化；光子只经「学出会员」出口变现（D-COMM-2 有界兑换）。<\/li>\n<li><strong>诚实性<\/strong>：空数据返回诚实空态（<code>has_ledger_data:false<\/code> 式），不造默认值；仪表数字必须有真源。<\/li>\n<li><strong>SPEC（A 线）<\/strong>：必达项≤2/surface；唯一交互色 accent；语义槽 5；DL-SPEC ratchet 只降不升。<\/li>\n<li><strong>工程红线<\/strong>：proto→make proto-gen；迁移挂唯一 head+合入验单头；分层（网关禁业务/引擎禁鉴权/handler 走 service）；改动必带回归验证（对比法）；交付物零凭据；遮蔽法处理安全词库。<\/li>\n<li><strong>资源纪律<\/strong>：定向测试绝不宽扫描（今晚两次熔断）；收工清 pytest-tmp/build/.dart_tool；HEAVY（模拟器/gradle/浏览器）等 swap 闲≥1.2G。<\/li>\n<\/ol>\n<h2>五、口径词典（跨卡一致性）<\/h2>\n<ul>\n<li>「冲刺完成度」= sprint 周期内 ledger 记录的完成任务/计划任务的比率（D-COMM-3 定义，唯一定义点）<\/li>\n<li>「自我锚」= 本人近 7 日每日完成度/掌握度增量（D-COMM-1，UTC 窗口）<\/li>\n<li>「在场」= study_room_sessions 的进出记录（D-COMM-4，时长仅展示）<\/li>\n<li>「可兑换基数」= 审计流水重放（四收入类型+首胜/combo，transfer_in 排除）<\/li>\n<li>「星图可见」= 经网关 gRPC 路径 user_status 等价直连（GRAPH-GRPC-SHAPE 契约）<\/li>\n<\/ul>\n<h2>六、合入管线（主会话职责，卡不碰）<\/h2>\n<p>备份→apply --3way→定向测试（对比法）→commit→push（带重试）→删 worktree→活库迁移→重启探针。Worker 交付 = worktree 改动 + v3-output/&lt;卡&gt;/REPORT.md + changes.patch。<\/p>\n", "text": "# Sparkle 舰队使命简报（FLEET-BRIEF v1）\n\n> 主会话维护，每轮唤醒更新。所有任务卡的共同上下文源——派卡时相关节直接嵌入，卡内写明「本卡在战役中的位置」。\n\n## 一、产品愿景（一句话）\n\n**期末只剩一周的大学生，用 Sparkle 备考效果最好、能拿的分最高**——比裸用 GPT/Claude/豆包/DeepSeek 好得多。一切工作以这个北极星排序。\n\n## 二、当前战役（2026-09-23 凌晨起）：「北极星全旅程」\n\nC 线 API 级压缩轮已 **fail=0** 收官（CP-01/CP-03 稳定 pass，TTFT 1-2s、投影 0.6s、星图经网关全链可见）。战役目标：把验证从「单日 API 闭环」推进到**「7 天完整旅程 + 新功能协同成体」**，让北极星从工程指标绿变成用户旅程真。\n\n战役三纵队：\n1. **JOURNEY（旅程纵深）**：驱动器补 Day2-Day7 相位——CP-04~08（次日计划适应/复习命中率/覆盖度/后测增益/遗忘率）全部 blocked 的唯一原因是压缩轮无多天数据。制高点卡。\n2. **TOUR（功能成体）**：今晚落地的 6 个新面（计划确认/冲刺小队/自习室/小队榜/自我锚/光子兑换）**作为一条用户旅程串测**——单独绿 ≠ 协同可用。\n3. **MOBILE（用户可见）**：新后端面在 mobile 的入口盘点与补齐——功能没入口等于不存在。\n\n## 三、四线现状图（2026-09-23 04:5x）\n\n| 线 | 状态 | 下一步 |\n|---|---|---|\n| A 设计语言 | SPEC v1.0 定稿；B3-CHAT/批3 落地（面积 71.8%/76.3%）；批4 收件箱桥在跑（wt160） | 批4 余项、H2 真人访谈（待用户/组员） |\n| B 模型 | Qwen 主力+MiniMax batch+GLM 保留，全链验证完 | 观察期，无卡 |\n| C 北极星 | 压缩轮 fail=0；TTFT/投影/星图/幂等全链闭合 | **本战役主战场** |\n| D 商业化 | D-COMMUNITY 六卡落地五卡（学出会员/小队/自习室/小队榜/自我锚） | D-COMM-5/6 待价值评估；云端部署已备 |\n\n## 四、共同约束（每卡必守，违反=返工）\n\n1. **口径单一事实源**：任务/完成度=`sprint_task_ledger`（BP-4）；今日视图=`goal_today_view`；galaxy 写路径失效必须走 `invalidate_galaxy_graph_view_cache`+shield 回调（SHIELD-INVAL 模式）。新聚合**禁止**自算一套。\n2. **反刷分红线**：任何榜/队内比较只准用 sprint-completion 口径，XP/光子/photon_balance/flame_level 禁入（AST+行为双钉模式照 D-COMM-3/4）。\n3. **价值增量红线**：免费闭环行为零变化；光子只经「学出会员」出口变现（D-COMM-2 有界兑换）。\n4. **诚实性**：空数据返回诚实空态（`has_ledger_data:false` 式），不造默认值；仪表数字必须有真源。\n5. **SPEC（A 线）**：必达项≤2/surface；唯一交互色 accent；语义槽 5；DL-SPEC ratchet 只降不升。\n6. **工程红线**：proto→make proto-gen；迁移挂唯一 head+合入验单头；分层（网关禁业务/引擎禁鉴权/handler 走 service）；改动必带回归验证（对比法）；交付物零凭据；遮蔽法处理安全词库。\n7. **资源纪律**：定向测试绝不宽扫描（今晚两次熔断）；收工清 pytest-tmp/build/.dart_tool；HEAVY（模拟器/gradle/浏览器）等 swap 闲≥1.2G。\n\n## 五、口径词典（跨卡一致性）\n\n- 「冲刺完成度」= sprint 周期内 ledger 记录的完成任务/计划任务的比率（D-COMM-3 定义，唯一定义点）\n- 「自我锚」= 本人近 7 日每日完成度/掌握度增量（D-COMM-1，UTC 窗口）\n- 「在场」= study_room_sessions 的进出记录（D-COMM-4，时长仅展示）\n- 「可兑换基数」= 审计流水重放（四收入类型+首胜/combo，transfer_in 排除）\n- 「星图可见」= 经网关 gRPC 路径 user_status 等价直连（GRAPH-GRPC-SHAPE 契约）\n\n## 六、合入管线（主会话职责，卡不碰）\n\n备份→apply --3way→定向测试（对比法）→commit→push（带重试）→删 worktree→活库迁移→重启探针。Worker 交付 = worktree 改动 + v3-output/<卡>/REPORT.md + changes.patch。\n"}, {"id": "00_context/source_notes/S03_EVAL_RESULTS.md", "title": "W nce 只列 36 条中前 20 条 request_id（harness `[:20]` 截断），计数正确。\n- **F4（产物瑕疵，已自曝）** wt801 summary.md 头部为 wt372 模板残留（\"WT372-E08\"、backend @ 0e4087ec、旧 guest 名）；实测栈为 cdc547be、guest wt801_e08_bench，wt801 notes §2 已如实披露，本审查核实。\n- **F5（读法注记）** 「所有 percentiles 样本量≥100」按 bench 级（n=104）读法满足；严格分层读法下修后分层 n=26、Q-06 切片 n=10/层（NOT_REPORTABLE）不足，wt406 的分层 100 样本统计仍是修后栈上的缺口径。wt801 已披露、建议不阻塞——本审查**认可该读法与不阻塞判断**。\n- **F6（预算复核边界）** 145 = 104+40+1 孤儿中，孤儿行仅 DB 留痕、仓库内不可独立复核；与 L3-26 resume 重跑成功行自洽，采信。\n\n**阻塞级条件（销账生效前提）**：\n\n- **C1（追踪义务落账）** wt801 两项追踪义务方向正确且充分性成立——① L0 直答缺位 + L2/深档 total 上行（65.4s/126.7s）作为 V4 首帧/拥塞与 SLO 设计输入；② E08-ISS-FALLBACK 本体（7 qid 多代理流计量错挂、成本低估、修复后 harness 对其失明）转持续追踪。但 FALLBACK 缺陷在修后**任何自动 dynamic_issues.json 中都不再出现**（换标签使判据失明），只存在于报告散文中——**销账落笔时必须把两项义务显式写进台账/销账条目**（含 7 个 qid 与 harness 失明机理），否则 8→3 会变成静默丢失。另建议（不阻塞）给 harness 补一条 `no_generation_model`-with-tokens 的 fallback-like 检出，防同类盲区逃过未来 bench；Q-06 400 样本修后重制维持 wt801 建议：另派预算卡、不随 E-08。\n\n**VERDICT：APPROVE-closure** —— 卡面验收要素按 §5 映射全部满足（percentiles 一项按 bench 级读法并注记 F5）；集成 bench 交付本体 + 修正波 + wt798/wt801 集成与复测证据链完整、数字可信、披露诚实。销账在满足 C1 后生效。\n\n---\n\n## 7. 审查边界\n\n主仓只读（仅 worktree add 与本分支 commit）；未重启/未触碰运行栈、未访问 DB/Redis、未触碰 ns001、未改台账/tasks.json/主文档、未 push。全部复算脚本为临时件（/tmp），审计仅消费入库产物；未验证 DB token_usage 归因（wt801 的 105 行/104/40 亲证属 DB 面，本审查采信其留痕自洽性）。\n"}, {"id": "00_context/source_notes/S07_notes.md", "title": "WT797 · V3-FIX-507 —— D-05 intervention lifecycle 写路径生产接线", "group": "原始报告副本", "html": "<h1>WT797 · V3-FIX-507 —— D-05 intervention lifecycle 写路径生产接线<\/h1>\n<p>台账：V3-FIX-507（P2）。问题：D-05 四个写方法（record_exposure / record_response /\nrecord_outcome_association / associate_pending_outcomes）全仓生产面零调用；读侧三消费方\n（D-07 洞察卡 / M-06 经验投影 / North Star intervention 面）全部已接线——数据飞轮中段\n断链被测试全绿掩盖：friction-pattern 与 interventions-that-helped 两类洞察卡生产零数据、\nM-06 经验投影恒空。<\/p>\n<h2>0. 约束回看<\/h2>\n<ul>\n<li>不造新事件、不造轮询：只在既有事件流的真实节点挂调用（D-02 ledger 增量扫描定时任务\n是台账明文规定的第三接线点，celery beat 是本仓既有定时批扫惯例，非新增轮询机制）。<\/li>\n<li>不改 D-05 服务自身语义；失败语义=韧性壳（FIX-530 判例）：lifecycle 写失败只\nlogger.warning，绝不拖垮宿主链路（交付/响应/管线）。<\/li>\n<li>不碰运行栈/docker；不 push；不改台账。<\/li>\n<\/ul>\n<h2>1. 接线设计图<\/h2>\n<pre><code>【写面 1】交付面（InterventionRecord 卡协议域）\n  触发事件（既有）：\n    a) InterventionEventConsumer._handle_record_created 交付成功 → mark_delivered\n    b) intervention_feedback_binding_service._apply_feedback_transition 反馈路径\n       CREATED→DELIVERED（消费者未经手的交付）\n    ⇒ 两者共用 InterventionRecordService.mark_delivered（唯一收敛点）\n  挂点：mark_delivered → record_exposure（幂等：双路径重复标记 dedupe 为\n        duplicate_event，零第二行）\n  挂点：mark_accepted → record_response(accepted)\n        mark_dismissed → record_response(rejected)\n        mark_acted → record_response(started)   [ACTED=用户开始按干预行动]\n        （snoozed/seen 无封闭词表成员 → 不接线，不造语义）\n\n【写面 2】Aurora decision 执行点（spine 管线域）\n  触发事件（既有）：SpineOrchestrator._run_signal_pipeline 中\n    policy_engine.evaluate 产出 (decision, directive) 且 directive 定稿下发\n    （set_active_directive 前后——intervention 动作实际下发的既有节点）\n  挂点：_record_intervention_lifecycle_exposure(user_id, signal, decision, directive)\n        → record_exposure\n  契约构造（A-01 形态，参照 L2 _build_decision_contract 先例）：\n    intervention_type = SPINE_STRATEGY_TO_INTERVENTION[decision.primary_strategy]\n      （A-02 投影映射；映射缺失或 inert（no_action/abstain）→ 不记录——\n       「不行动」没有用户可见载体，record_exposure 亦会拒绝）\n    cognition_tier = &quot;l1_light&quot;（spine 管线规则评估，无 LLM）\n    governance_mode = &quot;live&quot;（directive 实际生效）\n    execution_mode = catalog item nominal_execution_mode 镜像\n    evidence_refs = (f&quot;signal://{signal.state_key}&quot;,) → friction_tag 真实归因\n    input_context_hash = sha256(directive.directive_id)（每次下发实例唯一 →\n      decision_id 内容寻址且 per-dispatch 唯一；重放可去重）\n    rationale_summary = decision.reasoning_summary or signal.evidence_summary\n    linkage = {}（spine signal 域无 plans/tasks UUID 锚——诚实留空，不伪造关联键）\n  user_id 不可解析为 UUID → 跳过（L2 引擎同款纪律）\n\n【写面 3】D-02 ledger 增量扫描定时任务\n  新增 celery 任务 associate_intervention_lifecycle_outcomes（app/core/celery_tasks.py，\n  惯例同 scan_aurora_scheduled_wakes）：\n    选近期（≤37d=30d 最大观察窗+7d 宽限）有 exposure 的 distinct user（cap 500/轮）\n    → 逐用户 associate_pending_outcomes（幂等可重跑，重复扫描零成本）\n  beat 注册：every 6h，low_priority 车道（celery_schedule.setup_periodic_tasks），\n    与 intervention-outcomes-full（02:00）错峰（*/6h @ :50）。\n\n读侧（零改动，接线后自然有数据）：\n  D-07 friction-pattern 卡     ← 写面 2（friction_tag 真实归因的 exposure/response）\n  D-07 interventions-that-helped ← 写面 1（plan_id linkage）+ 写面 3（关联扫描）\n  M-06 经验投影                 ← 两写面 exposure+outcome 关联行\n  North Star lifecycle 计数    ← 两写面全部事件\n<\/code><\/pre>\n<h2>2. 幂等键与失败语义（逐挂点）<\/h2>\n<table>\n<thead>\n<tr>\n<th>挂点<\/th>\n<th>幂等键<\/th>\n<th>失败语义<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>mark_delivered → exposure<\/td>\n<td>(decision_id, &quot;exposed&quot;, &quot;&quot;)；decision_id=A-01 内容寻址（input_context_hash=sha256(record.id)，同 record 恒同 id）<\/td>\n<td>refused（inert/shadow/损坏载荷）→ info 留痕；DB 异常 → warning 壳，宿主转场不受影响<\/td>\n<\/tr>\n<tr>\n<td>mark_accepted/dismissed/acted → response<\/td>\n<td>(decision_id, accepted/rejected/started, &quot;&quot;)<\/td>\n<td>无 exposure → refused(no_exposure)（D-05 漏斗完整性既有语义，可观测降级）<\/td>\n<\/tr>\n<tr>\n<td>spine 指令下发 → exposure<\/td>\n<td>(decision_id, &quot;exposed&quot;, &quot;&quot;)；per-dispatch 唯一<\/td>\n<td>韧性壳：任何异常 warning + 返回 None，管线永不中断<\/td>\n<\/tr>\n<tr>\n<td>关联扫描任务<\/td>\n<td>(decision_id, &quot;outcome_observed&quot;, outcome_id)<\/td>\n<td>单用户失败 warning 继续；任务级 retry（既有 celery 惯例）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>decision_id 合法性：全部经 AuroraDecisionContract.decision_id_or_compute() 产出\n（aurora_&lt;32hex&gt;），不手搓前缀。 InterventionTriggerType → A-01 目录投影（冻结映射，\nL2_INTERVENTION_TO_CATALOG 同款纪律，语义判据逐条对齐 SPINE_STRATEGY_TO_INTERVENTION\n既有判例）：<\/p>\n<ul>\n<li>PLAN_RISK → rescope（adjust_plan→rescope 判例）<\/li>\n<li>CONCEPT_GAP → practice（repair_knowledge_bottleneck→practice 判例）<\/li>\n<li>STALL_PATTERN → split（insert_easy_win→split 判例）<\/li>\n<li>OVERLOAD → pause（reduce_next_48h_load→pause 判例）<\/li>\n<li>MISALIGNMENT → explain（insert_reassurance→explain 判例）<\/li>\n<\/ul>\n<p>交付面 exposure linkage：plan_card_id → Card.metadata_.legacy_plan_id → linkage.plan_id\n（与 D-02 task 完成 OutcomeEntry.correlation.plan_id 同 plans.id 域——这是 interventions-\nthat-helped 关联真实成立的唯一合法桥）。task_occurrence_id 与 Task.id 不同域，不伪造。<\/p>\n<h2>3. 红先行设计（三读侧消费方各一测）<\/h2>\n<ol>\n<li>D-07 面：真实交付流（create_record→mark_delivered→mark_accepted）+ spine 写面入口 +\n真实 Task 完成 + associate → build_cards 断言 friction_pattern 与\ninterventions_that_helped 卡出现。修前：lifecycle 零写入 → 卡恒空 → 红。<\/li>\n<li>M-06 面：同数据流 → project(use_cache=False) 断言投影 records 非空。修前恒空 → 红。<\/li>\n<li>North Star 面：同数据流 → _intervention_lifecycle 断言 lifecycle_events_by_type\n含 exposed。修前恒空 → 红。<\/li>\n<\/ol>\n<p>（红=证明「生产写路径驱动下读侧仍恒空」即零调用事实；绿=接线后同一测试翻转。）<\/p>\n<h2>4. 红绿实录<\/h2>\n<p>环境：worktree wt797-f507（branch agent/node-b/wt797/f507，base main@02a05425）；\nbackend gen 按先例主仓 cp -RL 不入库；SECRET_KEY=test env；主仓 venv。<\/p>\n<p><strong>红（修前，main 基线代码）<\/strong>：<\/p>\n<pre><code>tests/services/test_f507_readface_dataflow.py  —— 5 failed in 2.75s\n  test_delivery_face_writes_exposure_and_response_rows     FAILED\n    （真实 create→consumer 投递→mark_accepted 后 lifecycle 0 行：生产零调用实证）\n  test_spine_pipeline_writes_friction_attributed_exposure  FAILED\n    （ModuleNotFoundError: app.services.intervention_lifecycle_wiring\n     —— spine 写路径不存在本体）\n  test_readface_d07_cards_fed_by_production_writes         FAILED\n  test_readface_m06_projection_fed_by_production_writes    FAILED\n    （ExperienceProjection records=() watermark='empty'）\n  test_readface_north_star_counts_fed_by_production_writes FAILED\n<\/code><\/pre>\n<p><strong>绿（接线后，同一数据流）<\/strong>：<\/p>\n<pre><code>test_f507_readface_dataflow.py   5 passed\ntest_f507_lifecycle_wiring.py    9 passed\n  （映射全员覆盖/decision_id 稳定且内容寻址/重复投递幂等恰 1 行/韧性壳\n   lifecycle 宕机不影响交付转场/无 exposure 响应 refused 不炸/spine 契约\n   inert+未映射短路/管线调用点 AsyncMock 断言 awaited_once/beat+路由注册）\n<\/code><\/pre>\n<p><strong>触达面回归（全绿）<\/strong>：<\/p>\n<table>\n<thead>\n<tr>\n<th>套件<\/  关联，幂等）\n        ⇒ D-07 两类卡 / M-06 投影 / North Star intervention 面全部吃到真实数据\n<\/code><\/pre>\n<p>边界如实声明：交付面无 spine 信号锚 → friction=unattributed（不算分析失败，\nD-05 词表既有档）；spine 面无 plans/tasks UUID 锚 → linkage 留空不伪造；\nfriction-pattern 卡的数据源是 spine 面（真实归因），interventions-that-helped\n的数据源是交付面 plan 关联 + 关联扫描——两类卡各由其合法写面供数。\nedits 类响应（InterventionAcceptanceStatus 无 edited 档）生产无真实节点，\n不造语义，如实缺位。<\/p>\n<h2>6. 交接注记<\/h2>\n<ul>\n<li>改动文件：新增 <code>app/services/intervention_lifecycle_wiring.py<\/code>、两测试文件、\nnotes.md；修改 <code>intervention_record_service.py<\/code>（4 转场挂点）、\n<code>spine_orchestrator.py<\/code>（下发点 hook + 方法）、<code>celery_tasks.py<\/code>（新任务）、\n<code>celery_app.py<\/code>（路由）、<code>celery_schedule.py<\/code>（beat）。<\/li>\n<li>D-05 服务自身零改动（lifecycle_service.py 未触碰）。<\/li>\n<li>韧性壳判例：FIX-530（宿主链路永不因 lifecycle 失败中断；refused 是\nD-05 既有可观测降级语义，原样透传）。<\/li>\n<\/ul>\n", "text": "# WT797 · V3-FIX-507 —— D-05 intervention lifecycle 写路径生产接线\n\n台账：V3-FIX-507（P2）。问题：D-05 四个写方法（record_exposure / record_response /\nrecord_outcome_association / associate_pending_outcomes）全仓生产面零调用；读侧三消费方\n（D-07 洞察卡 / M-06 经验投影 / North Star intervention 面）全部已接线——数据飞轮中段\n断链被测试全绿掩盖：friction-pattern 与 interventions-that-helped 两类洞察卡生产零数据、\nM-06 经验投影恒空。\n\n## 0. 约束回看\n\n- 不造新事件、不造轮询：只在既有事件流的真实节点挂调用（D-02 ledger 增量扫描定时任务\n  是台账明文规定的第三接线点，celery beat 是本仓既有定时批扫惯例，非新增轮询机制）。\n- 不改 D-05 服务自身语义；失败语义=韧性壳（FIX-530 判例）：lifecycle 写失败只\n  logger.warning，绝不拖垮宿主链路（交付/响应/管线）。\n- 不碰运行栈/docker；不 push；不改台账。\n\n## 1. 接线设计图\n\n```\n【写面 1】交付面（InterventionRecord 卡协议域）\n  触发事件（既有）：\n    a) InterventionEventConsumer._handle_record_created 交付成功 → mark_delivered\n    b) intervention_feedback_binding_service._apply_feedback_transition 反馈路径\n       CREATED→DELIVERED（消费者未经手的交付）\n    ⇒ 两者共用 InterventionRecordService.mark_delivered（唯一收敛点）\n  挂点：mark_delivered → record_exposure（幂等：双路径重复标记 dedupe 为\n        duplicate_event，零第二行）\n  挂点：mark_accepted → record_response(accepted)\n        mark_dismissed → record_response(rejected)\n        mark_acted → record_response(started)   [ACTED=用户开始按干预行动]\n        （snoozed/seen 无封闭词表成员 → 不接线，不造语义）\n\n【写面 2】Aurora decision 执行点（spine 管线域）\n  触发事件（既有）：SpineOrchestrator._run_signal_pipeline 中\n    policy_engine.evaluate 产出 (decision, directive) 且 directive 定稿下发\n    （set_active_directive 前后——intervention 动作实际下发的既有节点）\n  挂点：_record_intervention_lifecycle_exposure(user_id, signal, decision, directive)\n        → record_exposure\n  契约构造（A-01 形态，参照 L2 _build_decision_contract 先例）：\n    intervention_type = SPINE_STRATEGY_TO_INTERVENTION[decision.primary_strategy]\n      （A-02 投影映射；映射缺失或 inert（no_action/abstain）→ 不记录——\n       「不行动」没有用户可见载体，record_exposure 亦会拒绝）\n    cognition_tier = \"l1_light\"（spine 管线规则评估，无 LLM）\n    governance_mode = \"live\"（directive 实际生效）\n    execution_mode = catalog item nominal_execution_mode 镜像\n    evidence_refs = (f\"signal://{signal.state_key}\",) → friction_tag 真实归因\n    input_context_hash = sha256(directive.directive_id)（每次下发实例唯一 →\n      decision_id 内容寻址且 per-dispatch 唯一；重放可去重）\n    rationale_summary = decision.reasoning_summary or signal.evidence_summary\n    linkage = {}（spine signal 域无 plans/tasks UUID 锚——诚实留空，不伪造关联键）\n  user_id 不可解析为 UUID → 跳过（L2 引擎同款纪律）\n\n【写面 3】D-02 ledger 增量扫描定时任务\n  新增 celery 任务 associate_intervention_lifecycle_outcomes（app/core/celery_tasks.py，\n  惯例同 scan_aurora_scheduled_wakes）：\n    选近期（≤37d=30d 最大观察窗+7d 宽限）有 exposure 的 distinct user（cap 500/轮）\n    → 逐用户 associate_pending_outcomes（幂等可重跑，重复扫描零成本）\n  beat 注册：every 6h，low_priority 车道（celery_schedule.setup_periodic_tasks），\n    与 intervention-outcomes-full（02:00）错峰（*/6h @ :50）。\n\n读侧（零改动，接线后自然有数据）：\n  D-07 friction-pattern 卡     ← 写面 2（friction_tag 真实归因的 exposure/response）\n  D-07 interventions-that-helped ← 写面 1（plan_id linkage）+ 写面 3（关联扫描）\n  M-06 经验投影                 ← 两写面 exposure+outcome 关联行\n  North Star lifecycle 计数    ← 两写面全部事件\n```\n\n## 2. 幂等键与失败语义（逐挂点）\n\n| 挂点 | 幂等键 | 失败语义 |\n|---|---|---|\n| mark_delivered → exposure | (decision_id, \"exposed\", \"\")；decision_id=A-01 内容寻址（input_context_hash=sha256(record.id)，同 record 恒同 id） | refused（inert/shadow/损坏载荷）→ info 留痕；DB 异常 → warning 壳，宿主转场不受影响 |\n| mark_accepted/dismissed/acted → response | (decision_id, accepted/rejected/started, \"\") | 无 exposure → refused(no_exposure)（D-05 漏斗完整性既有语义，可观测降级） |\n| spine 指令下发 → exposure | (decision_id, \"exposed\", \"\")；per-dispatch 唯一 | 韧性壳：任何异常 warning + 返回 None，管线永不中断 |\n| 关联扫描任务 | (decision_id, \"outcome_observed\", outcome_id) | 单用户失败 warning 继续；任务级 retry（既有 celery 惯例） |\n\ndecision_id 合法性：全部经 AuroraDecisionContract.decision_id_or_compute() 产出\n（aurora_<32hex>），不手搓前缀。 InterventionTriggerType → A-01 目录投影（冻结映射，\nL2_INTERVENTION_TO_CATALOG 同款纪律，语义判据逐条对齐 SPINE_STRATEGY_TO_INTERVENTION\n既有判例）：\n- PLAN_RISK → rescope（adjust_plan→rescope 判例）\n- CONCEPT_GAP → practice（repair_knowledge_bottleneck→practice 判例）\n- STALL_PATTERN → split（insert_easy_win→split 判例）\n- OVERLOAD → pause（reduce_next_48h_load→pause 判例）\n- MISALIGNMENT → explain（insert_reassurance→explain 判例）\n\n交付面 exposure linkage：plan_card_id → Card.metadata_.legacy_plan_id → linkage.plan_id\n（与 D-02 task 完成 OutcomeEntry.correlation.plan_id 同 plans.id 域——这是 interventions-\nthat-helped 关联真实成立的唯一合法桥）。task_occurrence_id 与 Task.id 不同域，不伪造。\n\n## 3. 红先行设计（三读侧消费方各一测）\n\n1. D-07 面：真实交付流（create_record→mark_delivered→mark_accepted）+ spine 写面入口 +\n   真实 Task 完成 + associate → build_cards 断言 friction_pattern 与\n   interventions_that_helped 卡出现。修前：lifecycle 零写入 → 卡恒空 → 红。\n2. M-06 面：同数据流 → project(use_cache=False) 断言投影 records 非空。修前恒空 → 红。\n3. North Star 面：同数据流 → _intervention_lifecycle 断言 lifecycle_events_by_type\n   含 exposed。修前恒空 → 红。\n\n（红=证明「生产写路径驱动下读侧仍恒空」即零调用事实；绿=接线后同一测试翻转。）\n\n## 4. 红绿实录\n\n环境：worktree wt797-f507（branch agent/node-b/wt797/f507，base main@02a05425）；\nbackend gen 按先例主仓 cp -RL 不入库；SECRET_KEY=test env；主仓 venv。\n\n**红（修前，main 基线代码）**：\n```\ntests/services/test_f507_readface_dataflow.py  —— 5 failed in 2.75s\n  test_delivery_face_writes_exposure_and_response_rows     FAILED\n
