d>1141L 单测 + 217L 崩溃恢复 e2e；X-10 outcome 族含 failure_preserved<\/td>\n<td>FIX-42 OPEN（分类器 transient+confirmed 陷阱等备忘）；幂等洗白链 FIX-417/447 已修（<code>df51a731<\/code>/<code>2d82a628<\/code>）<\/td>\n<\/tr>\n<tr>\n<td>X-10<\/td>\n<td><code>3b5a99bc<\/code><\/td>\n<td><code>tests/v3_action_eval/<\/code> 判定套件 + 77 场景 fixture + results.json（18k 行）入库<\/td>\n<td>（对内）行动引擎全链 77/77 可重复判定<\/td>\n<td><strong>77/77 PASS、allocation 28/28=100%、high-risk auto=0、false success=0<\/strong>；判定器从 DB 独立复算、<code>real_llm_calls=0<\/code> 强制断言<\/td>\n<td>零真实 LLM 为显式设计（见 §3.6）；LLM 依赖面由 J-04/J-06/JOURNEY 真驱动补证<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>2.2 逐卡要点与证据细节<\/h3>\n<p><strong>X-01（43942d23）<\/strong>——落点=tasks 表 8 个 nullable 新列（<code>action_schema_version<\/code> 判别位 NULL=legacy；desired_outcome；smallest_useful_step 带 <code>useful_because<\/code> 封闭枚举、空判据=伪步骤拒绝；completion_evidence 类型化证据规格；cognitive_ownership（D13 首版定义全仓第一落点）；source_refs 封闭 scheme；risk_class；reversible），<strong>execution_mode 复用既有列不建第二真源<\/strong>（dev 库 1231 行全 NULL 复核后定案）。契约真源 <code>core/action_plan.py<\/code>：C-01 同款冻结 dataclass+封闭词表+统一投影门——<strong>读侧容错取舍（R2 返修）<\/strong>：初版 REST 路径原样投影列值，单行脏枚举会使该用户全部任务端点 500（F1 探针实证）；修后版本门/词表不过→整块降级 None+WARN（区分「没有 V3 计划」与「计划损坏」）。契约载体=REST/JSON 非 gRPC，proto 不动（有意识决定）。<\/p>\n<p><strong>X-02（c0e02bf8）<\/strong>——「AI 能做 ≠ AI 应做」机制化为四层纯函数：①Guard 硬规则（R1 风险/不可逆、R4 具身、R5 隐私、R6 低置信、G1 学习守卫）从全集剔除不可行 mode；②选择层（显式意图&gt;持久偏好&gt;ownership×tool-advantage）；③修饰层（T1 紧急促进、T2 偏好 agent 但更慢更贵→降 hybrid）；④<strong>语义层（默认关，<code>SPARKLE_ALLOCATION_SEMANTIC_ENABLED=False<\/code> 本 worktree settings.py:1029 亲验）<\/strong>——LLM 只能在 feasible set 内选（越界 S2 拒收保规则默认），带熔断（3 败/300s）/限频/超时。学习守卫硬规则：学习任务 feasible set 永不含 agent、hybrid 必须带 user-authored 证据要求、<code>vet_agent_offer<\/code> 拒「直接写完整答案」；X-01 F5 矛盾集（agent×user_core 等）成硬规则测试冻结。封闭词表 sha256 双冻结。\n<strong>真模型证据<\/strong>：85 场景盲评=规则层独跑 100%（fixture 标注只看 HUMAN_AGENT_HYBRID 文档、rubric 盲跑不见 target）；E-04（<code>58d08c6f<\/code>）真模型五面探针（act-B1 学习守卫/B2 机械委托/B3 风险/B4 灰区/B5 <strong>注入推 agent<\/strong>）基线轮 8/15 失败→prompt 收敛轮 <strong>15/15<\/strong>（qwen3.8-flash 真实 API，baseline/converged 两份 JSON 入库）。<strong>生产authority实战<\/strong>：J-04（<code>02b82cd2<\/code>）首行动推导中 LLM 建议 agent 的学习步被 decide_allocation 学习守卫拦回 human/hybrid（真 LLM 产出+规则权威，测试断言在案）；JOURNEY day1-6 真驱动 6/7 过门（day6 门曾因 FIX-314 时钟语义停、当日修复重跑 PASS，证据链完整）。<\/p>\n<p><strong>X-03（7fc507fd）<\/strong>——统一命令路径：<code>action_command.py<\/code>（命令注册/schema）+ <code>action_command_service.py<\/code>（proposal→approve→validate→commit→receipt 全生命周期）+ <code>task_commands.py<\/code>（首批命令集）；里程碑路径迁上命令路径（milestone_command_path 测试）；网关 <code>/action-proposals<\/code> 纯代理。幂等四态（同键重放/同键异 payload 重放既有/终态拒绝/TTL sweep）与乐观并发（版本冲突不覆盖）由 1577L 测试+X-10 proposal 族 12 场景双承载。后续增强：P-04（<code>322988ce<\/code>）低风险 auto-execute（总开关∧类别授予∧low∧reversible∧无人工标记五条件，grant_basis 固化进 receipt，revoke 即时生效含 resume 复核）；U-04 chat 卡片命令分发收口（wt687，FIX-378）——「所有入口走同一权威路径」在 09-27 才完全成立。<\/p>\n<p><strong>X-04（6a6363f8）<\/strong>——<code>resolve_actual_minutes<\/code> 函数级红线：只认实测两真源，非实测值直接 raise（代码注释「宁少扣不少算」）；<code>compute_actual_minutes_from_timestamps<\/code> 从时间戳推导；完成证据按 action 类型（artifact/self-report/test）取；mobile 任务卡/详情/执行屏接线。GJ05 的 backend 全链+widget 部分已证；三端实机同属 HUMAN_INBOX 族。<\/p>\n<p><strong>X-05（fbe679bb + 238abe22）<\/strong>——run 脊柱：QUEUED/RUNNING/AWAITING_USER/EXECUTING/terminal 状态机（非法迁移测试钉）+ agent_runs/agent_run_steps 表 + runs API + 事件投影消费者（<code>$<\/code> 起点消费组首部署回放突发被 FIX-28 定性为一次性部署成本并根治）；X-05B 补 EXECUTING producer 接线（执行步进可见性）+ runs API 硬化（intent 归属 404、cancel reason 服务端白名单）。R2 双 PASS 190 绿。<strong>生产账本地位<\/strong>由 FIX-330 裁决背书（agent-stats 真空事件反证：生产链路已有自己的三套账本）。J-06 旗舰旅程把 run 脊柱用进产品（prep[agent]→judgment[human]→execute_check[agent]→outcome[hybrid] 四步真实数据流）。<\/p>\n<p><strong>X-06（5abd1c4b + f2e9f22e）<\/strong>——工具能力边界：metadata（read/write/risk/reversible/required permission/cost）+ ToolExecutor（权限判定→账本行→幂等键→执行，账本与业务写同事务——后由 FIX-40@<code>42ade28c<\/code> 收编 8 处内部 commit 工具达成「失败一起回滚、无 key 中毒」，红绿链 3 红→6 绿）+ run budget（token/cost/time/tool calls，超限进明确状态）。<strong>事故考古（V4 必读）<\/strong>：合入当日 chat 管道 <strong>100% 断<\/strong>——AgentRun/AgentToolCall 漏注册进 models <code>__init__<\/code>，SQLAlchemy lazy relationship 解析失败；热修 <code>f2e9f22e<\/code>（「demo-critical」）当日收口。教训：ORM 模型注册是隐式全局契约，新表合入需 import 面 grep。\n<strong>真模型证据面<\/strong>：J-06 prep 步走真实注册工具 retrieve_user_material 经 ToolExecutor 完整执行链（真实 document_chunks 检索，「零 mock 零预录」，prompt 断言在案）——工具执行链在真 LLM 会话中被端到端行使过。<\/p>\n<p><strong>X-07（8c769eaf + 76677063 + 20f9b200）<\/strong>——步骤契约：<code>run_steps.py<\/code> 纯函数（step_id/ordinal 全局唯一、owner∈{agent,human,hybrid}、completion_condition kind 封闭词表、越表 ValueError）；ownership 字段进 run 投影（解 U-04 P2：「你做」态此前从 authMode 不可达）；<strong>owner 纪律<\/strong>：agent 完成 human/hybrid 步被服务层拦截（本 worktree agent_run_service.py:1249 亲验）——J-06 判断面「空选择 422 judgment_required、agent 不可代决」即此纪律的产品化；resume 幂等（mobile <code>runStepActionIdempotencyKey<\/code> 统一推导式+服务端 <code>_confirmed_replay<\/code> 回 200）；P2-1 完成戳单一真源（计数器统一，274L 变异测试）；P2-2 BudgetExceeded→409。<\/p>\n<p><strong>X-08（5c62e2d8）<\/strong>——统一 Outcome：<code>capture_task_outcome<\/code>（任务完成路径挂钩）+ <code>build_run_receipt_outcome<\/code>（run 终态 receipt 映射，PARTIAL→NEUTRAL 极性保守）；经事件更新 Goal/Milestone/Galaxy 不双写多真源；G-02 吸收器实测恰一次点亮、同因 receipt duplicate 只补溯源、双面重放不重复点亮（J-06 测试断言）；失败/部分结果保留（failure_preserved/partial_not_promoted 场景在 X-10 outcome 族）。消费面：D-02 读模型账本 ledger_verified 查询、J-08 轨迹投影（derive_outcome_id 同一推导，<code>d105aa57<\/code> 四方一致锁）。<\/p>\n<p><strong>X-09（0c0e08ef）<\/strong>——失败语义三分类（retry vs reconcile vs unknown outcome）+ 两阶段收敛：executor 内部 commit 后崩溃→账本行 interrupted→<strong>同幂等键重放永久拒绝<\/strong>（「重试必须换新键——那是显式决策不是自动行为」注释在 executor 亲验）+ 客户端诚实状态。20+ chaos 场景（crash_recovery e2e 217L + 1141L 单测）。\n<strong>洗白链修复史（X 线最深的修复族，V4 教材）<\/strong>：FIX-40 P3-6 发现自修正环可把幂等闸门拒绝「洗白」成新键真执行→X-09 先在 chat /stream+/task 面排除（error_type 过滤）；wt713 顺审发现三闸门类（IdempotencyConflict/ArgsMismatch/KeyRequired）仍可洗→FIX-417@<code>df51a731<\/code>；wt732 再发现 Interrupted 在 /confirm 两面仍可洗→FIX-447@<code>2d82a628<\/code>（wt740 运行级复现+6 用例钉+handler 排除集扩展）。链条说明：<strong>失败语义的正确性不是一次设计出来的，是三轮对抗考古收出来的<\/strong>。<\/p>\n<p><strong>X-10（3b5a99bc）<\/strong>——评测形态：77 场景（allocation 28/authorization 10/proposal 12/run_steps 13/outcome 10/journey 4）×六元组判定；<strong>判定独立性=判定器对 DB 真相独立复算，不信执行器自述<\/strong>；<code>real_llm_calls=0<\/code> 强制断言（可复现、CI 无 key 可跑）；results.json 18k 行逐场景六元组入库。总览：77/77 PASS、allocation 达标率 100%（mode target 22/22+offer guard 6/6）、high-risk auto=0、false success=0、总延迟 157s（纯服务层墙钟）。后续 P-04 卡把 dbfixture auto_grant 升级为完整授权仪式后 X-10 gate 12 绿复验（<code>322988ce<\/code> 引证）。<\/p>\n<h2>3. 设计决定与取舍（考古）<\/h2>\n<ol>\n<li><strong>加法契约而非重建<\/strong>：8 个 nullable 列+版本判别位，旧行零影响（1231 行 NULL 复核）；execution_mode 复用、proto 不动（REST 是 tasks 契约载体的有意识判断）；card_protocol 不切流（文档级映射，B-06 审计补真源图谱）。<\/li>\n<li><strong>分配权威=代码不=模型<\/strong>：LLM 只在 feasible set 内精化灰区，越界代码强制拒收（S2）——「不信任 prompt」是结构性的；学习守卫/高风险非 auto 是硬规则不是提示词约束。J-04 实战（LLM 建议 agent 被拦回）证明该设计在真模型下行使。<\/li>\n<li><strong>Run 表是唯一真源，WebSocket 仅通知<\/strong>：X-05 验收原文「不让 App 内存或 OpenClaw 成第二真源」落到 agent_runs/agent_run_steps/agent_tool_calls 三表+状态机+投影消费者；FIX-330（agent-stats 真空→如实 unavailable）反向确认了「三套真账本」的边界。<\/li>\n<li><strong>幂等键哲学<\/strong>：side effect 强制幂等键；键永不自动重执行，重试换键=显式决策。洗白链三轮修复（417→447+FIX-40 P3-6 先行排除）把这个哲学贯彻到了自修正环/LLM 重试等所有旁路。<\/li>\n<li><strong>账本原子性<\/strong>：「工具写入与账本行同事务」最初对内部 commit 工具不成立（FIX-40 P2-3）——修法取「executor 打点+服务层收编 commit 为 flush」而非广泛 savepoint（调用面审计否决后者：独立脏会话调用方会静默丢写）。取舍记录完整在台账。<\/li>\n<li><strong>评测独立性<\/strong>：X-10 判定器从 DB 复算+零 LLM 断言=门禁可复现；LLM 依赖行为的验证被<strong>显式路由<\/strong>到别处（E-04 真模型探针、J-04/J-06 真组件链、JOURNEY 真驱动 6/7+day7 GO），不是遗漏而是分工。V4 读证据时要按这个分工找：<strong>「X-10 100%」是规则层+服务层结论，不证明真模型灰区表现<\/strong>——后者看 E-04/J-04/J-06/JOURNEY。<\/li>\n<li><strong>已知代价的接受<\/strong>：X-05 首部署消费组回放突发（一次性运维成本，不改为「运维知悉」）；reversible 元数据 38/38 全真（无信息量，登记待高影响域接入再分化）；budget 不切断 agent 循环（20 次硬顶兜底，FIX-40 行内留记）。<\/li>\n<\/ol>\n<h2>4. 残差与 V4 注意点<\/h2>\n<p><strong>活性残差（有台账号的）<\/strong>：<\/p>\n<ul>\n<li>FIX-32（X-05B follow-ups，OPEN 备忘）：once-set 键无 attempt/epoch 维度（resume 后 30 分钟内重复里程碑被抑制——纯可见性）；cancel 白名单先于幂等早退（终态 run 非法 reason 得 422 非 200，测试注释相反）；sweep 措辞偏宽。<\/li>\n<li>FIX-42（X-09 follow-ups，OPEN 备忘）：分类器公共 API transient+confirmed→retryable 潜在陷阱（当前接线不可达）；WAIT_EXPIRED/QUEUE_STALE 的 error_category=permanent_failure 终态观感偏粗；REPORT 两处勘误。<\/li>\n<li>FIX-40 残余留记：P3-7 M7 冲突语义断言区分；reversible 38/38 全真零信息量；<code>_resume_or_replay<\/code> 信任创建时授权 mode（高影响域接入时复推）。<\/li>\n<li>V3-FIX-502（X-03..X-09 receipt 断链，本轮登记）。<\/li>\n<\/ul>\n<p><strong>结构性事实（V4 设计输入）<\/strong>：<\/p>\n<ol>\n<li><strong>生产分配=规则层<\/strong>。语义精化层默认关；灰区默认 hybrid。若 V4 要更聪明的灰区分配，先决问题是「给语义层真实流量+护栏」还是「继续加规则维度」——E-04 已证明 prompt 收敛后真模型五面可 15/15，但那是探针不是产品流量。<\/li>\n<li><strong>所有权产品化已完成大半<\/strong>：cognitive_ownership 三值贯穿 tasks→allocation→run steps→UI ownership 投影→U-04 组件；J-06 证明「AI 备料→用户判断→AI 校对」可端到端走通且 AI 代答被结构性拦截。V4 扩展执行模式时沿这条词表链，勿新造第二套 ownership 词汇。<\/li>\n<li><strong>失败语义已成体系但仍在进化<\/strong>：两阶段收敛+幂等键纪律+洗白排除集是现势边界；V4 新增任何「自动重试/修正环」必须先过「会不会把闸门拒绝洗白成新执行」这一问（三连登记的教训）。<\/li>\n<li><strong>ORM 注册隐式契约<\/strong>：X-06 合入当日 chat 全断事故——新表必须注册进 models <code>__init__<\/code>；V4 若引入模型注册守卫（如 import 面 lint）可根除该族。<\/li>\n<li><strong>实机证据缺口<\/strong>：GJ07（X-07）及全 X 线三端实机走查均 headless+widget 口径，转 HUMAN_INBOX；X-10 的 journey 族 4 场景是服务层重放，非真机。V4 验收计划应把「真机 hybrid 交接」列为设备解锁后的第一批。<\/li>\n<li><strong>agent-stats 类「模板真空」教训<\/strong>：FIX-330 证明「结构性零冒充测量值」与 mock 污染同罪——V4 新增任何统计面必须同时交付写侧或默认 unavailable。<\/li>\n<\/ol>\n<h2>5. 本轮发现问题登记（号段复核后占用）<\/h2>\n<table>\n<thead>\n<tr>\n<th>号<\/th>\n<th>定性<\/th>\n<th>一句话<\/th>\n<th>证据硬点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>V3-FIX-502<\/strong><\/td>\n<td>实现漂移（证据面）<\/td>\n<td>X-03/X-04/X-05/X-05B/X-06/X-07/X-08/X-09（及 M-06/M-08/M-09）卡级 REPORT/REVIEW_RECEIPT 从未入库，台账 FIX-28/29/32/40/42 引用死路径<\/td>\n<td><code>git log --all --diff-filter=A<\/code> 0 命中；v3-output/ 现存 X 线仅 X-01/X-02/X-10/X07-P21；wt759 以 commit message 签收核验故结论不受影响<\/td>\n<\/tr>\n<tr>\n<td><strong>V3-FIX-503<\/strong><\/td>\n<td>承诺未兑现<\/td>\n<td>FIX-36「真模型复验由 E-05 下窗口补」未兑现（M-09 探针面；其结论直接影响「记忆个性化在答案层生效」这一 X/J 线共同前提的库内证据形态）<\/td>\n<td>HEAD 库内 stability report 仍是修前 P01-D1 0/5 快照；E-05 产物与 fleet notes 无复验记录；代码修复有 8 单测钉<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>（号段复核：500/501 在册 0 占用。X 线本身未发现新的活性缺陷——洗白链/账本原子性等深坑均已被在册 FIX 收口，本章以引用方式归档。）<\/p>\n", "text": "# X 线（Action，10 卡）深挖章 —— V3-COMPLETE-STATUS-FOR-V4 §4 素材\n\n> 作者：wt770（文档深挖）｜基线：main@ce9846a3（2026-09-28）｜方法：卡面 + `git log --grep` 逐卡定位 → 读现势代码核实 → 目标测试在 worktree 实跑 → REPORT/RECEIPT/FIX 台账抽读。\n> **本章事实判据**：所有 SHA 均已在 main 可达（`git show` 亲验）；运行级证据 = 本 worktree 实跑（§2.0）；「真模型 vs demo」逐处标注。\n> 本轮新登记：**V3-FIX-502**（M/X 线卡级 receipt 断链——X-03..X-09 在列）与 **V3-FIX-503**（M-09 真模型复验，涉 X 侧引证）见 §5；另有多项已在册残差汇总于 §4。\n\n## 0. 逐卡验证口径（本章通用）\n\n- **实跑验证（2026-09-28，worktree wt770-docmx = main HEAD）**：X 线核心测试 403 用例全绿——\n  `test_action_plan_contract + test_action_allocation_policy + test_action_allocation_guard + test_action_allocation_eval` = 141 passed；\n  `test_action_command_service + test_agent_run_service + test_run_state_machine + test_hybrid_run_steps + test_failure_semantics + test_x09_failure_recovery + tests/v3_action_eval/test_x10_action_eval_gate` = 262 passed（156s，sqlite in-memory，零 LLM）。\n- **评审证据形态**：X-01/X-02/X-10 有入库 REPORT/RECEIPT；X07-P21 有 REPORT；**X-03/X-04/X-05/X-05B/X-06/X-07/X-08/X-09 的 receipt 原件未入库**——评审结论在 ACCEPT merge commit message 内（「dual-reviewed」「R2 PASS」等），经 wt759 三源核验；断链本体已登记 **V3-FIX-502**。\n- 真源注记（FIX-330 裁决引文）：生产的 agent 执行账本=X-05 AgentRun/AgentRunTransition + X-06 AgentToolCall + outcome_ledger 三套；模板件 agent_execution_stats 零写侧、已如实标 unavailable。\n\n## 1. 意图（卡面提炼）\n\nX 线 10 卡（ACTION stream，V3-2~V3-5 门）把「AI 陪伴学习」落成**可执行的行动引擎**，核心主张是 V3 的第 2 条：**Human/Agent/Hybrid 执行模型——AI 降摩擦但不偷走目标**。设计骨架（ACTION_AND_INTERVENTION_ENGINE / HUMAN_AGENT_HYBRID / AGENT_RUNTIME）：\n\n1. **契约**：在既有 Task/Plan/Proposal 上加 V3 语义（desired_outcome/smallest_useful_step/completion_evidence/execution_mode/cognitive_ownership/source_refs/risk），不重建 task system；关键字段不得仅以自然语言携带（X-01）。\n2. **分配**：delegation rubric 而非模型随口「我来帮你做」——八维因子输出 mode；high-risk auto=0；学习目标不默认 Agent 写完整答案（X-02）。\n3. **授权**：proposal→approve→validate version/permission→commit→receipt 统一权威路径，所有入口同路；重复确认不重复写、冲突不覆盖、未授权不执行（X-03，critical）。\n4. **人执行面**：start/complete/abandon/rescope + 按类型取完成证据；实际时长永不从 estimated 回填（X-04）。\n5. **Run 真源**：统一 run_id/state 持久化，App 内存与 OpenClaw 不成第二真源；WebSocket 仅通知（X-05，critical）。\n6. **工具边界**：工具元数据（read/write/risk/reversible/permission/cost）+ side effect 强制幂等键 + run budget（X-06，critical）。\n7. **混合交接**：Agent 做一部分→轮到用户→继续；owner 纪律；用户操作两次不 resume 两次（X-07）。\n8. **结果回写**：无论谁执行，完成统一产 Outcome 进 Outcome Ledger；失败不点亮成果（X-08）。\n9. **失败语义**：false success=0、duplicate side effect=0、20+ chaos case 终态正确（X-09，critical）。\n10. **端到端评测**：≥60 场景 allocation ≥90%、high-risk auto=0、false success=0、Simulator 无需开发者介入（X-10）。\n\n**Forbidden（全卡共性）**：不重建既有真源；不用 mock 冒充真实行为；不以静态阅读宣称 UX 通过；不弱化既有安全/幂等/隔离/审计守卫。\n\n## 2. 实际交付逐卡表\n\n### 2.1 总表\n\n| 卡 | 主干 SHA（评审签收） | 关键交付 | 用户可见行为一句话 | 验证证据 | 残差 |\n|---|---|---|---|---|---|\n| X-01 | `43942d23`（dual-review+rework） | x01 迁移（tasks 8 nullable V3 列）+ `core/action_plan.py`（448L 冻结契约） | 任务可携带「期望结果/最小有效步/完成证据/谁执行」结构化字段 | 640L 测试含迁移 sqlite 重放；F1 探针（脏枚举行曾致全端点 500）红→绿 | card_protocol 映射停留在文档级（B-06 ENTITY_MAP 后续补齐真源审计） |\n| X-02 | `c0e02bf8`（dual-review+rework） | `action_allocation_policy.py`（995L）：纯函数 decide_allocation 四层 | 学习类请求永不自动代写；高风险永不自动执行；每次分配带 why+confidence | 85 场景盲评规则层 100%（目标≥90%）；1392L 测试；E-04 真模型 5 面收敛轮 15/15 | 语义层默认关（生产=规则层）；实机 5-Persona 观感转 HUMAN_INBOX |\n| X-03 | `7fc507fd`（dual-reviewed, rev2） | x03/x03b 迁移 + proposals API + `action_command_service.py`（897L）统一命令路径 | 重复确认不重复写、版本冲突不覆盖、过期/取消明确、UI 拿权威 receipt | 1577L 测试；X-10 proposal 族 12 场景全 PASS | chat 卡片命令分发缺口由 wt687（FIX-378）收口；P-04 在其上加低风险 auto-execute 授权层（`322988ce`） |\n| X-04 | `6a6363f8` | `task_completion_evidence.py`（275L）+ task_service +387L + mobile 完成流 | 完成要交证据；实际时长如实测量、绝不拿预估冒充 | 458L 后端测试 + mobile 真跑；「actual≠estimated」为函数级红线（违者 raise） | Focus/Calendar 仅 optional capability 挂点（卡面即如此定位） |\n| X-05 | `fbe679bb`（dual-reviewed rev2）+ X-05B `238abe22`（双 PASS） | x05 迁移 agent_runs + `run_state_machine.py`（322L）+ agent_run_service（1087L）+ runs API + 投影消费者 | App 杀掉重开仍能查到任务进行到哪一步；worker 重启恢复或明确终态 | 状态机非法迁移测试；X-05B 后 190 绿；X-10 run_steps 族 13 场景 PASS | FIX-32 OPEN（once-set 键无 attempt 维度等可见性缝隙，备忘） |\n| X-06 | `5abd1c4b`（dual-reviewed）+ 当日热修 `f2e9f22e` | x06 迁移 agent_tool_calls + `tools/metadata.py`（304L）+ `executor.py`（369L ToolExecutor） | AI 每次动工具都有权限判定、账本行、幂等键；花钱/超时进明确状态 | 1134L 测试（budget 449 + safety 685）；**事故**：合入当日 chat 管道 100% 断（models __init__ 漏注册）当日修 | FIX-40 P2-3 已收口@`42ade28c`；残余：reversible 38/38 全真零信息量、_resume_or_replay 信任创建时授权 mode |\n| X-07 | `8c769eaf` + P2-1 `76677063` + P2-2 `20f9b200` | x07 迁移 run_steps + `core/run_steps.py`（340L owner/ownership 词表）+ AwaitingStepResumeCard | 「AI 备料→你来判断→AI 校对」的交接卡真实存在且不能被 AI 代答 | 1062L 后端 + 216L mobile 测试；owner 纪律服务层拦截（agent_run_service:1249 亲验） | **GJ07 三端实机未做**（headless+widget 口径） |\n| X-08 | `5c62e2d8` | `outcome_capture_service.py`（219L）+ outcome_ledger_service +154L | 完成/失败都留可查结果记录；失败不点亮星图成果 | 528L 测试；J-06 实测 G-02 吸收器恰一次点亮+重放幂等 | partial→NEUTRAL 极性映射为保守口径（设计内） |\n| X-09 | `0c0e08ef`（dual-reviewed） | `core/failure_semantics.py`（389L）+ tool_call_ledger（285L）+ executor 两阶段收敛 | 崩溃后不假装成功：同一操作重放被明确拒绝而非悄悄重执行 | 1141L 单测 + 217L 崩溃恢复 e2e；X-10 outcome 族含 failure_preserved | FIX-42 OPEN（分类器 transient+confirmed 陷阱等备忘）；幂等洗白链 FIX-417/447 已修（`df51a731`/`2d82a628`） |\n| X-10 | `3b5a99bc` | `tests/v3_action_eval/` 判定套件 + 77 场景 fixture + results.json（18k 行）入库 | （对内）行动引擎全链 77/77 可重复判定 | **77/77 PASS、allocation 28/28=100%、high-risk auto=0、false success=0**；判定器从 DB 独立复算、`real_llm_calls=0` 强制断言 | 零真实 LLM 为显式设计（见 §3.6）；LLM 依赖面由 J-04/J-06/JOURNEY 真驱动补证 |\n\n### 2.2 逐卡要点与证据细节\n\n**X-01（43942d23）**——落点=tasks 表 8 个 nullable 新列（`action_schema_version` 判别位 NULL=legacy；desired_outcome；smallest_useful_step 带 `useful_because` 封闭枚举、空判据=伪步骤拒绝；completion_evidence 类型化证据规格；cognitive_ownership（D13 首版定义全仓第一落点）；source_refs 封闭 scheme；risk_class；reversible），**execution_mode 复用既有列不建第二真源**（dev 库 1231 行全 NULL 复核后定案）。契约真源 `core/action_plan.py`：C-01 同款冻结 dataclass+封闭词表+统一投影门——**读侧容错取舍（R2 返修）**：初版 REST 路径原样投影列值，单行脏枚举会使该用户全部任务端点 500（F1 探针实证）；修后版本门/词表不过→整块降级 None+WARN（区分「没有 V3 计划」与「计划损坏」）。契约载体=REST/JSON 非 gRPC，proto 不动（有意识决定）。\n\n**X-02（c0e02bf8）**——「AI 能做 ≠ AI 应做」机制化为四层纯函数：①Guard 硬规则（R1 风险/不可逆、R4 具身、R5 隐私、R6 低置信、G1 学习守卫）从全集剔除不可行 mode；②选择层（显式意图>持久偏好>ownership×tool-advantage）；③修饰层（T1 紧急促进、T2 偏好 agent 但更慢更贵→降 hybrid）；④**语义层（默认关，`SPARKLE_ALLOCATION_SEMANTIC_ENABLED=False` 本 worktree settings.py:1029 亲验）**——LLM 只能在 feasible set 内选（越界 S2 拒收保规则默认），带熔断（3 败/300s）/限频/超时。学习守卫硬规则：学习任务 feasible set 永不含 agent、hybrid 必须带 user-authored 证据要求、`vet_agent_offer` 拒「直接写完整答案」；X-01 F5 矛盾集（agent×user_core 等）成硬规则测试冻结。封闭词表 sha256 双冻结。\n**真模型证据**：85 场景盲评=规则层独跑 100%（fixture 标注只看 HUMAN_AGENT_HYBRID 文档、rubric 盲跑不见 target）；E-04（`58d08c6f`）真模型五面探针（act-B1 学习守卫/B2 机械委托/B3 风险/B4 灰区/B5 **注入推 agent**）基线轮 8/15 失败→prompt 收敛轮 **15/15**（qwen3.8-flash 真实 API，baseline/converged 两份 JSON 入库）。**生产authority实战**：J-04（`02b82cd2`）首行动推导中 LLM 建议 agent 的学习步被 decide_allocation 学习守卫拦回 human/hybrid（真 LLM 产出+规则权威，测试断言在案）；JOURNEY day1-6 真驱动 6/7 过门（day6 门曾因 FIX-314 时钟语义停、当日修复重跑 PASS，证据链完整）。\n\n**X-03（7fc507fd）**——统一命令路径：`action_command.py`（命令注册/schema）+ `action_command_service.py`（proposal→approve→validate→commit→receipt 全生命周期）+ `task_commands.py`（首批命令集）；里程碑路径迁上命令路径（milestone_command_path 测试）；网关 `/action-proposals` 纯代理。幂等四态（同键重放/同键异 payload 重放既有/终态拒绝/TTL sweep）与乐观并发（版本冲突不覆盖）由 1577L 测试+X-10 proposal 族 12 场景双承载。后续增强：P-04（`322988ce`）低风险 auto-execute（总开关∧类别授予∧low∧reversible∧无人工标记五条件，grant_basis 固化进 receipt，revoke 即时生效含 resume 复核）；U-04 chat 卡片命令分发收口（wt687，FIX-378）——「所有入口走同一权威路径」在 09-27 才完全成立。\n\n**X-04（6a6363f8）**——`resolve_actual_minutes` 函数级红线：只认实测两真源，非实测值直接 raise（代码注释「宁少扣不少算」）；`compute_actual_minutes_from_timestamps` 从时间戳推导；完成证据按 action 类型（artifact/self-report/test）取；mobile 任务卡/详情/执行屏接线。GJ05 的 backend 全链+widget 部分已证；三端实机同属 HUMAN_INBOX 族。\n\n**X-05（fbe679bb + 238abe22）**——run 脊柱：QUEUED/RUNNING/AWAITING_USER/EXECUTING/terminal 状态机（非法迁移测试钉）+ agent_runs/agent_run_steps 表 + runs API + 事件投影消费者（`$` 起点消费组首部署回放突发被 FIX-28 定性为一次性部署成本并根治）；X-05B 补 EXECUTING producer 接线（执行步进可见性）+ runs API 硬化（intent 归属 404、cancel reason 服务端白名单）。R2 双 PASS 190 绿。**生产账本地位**由 FIX-330 裁决背书（agent-stats 真空事件反证：生产链路已有自己的三套账本）。J-06 旗舰旅程把 run 脊柱用进产品（prep[agent]→judgment[human]→execute_check[agent]→outcome[hybrid] 四步真实数据流）。\n\n**X-06（5abd1c4b + f2e9f22e）**——工具能力边界：metadata（read/write/risk/reversible/required permission/cost）+ ToolExecutor（权限判定→账本行→幂等键→执行，账本与业务写同事务——后由 FIX-40@`42ade28c` 收编 8 处内部 commit 工具达成「失败一起回滚、无 key 中毒」，红绿链 3 红→6 绿）+ run budget（token/cost/time/tool calls，超限进明确状态）。**事故考古（V4 必读）**：合入当日 chat 管道 **100% 断**——AgentRun/AgentToolCall 漏注册进 models `__init__`，SQLAlchemy lazy relationship 解析失败；热修 `f2e9f22e`（「demo-critical」）当日收口。教训：ORM 模型注册是隐式全局契约，新表合入需 import 面 grep。\n**真模型证据面**：J-06 prep 步走真实注册工具 retrieve_user_material 经 ToolExecutor 完整执行链（真实 document_chunks 检索，「零 mock 零预录」，prompt 断言在案）——工具执行链在真 LLM 会话中被端到端行使过。\n\n**X-07（8c769eaf + 76677063 + 20f9b200）**——步骤契约：`run_steps.py` 纯函数（step_id/ordinal 全局唯一、owner∈{agent,human,hybrid}、completion_condition kind 封闭词表、越表 ValueError）；ownership 字段进 run 投影（解 U-04 P2：「你做」态此前从 authMode 不可达）；**owner 纪律**：agent 完成 human/hybrid 步被服务层拦截（本 worktree agent_run_service.py:1249 亲验）——J-06 判断面「空选择 422 judgment_required、agent 不可代决」即此纪律的产品化；resume 幂等（mobile `runStepActionIdempotencyKey` 统一推导式+服务端 `_confirmed_replay` 回 200）；P2-1 完成戳单一真源（计数器统一，274L 变异测试）；P2-2 BudgetExceeded→409。\n\n**X-08（5c62e2d8）**——统一 Outcome：`capture_task_outcome`（任务完成路径挂钩）+ `build_run_receipt_outcome`（run 终态 receipt 映射，PARTIAL→NEUTRAL 极性保守）；经事件更新 Goal/Milestone/Galaxy 不双写多真源；G-02 吸收器实测恰一次点亮、同因 receipt duplicate 只补溯源、双面重放不重复点亮（J-06 测试断言）；失败/部分结果保留（failure_preserved/partial_not_promoted 场景在 X-10 outcome 族）。消费面：D-02 读模型账本 ledger_verified 查询、J-08 轨迹投影（derive_outcome_id 同一推导，`d105aa57` 四方一致锁）。\n\n**X-09（0c0e08ef）**——失败语义三分类（retry vs reconcile vs unknown outcome）+ 两阶段收敛：executor 内部 commit 后崩溃→账本行 interrupted→**同幂等键重放永久拒绝**（「重试必须换新键——那是显式决策不是自动行为」注释在 executor 亲验）+ 客户端诚实状态。20+ chaos 场景（crash_recovery e2e 217L + 1141L 单测）。\n**洗白链修复史（X 线最深的修复族，V4 教材）**：FIX-40 P3-6 发现自修正环可把幂等闸门拒绝「洗白」成新键真执行→X-09 先在 chat /stream+/task 面排除（error_type 过滤）；wt713 顺审发现三闸门类（IdempotencyConflict/ArgsMismatch/KeyRequired）仍可洗→FIX-417@`df51a731`；wt732 再发现 Interrupted 在 /confirm 两面仍可洗→FIX-447@`2d82a628`（wt740 运行级复现+6 用例钉+handler 排除集扩展）。链条说明：**失败语义的正确性不是一次设计出来的，是三轮对抗考古收出来的**。\n\n**X-10（3b5a99bc）**——评测形态：77 场景（allocation 28/authorization 10/proposal 12/run_steps 13/outcome 10/journey 4）×六元组判定；**判定独立性=判定器对 DB 真相独立复算，不信执行器自述**；`real_llm_calls=0` 强制断言（可复现、CI 无 key 可跑）；results.json 18k 行逐场景六元组入库。总览：77/77 PASS、allocation 达标率 100%（mode target 22/22+offer guard 6/6）、high-risk auto=0、false success=0、总延迟 157s（纯服务层墙钟）。后续 P-04 卡把 dbfixture auto_grant 升级为完整授权仪式后 X-10 gate 12 绿复验（`322988ce` 引证）。\n\n## 3. 设计决定与取舍（考古）\n\n1. **加法契约而非重建**：8 个 nullable 列+版本判别位，旧行零影响（1231 行 NULL 复核）；execution_mode 复用、proto 不动（REST 是 tasks 契约载体的有意识判断）；card_protocol 不切流（文档级映射，B-06 审计补真源图谱）。\n2. **分配权威=代码不=模型**：LLM 只在 feasible set 内精化灰区，越界代码强制拒收（S2）——「不信任 prompt」是结构性的；学习守卫/高风险非 auto 是硬规则不是提示词约束。J-04 实战（LLM 建议 agent 被拦回）证明该设计在真模型下行使。\n3. **Run 表是唯一真源，WebSocket 仅通知**：X-05 验收原文「不让 App 内存或 OpenClaw 成第二真源」落到 agent_runs/agent_run_steps/agent_tool_calls 三表+状态机+投影消费者；FIX-330（agent-stats 真空→如实 unavailable）反向确认了「三套真账本」的边界。\n4. **幂等键哲学**：side effect 强制幂等键；键永不自动重执行，重试换键=显式决策。洗白链三轮修复（417→447+FIX-40 P3-6 先行排除）把这个哲学贯彻到了自修正环/LLM 重试等所有旁路。\n5. **账本原子性**：「工具写入与账本行同事务」最初对内部 commit 工具不成立（FIX-40 P2-3）——修法取「executor 打点+服务层收编 commit 为 flush」而非广泛 savepoint（调用面审计否决后者：独立脏会话调用方会静默丢写）。取舍记录完整在台账。\n6. **评测独立性**：X-10 判定器从 DB 复算+零 LLM 断言=门禁可复现；LLM 依赖行为的验证被**显式路由**到别处（E-04 真模型探针、J-04/J-06 真组件链、JOURNEY 真驱动 6/7+day7 GO），不是遗漏而是分工。V4 读证据时要按这个分工找：**「X-10 100%」是规则层+服务层结论，不证明真模型灰区表现**——后者看 E-04/J-04/J-06/JOURNEY。\n7. **已知代价的接受**：X-05 首部署消费组回放突发（一次性运维成本，不改为「运维知悉」）；reversible 元数据 38/38 全真（无信息量，登记待高影响域接入再分化）；budget 不切断 agent 循环（20 次硬顶兜底，FIX-40 行内留记）。\n\n## 4. 残差与 V4 注意点\n\n**活性残差（有台账号的）**：\n- FIX-32（X-05B follow-ups，OPEN 备忘）：once-set 键无 attempt/epoch 维度（resume 后 30 分钟内重复里程碑被抑制——纯可见性）；cancel 白名单先于幂等早退（终态 run 非法 reason 得 422 非 200，测试注释相反）；sweep 措辞偏宽。\n- FIX-42（X-09 follow-ups，OPEN 备忘）：分类器公共 API transient+confirmed→retryable 潜在陷阱（当前接线不可达）；WAIT_EXPIRED/QUEUE_STALE 的 error_category=permanent_failure 终态观感偏粗；REPORT 两处勘误。\n- FIX-40 残余留记：P3-7 M7 冲突语义断言区分；reversible 38/38 全真零信息量；`_resume_or_replay` 信任创建时授权 mode（高影响域接入时复推）。\n- V3-FIX-502（X-03..X-09 receipt 断链，本轮登记）。\n\n**结构性事实（V4 设计输入）**：\n1. **生产分配=规则层**。语义精化层默认关；灰区默认 hybrid。若 V4 要更聪明的灰区分配，先决问题是「给语义层真实流量+护栏」还是「继续加规则维度」——E-04 已证明 prompt 收敛后真模型五面可 15/15，但那是探针不是产品流量。\n2. **所有权产品化已完成大半**：cognitive_ownership 三值贯穿 tasks→allocation→run steps→UI ownership 投影→U-04 组件；J-06 证明「AI 备料→用户判断→AI 校对」可端到端走通且 AI 代答被结构性拦截。V4 扩展执行模式时沿这条词表链，勿新造第二套 ownership 词汇。\n3. **失败语义已成体系但仍在进化**：两阶段收敛+幂等键纪律+洗白排除集是现势边界；V4 新增任何「自动重试/修正环」必须先过「会不会把闸门拒绝洗白成新执行」这一问（三连登记的教训）。\n4. **ORM 注册隐式契约**：X-06 合入当日 chat 全断事故——新表必须注册进 models `__init__`；V4 若引入模型注册守卫（如 import 面 lint）可根除该族。\n5. **实机证据缺口**：GJ07（X-07）及全 X 线三端实机走查均 headless+widget 口径，转 HUMAN_INBOX；X-10 的 journey 族 4 场景是服务层重放，非真机。V4 验收计划应把「真机 hybrid 交接」列为设备解锁后的第一批。\n6. **agent-stats 类「模板真空」教训**：FIX-330 证明「结构性零冒充测量值」与 mock 污染同罪——V4 新增任何统计面必须同时交付写侧或默认 unavailable。\n\n## 5. 本轮发现问题登记（号段复核后占用）\n\n| 号 | 定性 | 一句话 | 证据硬点 |\n|---|---|---|---|\n| **V3-FIX-502** | 实现漂移（证据面） | X-03/X-04/X-05/X-05B/X-06/X-07/X-08/X-09（及 M-06/M-08/M-09）卡级 REPORT/REVIEW_RECEIPT 从未入库，台账 FIX-28/29/32/40/42 引用死路径 | `git log --all --diff-filter=A` 0 命中；v3-output/ 现存 X 线仅 X-01/X-02/X-10/X07-P21；wt759 以 commit message 签收核验故结论不受影响 |\n| **V3-FIX-503** | 承诺未兑现 | FIX-36「真模型复验由 E-05 下窗口补」未兑现（M-09 探针面；其结论直接影响「记忆个性化在答案层生效」这一 X/J 线共同前提的库内证据形态） | HEAD 库内 stability report 仍是修前 P01-D1 0/5 快照；E-05 产物与 fleet notes 无复验记录；代码修复有 8 单测钉 |\n\n（号段复核：500/501 在册 0 占用。X 线本身未发现新的活性缺陷——洗白链/账本原子性等深坑均已被在册 FIX 收口，本章以引用方式归档。）\n"}, {"id": "00_context/source_notes/S13_D-line.md", "title": "D 线（Data 8 卡）深挖章节 —— V4 交接文档素材（wt776）", "group": "原始报告副本", "html": "<h1>D 线（Data 8 卡）深挖章节 —— V4 交接文档素材（wt776）<\/h1>\n<blockquote>\n<p>本文是 <code>v3/V3-COMPLETE-STATUS-FOR-V4.md<\/code> §4「各线深度状态」D 线章节的深挖草稿。\n证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n撰写：wt776（2026-09-28，基线 main@fd4267ef）。方法：卡面（v3/07_tasks/cards/D-0*.md）+ <code>git log --grep<\/code> 逐卡定位 → 主干代码逐文件开文件亲证（event_registry 词表 40 名 sha256 独立复算吻合 / outcome_ledger / understanding_dimensions / intervention_lifecycle / north_star_wvpl / evidence_insight 六服务逐一开读）→ 测试文件逐个计数 → v3-output receipt/审计报告抽读（D-01/02/03/06 目录 + WT651/WT663/WT664/WT669/WT397）→ 台账闭环逐条复核。<strong>未轻信任何台账/报告结论性文字。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>D.0 线级概览<\/h2>\n<p>D 线是 V3 的「数据飞轮线」：把交互→决策→执行→outcome 串成可追溯、可审计、不让模型算数字的事件与账本体系。8/8 全部 done（tasks.json@main：D-01~06 由 8d4291aa 核正、D-07/D-08 由 wt759 批量销账 dba6aaf2 按交付+独立增量复证推定；本档 §D.2-D-07/D-08 给出复核结论：<strong>销账成立但两卡均无正式 review receipt<\/strong>）。<\/p>\n<p>执行形态的显著特点（V4 设计者需要知道）：<strong>D 线是「契约先行、读模型优先」的线<\/strong>——D-01 冻结事件词表（40 名 sha256 双冻结，本档独立重算吻合）、D-02 纯读模型零 schema 变更（五源聚合不建新表）、D-03 公式冻结进 core 纯函数、D-06 事实 JSON 工厂带 golden 钉死零 LLM。产品代码增量集中在 D-04（mobile 统计接真+清污）和 D-07（insights 证据化重构+假精确面删除）。<strong>D 线是「诚实数据」红线在统计面的执行者<\/strong>：D-04 催生 FIX-350~354 五项污染清污（两批全修），D-07 催生 FIX-359 删失语义诚实化。<\/p>\n<p><strong>V4 最须知道的一条（本档新登记 V3-FIX-507）<\/strong>：数据飞轮的中段——D-05 intervention lifecycle（exposure→response→outcome 关联）——<strong>写路径零生产调用方<\/strong>。record_exposure/record_response/associate_pending_outcomes 全仓生产面零调用，唯一调用方是测试与评测 harness 引擎；读侧（D-07 两类洞察卡、M-06 经验投影）已接线。即：<strong>飞轮纵向闭环的真实数据流在「干预交付」处断链，D-07/D-08 的洞察与证明是「读侧结构就绪 + 评测 harness 真数据」，不是生产部署会自然产生的数据<\/strong>。详见 §D.2-D-07/§D.4。<\/p>\n<hr />\n<h2>D.1 意图（卡面目标与验收）<\/h2>\n<p>八卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。Worker 只能提交 READY_FOR_REVIEW/PARTIAL/BLOCKED；Reviewer 必须独立执行关键验收。<\/p>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>Risk/Resource/Reviewers<\/th>\n<th>卡面目标（一句话）<\/th>\n<th>卡面关键验收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>D-01 统一 Event/Evidence Lineage Contract<\/td>\n<td>high/MEDIUM/2<\/td>\n<td>把交互/决策/执行/outcome 串到可追溯事件图（复用 outbox，不重建真源）<\/td>\n<td>GJ03 trace 可从 UI action 追到 outcome/state update；事件幂等且跨用户隔离<\/td>\n<\/tr>\n<tr>\n<td>D-02 Outcome Ledger 与 Evidence Type 正规化<\/td>\n<td>high/MEDIUM/2<\/td>\n<td>建立真实成果账本，让「完成」不等于点击<\/td>\n<td>completion evidence 无法证明时不伪装 actual；outcome 跨模块可查询且不重复计数<\/td>\n<\/tr>\n<tr>\n<td>D-03 Understanding 五维内部度量与校准<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>替代神秘 understanding_depth 百分比，形成可诊断五维指标<\/td>\n<td>每维有公式/数据源/边界，缺数据=unknown；纠正与错误使用会合理降维<\/td>\n<\/tr>\n<tr>\n<td>D-04 真实 Analytics 接线并清除生产 Mock 缓存污染<\/td>\n<td>high/HEAVY/2<\/td>\n<td>修复统计 provider 与 user-visible mock，真实 API 不可用就隐藏<\/td>\n<td>生产统计无固定 mock 值；cache 不存 demo fallback；断网显示 last-known-real/unknown+时间<\/td>\n<\/tr>\n<tr>\n<td>D-05 Intervention→Outcome 分析管线<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>回答「什么帮助在什么情境有用」，形成 Experience Memory 数据基础<\/td>\n<td>同一 intervention 不双计；未观察 outcome 标 censored/unknown；可生成 per-user/per-scope 历史摘要<\/td>\n<\/tr>\n<tr>\n<td>D-06 WVPL 北极星查询与事实 JSON<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>实现可审计 North Star，不让模型计算数字<\/td>\n<td>固定 fixture 确定结果+边界测试；可在 staging 真实跑并追溯 event IDs<\/td>\n<\/tr>\n<tr>\n<td>D-07 Evidence-driven Insights 产品重构<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>把 Insights 从预测仪表盘变成有证据、可行动的 reflection<\/td>\n<td>每条洞察可点来源，纠正后更新；无数据不生成人格结论；<strong>Simulator 能理解至少 3 条 insight 意义<\/strong><\/td>\n<\/tr>\n<tr>\n<td>D-08 数据飞轮纵向证明与 Regression Dashboard<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>用多 session 证据证明数据→理解→决策→outcome 闭环<\/td>\n<td>≥10 Persona Day0/3/7 模拟；每 persona 至少一条 correction/plan change→可解释 adaptation；无效个性化保留不筛<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>D.2 实际交付逐卡<\/h2>\n<h3>D-01 · 统一 Event / Evidence Lineage Contract<\/h3>\n<p><strong>交付（首轮 dual-ACCEPT + 增量复证轮）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>波次<\/th>\n<th>主干 SHA<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>首轮<\/td>\n<td><code>6f488636<\/code>（ACCEPT merge，dual-review + rework）<\/td>\n<td><code>backend/app/core/event_regis /p>\n<h3>D-07 · Evidence-driven Insights 产品重构<\/h3>\n<p><strong>交付（本体 + 独立会话诚实性增量 + 重编号修复链）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>波次<\/th>\n<th>主干 SHA<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>本体（wt369）<\/td>\n<td><code>667001e6<\/code><\/td>\n<td>GET /insights/evidence-cards：五要素卡（fact/interpretation/uncertainty/evidence/implication）×三类洞察——friction pattern 读 D-05 friction_tag 聚合、interventions that helped 读 D-05 association_summary（证据不足切片不发卡）、goal progress 复用 A-07 Goal/Task 读侧双口径；全派生现算、纠正落库后下次读取即更新、零置信百分比零分数族键、无数据不出卡不生成人格结论；mobile 五要素洞察卡+证据深链（decision log·goal ledger 可点）接入洞察总览顶部（learning_insights_overview_screen.dart:96 EvidenceInsightSection 本档亲证）；<strong>假精确面删除<\/strong>：PredictiveInsightsCard 整体删除（置信度%徽章/精确到时刻预测/风险指数分数条/难度分条），lfcConfidence 改样本观察口径；红测先行（base 5 用例 404 全红+mobile 诚实性测试渲染 90%/72/100 即红）<\/td>\n<\/tr>\n<tr>\n<td>诚实性增量（wt666）<\/td>\n<td><code>b92ae2ec<\/code>（原 worker 7a914a2c 重提交）<\/td>\n<td>删失语义拆分（FIX-359，原登记 357 撞号顺延）：not_yet_observed 只含未到期删失，window_closed/user_churned/unknown 合并进 not_determinable 新行——「不会有可判定结果」不再伪装成「还没到期」；insufficient 哨兵文案「证据不足，暂不下结论」（低报不虚报）。本档亲证：evidence_insight_service.py:209-215 拆分注释与实现在位<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>三类洞察卡的真实数据流判定（本档核心结论，任务问的「真数据 vs 结构就绪」）<\/strong>：<\/p>\n<ul>\n<li><strong>goal progress 卡：有真数据支撑<\/strong>——读 A-07 Goal/Task 生产表，任何真实用户有目标即出卡。<\/li>\n<li><strong>friction pattern 卡与 interventions-that-helped 卡：结构就绪、生产零数据<\/strong>——供给方是 D-05 lifecycle（写路径零生产调用方，§D.2-D-05/FIX-507），「无数据不出卡」守卫使它们在生产部署中不出卡而非出假卡。<\/li>\n<li>understanding-depth/understanding-dimensions 面：真数据（celery beat 每日聚合真实生产表，D-03）。<\/li>\n<\/ul>\n<p><strong>残差<\/strong>：① <strong>卡面验收「Simulator 能理解至少 3 条 insight 意义」未定位到证据<\/strong>（tests_e2e/、journey harness、WT397 产物全扫零命中；wt369 交付的是 backend 5/5+mobile 定向 6/6+smoke 16 的测试面证据）——销账依据=交付本体+wt666 独立增量复证，此验收项按「未定位到证据」如实留档；② FIX-361 置信度百分比族 8 键 6 面（本卡清了 lfcConfidence 后的残余）已由 wt685 定性化收口@53414f8a；③ 无正式 review receipt（独立复核以 wt666 增量形式发生）。<\/p>\n<p><strong>用户可见行为<\/stro 两类洞察卡、M-06 经验投影）已接线。即：**飞轮纵向闭环的真实数据流在「干预交付」处断链，D-07/D-08 的洞察与证明是「读侧结构就绪 + 评测 harness 真数据」，不是生产部署会自然产生的数据**。详见 §D.2-D-07/§D.4。\n\n---\n\n## D.1 意图（卡面目标与验收）\n\n八卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。Worker 只能提交 READY_FOR_REVIEW/PARTIAL/BLOCKED；Reviewer 必须独立执行关键验收。\n\n| 卡 | Risk/Resource/Reviewers | 卡面目标（一句话） | 卡面关键验收 |\n|---|---|---|---|\n| D-01 统一 Event/Evidence Lineage Contract | high/MEDIUM/2 | 把交互/决策/执行/outcome 串到可追溯事件图（复用 outbox，不重建真源） | GJ03 trace 可从 UI action 追到 outcome/state update；事件幂等且跨用户隔离 |\n| D-02 Outcome Ledger 与 Evidence Type 正规化 | high/MEDIUM/2 | 建立真实成果账本，让「完成」不等于点击 | completion evidence 无法证明时不伪装 actual；outcome 跨模块可查询且不重复计数 |\n| D-03 Understanding 五维内部度量与校准 | medium/MEDIUM/1 | 替代神秘 understanding_depth 百分比，形成可诊断五维指标 | 每维有公式/数据源/边界，缺数据=unknown；纠正与错误使用会合理降维 |\n| D-04 真实 Analytics 接线并清除生产 Mock 缓存污染 | high/HEAVY/2 | 修复统计 provider 与 user-visible mock，真实 API 不可用就隐藏 | 生产统计无固定 mock 值；cache 不存 demo fallback；断网显示 last-known-real/unknown+时间 |\n| D-05 Intervention→Outcome 分析管线 | medium/MEDIUM/1 | 回答「什么帮助在什么情境有用」，形成 Experience Memory 数据基础 | 同一 intervention 不双计；未观察 outcome 标 censored/unknown；可生成 per-user/per-scope 历史摘要 |\n| D-06 WVPL 北极星查询与事实 JSON | medium/MEDIUM/1 | 实现可审计 North Star，不让模型计算数字 | 固定 fixture 确定结果+边界测试；可在 staging 真实跑并追溯 event IDs |\n| D-07 Evidence-driven Insights 产品重构 | medium/HEAVY/1 | 把 Insights 从预测仪表盘变成有证据、可行动的 reflection | 每条洞察可点来源，纠正后更新；无数据不生成人格结论；**Simulator 能理解至少 3 条 insight 意义** |\n| D-08 数据飞轮纵向证明与 Regression Dashboard | medium/HEAVY/1 | 用多 session 证据证明数据→理解→决策→outcome 闭环 | ≥10 Persona Day0/3/7 模拟；每 persona 至少一条 correction/plan change→可解释 adaptation；无效个性化保留不筛 |\n\n---\n\n## D.2 实际交付逐卡\n\n### D-01 · 统一 Event / Evidence Lineage Contract\n\n**交付（首轮 dual-ACCEPT + 增量复证轮）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 首轮 | `6f488636`（ACCEPT merge，dual-review + rework） | `backend/app/core/event_registry.py`（现 849 行）：封闭事件词表+shared-fields 信封（build_event_metadata：event_id/user_id/schema_version= 独立会话诚实性增量 + 重编号修复链）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 本体（wt369） | `667001e6` | GET /insights/evidence-cards：五要素卡（fact/interpretation/uncertainty/evidence/implication）×三类洞察——friction pattern 读 D-05 friction_tag 聚合、interventions that helped 读 D-05 association_summary（证据不足切片不发卡）、goal progress 复用 A-07 Goal/Task 读侧双口径；全派生现算、纠正落库后下次读取即更新、零置信百分比零分数族键、无数据不出卡不生成人格结论；mobile 五要素洞察卡+证据深链（decision log·goal ledger 可点）接入洞察总览顶部（learning_insights_overview_screen.dart:96 EvidenceInsightSection 本档亲证）；**假精确面删除**：PredictiveInsightsCard 整体删除（置信度%徽章/精确到时刻预测/风险指数分数条/难度分条），lfcConfidence 改样本观察口径；红测先行（base 5 用例 404 全红+mobile 诚实性测试渲染 90%/72/100 即红） |\n| 诚实性增量（wt666） | `b92ae2ec`（原 worker 7a914a2c 重提交） | 删失语义拆分（FIX-359，原登记 357 撞号顺延）：not_yet_observed 只含未到期删失，window_closed/user_churned/unknown 合并进 not_determinable 新行——「不会有可判定结果」不再伪装成「还没到期」；insufficient 哨兵文案「证据不足，暂不下结论」（低报不虚报）。本档亲证：evidence_insight_service.py:209-215 拆分注释与实现在位 |\n\n**三类洞察卡的真实数据流判定（本档核心结论，任务问的「真数据 vs 结构就绪」）**：\n- **goal progress 卡：有真数据支撑**——读 A-07 Goal/Task 生产表，任何真实用户有目标即出卡。\n- **friction pattern 卡与 interventions-that-helped 卡：结构就绪、生产零数据**——供给方是 D-05 lifecycle（写路径零生产调用方，§D.2-D-05/FIX-507），「无数据不出卡」守卫使它们在生产部署中不出卡而非出假卡。\n- understanding-depth/understanding-dimensions 面：真数据（celery beat 每日聚合真实生产表，D-03）。\n\n**残差**：① **卡面验收「Simulator 能理解至少 3 条 insight 意义」未定位到证据**（tests_e2e/、journey harness、WT397 产物全扫零命中；wt369 交付的是 backend 5/5+mobile 定向 6/6+smoke 16 的测试面证据）——销账依据=交付本体+wt666 独立增量复证，此验收项按「未定位到证据」如实留档；② FIX-361 置信度百分比族 8 键 6 面（本卡清了 lfcConfidence 后的残余）已由 wt685 定性化收口@53414f8a；③ 无正式 review receipt（独立复核以 wt666 增量形式发生）。\n\n**用户可见行为**：洞察总览顶部出现可点证据深链的五要素卡；预测仪表盘的假精确面（置信度%/风险指数/精确时刻预测）从产品消失。\n\n### D-08 · 数据飞轮纵向证明与 Regression Dashboard\n\n**交付（本体 + 复证轮，双证成立、receipt 明确欠）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 本体（wt397） | `46762b31` | 10/10 persona Day0/Day3/Day7 双臂配对（flywheel vs no_feedback 同世界同探针零反馈）：旅程纠正垫后 14 条链（adjusted_by_correction=True+对照差分成立，含 p05/p10「纠正让类型更对但行动更差」有害适应 4 条）+记忆变安静 10 条链（deny×2+retract 后 Day7 旧偏好 0/10 注入 vs 对照 10/10 非加警示**：D-07 直接删 PredictiveInsightsCard 整卡+18 死键收割，而非给假精确数字加免责声明；删失语义拆分（FIX-359）同样是把「不确定」诚实分型而不是统一话术。\n5. **发现与修复分离纪律在 D 线的变体**：D-04 的 wt651 只做审计+低风险首批（345~349 登记），第二批 wt656 接力（353/354）——撞号重编号（→350~354）与注释号错位（FIX-371 再修）是这条纪律的集成成本实证。\n6. **评测 harness 直接驱动服务面**：D-08（与 A-08/Q-04 同构）不建产品旁路，harness 调真实服务引擎+可控时钟+确定性 judge——代价是「服务面被证明」与「生产流量存在」的分离（本档 FIX-507 即此分离在 D-05 上的显形）。\n\n---\n\n## D.4 残差与 V4 注意点（汇总）\n\n1. **飞轮中段写面缺位（最高优先）**：D-05 lifecycle 生产零写入方（V3-FIX-507，本档登记）。V4 做 Insights/Experience Memory/任何「越用越懂我」功能，第一步是把 record_exposure/record_response 接进干预交付路径（InterventionEventConsumer/notification/P 线交付点）并把 associate_pending_outcomes 挂定时扫描——否则 D-07 两类卡与 M-06 经验投影在生产永远空转。\n2. **台账证据指针死链（D/E 线扩展，V3-FIX-509）**：D-04/D-05/D-07/E-03/E-04/E-06/E-07 卡级 REPORT/RECEIPT 从未入库，台账三处死指针（FIX-31/FIX-37/FIX-41）。V4 的记账工具应把「证据路径存在性」做成机器检查（同 FIX-502/504 的教训合并处理）。\n3. **两卡证据形态弱于验收模型**：D-07/D-08 无正式 review receipt（前者以 wt666 独立增量、后者以 wt669 独立复证双证成立）；D-07 的 simulator 理解验收未定位到证据。V4 若继承 Insights 面，建议补一份正式独立审查覆盖这两卡。\n4. **D-06 staging 运行级四项待升栈**：与 O-01 云凭据同窗口解锁即可补验；golden/fixture 确定性面已完备。\n5. **agent-stats「如实 unavailable」态**：真零非假零是对的，但 V4 若接 agent 执行统计写侧，四端点与 agent_execution_stats 表要同步激活，否则继续 unavailable。\n6. **受控 demo 轨是合法形态**：D-04 确立的「门控+自述」先例（WT651 附1 + FIX-363 援引）应作为 V4 演示数据面的标准形态，而非 ad-hoc 处理。\n7. **D-01 遗留四个 R2 移交项**（F2 fail-open 真值门/F6 gateway 第二 envelope/F7 outbox 清理 vs lineage/F8 双 commit 窗口）——都不是阻塞项，但 V4 做跨层事件面统一时应清点。\n\n---\n\n## D.5 本次审查登记\n\n- **V3-FIX-507**（P2，本次新登记）：D-05 intervention lifecycle 写路径零生产调用方——record_exposure/record_response/record_outcome_association/associate_pending_outcomes 全仓生产面零调用（唯一非测试调用方=d08_flywheel/q04_personal_redteam/aurora_ablation 三个评测 harness 引擎）；读侧（D-07 evidence_insight_service 两类卡+M-06 ExperienceMemoryProjector 经验投影+north_star_wvpl intervention 面）全部已接线且诚实守卫生效（无数据不出卡）——生产部署中干预漏斗数据面静默缺席。危害定性：不是不诚实（守卫使空面不出假卡），是**产品结构就绪与生产数据流的断裂**被测试全绿掩盖；D-08 的飞轮闭环证明是 harness 驱动，不能外推为生产流量事实。修法方向：交付面（InterventionEventConsumer 标记 delivered 处/Aurora decision 执行点）调 record_exposure+record_response，D-02 ledger 增量扫描定时任务调 associate_pending_outcomes。\n- **V3-FIX-508**（P2，本次新登记，归 E 线章详述——wt761 批三行台账未闭）：V3-FIX-491/492/493 三行行尾状态格 OPEN 零 FIXED@，而修复本体 wt761 `1e3b6ebf`（2026-09-28 01:35）已在主干（merge-base --is-ancestor 判祖先）：491 auto_degrade 审计 publish 双参签名+sparkle_slo_auto_response_audit_publish_failures_total 计数器、492 plan_review daily_hours None 守卫、493 event_registry docstring 契约段改写。与 V3-FIX-504（FIX-258 行闭账丢失）同族第三例——本次成因是「集成合入后未回写台账」而非行重建回退。V3-COMPLETE-STATUS-FOR-V4.md §5「491/493 收口」表述与台账互相矛盾，以代码为准。修法：三行置 FIXED@1e3b6ebf。\n- **V3-FIX-509**（P3，本次新登记）：D/E 线卡级证据断链（V3-FIX-502 同型扩展）——v3-output/D-04、D-05、D-07、E-03、E-04、E-06、E-07 七目录从未入库（git log --all --diff-filter=A 全零命中）；台账死指针三处：FIX-31→v3-output/D-05/REVIEW_RECEIPT.md、FIX-37→v3-output/D-04/REVIEW_RECEIPT_2.md、**FIX-41(P1)**→v3-output/E-04/REVIEW_RECEIPT_2.md。wt759 以 commit message 签收字样（dual-reviewed/R2 PASS/reviewed）核验故销账结论不受影响；两个修复本体（FIX-37@0c1ea188、FIX-41@1ae6a9e1）均真实在主干。修法三选一同 502（回收原件/批量注记纠指/按台账行重建最小 receipt）。\n- 复核过但**不构成新发现**的三项：D-08 receipt 欠（wt669 自报+wt759 📌⚠ 在案，属已知残差非新发现）；D-07 simulator 验收无证据（按「未定位到证据」留档于本章 §D.2-D-07 残差①，与 D-08 receipt 同属证据形态弱面，不另占号）；FIX-345~349 撞号重编号与注释错位（FIX-371 已收口@7aa46c04）。\n- 号占用核验：507 起占用前 grep 复核——主仓 v3/ v3-output/ docs/ backend/ `V3-FIX-50[5-9]`/`V3-FIX-51[0-2]` 零命中；499~504 已占用（499=wt767、500/501=wt765、502/503=wt770、504=wt769）；505/506 为在航兄弟会话（wt774-AJ/wt775-UPSG）预留段，本档顺延取 507/508/509。\n"}, {"id": "00_context/source_notes/S14_E-line.md", "title": "E 线（AI 8 卡）深挖章节 —— V4 交接文档素材（wt776）", "group": "原始报告副本", "html": "<h1>E 线（AI 8 卡）深挖章节 —— V4 交接文档素材（wt776）<\/h1>\n<blockquote>\n<p>本文是 <code>v3/V3-COMPLETE-STATUS-FOR-V4.md<\/code> §4「各线深度状态」E 线章节的深挖草稿。\n证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n撰写：wt776（2026-09-28，基线 main@fd4267ef）。方法：卡面（v3/07_tasks/cards/E-0*.md）+ <code>git log --grep<\/code> 逐卡定位 → 主干 SHA 祖先核验（16+ 卡相关 commit 全部 --is-ancestor 通过，除 wt755 938e845c 在分支）→ 代码开文件亲证（llm_router.py 1959 行三态熔断/stage_events.py 160 行 canonical 词表/batch_worklane/gateway entitlement 判据）→ 测试文件逐个计数 → receipt/bench 产物抽读（E-01/02/05 目录 + WT372/WT727/WT653）→ 台账闭环逐条复核。<strong>未轻信任何台账/报告结论性文字。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>E.0 线级概览<\/h2>\n<p>E 线是 V3 的「AI 能力线」：路由分层（L0-L3 认知阶梯）→ 能力路由（快慢分道）→ 首反馈体验（stage events）→ 模型评测（prompt 收敛）→ embedding 生产化 → batch 降本 → 自适应路由与健康回退 → 集成 bench。7/8 done + E-08 TODO（tasks.json@main 亲证；E-08 交付本体 a1418084 在主干、三笔未闭，见 §E.2-E-08）。<\/p>\n<p>E 线执行形态最重要的特点（V4 设计者必须先读）：<strong>E 线的证据面必须按「真模型 / 规则层 / 结构就绪」三层分开看，混读会高估<\/strong>——<\/p>\n<ul>\n<li><strong>真模型证据<\/strong>：B-05 探针（59 live samples，09-19 时点）、E-04 收敛轮（qwen3.8-flash 7/15→15/15 + 注入对抗）、E-08 bench（wt372 104 条 + wt406 Q-06 400 条）、JOURNEY day1-6 驱动；<\/li>\n<li><strong>规则层/确定性证据<\/strong>：E-01 全卡（trace 分类+映射文档，零代码）、E-02 的 capability_lane 判定面（FakeLLM/monkeypatch，61 测试）、E-03 机制面（stage 帧三层测试）；<\/li>\n<li><strong>结构就绪、生产数据缺位<\/strong>：E-06 batch lane（生产样本仍近零）、E-08 的 L0 no-model 直答（bench 实锤未生效）。<\/li>\n<\/ul>\n<p><strong>E 线的第二特点：它的「done」大量依赖后续 FIX 族的接力校正<\/strong>——E-02 的 tier 塌缩由 E-08 bench 曝光、wt380 修复；E-03 的 500ms 口径经 wt727 双证裁决→FIX-439→Leader 裁决 b 三段收窄；E-07 的弹性缺陷由 Q-06 波动注入实锤（FIX-77~81 全修）；审计链静默失效由 mypy 批九顺审抓出（FIX-491，wt761 已修但台账未闭——本档 FIX-508）。<strong>E 线的真实状态 = 首轮交付 + Q-06/wt372/wt380/wt755 四波修正的叠加态。<\/strong><\/p>\n<hr />\n<h2>E.1 意图（卡面目标与验收）<\/h2>\n<p>八卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。<\/p>\n<table>\n<thead>\n<tr>\n<th>卡<\/th>\n<th>Risk/Resource/Reviewers<\/th>\n<th>卡面目标（一句话）<\/th>\n<th>卡面关键验收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>E-01 Cognition Ladder 当前路由映射<\/td>\n<td>medium/LIGHT/1<\/td>\n<td>现有 DualCore/UnifiedIntent/tiers 映射 L0-L3，找无意义 LLM 调用（不重建 router）<\/td>\n<td>核心 journey 无隐藏无必要深模型；映射文档+metrics；direct-answer fast path 不退化<\/td>\n<\/tr>\n<tr>\n<td>E-02 Fast Semantic / Deliberate 能力路由<\/td>\n<td>high/MEDIUM/2<\/td>\n<td>简单交互真正快、复杂决策保留能力<\/td>\n<td>L1/L2 latency/quality 有真实 A/B；简单 intent 不走 L2；fallback 不把需 tools 任务降成 text-only 假完成<\/td>\n<\/tr>\n<tr>\n<td>E-03 实时 Stage Events 与首反馈<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>真实阶段事件替代 20s 无反馈，不暴露 chain-of-thought<\/td>\n<td>深路径 500ms 内真实阶段反馈；stage 与 trace 匹配；不显示 reasoning_content 原文<\/td>\n<\/tr>\n<tr>\n<td>E-04 Aurora/Action/Memory 专项 Eval 与 Prompt 收敛<\/td>\n<td>high/MEDIUM/2<\/td>\n<td>任务级 eval 选 prompt/examples/tier，不凭主观<\/td>\n<td>每域 baseline→candidate 分数/latency/cost；安全相关 input 不用未消毒原文<\/td>\n<\/tr>\n<tr>\n<td>E-05 Embedding / Hybrid Retrieval 生产接入<\/td>\n<td>high/MEDIUM/2<\/td>\n<td>接活真实 embedding，RAG/Galaxy 语义搜索不靠旧 key<\/td>\n<td>真实文档 retrieval benchmark；wrong-user=0；无 key 明确关闭功能；不静默随机/zero embedding<\/td>\n<\/tr>\n<tr>\n<td>E-06 Async Batch Cognitive Worklane<\/td>\n<td>medium/MEDIUM/1<\/td>\n<td>非实时工作放 MiniMax/glm_batch 降前台成本<\/td>\n<td>前台 journey latency 不依赖 batch；stale result 拒绝；batch 老结果不覆盖新 explicit correction<\/td>\n<\/tr>\n<tr>\n<td>E-07 Quality/Latency/Cost 自适应路由+健康回退<\/td>\n<td>high/MEDIUM/2<\/td>\n<td>真实 provider 波动下选最便宜满足质量/延迟能力<\/td>\n<td>100+ sample 统计；provider down 仍合法降级/明确 unavailable；无无界重试/成本；付费 entitlement 不绑 flame<\/td>\n<\/tr>\n<tr>\n<td>E-08 AI Stack 集成 Bench<\/td>\n<td>medium/HEAVY/1<\/td>\n<td>给最终决策可复跑基准（Quality×TTFT×Cost×Context）<\/td>\n<td>100+ queries across L0-L3；raw CSV/JSON+dashboard；percentiles 样本≥100；SLO 未达真实报告+dynamic issues<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>E.2 实际交付逐卡<\/h2>\n<h3>E-01 · Cognition Ladder 当前路由映射<\/h3>\n<p><strong>交付（首轮 ACCEPT + v2 纯文档轮）<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>波次<\/th>\n<th>主干 SHA<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>首轮<\/td>\n<td><code>df1b55df<\/code>（ACCEPT merge，post-revision）<\/td>\n<td>L0-L3 映射文档+trace 分类（v3-output/E-01/{ROUTING_MAP.md, trace_classification.csv}）+ plus 覆盖缺口发现（W-1：记忆类流量误走 plus 层）<\/td>\n<\/tr>\n<tr>\n<td>v2（wt316，零代码）<\/td>\n<td><code>12ba22ec<\/code><\/td>\n<td>映射 v2+W-1 验证关闭（E-02 根修后 dev DB 44/44 真实会话 FAST，修前 54/54 plus）；<strong>新发现 G-1..G-7 缺口清单<\/strong>：G-1 sprint phase_d 强制 FAST 抢占 deep-word 否决（7/7 sprint 轮 FAST 含 proof-asking）；G-2 问候无 L0 直答 h 拖垮前台」从调度问题变成结构不可能；explicit-correction 守卫放在 L1 落库前最后一道。<\/li>\n<li><strong>熔断用滞回而非简单阈值<\/strong>（E-07）：probation 三态+冷却翻倍+在途成功不解除——每条规则都对应一类真实故障风暴（Q-06 注入面实证在先）。<\/li>\n<\/ol>\n<hr />\n<h2>E.4 残差与 V4 注意点（汇总）<\/h2>\n<ol>\n<li><strong>性能图景的唯一可信口径<\/strong>：修前=wt372 104 条（§E.2-E-08①表）；已修=tier 塌缩（wt380）+计量盲区（FIX-80）+L3-ACK（Q-06 复测 0.06s）；仍坏=L0 直答缺位/L2 total ~48s/免费层前置静默；复测=Q-06 同构 bench+wt755 集成后首帧重采。<strong>任何 V4 SLO 设计请以这张叠加态表为起点，不要引用「2 秒」类旧宣称。<\/strong><\/li>\n<li><strong>E-08 销账四件事<\/strong>（receipt/wt755 集成/E-03 残差闭环/真模型复测）全部就绪待条件（门后集成窗口+key 环境），是 107 卡销账成本最低的一张。<\/li>\n<li><strong>E-01 G 缺口清单是现成的 V4 待办<\/strong>：G-2（L0 直答）/G-4（evidence extractor 默认开且模型未注册）/G-5（隐藏调用记账）未闭环——G-4 兼具成本与审计双面风险，建议 V4 优先清点。<\/li>\n<li><strong>E-02 的延迟证据是借来的<\/strong>：引用前核对 B-05 时点（09-19）；fast lane 质量面无独立真模型 A/B，V4 若把更多流量压到 fast 档应先补质量 eval。<\/li>\n<li><strong>真模型证据重跑义务<\/strong>：E-04 收敛轮与 M-09 stability report 都是单模型时点快照（FIX-503 已登记 M-09 面的复验欠账）；E 线的 eval 套件全部在库可复跑，V4 排期应把「模型漂移后重跑」当作例行而非一次性。<\/li>\n<li><strong>FIX-491/492/493 台账未闭<\/strong>（本档 FIX-508）：代码已在主干，V4 动 SLO 审计/plan_review/event_registry 文档前先按 §E.5-508 纠指，避免重做已修面。<\/li>\n<li><strong>batch lane 的降本主张未被真实流量验证<\/strong>（E-06）：接入面只有 predictive long-horizon 一处；V4 若做成本优化应先扩 batch 工作负载再谈收益。<\/li>\n<li><strong>卡级证据目录缺口<\/strong>（E-03/E-04/E-06/E-07 无 v3-output 目录，本档 FIX-509）：wt759 以 commit message 签收字样核验故结论不受影响，但 V4 沿用「receipt 必须入库」纪律时应把这批卡的原件回收或注记纠指。<\/li>\n<\/ol>\n<hr />\n<h2>E.5 本次审查登记<\/h2>\n<ul>\n<li><strong>V3-FIX-507<\/strong>（P2，本次新登记，主登记在 D 线章 §D.5——D-05 lifecycle 写路径零生产调用方；对 E 线的含义：D-07 两类洞察卡与 M-06 经验投影的供给断链使「数据飞轮」在 E-08 的 Quality 维度上缺少真实个性化流量，E-08 复测时 quality 粗筛数字的解释需注此边界）。<\/li>\n<li><strong>V3-FIX-508<\/strong>（P2，本次新登记，E 线章主登记）：V3-FIX-491/492/493 三行台账 OPEN vs 修复本体已在主干——wt761 <code>1e3b6ebf<\/code>（2026-09-28 01:35:54，merge-base --is-ancestor 亲证祖先）修复 491 auto_degrade 审计 publish 双参签名（含 sparkle_slo_auto_response_audit_publish_failures_total 计数器，TestAuditEventPublishing 红→绿实录在 commit message）+492 plan_review daily_hours None 守卫+493 event_registry docstring 契约段；三行行尾状态格至今 OPEN 零 FIXED@（本档 sed 逐行亲证）。可证伪判据：对三行 grep -o &quot;FIXED@&quot; 计数=0；git log -S &quot;V3-FIX-491&quot; -- backend/app/api/internal/auto_degrade.py 唯一命中 1e3b6ebf。与 V3-FIX-504（FIX-258 行闭账丢失）同族第三例，成因=集成合入后未回写台账（504 是行重建回退）。V3-COMPLETE-STATUS-FOR-V4.md §5「491/493 收口」表述与台账矛盾，以代码为准。修法：三行置 FIXED@1e3b6ebf；ledger 工具加 FIXED@ 主干可达性抽检（与 504 的修法建议合并）。<\/li>\n<li><strong>V3-FIX-509<\/strong>（P3，本次新登记，D 线章 §D.5 主登记——七目录从未入库+三处台账死指针，E 线涉及 E-03/E-04/E-06/E-04→FIX-41(P1) 死指针；详见 D-line.md §D.5）。<\/li>\n<li>复核过但<strong>不构成新发现<\/strong>的四项：E-08 receipt 欠+wt755 未集成+E-03 移交笔（wt759 §3.1 已登记在案，本档 §E.2-E-08⑤ 复述不占号）；E-04 extractor v2 11/12 的 1 例（属 eval 数字如实照登非不诚实面）；E-02 §11 测试隔离 bug（REPORT 自曝、分片规避，未定位到独立 FIX 但属 test-infra 债非产品缺陷）；E-05 EMBEDDING_MODEL 遗留标签（REPORT 已自澄清，运行时无害）。<\/li>\n<li>号占用核验：507/508/509 占用前 grep 复核——主仓 v3/ v3-output/ docs/ backend/ <code>V3-FIX-50[5-9]<\/code>/<code>V3-FIX-51[0-2]<\/code> 零命中；499~504 已占用（499=wt767、500/501=wt765、502/503=wt770、504=wt769）；505/506 为在航兄弟会话（wt774-AJ/wt775-UPSG）预留段，本档顺延取 507/508/509（与 D-line.md 同批登记，三号两章共用）。<\/li>\n<\/ul>\n", "text": "# E 线（AI 8 卡）深挖章节 —— V4 交接文档素材（wt776）\n\n> 本文是 `v3/V3-COMPLETE-STATUS-FOR-V4.md` §4「各线深度状态」E 线章节的深挖草稿。\n> 证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n> 撰写：wt776（2026-09-28，基线 main@fd4267ef）。方法：卡面（v3/07_tasks/cards/E-0*.md）+ `git log --grep` 逐卡定位 → 主干 SHA 祖先核验（16+ 卡相关 commit 全部 --is-ancestor 通过，除 wt755 938e845c 在分支）→ 代码开文件亲证（llm_router.py 1959 行三态熔断/stage_events.py 160 行 canonical 词表/batch_worklane/gateway entitlement 判据）→ 测试文件逐个计数 → receipt/bench 产物抽读（E-01/02/05 目录 + WT372/WT727/WT653）→ 台账闭环逐条复核。**未轻信任何台账/报告结论性文字。**\n\n---\n\n## E.0 线级概览\n\nE 线是 V3 的「AI 能力线」：路由分层（L0-L3 认知阶梯）→ 能力路由（快慢分道）→ 首反馈体验（stage events）→ 模型评测（prompt 收敛）→ embedding 生产化 → batch 降本 → 自适应路由与健康回退 → 集成 bench。7/8 done + E-08 TODO（tasks.json@main 亲证；E-08 交付本体 a1418084 在主干、三笔未闭，见 §E.2-E-08）。\n\nE 线执行形态最重要的特点（V4 设计者必须先读）：**E 线的证据面必须按「真模型 / 规则层 / 结构就绪」三层分开看，混读会高估**——\n- **真模型证据**：B-05 探针（59 live samples，09-19 时点）、E-04 收敛轮（qwen3.8-flash 7/15→15/15 + 注入对抗）、E-08 bench（wt372 104 条 + wt406 Q-06 400 条）、JOURNEY day1-6 驱动；\n- **规则层/确定性证据**：E-01 全卡（trace 分类+映射文档，零代码）、E-02 的 capability_lane 判定面（FakeLLM/monkeypatch，61 测试）、E-03 机制面（stage 帧三层测试）；\n- **结构就绪、生产数据缺位**：E-06 batch lane（生产样本仍近零）、E-08 的 L0 no-model 直答（bench 实锤未生效）。\n\n**E 线的第二特点：它的「done」大量依赖后续 FIX 族的接力校正**——E-02 的 tier 塌缩由 E-08 bench 曝光、wt380 修复；E-03 的 500ms 口径经 wt727 双证裁决→FIX-439→Leader 裁决 b 三段收窄；E-07 的弹性缺陷由 Q-06 波动注入实锤（FIX-77~81 全修）；审计链静默失效由 mypy 批九顺审抓出（FIX-491，wt761 已修但台账未闭——本档 FIX-508）。**E 线的真实状态 = 首轮交付 + Q-06/wt372/wt380/wt755 四波修正的叠加态。**\n\n---\n\n## E.1 意图（卡面目标与验收）\n\n八卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。\n\n| 卡 | Risk/Resource/Reviewers | 卡面目标（一句话） | 卡面关键验收 |\n|---|---|---|---|\n| E-01 Cognition Ladder 当前路由映射 | medium/LIGHT/1 | 现有 DualCore/UnifiedIntent/tiers 映射 L0-L3，找无意义 LLM 调用（不重建 router） | 核心 journey 无隐藏无必要深模型；映射文档+metrics；direct-answer fast path 不退化 |\n| E-02 Fast Semantic / Deliberate 能力路由 | high/MEDIUM/2 | 简单交互真正快、复杂决策保留能力 | L1/L2 latency/quality 有真实 A/B；简单 intent 不走 L2；fallback 不把需 tools 任务降成 text-only 假完成 |\n| E-03 实时 Stage Events 与首反馈 | medium/HEAVY/1 | 真实阶段事件替代 20s 无反馈，不暴露 chain-of-thought | 深路径 500ms 内真实阶段反馈；stage 与 trace 匹配；不显示 reasoning_content 原文 |\n| E-04 Aurora/Action/Memory 专项 Eval 与 Prompt 收敛 | high/MEDIUM/2 | 任务级 eval 选 prompt/examples/tier，不凭主观 | 每域 baseline→candidate 分数/latency/cost；安全相关 input 不用未消毒原文 |\n| E-05 Embedding / Hybrid Retrieval 生产接入 | high/MEDIUM/2 | 接活真实 embedding，RAG/Galaxy 语义搜索不靠旧 key | 真实文档 retrieval benchmark；wrong-user=0；无 key 明确关闭功能；不静默随机/zero embedding |\n| E-06 Async Batch Cognitive Worklane | medium/MEDIUM/1 | 非实时工作放 MiniMax/glm_batch 降前台成本 | 前台 journey latency 不依赖 batch；stale result 拒绝；batch 老结果不覆盖新 explicit correction |\n| E-07 Quality/Latency/Cost 自适应路由+健康回退 | high/MEDIUM/2 | 真实 provider 波动下选最便宜满足质量/延迟能力 | 100+ sample 统计；provider down 仍合法降级/明确 unavailable；无无界重试/成本；付费 entitlement 不绑 flame |\n| E-08 AI Stack 集成 Bench | medium/HEAVY/1 | 给最终决策可复跑基准（Quality×TTFT×Cost×Context） | 100+ queries across L0-L3；raw CSV/JSON+dashboard；percentiles 样本≥100；SLO 未达真实报告+dynamic issues |\n\n---\n\n## E.2 实际交付逐卡\n\n### E-01 · Cognition Ladder 当前路由映射\n\n**交付（首轮 ACCEPT + v2 纯文档轮）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 首轮 | `df1b55df`（ACCEPT merge，post-revision） | L0-L3 映射文档+trace 分类（v3-output/E-01/{ROUTING_MAP.md, trace_classification.csv}）+ plus 覆盖缺口发现（W-1：记忆类流量误走 plus 层） |\n| v2（wt316，零代码） | `12ba22ec` | 映射 v2+W-1 验证关闭（E-02 根修后 dev DB 44/44 真实会话 FAST，修前 54/54 plus）；**新发现 G-1..G-7 缺口清单**：G-1 sprint phase_d 强制 FAST 抢占 deep-word 否决（7/7 sprint 轮 FAST 含 proof-asking）；G-2 问候无 L0 直答；G-3 0/0 default 记账 34 条；G-4 evidence extractor 默认开且模型未注册；G-5 隐藏调用记账；G-6 batch lane 零样本；G-7 LLM_TIER_PRO 语义 |\n\n**G 缺口后续吸收（本档逐条追溯）**：G-1 修复 `61e78483`（wt319：DEEP_ANALYSIS_TEXT_MARKERS 单源+用户 reasoning_mode=deep 抢占 phase_d FAST 默认，红 2→绿 30，dev DB 真实 trace 探针 7/7——修前两条真实 deep 轮误路由 dashscope_fast）；G-3 计量盲区 → FIX-80 FIXED@a1587328（Q-06 批）；G-7 的 user_tier 死键面 → wt380 `b42e279d` 修复（extra_context.user_tier 双形态死键）；G-2 → **仍未实施**（E08-ISS-L0-TTFT 实锤问候/确认走完整生成链，L0 no-model 直答未生效）；G-6 → batch lane 生产样本仍近零（Q-06 400 样本车道分布 fast263/plus67/max25/standard2，无 batch 车道）；G-4/G-5 → 本档未定位到对应闭环记录（**留档待查**）。\n\n**残差**：卡面验收「existing direct-answer fast path 不退化」在首轮 REPORT 以回归测试面覆盖；映射文档两版（E-01/ 与 WT316-E01/）以 v2 为准。\n\n**用户可见行为**：无直接可见面；它是 E-02/E-06/E-07 的路由事实底图。\n\n### E-02 · Fast Semantic / Deliberate Decision 能力路由\n\n**交付（dual-ACCEPT 三轮 receipt + G-1 修复 + tier 塌缩修复接力）**\n\n| 波次 | 主干 SHA | 内容 |\n|---|---|---|\n| 首轮 | `690541e3`（ACCEPT merge，dual-review + rework + delta） | capability_lane 判定面：记忆类消息根修（retrieval_intent.py `classify_memory_class_message` 纯规则零 LLM ≤200 字反模式优先）→ ContextPlan(no_retrieval, reason=\"memory_class_turn\")；简单批全落 fast lane 零检索；工具流/文档接地/深度批全落 deliberate 且 slim 全否决；capability_lane 45→61 测试（REVIEW_RECEIPT_3 总 verdict ACCEPT） |\n| G-1 修复（wt319） | `61e78483` | deep-signal priority（见 E-01 5_U-line.md", "title": "U 线（UI 10 卡）深挖章节 —— V4 交接文档素材（wt775）", "group": "原始报告副本", "html": "<h1>U 线（UI 10 卡）深挖章节 —— V4 交接文档素材（wt775）<\/h1>\n<blockquote>\n<p>本文是 <code>v3/V3-COMPLETE-STATUS-FOR-V4.md<\/code> §4「各线深度状态」U 线章节的深挖草稿。\n证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n撰写：wt775（2026-09-28，基线 main@ed072fd2）。方法：卡面（v3/07_tasks/cards/U-0*.md）+ wt759 三源核验报告逐卡 SHA → <code>git log -1<\/code> 全部 21 个交付 SHA 逐条重验在主干 → 关键代码开文件亲证（design tokens 守卫/state gate 注册表/notification card 四要素/proposal 分发）→ 测试逐文件计数 → v3-output receipt 抽读（WT671/WT673/WT686/WT689/WT694/U-09）。<strong>未轻信任何台账/报告结论性文字。<\/strong><\/p>\n<\/blockquote>\n<hr />\n<h2>U.0 线级概览<\/h2>\n<p>U 线是 V3 的「产品形态线」：把核心旅程从「功能可用」推向「产品化呈现」。10/10 全部 done（tasks.json + fleet done 名单 + wt759 逐卡 SHA 在案）。<\/p>\n<p>执行形态的显著特点（V4 设计者需要知道）：<\/p>\n<ol>\n<li><strong>两波交付结构<\/strong>：第一波（wt310-wt363，09-22 前后）把卡面主体全部落地；第二波（wt671-wt698，09-25/26）是「双证判定不重做 + 定向续做」——每个续做会话先以 <code>git merge-base --is-ancestor<\/code> + 树内产物证判定前轮已完成的范围，只补真实缺口（典型：wt673 对 U-06、wt675 对 U-07、wt672 对 U-10、wt676 对 U-09）。这个「续做不重做」模式是 V3 后期多线并行的关键纪律。<\/li>\n<li><strong>独立审查密度全线最高<\/strong>：U-02/U-05 有 wt694 两轮联合独立审查（第二轮在 APPROVE 376 的同时新抓出 FIX-384 漏修面——审查发现新缺陷的实录）；U-04 有 wt689 独立审查 APPROVE（并核验出 FIX-379②③ 的诚实化处置）；U-01 有 wt671 集成 HEAD 复核。<\/li>\n<li><strong>「headless/契约层可交付，真机段诚实转出」是全线常态<\/strong>：无真机/浏览器权限的 worker 用 widget test + 契约测试 + golden 链承载验收，真机走查段显式转 HUMAN_INBOX 不伪造（U-09 45 张矩阵、U-06 simulator 段、G-05 同族）。<strong>但中央 HUMAN_INBOX（09-27 才创建）未回填这些转出项<\/strong>（→ 本次登记 V3-FIX-511，§U.5）。<\/li>\n<\/ol>\n<p><strong>L2–L5 分层实际达到哪层（卡面编号体系的亲证结论）<\/strong>：卡面只在标题层标注了 L2（U-05 三屏产品化）/L4（U-06 状态完备性）/L5（U-09 三端一致性 diff），全库无 L1/L3 层的 UI 卡定义（B-04 的「L2–L5 Review Harness」是审查轮次口径，见 v3/07_tasks/TASK_INDEX.md:14）。实际达到：<\/p>\n<ul>\n<li><strong>L2（单屏产品化）：达成的面=home/goal/chat 三屏（U-05，双审查 APPROVE）+ memory 控制面（U-03）+ proposal 交互组件（U-04）+ 文案终审（U-10）<\/strong>；<\/li>\n<li><strong>L4（状态完备性）：闸门面达成、非全屏覆盖<\/strong>——<code>core/state/<\/code> 四件套 22 相位代码化，闸门注册面覆 \n<ol>\n<li><strong>「续做不重做」双证判据<\/strong>：每个续做会话先证前轮交付在主干祖先链+树内产物齐备，只补真实缺口（wt673/675/672/676 四连）。代价是每张卡的交付分散在 2-4 个 commit 波次，V4 读账必须逐波读；收益是 10/4 红线内零重做浪费。<\/li>\n<li><strong>守卫冻结优于一次性迁移<\/strong>：U-01 的真正产物是「只降不升」的 ratchet 基线+新文件零违例闸，而非把 22k 处 DS 引用一次性清完。存量撕裂面（chat 80 字面量、galaxy 零 typo 采用）以矩阵盘点显式留档，迁移裁决权留给视觉 owner（E1 冻结豁免）。<\/li>\n<li><strong>低刺激的验证钉在渲染树而非设置页<\/strong>：U-02/374/384 三轮把「reduceMotion 下不得出现零时长 AnimatedSize 壳」做成渲染树枚举断言+「禁动效不装壳」修法范式——reviewer（wt694）亲跑红绿复核并纠正普查归因，这是「独立审查抓出真缺陷」的正面样本。<\/li>\n<li><strong>诚实化优于死键<\/strong>：U-04/379②③ 的裁定——提示文案在唯一活面永不可渲染时，撤 docstring 许诺+留幂等不变量测试，而不是造新 l10n 死面。「不虚占键位」与 U-10 死键收割同律。<\/li>\n<li><strong>允许差异显式登记<\/strong>：U-09 把「平台差异是资产不是缺陷」写成机器可读 fixture（platformDivergences 逐条 point/platforms/reason）+文档双承载，C7 契约测试保证登记表非空且形合规——为 V4 的多端策略提供了现成的裁决框架。<\/li>\n<li><strong>真机段不伪造<\/strong>：全线以「headless 承载+转出清单就绪」收束真机验收；但转出登记链断裂（508），V4 若接手三端走查，执行清单都在（U-09 §5、B-04 harness、G-05 HUMAN_INBOX_G05_VISUAL.md），缺的只是统一入口登记与采集执行。<\/li>\n<\/ol>\n<hr />\n<h2>U.4 残差与 V4 注意点（汇总）<\/h2>\n<ol>\n<li><strong>GOV-015/WS6 两大删除后的 UI 面健康度（专项结论）<\/strong>：wt729（FIX-440，data_usage_dashboard 655 行纯删）+ wt762（FIX-489 WS6 透明画像孤儿屏 2636 行纯删 + FIX-490 learning-mode 667 行纯删，共 ~3,958 行 0 增）删除的全部是<strong>从未接线的孤儿面<\/strong>——WS6 的 wire-or-purge 裁决证据链亲证「路由两代仓库从未注册、stage7 只翻 flag 未触 routes；设计意图已由已接线 UserPersonaScreen /profile/persona 承担（读/纠正/回滚/偏好更新四面齐备）」。删除后：analyze E0、full_route_coverage 116 路由全绿、a11y 守卫 allowlist 同步摘行（防僵尸豁免）、独占 l10n 键逐键亲证零外部消费者后删除、i18n 100%。<strong>UI 面健康度未受伤害，反而消除了「不可达承诺面」<\/strong>；重做路径原子留档在 commit message（git 恢复+注册路由+补入口三步）。V4 教训：删面前先证「设计意图是否已由他面承担」，且删除必须是屏+provider+flags+tests+l10n 全链原子。<\/li>\n<li><strong>U-06 闸门覆盖是 8 个 seam 不是全部核心屏<\/strong>：chat（自有 ws 状态机）与 galaxy（视觉锤）的整面接入是 V4 的显式决策点，不是「已完成只需要维护」。<\/li>\n<li><strong>令牌存量迁移无主<\/strong>：chat 80 处 fontSize 字面量+galaxy 零 context.typo（E1 豁免）在 FIX-377 首批后无承接计划；台账 377 行缺失（507）使这个尾更不可见。<\/li>\n<li><strong>真机面欠账集中<\/strong>：U-06 simulator、U-08 三端辅助技术、U-09 45 张矩阵、U-02/05 的 5 秒测试 rubric——全部只有 headless 承载。执行清单与 harness 齐备，V4 初期应安排一次集中采集批次（成本主要在设备/浏览器权限而非代码）。<\/li>\n<li><strong>FIX-375 OPEN<\/strong>（FirstActionCard 无标题层，journey 面 rubric FAIL 保持必红放行）与 FIX-379②③ OPEN——两个 U 线挂账都是「需要产品/视觉裁决」而非机械修。<\/li>\n<li><strong>验收语义的口径差异要带进 V4<\/strong>：「≥95% covered」=注册面覆盖率 1.0；「A/B issue=0」=golden android 批口径+macOS ENV-1 豁免；「三端一致」=契约指纹一致。V4 验收设计应显式写清口径，避免把 headless 口径误读为真机结论。<\/li>\n<\/ol>\n<hr />\n<h2>U.5 本次审查登记<\/h2>\n<ul>\n<li><strong>V3-FIX-510<\/strong>（本次新登记，台账行已入本 worktree commit）：台账 V3-FIX-377 行缺失——370-376/378/379 在册而 377 跳号零行；修复本体在主干（分支 commit 3d00aec9，集成 3ec111c4「V3-FIX-377 chat 令牌双态撕裂机械收口首批」，WT686 REPORT §「→ FIXED@3d00aec9」、wt694 review 引用一致）。与 504 同向的台账低估漂移；且行缺失使「首批」后的令牌迁移尾（本次复测 chat 仍有 80 处 fontSize 字面量）失去依附面。<\/li>\n<li><strong>V3-FIX-511<\/strong>（本次新登记）：真机段交接承诺未入中央 HUMAN_INBOX——U-09 45 张三端截图矩阵、G-05 真机截图/FPS 批（自带 v3-output/WT395-G05-GALAXY/HUMAN_INBOX_G05_VISUAL.md）、U-08 三端辅助技术走查、B-04 L2-L5 走查等「转 HUMAN_INBOX」承诺均早于中央收件箱创建（09-27 wt695），从未回填；现行 H-001~008 无一覆盖。V4 从中央收件箱出发会系统性漏看这批未完成面。<\/li>\n<li>复核过但<strong>不构成新发现<\/strong>的两项：chat/galaxy 未接状态闸（wt358/wt673 两轮如实登记，属已知设计态）；demo 首屏孪生 provider 面（wt694 抓出且 wt696 已补完收口 bd576cd7）。<\/li>\n<li>号占用核验：500-504 已占用（wt765/wt770/wt769）；505 grep 全仓零命中但仍空置——按派单纪律自 506 起用，本登记取 507/508（506 预留给并行的 wt775 S/G 章内先发现项，见 S-line.md §S.5）。<\/li>\n<\/ul>\n", "text": "# U 线（UI 10 卡）深挖章节 —— V4 交接文档素材（wt775）\n\n> 本文是 `v3/V3-COMPLETE-STATUS-FOR-V4.md` §4「各线深度状态」U 线章节的深挖草稿。\n> 证据纪律：只写三源证据（git 主干 SHA / 独立审查 receipt / 运行级实测）支撑的事实；逐条标注出处；无法定位证据的验收项显式标注「未定位到证据」。\n> 撰写：wt775（2026-09-28，基线 main@ed072fd2）。方法：卡面（v3/07_tasks/cards/U-0*.md）+ wt759 三源核验报告逐卡 SHA → `git log -1` 全部 21 个交付 SHA 逐条重验在主干 → 关键代码开文件亲证（design tokens 守卫/state gate 注册表/notification card 四要素/proposal 分发）→ 测试逐文件计数 → v3-output receipt 抽读（WT671/WT673/WT686/WT689/WT694/U-09）。**未轻信任何台账/报告结论性文字。**\n\n---\n\n## U.0 线级概览\n\nU 线是 V3 的「产品形态线」：把核心旅程从「功能可用」推向「产品化呈现」。10/10 全部 done（tasks.json + fleet done 名单 + wt759 逐卡 SHA 在案）。\n\n执行形态的显著特点（V4 设计者需要知道）：\n\n1. **两波交付结构**：第一波（wt310-wt363，09-22 前后）把卡面主体全部落地；第二波（wt671-wt698，09-25/26）是「双证判定不重做 + 定向续做」——每个续做会话先以 `git merge-base --is-ancestor` + 树内产物证判定前轮已完成的范围，只补真实缺口（典型：wt673 对 U-06、wt675 对 U-07、wt672 对 U-10、wt676 对 U-09）。这个「续做不重做」模式是 V3 后期多线并行的关键纪律。\n2. **独立审查密度全线最高**：U-02/U-05 有 wt694 两轮联合独立审查（第二轮在 APPROVE 376 的同时新抓出 FIX-384 漏修面——审查发现新缺陷的实录）；U-04 有 wt689 独立审查 APPROVE（并核验出 FIX-379②③ 的诚实化处置）；U-01 有 wt671 集成 HEAD 复核。\n3. **「headless/契约层可交付，真机段诚实转出」是全线常态**：无真机/浏览器权限的 worker 用 widget test + 契约测试 + golden 链承载验收，真机走查段显式转 HUMAN_INBOX 不伪造（U-09 45 张矩阵、U-06 simulator 段、G-05 同族）。**但中央 HUMAN_INBOX（09-27 才创建）未回填这些转出项**（→ 本次登记 V3-FIX-511，§U.5）。\n\n**L2–L5 分层实际达到哪层（卡面编号体系的亲证结论）**：卡面只在标题层标注了 L2（U-05 三屏产品化）/L4（U-06 状态完备性）/L5（U-09 三端一致性 diff），全库无 L1/L3 层的 UI 卡定义（B-04 的「L2–L5 Review Harness」是审查轮次口径，见 v3/07_tasks/TASK_INDEX.md:14）。实际达到：\n- **L2（单屏产品化）：达成的面=home/goal/chat 三屏（U-05，双审查 APPROVE）+ memory 控制面（U-03）+ proposal 交互组件（U-04）+ 文案终审（U-10）**；\n- **L4（状态完备性）：闸门面达成、非全屏覆盖**——`core/state/` 四件套 22 相位代码化，闸门注册面覆盖率 1.0≥0.95 达标，但注册表仅 8 个 seam（§U.2-U-06），chat/galaxy 主屏未整面接闸（wt358/wt673 两轮如实登记）；\n- **L5（三端一致性）：headless 契约层达成，真机 diff 层未发生**——11 契约用例+平台分支审计+允许差异登记表在主干，45 张真机截图矩阵是就绪的执行清单而非已采集证据（v3-output/U-09/SCREENSHOT_MATRIX.md，采集命令可复跑）。\n\n---\n\n## U.1 意图（卡面目标与验收）\n\n十卡共性 Forbidden 条款（卡面原文，全线一致）：不得重建已存在的权威真源；不得用 mock/seed 冒充真实行为；不得只通过静态代码阅读宣称用户体验通过；不得弱化既有安全/幂等/隔离/审计守卫。Worker 只能提交 READY_FOR_REVIEW/PARTIAL/BLOCKED；Reviewer 必须独立执行关键验收。\n\n| 卡 | Risk/Resource/Reviewers | 卡面目标（一句话） | 卡面关键验收 |\n|---|---|---|---|\n| U-01 设计表面 Inventory 与组件收敛 | medium/LIGHT/1 | 用真实 screenshot+widget tree 找出核心旅程组件/装饰债，制定迁移顺序 | 组件 owner 唯一；新增 UI 必须用 design system；输出 before screenshots+consolidation plan |\n| U-02 Calm/Warm 设计语言与低刺激 | medium/HEAVY/1 | 「纸感书院+现代AI」变 token/policy，接活 low-stimulation dead code | 双模式核心截图过 contrast/hierarchy rubric；低刺激实际减少动效不只是 setting 值 |\n| U-03 Aurora/Memory「对我的理解」 | high/HEAVY/2 | provenance/scope/correction 做成普通用户可懂的控制面 | 30 秒能解释知道什么/为什么/怎么改；纠正后界面与下次 decision 同步变化；A/B visual issues=0 |\n| U-04 Proposal/Execution/Hybrid Handoff | high/HEAVY/2 | 统一 Action Proposal、diff、approval、turn ownership、run progress UI | GJ06/GJ07 无需读日志知道轮到谁；重复点击不产生重复 command；未知结果不显示成功 |\n| U-05 首页/Goal/Chat 三屏 L2 | medium/HEAVY/1 | 三屏共享同一 Goal trajectory 心智模型 | 5 秒测试说出每屏主任务；核心 CTA 唯一；5 Persona screenshot A/B=0；功能不退化 |\n| U-06 L4 状态完备性注入 | medium/HEAVY/1 | 系统化覆盖 State Matrix，不再每 feature 自造空/错/加载态 | 核心 surfaces state matrix ≥95% covered；错误全有下一步；>500ms 有 stage feedback；无 terminal spinner |\n| U-07 长尾 Contextualization 与导航减负 | medium/HEAVY/1 | 长尾能力放回 Goal/Action context，清除超级App感 | 五 Tab 不增；CORE journey 无关入口不出现；HIDDEN 不可达；CONTEXTUAL 有自然 journey |\n| U-08 Accessibility 全链升级 | medium/HEAVY/1 | 核心 Journey 对 screen reader/keyboard/large text/reduced motion 可用 | GJ01/GJ03/GJ08 辅助技术可完成；WCAG AA；不依赖颜色传达关键状态 |\n| U-09 L5 三端视觉/交互一致性 Diff | medium/HEAVY/1 | Android/Web/macOS 同 canonical state 真实对比并修平台断裂 | 核心状态三端无 A/B issue；交互语义一致；产出 final screenshot matrix 与 diff report |\n| U-10 全产品文案与术语终审 | medium/LIGHT/1 | 黑话/玄学分数/羞辱化鼓励全部收敛 | 核心 journey 无未解释术语/placeholder/raw key；Why/失败/不确定表达合规 |\n\n---\n\n## U.2 实际交付逐卡\n\n### U-01 · 组件收敛与设计系统治理（V4 应把「守卫冻结」当作本卡真正的产物）\n\n**交付（六步链 + 复核，全部有主干 SHA）**\n\n| 步骤 | 主干 SHA | 内容 |\n|---|---|---|\n| Step 1/3/4/5 | `c99838d5`/`76847722`/`7cf1198c`/`4e406994` | chip/pill 收敛 rawChip 75→11；empty/error/loading 收敛 rawSpinner 79→8；button 收敛 rawButton 87→19（CustomButton 退役）；profile 色字面量 123→103 |\n| Step 6+7 | `7590aa1a` | confetti 双挂载修复 + **守卫清单登记（chain complete）** |\n| wt671 复核 | `938e1f34`+`e3e68667` | FIX-357/358（扫描根陈旧机械对齐+证据指针诚实化）+ Inventory 刷新：**头注亲证** scripts/guards/check_ux_component_convention.py:6-31 声明基线冻结于 U-01、10 个治理面（9 U-01 surfaces+sprint 第 10 面）、ratchet 只降不升 |\n\n**DS.* 令牌体系的约束力（本次专项核验）**：约束力是**守卫冻结型**而非「全量迁移完成型」——\n- `mobile/lib/core/design/` 权威层级 = `tokens_v2/`（唯一事实源）→ `theme/`（context.colors/typo/space/radius/motion 唯一 context 入口）→ `DS`（数值层已冻结 @Deprecated，存量过渡）（v3-output/U-09/WT676_CONSISTENCY_DIFF_MATRIX.md §2，主干文件亲证一致）。\n- 使用规模：`DS.` 形态引用 22,129 处 / 577 文件 import design_system（本次 grep 实数）。\n- 双 ratchet 守卫在册在跑：`check
