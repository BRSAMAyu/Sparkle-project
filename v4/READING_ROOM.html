</style></head><body><header><div><strong>Sparkle V4 / 阅读室</strong><div class="hint">v0.1 · 2026-09-28 · 可修改的风格提案，明确的行为与验证边界</div></div><div><a href="prototype/DESIGN_LAB.html">打开交互草图 ↗</a><a href="#05_agents/START_PROMPT.md" data-doc="05_agents/START_PROMPT.md">Agent启动入口</a></div></header><div class="wrap"><aside><label for="search" class="hint">搜索标题、任务编号或全文</label><input id="search" placeholder="例如：记忆效用 / V4-I02 / 触觉"><div id="count" class="meta"></div><nav id="nav"></nav></aside><main><div id="path"></div><article id="article"></article></main></div><script id="data" type="application/json">[{"id": "README_START_HERE.md", "title": "Sparkle V4｜有证据的自适应体验", "group": "入口", "html": "<h1>Sparkle V4｜有证据的自适应体验<\/h1>\n<p><strong>设计提案与增量 Agent 执行包 · v0.1 · 2026-09-28<\/strong><\/p>\n<p>V4 不是重做 V3，也不是给 V3 加一层像素皮肤。目标是把“接得上、改得对、成长有痕迹”做成 Sparkle 自己的交互语言，同时证明历史经验在该用时能改善下一次行动。<\/p>\n<h2>三个入口<\/h2>\n<ul>\n<li>团队阅读：<code>MASTER_DESIGN.md<\/code> → <code>01_product/SIGNATURE_JOURNEYS.md<\/code> → <code>02_design/REFERENCE_CRITIQUE.md<\/code>。<\/li>\n<li>Agent 执行：<code>05_agents/START_PROMPT.md<\/code> → <code>04_tasks/tasks.json<\/code>；JSON 为任务规格唯一真源，Markdown 卡由其生成。<\/li>\n<li>风格讨论：<code>prototype/DESIGN_LAB.html<\/code>。这是本地交互示意，不接真实 AI，不含真实产品测试结果；可切换纸昼/暮色/低刺激，体验纠正与回执。<\/li>\n<\/ul>\n<h2>本版的权限与冻结点<\/h2>\n<p>参考图是提案，不是已批准的全站设计。Agent 可完成组件、内部 preview 与垂直旅程；<code>v4.pixel.preview<\/code> 只在开发预览开放，默认发布仍沿用已验收主题，直到设计选择被明确记录。AI 增量不依赖色板批准；更换色板不应重写业务代码。<\/p>\n<p>名字固定 Sparkle / 星火。能力、目标与底层权限不改名。保留实际五 Tab 的路由合同，不因参考图四 Tab 直接删导航。上线场景仍以当前最有依据的学习/备考/技能项目为锚，不宣称已经服务所有人生需求。<\/p>\n<h2>开始运行<\/h2>\n<pre><code class=\"language-bash\">python tools/validate_pack.py\npython -m unittest discover -s tests -v\npython tools/next_tasks.py\n<\/code><\/pre>\n<p>以上只验证本包、离线参考逻辑和依赖规划，不启动产品，不调用模型，不改仓库。把本包收编进现有仓库后，由 Leader 按 START_PROMPT 绑定已有 CI/模拟器/模型环境，沿用现有 fleet 状态系统。没有真实运行证据的任务不得自动签成 VALUE_PASS。<\/p>\n<h2>完成含义<\/h2>\n<p><code>V4_DONE.md<\/code> 定义 DESIGN_PREVIEW、ENGINEERING_VERIFIED、VALUE_VERIFIED 与 RELEASE_READY。任何一个都不是“真实用户喜欢/付费/留存”的替代证据。Agent 可以完成模拟器与自动化工作，不能用虚拟用户证明市场匹配，也不能在模拟器中证明真实扬声器和触觉的舒适度。<\/p>\n<h2>不做什么<\/h2>\n<p>不重布 V3 已完成卡；不绕权限/关闭安全来追指标；不自动发布、付费、接受条款或推送到被冻结远端；不新建第二套 Memory/Task 真源；不把“评测诚实失败”当产品效果通过。有关外部依赖沿用原 O-01/Q-07/Q-08 状态，不制造新的重复工程卡。<\/p>\n", "text": "# Sparkle V4｜有证据的自适应体验\n**设计提案与增量 Agent 执行包 · v0.1 · 2026-09-28**\n\nV4 不是重做 V3，也不是给 V3 加一层像素皮肤。目标是把“接得上、改得对、成长有痕迹”做成 Sparkle 自己的交互语言，同时证明历史经验在该用时能改善下一次行动。\n\n## 三个入口\n- 团队阅读：`MASTER_DESIGN.md` → `01_product/SIGNATURE_JOURNEYS.md` → `02_design/REFERENCE_CRITIQUE.md`。\n- Agent 执行：`05_agents/START_PROMPT.md` → `04_tasks/tasks.json`；JSON 为任务规格唯一真源，Markdown 卡由其生成。\n- 风格讨论：`prototype/DESIGN_LAB.html`。这是本地交互示意，不接真实 AI，不含真实产品测试结果；可切换纸昼/暮色/低刺激，体验纠正与回执。\n\n## 本版的权限与冻结点\n参考图是提案，不是已批准的全站设计。Agent 可完成组件、内部 preview 与垂直旅程；`v4.pixel.preview` 只在开发预览开放，默认发布仍沿用已验收主题，直到设计选择被明确记录。AI 增量不依赖色板批准；更换色板不应重写业务代码。\n\n名字固定 Sparkle / 星火。能力、目标与底层权限不改名。保留实际五 Tab 的路由合同，不因参考图四 Tab 直接删导航。上线场景仍以当前最有依据的学习/备考/技能项目为锚，不宣称已经服务所有人生需求。\n\n## 开始运行\n```bash\npython tools/validate_pack.py\npython -m unittest discover -s tests -v\npython tools/next_tasks.py\n```\n以上只验证本包、离线参考逻辑和依赖规划，不启动产品，不调用模型，不改仓库。把本包收编进现有仓库后，由 Leader 按 START_PROMPT 绑定已有 CI/模拟器/模型环境，沿用现有 fleet 状态系统。没有真实运行证据的任务不得自动签成 VALUE_PASS。\n\n## 完成含义\n`V4_DONE.md` 定义 DESIGN_PREVIEW、ENGINEERING_VERIFIED、VALUE_VERIFIED 与 RELEASE_READY。任何一个都不是“真实用户喜欢/付费/留存”的替代证据。Agent 可以完成模拟器与自动化工作，不能用虚拟用户证明市场匹配，也不能在模拟器中证明真实扬声器和触觉的舒适度。\n\n## 不做什么\n不重布 V3 已完成卡；不绕权限/关闭安全来追指标；不自动发布、付费、接受条款或推送到被冻结远端；不新建第二套 Memory/Task 真源；不把“评测诚实失败”当产品效果通过。有关外部依赖沿用原 O-01/Q-07/Q-08 状态，不制造新的重复工程卡。\n"}, {"id": "MASTER_DESIGN.md", "title": "Sparkle V4：让自适应成为用户能看见的体验", "group": "入口", "html": "<h1>Sparkle V4：让自适应成为用户能看见的体验<\/h1>\n<h2>1. 最终产品方向<\/h2>\n<p>保留“把卡住变成下一步”。V4 增加一个可验证的内涵：<strong>我离开后它接得上；我纠正后它改得对；我做成的事情留下真实痕迹。<\/strong><\/p>\n<p>像素风承担识别、节奏和记忆点；AI 承担判断与协作；数据承担事实。三者共用同一个状态协议，不能各自讲不同故事。皮肤再独特，也不能把长等待、错误记忆和假成长美化掉。<\/p>\n<h2>2. 为什么不能只换皮肤<\/h2>\n<p>V3 实现面很完整，但最新资料包含负结果：修后模拟消融中 full=9/20、no_memory=11/20；Q04 首轮个性化红队未达标；E08 真模型深任务存在分钟级长尾。它们并非真实用户试验，也不说明所有现有能力无效，却清楚提示：<strong>V4 首要竞争力是可重复的帮助质量，不是更多记忆或更多特效。<\/strong> 原始边界见 <code>00_context/READING_AND_CONFLICTS.md<\/code>（S03/S04/S05/S06）。<\/p>\n<p>同时，FIX507 的生产生命周期接线、FIX539/540 的注册和首卡路径已经有较新修复，必须继承。避免“读一份旧总结就把已修工作再做一遍”。<\/p>\n<h2>3. 产品的三个标志性时刻<\/h2>\n<h3>接续：回来不必重新解释<\/h3>\n<p>打开首页，最醒目的是上次未完成但仍有价值的一步：当前目标、上次做到哪、本次可选投入、一个主动作。不是二十张摘要卡，也不是泛化欢迎语。若目标已变或记录过期，先说明不确定性而不是强行接续。<\/p>\n<h3>校准：一句纠正，直接看见变化<\/h3>\n<p>用户说“不是不会，我今天只有十五分钟”。界面把临时约束和长期偏好分开，显示本次行动前后差异；用户选择仅本次/本目标/撤回。确认后等待真实回执，卡片再转态。以后相似场景少解释；不同场景不套用。没有提案或系统选择不干预时，纠正入口仍存在。<\/p>\n<h3>留痕：成果进入自己的成长轨迹<\/h3>\n<p>完成一次练习、提交一个产物或通过一次独立检验，留下来源明确的轨迹节点。点击可回到内容、行动和证据。像素星点/小路是事实的表现，不是积分换“精通”。退出几天不枯萎、不损失伙伴、不用羞耻催回。<\/p>\n<p>这三个时刻分别对应持续上下文、有效记忆、真实证据。它们共同形成特色，任何单独复制一个小组件都不足以复现闭环。<\/p>\n<h2>4. 可变的风格，不可变的语义<\/h2>\n<p>建议主方向为“暖纸像素 · 成长工坊”：暖白纸面、深墨文字、低饱和苔绿/雾蓝/陶土、阶梯边缘、少量像素植物与星光。三种环境：纸昼、暮色、低刺激。此命名是提案，不给每个既有模块强贴游戏术语。<\/p>\n<p>像素化用于轮廓、图标、插画和里程碑。正文、中文、代码、公式、图表坐标、输入控件保持清晰的现代排版。不要为了复古让用户多读一遍。<\/p>\n<p>底层 <code>tokens_v2 → theme → context.*<\/code> 继续唯一真源。V4 tokens 文件是本包的候选输入规格，实施时必须落到既有系统，不能常驻成第二个运行时主题库。功能级状态与视觉反馈通过统一 <code>ExperienceEvent<\/code> 投影连接，模型只能提出动作，不能直接发“成功音效”。<\/p>\n<h2>5. AI 的实质性增量<\/h2>\n<p><strong>记忆效用门。<\/strong> 从“检索得到了就加”转成“合法、相关、不冲突，而且预期有助于当前决策才加”。当前显式目标/约束不是可有可无的记忆；删除/越权/过期规则先执行，不交给模型投票。旧失败类型与当前问题不同，不加“能力不足”权重。<\/p>\n<p><strong>有界语义判断。<\/strong> 保留已有规则快路，复杂表达让模型在合法候选中输出 blocker/intervention/ref IDs/是否需要澄清。模型不能造 evidence_id、拿人格词替代理由、改 A05 白名单、把一条历史成功当永恒规律。<\/p>\n<p><strong>最少但有价值的澄清。<\/strong> 只问会改变行动的一个问题。无行动也允许用户提供真实原因，避免“为了等用户纠正必须先猜错”的悖论。<\/p>\n<p><strong>可检验的经验策略。<\/strong> 复用 A05 六个受限字段，增加负迁移、版本、观察窗和撤回。事实→相关经验→候选策略→影子比较→有限启用；不直接用随机点击奖励训练在线 RL。<\/p>\n<p><strong>人机合作不偷走学习。<\/strong> 我来做/带我做/交给 Sparkle 与现有 Human/Hybrid/Agent 映射。目标是掌握时，人必须完成理解/尝试/独立检验；目标是交付时，Agent 可做可委托的整理和制作，但仍需授权。<\/p>\n<h2>6. 三个难点如何连起来<\/h2>\n<p>例：用户从错题页面说“我知道原理，只是不知道怎么开始”。Context Compiler 取当前题目、最近相关尝试、用户本目标已确认偏好，排除另一课程的挫败记忆。Aurora 问是否先看一个相近而非同题的示例，生成“示例→自己做→检查”的 Hybrid 计划。Flutter 呈现单张行动卡，启动真实 runtime。用户亲自完成关键步骤，证据进入既有账本；Galaxy 展示“独立检验1次通过”，不显示“练了15分钟所以精通”。次日接续卡引用上次成果与未完成处。每个图标变化都可回到具体事件。<\/p>\n<h2>7. 商业特色与可防御性<\/h2>\n<p>审美可以被模仿，API 可以被调用。更难复制的积累，是同意边界内的情境—帮助—结果数据质量、校准后稳定的个人策略、跨模块一致的行动与证据协议、以及大量难例回归带来的可靠性。它们是待建立的优势，不是已经拥有的市场垄断。<\/p>\n<p>保留当前 D-COMM 的自我锚、短期小队与受限会员兑换；不恢复全站综合榜，不因新像素风改造成打怪抽卡游戏。核心帮助、纠正、删除、导出和低刺激不收费。用户应该因为真实价值回来，而不是因为数字伙伴会受伤。<\/p>\n<h2>8. 开发策略<\/h2>\n<p>一条稳定 V3 主线；V4 路由/契约增量向后兼容；像素 preview、记忆效用门、语义澄清、反馈总线分别 off/shadow/live。先做“首页→卡住→校准→确认→证据”垂直切片，再迁移页面家族。任何 UI 风格改动不能同时顺手重写任务状态机。色板讨论不阻塞 AI 侧；外部部署授权不阻塞内部实测。<\/p>\n<p>前台 Leader + 六后台 Agent，最多一个 HEAVY 构建/模拟器/大测试运行。其余槽位用于实现、独立审查、轻量测试、证据分析。不是六个模拟器一起抢内存，也不是为了填满槽位制造任务。<\/p>\n<h2>9. 交付不是完成表格<\/h2>\n<p>任务完成需要产物、差量、运行证据和独立审查。效果不达标不能靠重定义样本/剪去失败/换模型标签过门。V4 目标见 <code>06_evaluation/METRICS.json<\/code>；数值是本轮工程目标，非行业事实、非实测成绩。所有对真人偏好、留存、付费与触觉舒适度的判断保持未验证，直到相应证据存在。<\/p>\n<p>V4 最终应让人无需听架构说明就感受到：<strong>这个系统知道我在做什么，允许我纠正它，并确实帮助我继续。<\/strong><\/p>\n", "text": "# Sparkle V4：让自适应成为用户能看见的体验\n\n## 1. 最终产品方向\n保留“把卡住变成下一步”。V4 增加一个可验证的内涵：**我离开后它接得上；我纠正后它改得对；我做成的事情留下真实痕迹。**\n\n像素风承担识别、节奏和记忆点；AI 承担判断与协作；数据承担事实。三者共用同一个状态协议，不能各自讲不同故事。皮肤再独特，也不能把长等待、错误记忆和假成长美化掉。\n\n## 2. 为什么不能只换皮肤\nV3 实现面很完整，但最新资料包含负结果：修后模拟消融中 full=9/20、no_memory=11/20；Q04 首轮个性化红队未达标；E08 真模型深任务存在分钟级长尾。它们并非真实用户试验，也不说明所有现有能力无效，却清楚提示：**V4 首要竞争力是可重复的帮助质量，不是更多记忆或更多特效。** 原始边界见 `00_context/READING_AND_CONFLICTS.md`（S03/S04/S05/S06）。\n\n同时，FIX507 的生产生命周期接线、FIX539/540 的注册和首卡路径已经有较新修复，必须继承。避免“读一份旧总结就把已修工作再做一遍”。\n\n## 3. 产品的三个标志性时刻\n### 接续：回来不必重新解释\n打开首页，最醒目的是上次未完成但仍有价值的一步：当前目标、上次做到哪、本次可选投入、一个主动作。不是二十张摘要卡，也不是泛化欢迎语。若目标已变或记录过期，先说明不确定性而不是强行接续。\n\n### 校准：一句纠正，直接看见变化\n用户说“不是不会，我今天只有十五分钟”。界面把临时约束和长期偏好分开，显示本次行动前后差异；用户选择仅本次/本目标/撤回。确认后等待真实回执，卡片再转态。以后相似场景少解释；不同场景不套用。没有提案或系统选择不干预时，纠正入口仍存在。\n\n### 留痕：成果进入自己的成长轨迹\n完成一次练习、提交一个产物或通过一次独立检验，留下来源明确的轨迹节点。点击可回到内容、行动和证据。像素星点/小路是事实的表现，不是积分换“精通”。退出几天不枯萎、不损失伙伴、不用羞耻催回。\n\n这三个时刻分别对应持续上下文、有效记忆、真实证据。它们共同形成特色，任何单独复制一个小组件都不足以复现闭环。\n\n## 4. 可变的风格，不可变的语义\n建议主方向为“暖纸像素 · 成长工坊”：暖白纸面、深墨文字、低饱和苔绿/雾蓝/陶土、阶梯边缘、少量像素植物与星光。三种环境：纸昼、暮色、低刺激。此命名是提案，不给每个既有模块强贴游戏术语。\n\n像素化用于轮廓、图标、插画和里程碑。正文、中文、代码、公式、图表坐标、输入控件保持清晰的现代排版。不要为了复古让用户多读一遍。\n\n底层 `tokens_v2 → theme → context.*` 继续唯一真源。V4 tokens 文件是本包的候选输入规格，实施时必须落到既有系统，不能常驻成第二个运行时主题库。功能级状态与视觉反馈通过统一 `ExperienceEvent` 投影连接，模型只能提出动作，不能直接发“成功音效”。\n\n## 5. AI 的实质性增量\n**记忆效用门。** 从“检索得到了就加”转成“合法、相关、不冲突，而且预期有助于当前决策才加”。当前显式目标/约束不是可有可无的记忆；删除/越权/过期规则先执行，不交给模型投票。旧失败类型与当前问题不同，不加“能力不足”权重。\n\n**有界语义判断。** 保留已有规则快路，复杂表达让模型在合法候选中输出 blocker/intervention/ref IDs/是否需要澄清。模型不能造 evidence_id、拿人格词替代理由、改 A05 白名单、把一条历史成功当永恒规律。\n\n**最少但有价值的澄清。** 只问会改变行动的一个问题。无行动也允许用户提供真实原因，避免“为了等用户纠正必须先猜错”的悖论。\n\n**可检验的经验策略。** 复用 A05 六个受限字段，增加负迁移、版本、观察窗和撤回。事实→相关经验→候选策略→影子比较→有限启用；不直接用随机点击奖励训练在线 RL。\n\n**人机合作不偷走学习。** 我来做/带我做/交给 Sparkle 与现有 Human/Hybrid/Agent 映射。目标是掌握时，人必须完成理解/尝试/独立检验；目标是交付时，Agent 可做可委托的整理和制作，但仍需授权。\n\n## 6. 三个难点如何连起来\n例：用户从错题页面说“我知道原理，只是不知道怎么开始”。Context Compiler 取当前题目、最近相关尝试、用户本目标已确认偏好，排除另一课程的挫败记忆。Aurora 问是否先看一个相近而非同题的示例，生成“示例→自己做→检查”的 Hybrid 计划。Flutter 呈现单张行动卡，启动真实 runtime。用户亲自完成关键步骤，证据进入既有账本；Galaxy 展示“独立检验1次通过”，不显示“练了15分钟所以精通”。次日接续卡引用上次成果与未完成处。每个图标变化都可回到具体事件。\n\n## 7. 商业特色与可防御性\n审美可以被模仿，API 可以被调用。更难复制的积累，是同意边界内的情境—帮助—结果数据质量、校准后稳定的个人策略、跨模块一致的行动与证据协议、以及大量难例回归带来的可靠性。它们是待建立的优势，不是已经拥有的市场垄断。\n\n保留当前 D-COMM 的自我锚、短期小队与受限会员兑换；不恢复全站综合榜，不因新像素风改造成打怪抽卡游戏。核心帮助、纠正、删除、导出和低刺激不收费。用户应该因为真实价值回来，而不是因为数字伙伴会受伤。\n\n## 8. 开发策略\n一条稳定 V3 主线；V4 路由/契约增量向后兼容；像素 preview、记忆效用门、语义澄清、反馈总线分别 off/shadow/live。先做“首页→卡住→校准→确认→证据”垂直切片，再迁移页面家族。任何 UI 风格改动不能同时顺手重写任务状态机。色板讨论不阻塞 AI 侧；外部部署授权不阻塞内部实测。\n\n前台 Leader + 六后台 Agent，最多一个 HEAVY 构建/模拟器/大测试运行。其余槽位用于实现、独立审查、轻量测试、证据分析。不是六个模拟器一起抢内存，也不是为了填满槽位制造任务。\n\n## 9. 交付不是完成表格\n任务完成需要产物、差量、运行证据和独立审查。效果不达标不能靠重定义样本/剪去失败/换模型标签过门。V4 目标见 `06_evaluation/METRICS.json`；数值是本轮工程目标，非行业事实、非实测成绩。所有对真人偏好、留存、付费与触觉舒适度的判断保持未验证，直到相应证据存在。\n\nV4 最终应让人无需听架构说明就感受到：**这个系统知道我在做什么，允许我纠正它，并确实帮助我继续。**\n"}, {"id": "V4_DONE.md", "title": "V4 Definition of Done", "group": "入口", "html": "<h1>V4 Definition of Done<\/h1>\n<h2>四个结论必须分开<\/h2>\n<p><strong>DESIGN_PREVIEW_READY<\/strong>：候选视觉有跨页面/状态原型和真实Flutter preview，令牌与反馈机制可替换，参考图没有被冒充全站批准。<\/p>\n<p><strong>ENGINEERING_VERIFIED<\/strong>：增量代码集成、原V3触达回归通过、真实数据与副作用正确、关键旅程在声明的平台通过；音触只测到调用时注明边界。<\/p>\n<p><strong>VALUE_VERIFIED_IN_TESTS<\/strong>：M08–M14等独立效用门达到要求，记忆不靠全拒用投机，前台有用内容而非ack达标，用户路径显示真正改变与真实结果。合成holdout只支持测试范围，不支持真人市场结果。<\/p>\n<p><strong>RELEASE_READY<\/strong>：以上必要条件通过、风格已明确选择、资产授权齐全、部署/真实设备/费用/隐私与原O-01/Q-07/Q-08外部门关闭。没有外部授权就停留内部候选，不伪称商业上线。<\/p>\n<h2>不能用来替代完成的东西<\/h2>\n<p>任务卡全部Integrated、单元测试数量、接口200、260模拟case绿、截图好看、模型自评高分、演示脚本自动补走隐藏路径、7日控制钟、no_generation标签、冷门功能数量。<\/p>\n<h2>每条标志旅程必须回答<\/h2>\n<ol>\n<li>用户眼前有明确目标与下一步吗？<\/li>\n<li>“为什么这样建议”引用了实际、合法、当前有效的信息吗？<\/li>\n<li>用户纠正/不答/取消时还能继续吗？<\/li>\n<li>谁执行、何时确认、人类步骤是否保留？<\/li>\n<li>成功状态真有receipt/证据，断线恢复后仍一致吗？<\/li>\n<li>过去经验真的改善而非拖偏新决定吗？<\/li>\n<li>音、震、动效全关后价值是否仍成立？<\/li>\n<li>暗色、大字体、键盘、无障碍、低性能设备是否能完成？<\/li>\n<li>相同状态跨模块有同一个含义吗？<\/li>\n<li>对外宣称是否与证据层级一致？<\/li>\n<\/ol>\n<h2>终门输出格式<\/h2>\n<p>每个gate：PASS/FAIL/NOT_RUN/BLOCKED；对应metric IDs、样本、版本、证据路径与哈希、独立review、限制。任何硬权限/撤回/假成功失败阻止相应功能live。审查任务结束可标实现完成，但结果FAIL永久可见；不得删除失败数据来凑“全绿”。<\/p>\n<h2>旧工作不重做<\/h2>\n<p>原V3 104 done按输入快照继承；原剩余O-01/Q-07/Q-08不换号；当前源码已修的V4覆盖行为可evidence-only验证。V4只交差量，不因设计美学升级反复建Memory/Agent架构。<\/p>\n", "text": "# V4 Definition of Done\n\n## 四个结论必须分开\n**DESIGN_PREVIEW_READY**：候选视觉有跨页面/状态原型和真实Flutter preview，令牌与反馈机制可替换，参考图没有被冒充全站批准。\n\n**ENGINEERING_VERIFIED**：增量代码集成、原V3触达回归通过、真实数据与副作用正确、关键旅程在声明的平台通过；音触只测到调用时注明边界。\n\n**VALUE_VERIFIED_IN_TESTS**：M08–M14等独立效用门达到要求，记忆不靠全拒用投机，前台有用内容而非ack达标，用户路径显示真正改变与真实结果。合成holdout只支持测试范围，不支持真人市场结果。\n\n**RELEASE_READY**：以上必要条件通过、风格已明确选择、资产授权齐全、部署/真实设备/费用/隐私与原O-01/Q-07/Q-08外部门关闭。没有外部授权就停留内部候选，不伪称商业上线。\n\n## 不能用来替代完成的东西\n任务卡全部Integrated、单元测试数量、接口200、260模拟case绿、截图好看、模型自评高分、演示脚本自动补走隐藏路径、7日控制钟、no_generation标签、冷门功能数量。\n\n## 每条标志旅程必须回答\n1. 用户眼前有明确目标与下一步吗？\n2. “为什么这样建议”引用了实际、合法、当前有效的信息吗？\n3. 用户纠正/不答/取消时还能继续吗？\n4. 谁执行、何时确认、人类步骤是否保留？\n5. 成功状态真有receipt/证据，断线恢复后仍一致吗？\n6. 过去经验真的改善而非拖偏新决定吗？\n7. 音、震、动效全关后价值是否仍成立？\n8. 暗色、大字体、键盘、无障碍、低性能设备是否能完成？\n9. 相同状态跨模块有同一个含义吗？\n10. 对外宣称是否与证据层级一致？\n\n## 终门输出格式\n每个gate：PASS/FAIL/NOT_RUN/BLOCKED；对应metric IDs、样本、版本、证据路径与哈希、独立review、限制。任何硬权限/撤回/假成功失败阻止相应功能live。审查任务结束可标实现完成，但结果FAIL永久可见；不得删除失败数据来凑“全绿”。\n\n## 旧工作不重做\n原V3 104 done按输入快照继承；原剩余O-01/Q-07/Q-08不换号；当前源码已修的V4覆盖行为可evidence-only验证。V4只交差量，不因设计美学升级反复建Memory/Agent架构。\n"}, {"id": "PACK_CONTENTS.md", "title": "包内容与阅读顺序", "group": "入口", "html": "<h1>包内容与阅读顺序<\/h1>\n<h2>给团队<\/h2>\n<p><code>MASTER_DESIGN.md<\/code>：V4方向与实质增量。\n<code>01_product/SIGNATURE_JOURNEYS.md<\/code>：10条标志性用户旅程。\n<code>02_design/REFERENCE_CRITIQUE.md<\/code>：参考图取舍，不把候选当定稿。\n<code>prototype/DESIGN_LAB.html<\/code>：独立可交互草图。\n<code>READING_ROOM.html<\/code>：离线搜索所有本包Markdown；原始报告与新提案清楚分组。<\/p>\n<h2>给Leader与Agent<\/h2>\n<p><code>05_agents/START_PROMPT.md<\/code>：执行入口，前台Leader+六后台，HEAVY=1/宿主。\n<code>04_tasks/tasks.json<\/code>：58张任务的唯一规格源；cards/是可读副本。\n<code>01_product/MODULE_MATRIX.json<\/code>：43模块逐一落点，保留最新D-COMM裁决。\n<code>03_intelligence/<\/code>：6份AI系统专项设计。\n<code>02_design/<\/code>：5份设计规范+候选tokens+资产台账+参考图。\n<code>06_evaluation/<\/code>：26项指标、72条场景设计、评测与预算、主张边界。\n<code>08_release/<\/code>：渐进发布、回滚、既有外部依赖。<\/p>\n<h2>给审查Agent<\/h2>\n<p><code>00_context/READING_AND_CONFLICTS.md<\/code>：源资料冲突与继承规则。\n<code>00_context/SOURCE_INDEX.json<\/code>与source_notes/：20份关键原始报告的路径/哈希/副本。\n<code>00_context/INPUT_MANIFEST.json<\/code>：LITE归档全量文件清单，不声称每一个重复日志均逐字精读。\n<code>07_research/<\/code>：15项一手研究/官方资料及采用/不采用理由；不是穷尽综述。\n<code>reference/<\/code>：三个离线契约行为参考，不是生产代码。\n<code>tools/<\/code>：离线包校验、只读任务建议、可选草图浏览器测试。\n<code>tests/<\/code>与<code>evidence/<\/code>：本轮真实包级测试与草图测试记录。\n<code>VALIDATION_REPORT.md<\/code>：本轮做了什么、没做什么。<\/p>\n<h2>权限与资产<\/h2>\n<p>不包含产品源代码、模型Key或字体。参考JPG只用于内部讨论，未授权作为商业资产。source_notes中的旧结论原样保留，最终取舍看READING_AND_CONFLICTS，不混用来源年代。所有对外发布/付费/官方提交仍受原授权边界约束。<\/p>\n", "text": "# 包内容与阅读顺序\n\n## 给团队\n`MASTER_DESIGN.md`：V4方向与实质增量。\n`01_product/SIGNATURE_JOURNEYS.md`：10条标志性用户旅程。\n`02_design/REFERENCE_CRITIQUE.md`：参考图取舍，不把候选当定稿。\n`prototype/DESIGN_LAB.html`：独立可交互草图。\n`READING_ROOM.html`：离线搜索所有本包Markdown；原始报告与新提案清楚分组。\n\n## 给Leader与Agent\n`05_agents/START_PROMPT.md`：执行入口，前台Leader+六后台，HEAVY=1/宿主。\n`04_tasks/tasks.json`：58张任务的唯一规格源；cards/是可读副本。\n`01_product/MODULE_MATRIX.json`：43模块逐一落点，保留最新D-COMM裁决。\n`03_intelligence/`：6份AI系统专项设计。\n`02_design/`：5份设计规范+候选tokens+资产台账+参考图。\n`06_evaluation/`：26项指标、72条场景设计、评测与预算、主张边界。\n`08_release/`：渐进发布、回滚、既有外部依赖。\n\n## 给审查Agent\n`00_context/READING_AND_CONFLICTS.md`：源资料冲突与继承规则。\n`00_context/SOURCE_INDEX.json`与source_notes/：20份关键原始报告的路径/哈希/副本。\n`00_context/INPUT_MANIFEST.json`：LITE归档全量文件清单，不声称每一个重复日志均逐字精读。\n`07_research/`：15项一手研究/官方资料及采用/不采用理由；不是穷尽综述。\n`reference/`：三个离线契约行为参考，不是生产代码。\n`tools/`：离线包校验、只读任务建议、可选草图浏览器测试。\n`tests/`与`evidence/`：本轮真实包级测试与草图测试记录。\n`VALIDATION_REPORT.md`：本轮做了什么、没做什么。\n\n## 权限与资产\n不包含产品源代码、模型Key或字体。参考JPG只用于内部讨论，未授权作为商业资产。source_notes中的旧结论原样保留，最终取舍看READING_AND_CONFLICTS，不混用来源年代。所有对外发布/付费/官方提交仍受原授权边界约束。\n"}, {"id": "VALIDATION_REPORT.md", "title": "V4 v0.1 交付验证报告", "group": "入口", "html": "<h1>V4 v0.1 交付验证报告<\/h1>\n<p><strong>验证对象<\/strong>：本设计与增量Agent任务包。<strong>日期<\/strong>：2026-09-28。不是 Sparkle 产品V4验收。<\/p>\n<h2>已实际运行<\/h2>\n<table>\n<thead>\n<tr>\n<th>检查<\/th>\n<th>实际结果<\/th>\n<th>原始记录<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>任务规格、引用、DAG<\/td>\n<td>58张增量卡；依赖有效、无环；首批B01–B06可领取<\/td>\n<td>evidence/package_validation.json<\/td>\n<\/tr>\n<tr>\n<td>模块覆盖<\/td>\n<td>43个现行功能目录全部有设计/增量去向<\/td>\n<td>01_product/MODULE_MATRIX.json<\/td>\n<\/tr>\n<tr>\n<td>场景规格<\/td>\n<td>72条可解析、ID唯一的场景设计；状态SPEC_ONLY<\/td>\n<td>06_evaluation/scenarios.jsonl<\/td>\n<\/tr>\n<tr>\n<td>指标<\/td>\n<td>26项指标定义；阈值是规划目标，不是实测成绩<\/td>\n<td>06_evaluation/METRICS.json<\/td>\n<\/tr>\n<tr>\n<td>离线Python单元测试<\/td>\n<td><strong>43/43通过；0失败，0跳过<\/strong><\/td>\n<td>evidence/unit_tests.txt<\/td>\n<\/tr>\n<tr>\n<td>独立HTML草图浏览器检查<\/td>\n<td><strong>17/17通过；0浏览器异常<\/strong><\/td>\n<td>evidence/prototype_tests.json<\/td>\n<\/tr>\n<tr>\n<td>离线阅读室<\/td>\n<td><strong>8/8浏览器检查通过<\/strong>：导航、全文搜索、空结果、窄屏、无异常<\/td>\n<td>evidence/reader_tests.json<\/td>\n<\/tr>\n<tr>\n<td>主题令牌对比度<\/td>\n<td>三个候选主题的指定正文/次文/按钮/错误/警告组合均≥4.5:1<\/td>\n<td>evidence/package_validation.json<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>草图实际检查了：桌面/390px移动无横向溢出；显式示例标签；提案未提交无回执；本地确认后回执；目标范围记忆与忘记；练习证据与撤回；失败不成功；关闭取消本地计时器；暮色/低刺激切换；Escape；移动弹窗边界。桌面、移动、移动弹窗截图已打开目检。文件导航被容器浏览器策略拦截，因此测试改用Playwright的set_content加载同一HTML，不改变页面逻辑。<\/p>\n<p>令牌数字不是实际页面全部对比度验证，也不代表WCAG全面认证。离线算法测试是契约示例，不证明生产权限、分布式状态、训练收益或真实模型能力。<\/p>\n<h2>没有执行、不得声称已经执行<\/h2>\n<ul>\n<li>无 Sparkle 产品源码，不对当前main做独立代码审计；LITE中的原测试只作为来源报告。<\/li>\n<li>无 Flutter/Android/macOS原生App启动、真机触觉、扬声器试听或真实部署验收。<\/li>\n<li>无真LLM调用、V4效果A/B、四臂实验、长期用户或付费测试；72场景需要Agent绑定真实环境并运行。<\/li>\n<li>无商用资产授权取得、团队像素风批准、官方赛程/资格确认或公网发布。<\/li>\n<li>参考图是用户提供的候选方向，不是已有V3截图；包内浏览器截图属于本地草图。<\/li>\n<\/ul>\n<h2>继承与不确定性<\/h2>\n<p>最新修复优先于旧总结，已完成V3任务不重开；104/107 done不推导所有效果PASS。FIX507生产接线、539/540首卡修复继承，V4只覆盖未闭环的可见性、效用与集成。O-01/Q-07/Q-08外部门槛保留原号。<\/p>\n<h2>包的完整性<\/h2>\n<p>最终文件清单与SHA-256位于MANIFEST.json，清单不包括它自身。打包后另做ZIP读取/CRC检验。生成工具源码和本地缓存不必进入产品仓库；本包不含字体。<\/p>\n", "text": "# V4 v0.1 交付验证报告\n\n**验证对象**：本设计与增量Agent任务包。**日期**：2026-09-28。不是 Sparkle 产品V4验收。\n\n## 已实际运行\n| 检查 | 实际结果 | 原始记录 |\n|---|---|---|\n| 任务规格、引用、DAG | 58张增量卡；依赖有效、无环；首批B01–B06可领取 | evidence/package_validation.json |\n| 模块覆盖 | 43个现行功能目录全部有设计/增量去向 | 01_product/MODULE_MATRIX.json |\n| 场景规格 | 72条可解析、ID唯一的场景设计；状态SPEC_ONLY | 06_evaluation/scenarios.jsonl |\n| 指标 | 26项指标定义；阈值是规划目标，不是实测成绩 | 06_evaluation/METRICS.json |\n| 离线Python单元测试 | **43/43通过；0失败，0跳过** | evidence/unit_tests.txt |\n| 独立HTML草图浏览器检查 | **17/17通过；0浏览器异常** | evidence/prototype_tests.json |\n| 离线阅读室 | **8/8浏览器检查通过**：导航、全文搜索、空结果、窄屏、无异常 | evidence/reader_tests.json |\n| 主题令牌对比度 | 三个候选主题的指定正文/次文/按钮/错误/警告组合均≥4.5:1 | evidence/package_validation.json |\n\n草图实际检查了：桌面/390px移动无横向溢出；显式示例标签；提案未提交无回执；本地确认后回执；目标范围记忆与忘记；练习证据与撤回；失败不成功；关闭取消本地计时器；暮色/低刺激切换；Escape；移动弹窗边界。桌面、移动、移动弹窗截图已打开目检。文件导航被容器浏览器策略拦截，因此测试改用Playwright的set_content加载同一HTML，不改变页面逻辑。\n\n令牌数字不是实际页面全部对比度验证，也不代表WCAG全面认证。离线算法测试是契约示例，不证明生产权限、分布式状态、训练收益或真实模型能力。\n\n## 没有执行、不得声称已经执行\n- 无 Sparkle 产品源码，不对当前main做独立代码审计；LITE中的原测试只作为来源报告。\n- 无 Flutter/Android/macOS原生App启动、真机触觉、扬声器试听或真实部署验收。\n- 无真LLM调用、V4效果A/B、四臂实验、长期用户或付费测试；72场景需要Agent绑定真实环境并运行。\n- 无商用资产授权取得、团队像素风批准、官方赛程/资格确认或公网发布。\n- 参考图是用户提供的候选方向，不是已有V3截图；包内浏览器截图属于本地草图。\n\n## 继承与不确定性\n最新修复优先于旧总结，已完成V3任务不重开；104/107 done不推导所有效果PASS。FIX507生产接线、539/540首卡修复继承，V4只覆盖未闭环的可见性、效用与集成。O-01/Q-07/Q-08外部门槛保留原号。\n\n## 包的完整性\n最终文件清单与SHA-256位于MANIFEST.json，清单不包括它自身。打包后另做ZIP读取/CRC检验。生成工具源码和本地缓存不必进入产品仓库；本包不含字体。\n"}, {"id": "01_product/DECISIONS_AND_MOAT.md", "title": "产品取舍与“护城河”证据要求", "group": "01_product", "html": "<h1>产品取舍与“护城河”证据要求<\/h1>\n<h2>固定决定<\/h2>\n<p>Sparkle 是系统，不改成单个万能Agent。Aurora控制决策和关系呈现但不拥有数据主权。当前学习/备考用户路径保留；一般目标扩展是结构能力，不作为已验证需求。V3的goal、task、outcome、runtime、权限、校准与删除协议保持。<\/p>\n<h2>暂定视觉决定<\/h2>\n<p>采用暖纸像素作为首选候选；文本现代化；像素主要用于轮廓与图形，密集信息区降低装饰。先迁移五个主旅程面再铺全家族。五Tab路由保持；待任务/目标信息架构现场走查后可改标签，不能直接复制参考图四Tab。<\/p>\n<p>团队随后只需修改 <code>02_design/TOKENS.proposal.json<\/code> 的候选值/资产清单/主题配置，独立ADR记录；不要求重新做AI/数据卡。改导航层级则必须重跑深链、回归、键盘与可达性测试，不能当换色处理。<\/p>\n<h2>最值得争取的三层优势<\/h2>\n<table>\n<thead>\n<tr>\n<th>层次<\/th>\n<th>用户能感知的东西<\/th>\n<th>技术积累<\/th>\n<th>反证条件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>识别与信任<\/td>\n<td>克制的像素语言；纠正和回执清楚<\/td>\n<td>统一语义状态与跨端反馈组件<\/td>\n<td>看不懂状态、开启风格后完成时间变长<\/td>\n<\/tr>\n<tr>\n<td>合作质量<\/td>\n<td>找到正确卡点；分工不偷走学习<\/td>\n<td>受限语义选择、记忆效用门、可恢复episode<\/td>\n<td>无记忆对照更好、主动侵入、人类检验反而更差<\/td>\n<\/tr>\n<tr>\n<td>长程积累<\/td>\n<td>未来少解释；能见真实成长<\/td>\n<td>带版本的经验、关联结果、负迁移测试库<\/td>\n<td>更多数据不改善、错误长期固化、删除不可追溯<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这是产品假设，不是专利新颖性判断。不能宣称“超过所有现有系统”。Habitica已将RPG与任务结合，Finch已有成长陪伴与习惯/反思体验；两者足以说明像素、养成、奖励不是独占空间（研究索引 R09/R10）。Sparkle要证明的是严肃学习目标下的校准与人机协作闭环。<\/p>\n<h2>不采用的提案<\/h2>\n<p>全站8bit字体；全屏低帧滚动；按推测情绪自动改主题；连续缺席让植物枯死；开启配乐作为默认惊艳；每次勾选掉金币；隐藏失败换取“丝滑”；用头像亲密度收费；无限存全部交互；让模型改系统提示词和权限；为了新颖另建AGE人物世界模型；用合成用户证明付费留存。<\/p>\n<h2>商业验证口径<\/h2>\n<p>V4 Agent阶段可验：核心价值路径、成本、可达性、解释一致性、真实数据和差异化对照。不可验：真人喜好、长期留存、真实支付意愿、扬声器/触觉舒适度。它们列在发布证据账本，不生成假阳性或自动出营销语。后续真人验证只需一条主假设：经过真实目标周期，用户是否因为更少重复解释且有更多实际成果而主动继续使用，而非因为签到损失。<\/p>\n", "text": "# 产品取舍与“护城河”证据要求\n\n## 固定决定\nSparkle 是系统，不改成单个万能Agent。Aurora控制决策和关系呈现但不拥有数据主权。当前学习/备考用户路径保留；一般目标扩展是结构能力，不作为已验证需求。V3的goal、task、outcome、runtime、权限、校准与删除协议保持。\n\n## 暂定视觉决定\n采用暖纸像素作为首选候选；文本现代化；像素主要用于轮廓与图形，密集信息区降低装饰。先迁移五个主旅程面再铺全家族。五Tab路由保持；待任务/目标信息架构现场走查后可改标签，不能直接复制参考图四Tab。\n\n团队随后只需修改 `02_design/TOKENS.proposal.json` 的候选值/资产清单/主题配置，独立ADR记录；不要求重新做AI/数据卡。改导航层级则必须重跑深链、回归、键盘与可达性测试，不能当换色处理。\n\n## 最值得争取的三层优势\n| 层次 | 用户能感知的东西 | 技术积累 | 反证条件 |\n|---|---|---|---|\n| 识别与信任 | 克制的像素语言；纠正和回执清楚 | 统一语义状态与跨端反馈组件 | 看不懂状态、开启风格后完成时间变长 |\n| 合作质量 | 找到正确卡点；分工不偷走学习 | 受限语义选择、记忆效用门、可恢复episode | 无记忆对照更好、主动侵入、人类检验反而更差 |\n| 长程积累 | 未来少解释；能见真实成长 | 带版本的经验、关联结果、负迁移测试库 | 更多数据不改善、错误长期固化、删除不可追溯 |\n\n这是产品假设，不是专利新颖性判断。不能宣称“超过所有现有系统”。Habitica已将RPG与任务结合，Finch已有成长陪伴与习惯/反思体验；两者足以说明像素、养成、奖励不是独占空间（研究索引 R09/R10）。Sparkle要证明的是严肃学习目标下的校准与人机协作闭环。\n\n## 不采用的提案\n全站8bit字体；全屏低帧滚动；按推测情绪自动改主题；连续缺席让植物枯死；开启配乐作为默认惊艳；每次勾选掉金币；隐藏失败换取“丝滑”；用头像亲密度收费；无限存全部交互；让模型改系统提示词和权限；为了新颖另建AGE人物世界模型；用合成用户证明付费留存。\n\n## 商业验证口径\nV4 Agent阶段可验：核心价值路径、成本、可达性、解释一致性、真实数据和差异化对照。不可验：真人喜好、长期留存、真实支付意愿、扬声器/触觉舒适度。它们列在发布证据账本，不生成假阳性或自动出营销语。后续真人验证只需一条主假设：经过真实目标周期，用户是否因为更少重复解释且有更多实际成果而主动继续使用，而非因为签到损失。\n"}, {"id": "01_product/MODULE_MATRIX.md", "title": "43模块增量覆盖", "group": "01_product", "html": "<h1>43模块增量覆盖<\/h1>\n<p>基线B01目录集合 + WT790较新显式变更。状态只在当前仓库实证后更新；以下不是本轮运行验证。<\/p>\n<table>\n<thead>\n<tr>\n<th>模块<\/th>\n<th>最新资料状态<\/th>\n<th>V4处理<\/th>\n<th>任务<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>achievement<\/td>\n<td>CONTEXTUAL<\/td>\n<td>只为真实成果或已定义行为展示轻庆祝；缺席不惩罚；不改原奖励账本。<\/td>\n<td>V4-D04, V4-U12<\/td>\n<\/tr>\n<tr>\n<td>aurora<\/td>\n<td>CORE<\/td>\n<td>通过接续/校准/真实回执感知关系，不显示虚构理解百分比。<\/td>\n<td>V4-F03, V4-I01, V4-I03, V4-I04, V4-I05, V4-U02, V4-S01, V4-P01<\/td>\n<\/tr>\n<tr>\n<td>auth<\/td>\n<td>CORE<\/td>\n<td>原生输入、持久内联错误、正确登陆落点；像素框不吞点击。<\/td>\n<td>V4-U06, V4-U14<\/td>\n<\/tr>\n<tr>\n<td>calendar<\/td>\n<td>CONTEXTUAL<\/td>\n<td>正常日期/时区排版，像素选中框；拖动有等价操作。<\/td>\n<td>V4-U08<\/td>\n<\/tr>\n<tr>\n<td>chat<\/td>\n<td>CORE<\/td>\n<td>现代文字与代码，像素仅外围；来源/有用首内容/中断保留。<\/td>\n<td>V4-F04, V4-F06, V4-I06, V4-I09, V4-D01, V4-U07, V4-S02<\/td>\n<\/tr>\n<tr>\n<td>cognitive<\/td>\n<td>CORE<\/td>\n<td>五层证据语义不变，观察与人格推断分离；不输出无依据雷达图。<\/td>\n<td>V4-I02, V4-I05, V4-D03, V4-D05, V4-U03, V4-U13<\/td>\n<\/tr>\n<tr>\n<td>community<\/td>\n<td>CONTEXTUAL<\/td>\n<td>邀请小队/冲刺成果卡；隐私与撤回先于火堆装饰。<\/td>\n<td>V4-U11, V4-P02<\/td>\n<\/tr>\n<tr>\n<td>document<\/td>\n<td>CONTEXTUAL<\/td>\n<td>保留当前单文档承载路径，来源/解析状态/失败真实。<\/td>\n<td>V4-U10<\/td>\n<\/tr>\n<tr>\n<td>documents<\/td>\n<td>CONTEXTUAL<\/td>\n<td>材料列表家族；与document共享组件，不顺手合并数据库模型。<\/td>\n<td>V4-U10<\/td>\n<\/tr>\n<tr>\n<td>error_book<\/td>\n<td>CONTEXTUAL<\/td>\n<td>拍照或文本输入真实；示例/提示与独立检验答案隔离。<\/td>\n<td>V4-I07, V4-U10<\/td>\n<\/tr>\n<tr>\n<td>experience<\/td>\n<td>CONTEXTUAL<\/td>\n<td>干预呈现/响应/结果链路；用户可读关联而非因果夸大。<\/td>\n<td>V4-F03, V4-I05, V4-D01, V4-D02, V4-U13<\/td>\n<\/tr>\n<tr>\n<td>file<\/td>\n<td>CONTEXTUAL<\/td>\n<td>上传、权限、解析中、错误、已撤回语义统一。<\/td>\n<td>V4-U10, V4-P02<\/td>\n<\/tr>\n<tr>\n<td>focus<\/td>\n<td>CONTEXTUAL<\/td>\n<td>行动导向安静计时；音频显式开启；真实时长与成果分开。<\/td>\n<td>V4-U09, V4-S02<\/td>\n<\/tr>\n<tr>\n<td>galaxy<\/td>\n<td>CORE<\/td>\n<td>像素证据轨迹+可读列表；时间足迹不等于能力。<\/td>\n<td>V4-F04, V4-F06, V4-D03, V4-D04, V4-D06, V4-U05<\/td>\n<\/tr>\n<tr>\n<td>goal<\/td>\n<td>CORE<\/td>\n<td>目标结果标准与接续位置优先，不以巨大百分比代替信息。<\/td>\n<td>V4-I01, V4-U01, V4-U08<\/td>\n<\/tr>\n<tr>\n<td>home<\/td>\n<td>CORE<\/td>\n<td>一主行动+真实接续+可纠正的依据，不让品牌口号吃满首屏。<\/td>\n<td>V4-F04, V4-F05, V4-D01, V4-U01<\/td>\n<\/tr>\n<tr>\n<td>insights<\/td>\n<td>CORE<\/td>\n<td>事实来源/观察窗口/少样本明确；可选一个后续调整。<\/td>\n<td>V4-D02, V4-D05, V4-U13<\/td>\n<\/tr>\n<tr>\n<td>intent<\/td>\n<td>CONTEXTUAL<\/td>\n<td>复杂语义受限选择，用户不需要看内部成因编号。<\/td>\n<td>V4-I03, V4-I09, V4-U15<\/td>\n<\/tr>\n<tr>\n<td>knowledge<\/td>\n<td>CONTEXTUAL<\/td>\n<td>关系型真源优先；材料引用/AGE时效可检查。<\/td>\n<td>V4-I06, V4-D04, V4-D06, V4-U05, V4-U10<\/td>\n<\/tr>\n<tr>\n<td>leaderboard<\/td>\n<td>CONTEXTUAL<\/td>\n<td>覆盖较新self-anchor可达面；不复活全站综合榜。<\/td>\n<td>V4-U12<\/td>\n<\/tr>\n<tr>\n<td>memory<\/td>\n<td>CORE<\/td>\n<td>沿UserPersona等活入口，让用户看/改/限范围/忘记。<\/td>\n<td>V4-I02, V4-I06, V4-D03, V4-U03, V4-P02<\/td>\n<\/tr>\n<tr>\n<td>mirofish<\/td>\n<td>LABS<\/td>\n<td>维持LABS不默默上线；统一边界页并记录当前真实入口。<\/td>\n<td>V4-U15<\/td>\n<\/tr>\n<tr>\n<td>notification_center<\/td>\n<td>CONTEXTUAL<\/td>\n<td>跨渠道去重/静音/具体对象深链；已删除对象可解释。<\/td>\n<td>V4-U14, V4-P01<\/td>\n<\/tr>\n<tr>\n<td>openclaw<\/td>\n<td>CONTEXTUAL<\/td>\n<td>唯一运行工作台；Human/Agent/Hybrid共用Run ID。<\/td>\n<td>V4-I08, V4-U04<\/td>\n<\/tr>\n<tr>\n<td>photon<\/td>\n<td>CONTEXTUAL<\/td>\n<td>沿最新受限兑换出口；保留免费核心和反刷，不混付费身份。<\/td>\n<td>V4-U12<\/td>\n<\/tr>\n<tr>\n<td>plan<\/td>\n<td>CORE<\/td>\n<td>计划→动作→成果一条链；原子确认、估时和实耗区分。<\/td>\n<td>V4-U08<\/td>\n<\/tr>\n<tr>\n<td>reflection<\/td>\n<td>HIDDEN<\/td>\n<td>维持HIDDEN；复盘能力复用活跃报告而不恢复旧独立空页。<\/td>\n<td>V4-U15<\/td>\n<\/tr>\n<tr>\n<td>report<\/td>\n<td>CONTEXTUAL<\/td>\n<td>事实先结构化，再自然语言；每个数字可追溯。<\/td>\n<td>V4-D05, V4-U13<\/td>\n<\/tr>\n<tr>\n<td>reviews<\/td>\n<td>CONTEXTUAL<\/td>\n<td>复习/独立检验目标明确；样例答案不穿透到测试。<\/td>\n<td>V4-I07, V4-U10<\/td>\n<\/tr>\n<tr>\n<td>seed_library<\/td>\n<td>LABS<\/td>\n<td>LABS/明确示例；不可把seed画像合并真实用户历史。<\/td>\n<td>V4-U15<\/td>\n<\/tr>\n<tr>\n<td>settings<\/td>\n<td>CORE<\/td>\n<td>主题/动/声/震独立，导出删除与无障碍不收费。<\/td>\n<td>V4-F01, V4-F06, V4-I10, V4-U14, V4-S02, V4-S03<\/td>\n<\/tr>\n<tr>\n<td>shop<\/td>\n<td>HIDDEN<\/td>\n<td>维持HIDDEN；不为像素装扮重新开放未批准交易。<\/td>\n<td>V4-U12<\/td>\n<\/tr>\n<tr>\n<td>simulation<\/td>\n<td>LABS<\/td>\n<td>LABS只做明确模拟；不把仿真数据记真实成果。<\/td>\n<td>V4-U15<\/td>\n<\/tr>\n<tr>\n<td>splash<\/td>\n<td>CORE<\/td>\n<td>压缩首屏装饰，快速到真实价值入口。<\/td>\n<td>V4-U01, V4-U06<\/td>\n<\/tr>\n<tr>\n<td>task<\/td>\n<td>CORE<\/td>\n<td>执行动作与真实回执中心；可读差异与卡住入口。<\/td>\n<td>V4-F04, V4-U08<\/td>\n<\/tr>\n<tr>\n<td>theater<\/td>\n<td>LABS<\/td>\n<td>LABS边界保留；不新增剧情绕开用户目标。<\/td>\n<td>V4-U15<\/td>\n<\/tr>\n<tr>\n<td>tools<\/td>\n<td>CONTEXTUAL<\/td>\n<td>上下文工具面；能力可用性探测与权限，失败不假成功。<\/td>\n<td>V4-I10, V4-U10, V4-U15<\/td>\n<\/tr>\n<tr>\n<td>translation<\/td>\n<td>CONTEXTUAL<\/td>\n<td>嵌入当前材料，保留原文/译文来源，别造独立任务孤岛。<\/td>\n<td>V4-U07, V4-U10<\/td>\n<\/tr>\n<tr>\n<td>user<\/td>\n<td>CORE<\/td>\n<td>吸收onboarding现有承载；我的理解/自我锚/设置结构清楚。<\/td>\n<td>V4-F04, V4-U03, V4 发送内容就直接打开绑定目标的对话，不能落“我的”再让测试脚本补导航。<\/p>\n<p>首屏：品牌与当前日期一行；主卡“今天先做什么”；一行 Aurora 解释；次级工具藏在目标上下文。首次价值定义为一个可查看内容、完成标准、来源及执行人的有效行动被用户确认，而非看到动画、HTTP200或“你好”。确认后的 committed receipt 可见，重开仍在。<\/p>\n<p>异常：同意未勾→滚动到持久内联解释；慢注册→明确进行中禁止重复写；断网→草稿保留；模型失败→允许手工设行动；游客升级不得把示例画像写入真账号。V3 FIX539/540/543继承，V4只解决新的落点/回执/像素布局差量。<\/p>\n<h2>J4-02 回来继续 / 三十秒找回上下文<\/h2>\n<p>已有目标、两个成果、一个停在一半的行动。离开3天后再次进入。接续卡只陈述最后已确认事实：“你上次完成了二叉树的前序练习，还没检查中序。”主CTA“接着做”；次级“今天调整一下”。已过期DDL只提示调整，不误称仍有7天。无有效记录时坦诚新开始，不制造关系。<\/p>\n<p>验收：关闭进程/跨端重开，恢复同一goal/task/run位置，少于3次主要操作进入有效行动；不自动恢复音乐、不重播庆祝、不重复扣费；不凭“回归”增加主动消息。<\/p>\n<h2>J4-03 卡住但不猜人格<\/h2>\n<p>用户“总是做不下去，可能是太难，也可能是时间被切碎了”。合法候选保留两种解释；问“你现在更缺的是完整时间，还是这一步的做法？”也允许直接输入“都不是，其实材料不对”。若用户不答，给可撤回的低承诺建议或暂停，不锁住聊天。<\/p>\n<p>明确纠正“不是不会，今天只有15分钟”，只改变本次可用时长，不改长期能力。界面展示原动作与新动作差异、产物标准与谁做；一次确认真实落库。没有提出任何动作时，“补充我的情况”仍始终可达（FIX97）。<\/p>\n<h2>J4-04 校准与边界 / 第二次真的不同<\/h2>\n<p>在项目A选择“本项目实践先看示例”，保存并展示来源、scope与有效期。新会话相似任务利用该偏好，说明“采用了本项目的示例偏好”。项目B数学证明默认不使用。用户删除偏好后，打开的旧卡过期并重新计算；后台旧任务不能复活它。可点击“只这一次”，无需理解scope术语。<\/p>\n<p>成功不是出现“已记住”的聊天，而是前后决定的可观察差异，并且无错误跨域。保存回执与当前行动回执是两件事：存偏好不等于任务已改。<\/p>\n<h2>J4-05 人机接力 / 带我做<\/h2>\n<p>目标是掌握树遍历。Sparkle准备一个相近示例；用户自己给出当前题的序列并解释一处选择；Agent对答案做检查、给针对性提示；用户完成无答案可见的独立变体。模式切换明确“学习中/交付中”，不暗自替用户完成测验。Agent制作了材料不标记用户掌握。<\/p>\n<p>当前 HybridJourneySheet 孤儿入口（FIX535）应挂到已批准提案/运行面，不另造“第二AI中心”。用户离开后 Agent准备可继续；到了人类步骤等待，不伪造点击。失败、预算暂停与权限拒绝有正常路径。<\/p>\n<h2>J4-06 真实成长留痕 / 星图不是积分装饰<\/h2>\n<p>提交真实笔记/练习结果→outcome记录→合法投影→Galaxy增量节点→用户点击返回产物。参与痕迹与能力证据使用不同形状与文字：“练习过”“独立检验通过”；无数据不显示精通百分比。<\/p>\n<p>撤回错误评测证据时，对受影响节点从有效事件重算，不从当前分数简单减一项；保留独立的成果文件（除非用户也请求删除）。他人共享成果不影响自己的能力图。<\/p>\n<h2>J4-07 专注与轻陪伴<\/h2>\n<p>从当前行动进入专注，一屏只保留行动标准、计时与退出。背景静止，默认无配乐；用户明确点播合法声音后才播放。来电、耳机拔出、录音、TTS、切后台按音频策略处理；中断不重置专注记录，不把计划时长当真实时长。结束后只问一次“留下什么结果”，可跳过，用户不报告结果就记“专注记录”而非“掌握”。<\/p>\n<h2>J4-08 同行小队<\/h2>\n<p>进入自己参加的冲刺小队，仅共享确认过的目标/成果。火堆表达当日已发生协作，不随私人聊天推测心情。成员撤回分享，其他端、缓存与AI上下文同步撤销。排序遵守已有sprint账本规则；自我锚不偷换为全站竞争。无其他人时也能完成所有核心价值。<\/p>\n<h2>J4-09 深任务与延迟<\/h2>\n<p>用户请求“比较多份资料，帮我重排后两周计划”。先显示已收到请求+真实准备范围，不把ack算答案；返回可离开的run卡。快速可用的阶段产物（资料清单/待澄清约束）按真实状态发出，最终计划验证后再确认。慢一分钟不能只放循环像素小人。取消保留已有内容，未知提交结果先对账，不重做有副作用步骤。<\/p>\n<h2>J4-10 全感官关闭<\/h2>\n<p>系统或用户开启减少动态/静音/关闭触觉，以上全部旅程仍成立。所有动作结果有文本，所有图形可列表阅读，任何页面无需长按/拖动才能完成核心操作。新风格不允许倒退V3无障碍和离线恢复。<\/p>\n", "text": "# 核心旅程：用行为而不是功能清单定义完成\n\n## J4-01 新用户 / 第一份有效行动\n起点是全新真实用户，没有“连续7天”“理解75%”。启动页只给开始/明确标记的体验示例两种路径。用户输入近期目标，补至多一个阻塞性信息；不强制人格访谈。创建真实目标后落到该目标的“今天”，带入待发送内容就直接打开绑定目标的对话，不能落“我的”再让测试脚本补导航。\n\n首屏：品牌与当前日期一行；主卡“今天先做什么”；一行 Aurora 解释；次级工具藏在目标上下文。首次价值定义为一个可查看内容、完成标准、来源及执行人的有效行动被用户确认，而非看到动画、HTTP200或“你好”。确认后的 committed receipt 可见，重开仍在。\n\n异常：同意未勾→滚动到持久内联解释；慢注册→明确进行中禁止重复写；断网→草稿保留；模型失败→允许手工设行动；游客升级不得把示例画像写入真账号。V3 FIX539/540/543继承，V4只解决新的落点/回执/像素布局差量。\n\n## J4-02 回来继续 / 三十秒找回上下文\n已有目标、两个成果、一个停在一半的行动。离开3天后再次进入。接续卡只陈述最后已确认事实：“你上次完成了二叉树的前序练习，还没检查中序。”主CTA“接着做”；次级“今天调整一下”。已过期DDL只提示调整，不误称仍有7天。无有效记录时坦诚新开始，不制造关系。\n\n验收：关闭进程/跨端重开，恢复同一goal/task/run位置，少于3次主要操作进入有效行动；不自动恢复音乐、不重播庆祝、不重复扣费；不凭“回归”增加主动消息。\n\n## J4-03 卡住但不猜人格\n用户“总是做不下去，可能是太难，也可能是时间被切碎了”。合法候选保留两种解释；问“你现在更缺的是完整时间，还是这一步的做法？”也允许直接输入“都不是，其实材料不对”。若用户不答，给可撤回的低承诺建议或暂停，不锁住聊天。\n\n明确纠正“不是不会，今天只有15分钟”，只改变本次可用时长，不改长期能力。界面展示原动作与新动作差异、产物标准与谁做；一次确认真实落库。没有提出任何动作时，“补充我的情况”仍始终可达（FIX97）。\n\n## J4-04 校准与边界 / 第二次真的不同\n在项目A选择“本项目实践先看示例”，保存并展示来源、scope与有效期。新会话相似任务利用该偏好，说明“采用了本项目的示例偏好”。项目B数学证明默认不使用。用户删除偏好后，打开的旧卡过期并重新计算；后台旧任务不能复活它。可点击“只这一次”，无需理解scope术语。\n\n成功不是出现“已记住”的聊天，而是前后决定的可观察差异，并且无错误跨域。保存回执与当前行动回执是两件事：存偏好不等于任务已改。\n\n## J4-05 人机接力 / 带我做\n目标是掌握树遍历。Sparkle准备一个相近示例；用户自己给出当前题的序列并解释一处选择；Agent对答案做检查、给针对性提示；用户完成无答案可见的独立变体。模式切换明确“学习中/交付中”，不暗自替用户完成测验。Agent制作了材料不标记用户掌握。\n\n当前 HybridJourneySheet 孤儿入口（FIX535）应挂到已批准提案/运行面，不另造“第二AI中心”。用户离开后 Agent准备可继续；到了人类步骤等待，不伪造点击。失败、预算暂停与权限拒绝有正常路径。\n\n## J4-06 真实成长留痕 / 星图不是积分装饰\n提交真实笔记/练习结果→outcome记录→合法投影→Galaxy增量节点→用户点击返回产物。参与痕迹与能力证据使用不同形状与文字：“练习过”“独立检验通过”；无数据不显示精通百分比。\n\n撤回错误评测证据时，对受影响节点从有效事件重算，不从当前分数简单减一项；保留独立的成果文件（除非用户也请求删除）。他人共享成果不影响自己的能力图。\n\n## J4-07 专注与轻陪伴\n从当前行动进入专注，一屏只保留行动标准、计时与退出。背景静止，默认无配乐；用户明确点播合法声音后才播放。来电、耳机拔出、录音、TTS、切后台按音频策略处理；中断不重置专注记录，不把计划时长当真实时长。结束后只问一次“留下什么结果”，可跳过，用户不报告结果就记“专注记录”而非“掌握”。\n\n## J4-08 同行小队\n进入自己参加的冲刺小队，仅共享确认过的目标/成果。火堆表达当日已发生协作，不随私人聊天推测心情。成员撤回分享，其他端、缓存与AI上下文同步撤销。排序遵守已有sprint账本规则；自我锚不偷换为全站竞争。无其他人时也能完成所有核心价值。\n\n## J4-09 深任务与延迟\n用户请求“比较多份资料，帮我重排后两周计划”。先显示已收到请求+真实准备范围，不把ack算答案；返回可离开的run卡。快速可用的阶段产物（资料清单/待澄清约束）按真实状态发出，最终计划验证后再确认。慢一分钟不能只放循环像素小人。取消保留已有内容，未知提交结果先对账，不重做有副作用步骤。\n\n## J4-10 全感官关闭\n系统或用户开启减少动态/静音/关闭触觉，以上全部旅程仍成立。所有动作结果有文本，所有图形可列表阅读，任何页面无需长按/拖动才能完成核心操作。新风格不允许倒退V3无障碍和离线恢复。\n"}, {"id": "02_design/ACCESSIBILITY_ASSETS.md", "title": "无障碍、资产与风格改版的安全边界", "group": "02_design", "html": "<h1>无障碍、资产与风格改版的安全边界<\/h1>\n<p>以 WCAG2.2 可测条款和原生平台语义作为参考，不宣称仅跑脚本即可获得完整合规认证（R05）。正文contrast≥4.5:1，大字/非文字关键部件≥3:1；项目移动触达目标48dp是自定标准，不误称WCAGAA一律48dp。辅助模式以最终计算颜色而非设计稿推断。<\/p>\n<p>CustomPainter默认不替图形生成完整可读语义（R06）。PixelFrame装饰排除Semantics；星图的可选节点逐一标角色/名称/状态、连接有文本列表；本地输入/按钮用真实Flutter语义树，不用整屏一张bitmap冒充可访问UI。<\/p>\n<p>测试覆盖中文/英文、字体100/150/200%、横竖屏、360逻辑宽手机、800×600桌面、1280×720Web、深/浅/高对比/减少动态。浏览器200%缩放与文本缩放分开；焦点顺序和可见焦点不被pixel裁切。拖动有替代按钮；倒计时不每秒朗读；重要结果用合适live region，不刷屏。<\/p>\n<p>资产交付每项含asset_id、用途、尺寸/网格、作者、来源URL或“团队原创”、license_id、商业/再分发/修改许可、attribution、sha256、fallback、版本。原参考图只存设计参考目录，rights_unknown，不可剪出头像进App。禁止把商业BGM/第三方游戏sprite/未知字体带回已清理的仓库。<\/p>\n<p>建议资产最小集：品牌标记1、5导航图标、8状态图标、4成长节点、3空态插画、2环境背景、3提示音候选、1环境声候选。数量是初始预算；音轨在合法证据齐全前只做接口与静音fallback。无需为43模块各造一套吉祥物。<\/p>\n<p>关键语义是可以独立替换的：今天=继续当前目标，星图=证据关系，小队=同行协作。若团队不喜欢“工坊/芽/小路”，更换插画和措辞不改route/receipt/evidence。抽象层防止第二次改风格再重构全站。<\/p>\n", "text": "# 无障碍、资产与风格改版的安全边界\n\n以 WCAG2.2 可测条款和原生平台语义作为参考，不宣称仅跑脚本即可获得完整合规认证（R05）。正文contrast≥4.5:1，大字/非文字关键部件≥3:1；项目移动触达目标48dp是自定标准，不误称WCAGAA一律48dp。辅助模式以最终计算颜色而非设计稿推断。\n\nCustomPainter默认不替图形生成完整可读语义（R06）。PixelFrame装饰排除Semantics；星图的可选节点逐一标角色/名称/状态、连接有文本列表；本地输入/按钮用真实Flutter语义树，不用整屏一张bitmap冒充可访问UI。\n\n测试覆盖中文/英文、字体100/150/200%、横竖屏、360逻辑宽手机、800×600桌面、1280×720Web、深/浅/高对比/减少动态。浏览器200%缩放与文本缩放分开；焦点顺序和可见焦点不被pixel裁切。拖动有替代按钮；倒计时不每秒朗读；重要结果用合适live region，不刷屏。\n\n资产交付每项含asset_id、用途、尺寸/网格、作者、来源URL或“团队原创”、license_id、商业/再分发/修改许可、attribution、sha256、fallback、版本。原参考图只存设计参考目录，rights_unknown，不可剪出头像进App。禁止把商业BGM/第三方游戏sprite/未知字体带回已清理的仓库。\n\n建议资产最小集：品牌标记1、5导航图标、8状态图标、4成长节点、3空态插画、2环境背景、3提示音候选、1环境声候选。数量是初始预算；音轨在合法证据齐全前只做接口与静音fallback。无需为43模块各造一套吉祥物。\n\n关键语义是可以独立替换的：今天=继续当前目标，星图=证据关系，小队=同行协作。若团队不喜欢“工坊/芽/小路”，更换插画和措辞不改route/receipt/evidence。抽象层防止第二次改风格再重构全站。\n"}, {"id": "02_design/DESIGN_SYSTEM.md", "title": "统一像素设计系统", "group": "02_design", "html": "<h1>统一像素设计系统<\/h1>\n<h2>层级与技术落点<\/h2>\n<p>沿用 <code>mobile/lib/core/design/tokens_v2/ → theme/ → context.colors/typo/space/radius/motion<\/code>。先盘点现存语义，再增加极少数字段（pixelStep、cornerCut、accentInk、stateMotion）。不引入第三套品牌色/第二套字阶。包内JSON只是设计输入；产品编译期转换到既有令牌，随后由唯一源生成Web/原生示例。<\/p>\n<h2>视觉语法<\/h2>\n<p>主卡：一条深墨轮廓+1个4/8dp阶梯角；次卡：单线或轻底色；列表：用留白与分割，不每行镶框。单视口最多一个强主CTA。阴影只表层级，不对每张卡加高光；像素图形统一2dp概念网格，外观可在最终设备像素取整，不对文字画布整数缩放。<\/p>\n<p>DPR处理：stroke中心与填充边缘各自对齐物理像素；DPR=1/1.25/1.5/2/3覆盖。小sprite用nearest-neighbor、整数纹理倍数或离散尺寸资产；布局保持逻辑dp连续，不用Transform缩整个App来“对齐像素”。大面积叠透明噪声/BackdropFilter禁止成为默认。不能为了少量像素图形把Flutter全部变成CustomPainter。<\/p>\n<h2>字体与阅读<\/h2>\n<p>中文正文系统sans，16sp/1.6；标签14sp；最小辅助13sp，不塞10px英文装饰。长文可调整字号；代码等宽但不8bit；公式与屏幕阅读器描述保持。像素短标题为可替换品牌资产，不承担错误、帮助或长文本。包不分发字体。使用字体前记录许可证与中文覆盖范围，缺字回退不改变行高。<\/p>\n<h2>主题和状态<\/h2>\n<p>paper_day/dusk/quiet 是同一语义映射，不是不同产品。quiet 是显式选择或系统减少动态偏好的保守呈现，不由AI从“情绪低落”偷偷推断并改变主题。高对比/色觉辅助维持既有可访问配置并逐色测试。不要用红绿/亮暗单独表达未掌握与掌握。<\/p>\n<h2>核心组件合同<\/h2>\n<table>\n<thead>\n<tr>\n<th>组件<\/th>\n<th>内容/事件<\/th>\n<th>状态与边界<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>PixelFrame<\/td>\n<td>轮廓与surface<\/td>\n<td>仅装饰；Semantics由child提供；不能吞手势<\/td>\n<\/tr>\n<tr>\n<td>PrimaryAction<\/td>\n<td>文本+可选图标<\/td>\n<td>loading不改宽度；重复点击禁写；focus ring在切角外仍可见<\/td>\n<\/tr>\n<tr>\n<td>GoalAnchor<\/td>\n<td>目标、期限、有效期<\/td>\n<td>过期/暂停明确；不显示不存在的7天连续<\/td>\n<\/tr>\n<tr>\n<td>NextStepCard<\/td>\n<td>产物标准、执行人、估时<\/td>\n<td>单主CTA、卡住入口、编辑；少字段渐进展开<\/td>\n<\/tr>\n<tr>\n<td>AuroraReceipt<\/td>\n<td>为什么/用了哪条经验<\/td>\n<td>只对实际选用ref有说明；纠正/仅本次/删除始终可达<\/td>\n<\/tr>\n<tr>\n<td>ActionDiffSheet<\/td>\n<td>old→new/变化理由<\/td>\n<td>proposed/approved/applying/committed/unknown/conflict；不能合并<\/td>\n<\/tr>\n<tr>\n<td>RunCard<\/td>\n<td>plan、阶段、handoff<\/td>\n<td>离开后恢复；长任务不以假进度百分比填空<\/td>\n<\/tr>\n<tr>\n<td>EvidenceStamp<\/td>\n<td>outcome→来源与方法<\/td>\n<td>persisted≠validated≠mastery；可撤回和重算<\/td>\n<\/tr>\n<tr>\n<td>PathNode<\/td>\n<td>轨迹节点与详情<\/td>\n<td>有列表替代；不靠亮度表示能力<\/td>\n<\/tr>\n<tr>\n<td>MemoryItem<\/td>\n<td>事实/偏好/推断分层<\/td>\n<td>scope用人话；来源缺失不伪造；并发版本冲突可见<\/td>\n<\/tr>\n<tr>\n<td>FeedbackToast<\/td>\n<td>短反馈<\/td>\n<td>成功须真实回执；关键错误持久内联，不2秒消失<\/td>\n<\/tr>\n<tr>\n<td>QuietControls<\/td>\n<td>声/触/动独立偏好<\/td>\n<td>不可因页面初始化重开声音<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>布局<\/h2>\n<p>宽&lt;600：单列、16dp边距；600–1023：主要区+可收起上下文；≥1024：导航侧栏+中列动作/对话+右侧来源，正文max宽约720dp。真实断点需与既有Shell兼容，保持route ID。文本200%时允许更少列、更高卡片，不截断主按钮标签。键盘弹出后输入栏和错误仍可见，bottomSafeArea单一消费。<\/p>\n<h2>迁移办法<\/h2>\n<p>先适配组件故事页和主旅程，保留旧主题fallback；每个页面家族逐个替换并截图对照；最后收旧样式桥。迁移令牌只触design目录，不混业务逻辑。优先删除重复装饰与重复组件，不机械把2万次DS调用改名。全端行为测试复用，golden差异须独立解释每类变化。<\/p>\n<h2>验收<\/h2>\n<p>实现按R01/R05/R06等来源原则及项目阈值，见METRICS。相同状态在任意页面有相同语义；错误、撤回和未知不能用庆祝视觉。滚动/点击/正文60Hz目标不受像素动画12fps限制；frame统计在profile/release测，不在debug截图里估帧率。<\/p>\n", "text": "# 统一像素设计系统\n\n## 层级与技术落点\n沿用 `mobile/lib/core/design/tokens_v2/ → theme/ → context.colors/typo/space/radius/motion`。先盘点现存语义，再增加极少数字段（pixelStep、cornerCut、accentInk、stateMotion）。不引入第三套品牌色/第二套字阶。包内JSON只是设计输入；产品编译期转换到既有令牌，随后由唯一源生成Web/原生示例。\n\n## 视觉语法\n主卡：一条深墨轮廓+1个4/8dp阶梯角；次卡：单线或轻底色；列表：用留白与分割，不每行镶框。单视口最多一个强主CTA。阴影只表层级，不对每张卡加高光；像素图形统一2dp概念网格，外观可在最终设备像素取整，不对文字画布整数缩放。\n\nDPR处理：stroke中心与填充边缘各自对齐物理像素；DPR=1/1.25/1.5/2/3覆盖。小sprite用nearest-neighbor、整数纹理倍数或离散尺寸资产；布局保持逻辑dp连续，不用Transform缩整个App来“对齐像素”。大面积叠透明噪声/BackdropFilter禁止成为默认。不能为了少量像素图形把Flutter全部变成CustomPainter。\n\n## 字体与阅读\n中文正文系统sans，16sp/1.6；标签14sp；最小辅助13sp，不塞10px英文装饰。长文可调整字号；代码等宽但不8bit；公式与屏幕阅读器描述保持。像素短标题为可替换品牌资产，不承担错误、帮助或长文本。包不分发字体。使用字体前记录许可证与中文覆盖范围，缺字回退不改变行高。\n\n## 主题和状态\npaper_day/dusk/quiet 是同一语义映射，不是不同产品。quiet 是显式选择或系统减少动态偏好的保守呈现，不由AI从“情绪低落”偷偷推断并改变主题。高对比/色觉辅助维持既有可访问配置并逐色测试。不要用红绿/亮暗单独表达未掌握与掌握。\n\n## 核心组件合同\n| 组件 | 内容/事件 | 状态与边界 |\n|---|---|---|\n| PixelFrame | 轮廓与surface | 仅装饰；Semantics由child提供；不能吞手势 |\n| PrimaryAction | 文本+可选图标 | loading不改宽度；重复点击禁写；focus ring在切角外仍可见 |\n| GoalAnchor | 目标、期限、有效期 | 过期/暂停明确；不显示不存在的7天连续 |\n| NextStepCard | 产物标准、执行人、估时 | 单主CTA、卡住入口、编辑；少字段渐进展开 |\n| AuroraReceipt | 为什么/用了哪条经验 | 只对实际选用ref有说明；纠正/仅本次/删除始终可达 |\n| ActionDiffSheet | old→new/变化理由 | proposed/approved/applying/committed/unknown/conflict；不能合并 |\n| RunCard | plan、阶段、handoff | 离开后恢复；长任务不以假进度百分比填空 |\n| EvidenceStamp | outcome→来源与方法 | persisted≠validated≠mastery；可撤回和重算 |\n| PathNode | 轨迹节点与详情 | 有列表替代；不靠亮度表示能力 |\n| MemoryItem | 事实/偏好/推断分层 | scope用人话；来源缺失不伪造；并发版本冲突可见 |\n| FeedbackToast | 短反馈 | 成功须真实回执；关键错误持久内联，不2秒消失 |\n| QuietControls | 声/触/动独立偏好 | 不可因页面初始化重开声音 |\n\n## 布局\n宽<600：单列、16dp边距；600–1023：主要区+可收起上下文；≥1024：导航侧栏+中列动作/对话+右侧来源，正文max宽约720dp。真实断点需与既有Shell兼容，保持route ID。文本200%时允许更少列、更高卡片，不截断主按钮标签。键盘弹出后输入栏和错误仍可见，bottomSafeArea单一消费。\n\n## 迁移办法\n先适配组件故事页和主旅程，保留旧主题fallback；每个页面家族逐个替换并截图对照；最后收旧样式桥。迁移令牌只触design目录，不混业务逻辑。优先删除重复装饰与重复组件，不机械把2万次DS调用改名。全端行为测试复用，golden差异须独立解释每类变化。\n\n## 验收\n实现按R01/R05/R06等来源原则及项目阈值，见METRICS。相同状态在任意页面有相同语义；错误、撤回和未知不能用庆祝视觉。滚动/点击/正文60Hz目标不受像素动画12fps限制；frame统计在profile/release测，不在debug截图里估帧率。\n"}, {"id": "02_design/MOTION_AUDIO_HAPTICS.md", "title": "动效、声音、触觉：同一状态的三种表达", "group": "02_design", "html": "<h1>动效、声音、触觉：同一状态的三种表达<\/h1>\n<h2>核心合同<\/h2>\n<p>模型、业务代码和单独页面不得各自直接触发奖励。统一适配器消费已验证 <code>ExperienceEvent<\/code>，再按当前用户偏好、平台能力、应用可见性和证据新鲜度选visual/audio/haptic。该事件是呈现投影，不新增第二个业务事实源；缺回执时不发成功事件。<\/p>\n<p>字段建议：event_id、kind、actor、object_ref、object_version、receipt_id?、occurred_at、is_replay、origin（live/demo）、importance、visible_surface。通过服务端对应对象读取确认引用与权限；客户端不能自称server_committed。去重键至少user/session/event，恢复重放不重复音/震/庆祝；文本状态仍恢复。<\/p>\n<h2>事件乐谱（候选值）<\/h2>\n<table>\n<thead>\n<tr>\n<th>事件<\/th>\n<th>动效<\/th>\n<th>声音<\/th>\n<th>触觉<\/th>\n<th>触发条件<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>按压/选择<\/td>\n<td>80ms轻压1–2dp，焦点不移动<\/td>\n<td>默认无<\/td>\n<td>明确离散选择可系统selection；普通滚动无<\/td>\n<td>用户真实操作；native已有触觉则不叠加<\/td>\n<\/tr>\n<tr>\n<td>提案出现<\/td>\n<td>160–220ms从纸面抬起<\/td>\n<td>无<\/td>\n<td>无<\/td>\n<td>本轮有效proposed，不表示完成<\/td>\n<\/tr>\n<tr>\n<td>写入提交成功<\/td>\n<td>标题/状态160ms替换<\/td>\n<td>用户开启后短柔和双音，≤300ms<\/td>\n<td>系统success一次<\/td>\n<td>有对应committed回执且非重放<\/td>\n<\/tr>\n<tr>\n<td>仅记忆已保存<\/td>\n<td>来源badge短高亮<\/td>\n<td>默认无<\/td>\n<td>轻selection可选<\/td>\n<td>epoch/version已确认；不用任务成功音<\/td>\n<\/tr>\n<tr>\n<td>证据已登记<\/td>\n<td>小印章160ms<\/td>\n<td>可选短单音<\/td>\n<td>可选轻impact<\/td>\n<td>outcome持久化；文字不说已掌握<\/td>\n<\/tr>\n<tr>\n<td>独立检验通过<\/td>\n<td>星点连线≤650ms，可跳过<\/td>\n<td>可选里程碑短音≤600ms<\/td>\n<td>success一次<\/td>\n<td>通过真实有效独立评测；不等同一次点击<\/td>\n<\/tr>\n<tr>\n<td>冲突/未知/失败<\/td>\n<td>持久信息行，无抖屏<\/td>\n<td>默认无<\/td>\n<td>明确操作失败可systemwarning一次<\/td>\n<td>无颜色/声音独占信息<\/td>\n<\/tr>\n<tr>\n<td>深任务进行中<\/td>\n<td>静态阶段文字；可选局部慢呼吸<\/td>\n<td>无<\/td>\n<td>无<\/td>\n<td>来自真实run阶段；不伪进度<\/td>\n<\/tr>\n<tr>\n<td>长期回归<\/td>\n<td>低幅进入或静态<\/td>\n<td>不自动播放<\/td>\n<td>无<\/td>\n<td>用户进入，不是营销推送<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>动效预算<\/h2>\n<p>滚动、输入、手势以平台流畅性为先。像素sprite可12fps局部播放，不把整个界面锁12fps。首页最多1个短事件动画、0个默认无限粒子；聊天打字不是音效节拍器。reduceMotion时替换为静态层级/文字，不全局把所有AnimatedSize duration设置0导致已有崩溃；为各组件显式静态分支。<\/p>\n<h2>声音设计<\/h2>\n<p>不是全程8bit游戏BGM。可选环境床为无歌词、低变化、长循环；提示音与背景分音量。默认环境声与提示音关闭，用户点播后尊重当前会话偏好；重开App不自行续播。两种候选音色：柔和木质pluck与温和sine，不模仿受版权保护的游戏旋律。普通任务完成不“赢关”。音频资产需原作者/授权、来源、是否可商用/修改/分发、归属与哈希；未证实许可就不打包上线。<\/p>\n<p>音频焦点状态：IDLE→USER_PLAYING→DUCKED_BY_TTS / PAUSED_BY_RECORDING / PAUSED_BY_CALL / STOPPED_BY_USER。耳机拔出不转扬声器大声续播；录音、TTS和背景床不得彼此回录；系统拒绝播放时降级静音并保持任务正常。缓存音频有上限；不按每个像素点击调用云TTS。<\/p>\n<h2>触觉<\/h2>\n<p>使用系统语义/能力探测；不支持则不震，不能拿蜂鸣替代。Apple/Android官方都强调语义一致、短促与克制，见R07/R08。拒绝“每步都震”。应用级偏好独立，尊重系统策略。模拟器可测调用/去重/静音，不能证明硬件触感舒适；真实设备证据记DEVICE_UNVERIFIED直到实测，不阻止其他Agent推进。<\/p>\n<h2>同步与安全<\/h2>\n<p>提交按钮的按压反馈立即，成功反馈在回执后；两者不可合并。音/触/visual之间目标起点差≤80ms是设计目标，真设备测。单次失败只提示一次，不连锁蜂鸣。foreground→background立即停止装饰，重要run继续由服务器管理。任何声音或动态关闭都不能减少可理解信息。<\/p>\n", "text": "# 动效、声音、触觉：同一状态的三种表达\n\n## 核心合同\n模型、业务代码和单独页面不得各自直接触发奖励。统一适配器消费已验证 `ExperienceEvent`，再按当前用户偏好、平台能力、应用可见性和证据新鲜度选visual/audio/haptic。该事件是呈现投影，不新增第二个业务事实源；缺回执时不发成功事件。\n\n字段建议：event_id、kind、actor、object_ref、object_version、receipt_id?、occurred_at、is_replay、origin（live/demo）、importance、visible_surface。通过服务端对应对象读取确认引用与权限；客户端不能自称server_committed。去重键至少user/session/event，恢复重放不重复音/震/庆祝；文本状态仍恢复。\n\n## 事件乐谱（候选值）\n| 事件 | 动效 | 声音 | 触觉 | 触发条件 |\n|---|---|---|---|---|\n| 按压/选择 | 80ms轻压1–2dp，焦点不移动 | 默认无 | 明确离散选择可系统selection；普通滚动无 | 用户真实操作；native已有触觉则不叠加 |\n| 提案出现 | 160–220ms从纸面抬起 | 无 | 无 | 本轮有效proposed，不表示完成 |\n| 写入提交成功 | 标题/状态160ms替换 | 用户开启后短柔和双音，≤300ms | 系统success一次 | 有对应committed回执且非重放 |\n| 仅记忆已保存 | 来源badge短高亮 | 默认无 | 轻selection可选 | epoch/version已确认；不用任务成功音 |\n| 证据已登记 | 小印章160ms | 可选短单音 | 可选轻impact | outcome持久化；文字不说已掌握 |\n| 独立检验通过 | 星点连线≤650ms，可跳过 | 可选里程碑短音≤600ms | success一次 | 通过真实有效独立评测；不等同一次点击 |\n| 冲突/未知/失败 | 持久信息行，无抖屏 | 默认无 | 明确操作失败可systemwarning一次 | 无颜色/声音独占信息 |\n| 深任务进行中 | 静态阶段文字；可选局部慢呼吸 | 无 | 无 | 来自真实run阶段；不伪进度 |\n| 长期回归 | 低幅进入或静态 | 不自动播放 | 无 | 用户进入，不是营销推送 |\n\n## 动效预算\n滚动、输入、手势以平台流畅性为先。像素sprite可12fps局部播放，不把整个界面锁12fps。首页最多1个短事件动画、0个默认无限粒子；聊天打字不是音效节拍器。reduceMotion时替换为静态层级/文字，不全局把所有AnimatedSize duration设置0导致已有崩溃；为各组件显式静态分支。\n\n## 声音设计\n不是全程8bit游戏BGM。可选环境床为无歌词、低变化、长循环；提示音与背景分音量。默认环境声与提示音关闭，用户点播后尊重当前会话偏好；重开App不自行续播。两种候选音色：柔和木质pluck与温和sine，不模仿受版权保护的游戏旋律。普通任务完成不“赢关”。音频资产需原作者/授权、来源、是否可商用/修改/分发、归属与哈希；未证实许可就不打包上线。\n\n音频焦点状态：IDLE→USER_PLAYING→DUCKED_BY_TTS / PAUSED_BY_RECORDING / PAUSED_BY_CALL / STOPPED_BY_USER。耳机拔出不转扬声器大声续播；录音、TTS和背景床不得彼此回录；系统拒绝播放时降级静音并保持任务正常。缓存音频有上限；不按每个像素点击调用云TTS。\n\n## 触觉\n使用系统语义/能力探测；不支持则不震，不能拿蜂鸣替代。Apple/Android官方都强调语义一致、短促与克制，见R07/R08。拒绝“每步都震”。应用级偏好独立，尊重系统策略。模拟器可测调用/去重/静音，不能证明硬件触感舒适；真实设备证据记DEVICE_UNVERIFIED直到实测，不阻止其他Agent推进。\n\n## 同步与安全\n提交按钮的按压反馈立即，成功反馈在回执后；两者不可合并。音/触/visual之间目标起点差≤80ms是设计目标，真设备测。单次失败只提示一次，不连锁蜂鸣。foreground→background立即停止装饰，重要run继续由服务器管理。任何声音或动态关闭都不能减少可理解信息。\n"}, {"id": "02_design/REFERENCE_CRITIQUE.md", "title": "参考图逐层审查：保留气质，不复制布局", "group": "02_design", "html": "<h1>参考图逐层审查：保留气质，不复制布局<\/h1>\n<p>输入是用户提供的 <code>前端参考图.jpg<\/code>，属于方向示意，不是当前Sparkle实际页面或已授权上线资产。本文是视觉观察与设计判断，不声称做过眼动/真人测试。<\/p>\n<h2>应当保留<\/h2>\n<p>暖纸底色与低饱和像素自然物带来区别于玻璃渐变AI面板的识别度；阶梯角、细墨边、有限像素阴影可以形成组件语法；嫩芽、路径与远景能表达成长但无需每页讲新故事。正文采用可读中文字而非全像素字，这一点比“越复古越好”更重要。<\/p>\n<h2>必须修改<\/h2>\n<table>\n<thead>\n<tr>\n<th>图中具体位置<\/th>\n<th>观察<\/th>\n<th>V4处理<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>顶部头像/Explorer/英文手写口号/中文口号<\/td>\n<td>装饰与自我介绍占首屏大量空间；真正行动晚出现<\/td>\n<td>顶部压成品牌/日期/状态一行，主行动进入首个视口；口号仅空态或欢迎页<\/td>\n<\/tr>\n<tr>\n<td>今日成长3/4勾选<\/td>\n<td>任务完成数与成长混为一层<\/td>\n<td>改为“今日行动3/4”，能力只由独立证据说明；未完成不变成失败人格<\/td>\n<\/tr>\n<tr>\n<td>紫蓝渐变CTA<\/td>\n<td>与低饱和纸感体系不一致，按钮比内容更像营销Banner<\/td>\n<td>主CTA统一深苔绿/深墨，像素压印仅表示按压；渐变只给非关键装饰实验档<\/td>\n<\/tr>\n<tr>\n<td>所有块都双边框/重圆角切阶<\/td>\n<td>无主次，内容区边缘多次重复<\/td>\n<td>一级主卡可双线，二级平面分隔，密集列表无装饰边；边框种类≤3<\/td>\n<\/tr>\n<tr>\n<td>小号英文字母与底部口号<\/td>\n<td>低优先信息仍占纵向空间，窄屏容易难读<\/td>\n<td>非必要双语删掉；核心中文14–16sp以上；辅助英文不承担唯一意义<\/td>\n<\/tr>\n<tr>\n<td>探索/成长同款罗盘<\/td>\n<td>语义难区分<\/td>\n<td>维持现有五Tab语义，任务/对话/星图用独立形状和文本标签<\/td>\n<\/tr>\n<tr>\n<td>底部长景与大导航框<\/td>\n<td>小屏与键盘打开时挤占有效空间<\/td>\n<td>Landscape仅视口有余量时出现、无交互、可关闭；导航原生SafeArea，不进截图背景画布<\/td>\n<\/tr>\n<tr>\n<td>图中路线图START/BETTER YOU<\/td>\n<td>漂亮但不知道点是否有事实<\/td>\n<td>每点必须可读具体成果；无成果显示空路线或引导，不伪造进步<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>风格冻结与探索边界<\/h2>\n<p>字体、色值、枝叶/星星形象、角切步长、音色暂定。状态语义、点击区域、文本层级、单一主动作、权限和回执不可为风格让路。原图中的可爱不是“强制每次鼓励”，像素不是“故意卡顿”。<\/p>\n<h2>同一设计如何覆盖不同密度<\/h2>\n<p>欢迎/空态：插画可以占20–30%可用区；主任务面≤15%；长文/代码/数据≤5%。这是设计预算，须实际截图调整。聊天回复不套巨大像素气泡嵌套四层；来源和操作只在相关段落出现。多人群聊先可读，再装饰。<\/p>\n<p>本包 <code>prototype/DESIGN_LAB.html<\/code> 只验证这种克制方向的布局与交互，不能据此说“像素风已全端实施”。<\/p>\n", "text": "# 参考图逐层审查：保留气质，不复制布局\n\n输入是用户提供的 `前端参考图.jpg`，属于方向示意，不是当前Sparkle实际页面或已授权上线资产。本文是视觉观察与设计判断，不声称做过眼动/真人测试。\n\n## 应当保留\n暖纸底色与低饱和像素自然物带来区别于玻璃渐变AI面板的识别度；阶梯角、细墨边、有限像素阴影可以形成组件语法；嫩芽、路径与远景能表达成长但无需每页讲新故事。正文采用可读中文字而非全像素字，这一点比“越复古越好”更重要。\n\n## 必须修改\n| 图中具体位置 | 观察 | V4处理 |\n|---|---|---|\n| 顶部头像/Explorer/英文手写口号/中文口号 | 装饰与自我介绍占首屏大量空间；真正行动晚出现 | 顶部压成品牌/日期/状态一行，主行动进入首个视口；口号仅空态或欢迎页 |\n| 今日成长3/4勾选 | 任务完成数与成长混为一层 | 改为“今日行动3/4”，能力只由独立证据说明；未完成不变成失败人格 |\n| 紫蓝渐变CTA | 与低饱和纸感体系不一致，按钮比内容更像营销Banner | 主CTA统一深苔绿/深墨，像素压印仅表示按压；渐变只给非关键装饰实验档 |\n| 所有块都双边框/重圆角切阶 | 无主次，内容区边缘多次重复 | 一级主卡可双线，二级平面分隔，密集列表无装饰边；边框种类≤3 |\n| 小号英文字母与底部口号 | 低优先信息仍占纵向空间，窄屏容易难读 | 非必要双语删掉；核心中文14–16sp以上；辅助英文不承担唯一意义 |\n| 探索/成长同款罗盘 | 语义难区分 | 维持现有五Tab语义，任务/对话/星图用独立形状和文本标签 |\n| 底部长景与大导航框 | 小屏与键盘打开时挤占有效空间 | Landscape仅视口有余量时出现、无交互、可关闭；导航原生SafeArea，不进截图背景画布 |\n| 图中路线图START/BETTER YOU | 漂亮但不知道点是否有事实 | 每点必须可读具体成果；无成果显示空路线或引导，不伪造进步 |\n\n## 风格冻结与探索边界\n字体、色值、枝叶/星星形象、角切步长、音色暂定。状态语义、点击区域、文本层级、单一主动作、权限和回执不可为风格让路。原图中的可爱不是“强制每次鼓励”，像素不是“故意卡顿”。\n\n## 同一设计如何覆盖不同密度\n欢迎/空态：插画可以占20–30%可用区；主任务面≤15%；长文/代码/数据≤5%。这是设计预算，须实际截图调整。聊天回复不套巨大像素气泡嵌套四层；来源和操作只在相关段落出现。多人群聊先可读，再装饰。\n\n本包 `prototype/DESIGN_LAB.html` 只验证这种克制方向的布局与交互，不能据此说“像素风已全端实施”。\n"}, {"id": "02_design/SCREEN_FAMILIES.md", "title": "页面家族：风格必须贯穿，而不是每页一套", "group": "02_design", "html": "<h1>页面家族：风格必须贯穿，而不是每页一套<\/h1>\n<h2>首页 / 目标 / 任务 / 日历<\/h2>\n<p>首页按“当前目标→下一步→可选上下文”排序，不复刻参考图高头部。目标页顶部是结果标准和接续，不是大百分比。任务页以执行区为中心，完成按钮要求明确提交/自报语义。日历保留小时/日期普通排版，像素仅选中框与微图标；拖动有键盘/按钮替代。新建表单先目标与成果再可选字段，不为游戏化加角色、能量、职业问卷。<\/p>\n<h2>对话 / 卡住 / Hybrid / 运行台<\/h2>\n<p>对话平直纸面，不把每条长回答装双重边框。正文按段流式，增量不抢滚动；用户上滑后保持位置。工具阶段收在状态行，不能展示隐藏推理链当解释。卡住sheet先输入原因，再一个决策问题和提案；取消即回到原任务。Hybrid卡固定“Sparkle准备→你来做→共同检查”，每步的责任人和证据一目了然。运行台沿用OpenClaw路径与Run ID，不创建像素版独立Agent中心。<\/p>\n<h2>记忆 / Aurora / 我的理解<\/h2>\n<p>“我了解到的”按项目范围分组；事实、已确认偏好、待确认观察分开，不输出人格雷达图。每项有“来自…/仅用于…/更改/忘记”；复杂版本和epoch留开发诊断。纠正成功只代表该状态保存；本轮计划需另确认。记忆清空有明确说明和可查询进度，不被3次/天解释预算限制。<\/p>\n<h2>星图 / 学习 / 错题 / 资料<\/h2>\n<p>星图是一张可探索的证据路径，地图可像素化，标签与图表保持清楚。有线性列表模式、缩放+/-、键盘导航。材料、错题与词汇沿目标打开，主操作是继续当前动作；不回到空白搜索页丢上下文。来源badge能跳原文片段。OCR不支持时提供手输入；不假装图片已识别。题目示例与独立测验答案隔离；测试命题不能把答案塞进可被用户读出的UI状态。<\/p>\n<h2>洞察 / 复盘 / 报告<\/h2>\n<p>先一句可核验观察，再≤3条带来源记录，再一个可以采用的调整。“有3次相关记录；2次采用示例后开始了练习”是关联，不写“示例法使你提升67%”。没有数据就说明尚未形成结论。像素印章标记类型，不给AI推断盖“认证”章。统计图颜色语义和日期/单位一致，不能用pixel阶梯线捏造台阶趋势。<\/p>\n<h2>小队 / 自我锚 / 光子 / 成就<\/h2>\n<p>沿用D-COMM最新决定。邀请制学习小队先行动和共享成果，再火堆装饰；self-anchor是与过去自己比较，不是全站排行；光子兑换表达受限奖励不暗示付费身份由游戏等级决定。所有展示用真实账本，用户可关闭庆祝。小队头像/成就资产同一像素网格，不照搬第三方游戏素材。Shop等HIDDEN不为展示新皮肤擅自开启。<\/p>\n<h2>账号 / 设置 / 通知 / 异常 / 长尾<\/h2>\n<p>账号功能以原生输入和错误信息优先，品牌框不能遮键盘和勾选。设置提供动效、配乐、提示音、触觉分别开关，默认不自动播放。通知深链落在具体对象，对象已删或权限失效有可理解的替代页。404/离线/登录失效与模型失败不同，不全部跳“AI出错”。所有长尾模块按MODULE_MATRIX绑定一个页面家族，LABS/HIDDEN不改状态只是记录fallback。<\/p>\n<h2>每家族统一检查表<\/h2>\n<p>默认/空/加载/部分内容/模型失败/离线/恢复/取消/未知写入/过期版本/权限失效/200%字体/键盘遮挡/深链返回/减少动态。列表、表单、sheet与dialog均要截最上层实际画面，不能只取栈底RepaintBoundary复用“漂亮截图”。<\/p>\n", "text": "# 页面家族：风格必须贯穿，而不是每页一套\n\n## 首页 / 目标 / 任务 / 日历\n首页按“当前目标→下一步→可选上下文”排序，不复刻参考图高头部。目标页顶部是结果标准和接续，不是大百分比。任务页以执行区为中心，完成按钮要求明确提交/自报语义。日历保留小时/日期普通排版，像素仅选中框与微图标；拖动有键盘/按钮替代。新建表单先目标与成果再可选字段，不为游戏化加角色、能量、职业问卷。\n\n## 对话 / 卡住 / Hybrid / 运行台\n对话平直纸面，不把每条长回答装双重边框。正文按段流式，增量不抢滚动；用户上滑后保持位置。工具阶段收在状态行，不能展示隐藏推理链当解释。卡住sheet先输入原因，再一个决策问题和提案；取消即回到原任务。Hybrid卡固定“Sparkle准备→你来做→共同检查”，每步的责任人和证据一目了然。运行台沿用OpenClaw路径与Run ID，不创建像素版独立Agent中心。\n\n## 记忆 / Aurora / 我的理解\n“我了解到的”按项目范围分组；事实、已确认偏好、待确认观察分开，不输出人格雷达图。每项有“来自…/仅用于…/更改/忘记”；复杂版本和epoch留开发诊断。纠正成功只代表该状态保存；本轮计划需另确认。记忆清空有明确说明和可查询进度，不被3次/天解释预算限制。\n\n## 星图 / 学习 / 错题 / 资料\n星图是一张可探索的证据路径，地图可像素化，标签与图表保持清楚。有线性列表模式、缩放+/-、键盘导航。材料、错题与词汇沿目标打开，主操作是继续当前动作；不回到空白搜索页丢上下文。来源badge能跳原文片段。OCR不支持时提供手输入；不假装图片已识别。题目示例与独立测验答案隔离；测试命题不能把答案塞进可被用户读出的UI状态。\n\n## 洞察 / 复盘 / 报告\n先一句可核验观察，再≤3条带来源记录，再一个可以采用的调整。“有3次相关记录；2次采用示例后开始了练习”是关联，不写“示例法使你提升67%”。没有数据就说明尚未形成结论。像素印章标记类型，不给AI推断盖“认证”章。统计图颜色语义和日期/单位一致，不能用pixel阶梯线捏造台阶趋势。\n\n## 小队 / 自我锚 / 光子 / 成就\n沿用D-COMM最新决定。邀请制学习小队先行动和共享成果，再火堆装饰；self-anchor是与过去自己比较，不是全站排行；光子兑换表达受限奖励不暗示付费身份由游戏等级决定。所有展示用真实账本，用户可关闭庆祝。小队头像/成就资产同一像素网格，不照搬第三方游戏素材。Shop等HIDDEN不为展示新皮肤擅自开启。\n\n## 账号 / 设置 / 通知 / 异常 / 长尾\n账号功能以原生输入和错误信息优先，品牌框不能遮键盘和勾选。设置提供动效、配乐、提示音、触觉分别开关，默认不自动播放。通知深链落在具体对象，对象已删或权限失效有可理解的替代页。404/离线/登录失效与模型失败不同，不全部跳“AI出错”。所有长尾模块按MODULE_MATRIX绑定一个页面家族，LABS/HIDDEN不改状态只是记录fallback。\n\n## 每家族统一检查表\n默认/空/加载/部分内容/模型失败/离线/恢复/取消/未知写入/过期版本/权限失效/200%字体/键盘遮挡/深链返回/减少动态。列表、表单、sheet与dialog均要截最上层实际画面，不能只取栈底RepaintBoundary复用“漂亮截图”。\n"}, {"id": "03_intelligence/ARCHITECTURE_DELTA.md", "title": "AI 架构增量：在已有权威上增加一条可证明的闭环", "group": "03_intelligence", "html": "<h1>AI 架构增量：在已有权威上增加一条可证明的闭环<\/h1>\n<h2>已有结构不动<\/h2>\n<p>Flutter → Go Gateway（身份/WS/限流/桥）→ Python Engine（业务与推理）→ PostgreSQL/Redis/Celery。主聊天仍为自研StateGraph，LangGraph仅已有规划用途；不迁框架。权限上下文由网关可信传入，引擎对具体对象/调用能力仍必须做授权边界校验，不能把“网关认证”误当“任何对象都可访问”。<\/p>\n<p>Aurora、memory_preferences、episodic_memories、working_memory、user_preferences、TaskService、sprint_task_ledger、goal_today_view、outcome、runtime和现有A05 policy patch均继续主权。名称是资料定位种子，V4开工由当前代码映射确认；本包不声称新增类已存在。<\/p>\n<h2>新增逻辑责任，不默认新增服务<\/h2>\n<pre><code>当前目标/动作/资料/约束\n     + 合法历史候选 (原Context Compiler)\n     ↓\n可用性过滤 + 记忆效用门  [增量 I02]\n     ↓\n规则快路 / 受限语义选择 / 一次决策性澄清 [增量 I03-I04]\n     ↓\n既有 AuroraDecision / A05 六字段策略 / Human-Agent-Hybrid\n     ↓\n既有 Proposal → Confirm → Command → Receipt\n     ↓\n呈现投影 ExperienceEvent → 文本/像素/声/触 [增量 F03/S01]\n     ↓\n既有生命周期 + rendered曝光 + outcome/censor/retract [增量 D01-D03]\n     ↓\n合规经验候选 → 影子验证/回退 [增量 I05]\n<\/code><\/pre>\n<h2>新契约最小面<\/h2>\n<ol>\n<li>ContextSelectionReceipt：输入各权威版本、候选/选用ref、拒用原因、预算、作用于何处、选择器版本。正文仅显示用过的合法依据；debug侧可看摘要但不泄露被拒内容。<\/li>\n<li>EpisodeResumeView：existing goal/task/run/last_valid_outcome引用，last_confirmed_step、pending_human_step、expires_at；它是读模型，绝非另一份主任务。原run状态始终优先。<\/li>\n<li>ExperienceEvent：呈现事件，不可授予写权限或表示额外业务事实。<\/li>\n<li>OutcomeObservation：现有schema按需扩展delivery_state、attribution_level、window_end、censored_reason、evidence_kind与policy_version。新字段向后兼容，老行unknown，禁止回填臆测。<\/li>\n<\/ol>\n<h2>同一轮的原子性和过期<\/h2>\n<p>读取context版本→生成提案→确认前再校验对象version/memory_epoch/policy_version。期间用户删除记忆，提案转expired并解释“你的设置已更新，需要重新生成”；不是拿旧上下文照样写任务。UI可以先保留用户编辑内容，不能复用过期授权。<\/p>\n<p>在线必要状态更新（用户纠正/撤回）与版本提升沿已有原子事务；离线总结不影响当前确认的可用性。Celery派发/outbox失败不能丢已提交事实，重放幂等；若某读投影落后，UI显式“正在同步”，不以旧事实庆祝第二次。<\/p>\n<h2>变更策略<\/h2>\n<p>扩展字段先shadow读写，旧客户端忽略未知可选字段。数据库只有迁移单头；proto改动先contract-owner提交，再生成Go/Dart/Python，其他Agent只基于已合并契约。新视觉默认off，新的语义选择shadow；在既有kill-switch manifest中登记，不造另一组常量开关。<\/p>\n<h2>缓存<\/h2>\n<p>key绑定user、consent_scope、goal/task version、memory_epoch、policy_version、material_version、selector_version；矫正/删除立即使相关读失效。单纯LLM输出缓存不能代替写动作；匿名demo和真实账号完全隔离。当前State必须读权威或有明确watermark的快照，不能用旧摘要覆盖。<\/p>\n", "text": "# AI 架构增量：在已有权威上增加一条可证明的闭环\n\n## 已有结构不动\nFlutter → Go Gateway（身份/WS/限流/桥）→ Python Engine（业务与推理）→ PostgreSQL/Redis/Celery。主聊天仍为自研StateGraph，LangGraph仅已有规划用途；不迁框架。权限上下文由网关可信传入，引擎对具体对象/调用能力仍必须做授权边界校验，不能把“网关认证”误当“任何对象都可访问”。\n\nAurora、memory_preferences、episodic_memories、working_memory、user_preferences、TaskService、sprint_task_ledger、goal_today_view、outcome、runtime和现有A05 policy patch均继续主权。名称是资料定位种子，V4开工由当前代码映射确认；本包不声称新增类已存在。\n\n## 新增逻辑责任，不默认新增服务\n```\n当前目标/动作/资料/约束\n     + 合法历史候选 (原Context Compiler)\n     ↓\n可用性过滤 + 记忆效用门  [增量 I02]\n     ↓\n规则快路 / 受限语义选择 / 一次决策性澄清 [增量 I03-I04]\n     ↓\n既有 AuroraDecision / A05 六字段策略 / Human-Agent-Hybrid\n     ↓\n既有 Proposal → Confirm → Command → Receipt\n     ↓\n呈现投影 ExperienceEvent → 文本/像素/声/触 [增量 F03/S01]\n     ↓\n既有生命周期 + rendered曝光 + outcome/censor/retract [增量 D01-D03]\n     ↓\n合规经验候选 → 影子验证/回退 [增量 I05]\n```\n\n## 新契约最小面\n1. ContextSelectionReceipt：输入各权威版本、候选/选用ref、拒用原因、预算、作用于何处、选择器版本。正文仅显示用过的合法依据；debug侧可看摘要但不泄露被拒内容。\n2. EpisodeResumeView：existing goal/task/run/last_valid_outcome引用，last_confirmed_step、pending_human_step、expires_at；它是读模型，绝非另一份主任务。原run状态始终优先。\n3. ExperienceEvent：呈现事件，不可授予写权限或表示额外业务事实。\n4. OutcomeObservation：现有schema按需扩展delivery_state、attribution_level、window_end、censored_reason、evidence_kind与policy_version。新字段向后兼容，老行unknown，禁止回填臆测。\n\n## 同一轮的原子性和过期\n读取context版本→生成提案→确认前再校验对象version/memory_epoch/policy_version。期间用户删除记忆，提案转expired并解释“你的设置已更新，需要重新生成”；不是拿旧上下文照样写任务。UI可以先保留用户编辑内容，不能复用过期授权。\n\n在线必要状态更新（用户纠正/撤回）与版本提升沿已有原子事务；离线总结不影响当前确认的可用性。Celery派发/outbox失败不能丢已提交事实，重放幂等；若某读投影落后，UI显式“正在同步”，不以旧事实庆祝第二次。\n\n## 变更策略\n扩展字段先shadow读写，旧客户端忽略未知可选字段。数据库只有迁移单头；proto改动先contract-owner提交，再生成Go/Dart/Python，其他Agent只基于已合并契约。新视觉默认off，新的语义选择shadow；在既有kill-switch manifest中登记，不造另一组常量开关。\n\n## 缓存\nkey绑定user、consent_scope、goal/task version、memory_epoch、policy_version、material_version、selector_version；矫正/删除立即使相关读失效。单纯LLM输出缓存不能代替写动作；匿名demo和真实账号完全隔离。当前State必须读权威或有明确watermark的快照，不能用旧摘要覆盖。\n"}, {"id": "03_intelligence/AURORA_SEMANTIC_POLICY.md", "title": "Aurora：少问、问对、允许纠正的语义控制", "group": "03_intelligence", "html": "<h1>Aurora：少问、问对、允许纠正的语义控制<\/h1>\n<h2>分工<\/h2>\n<p>确定性层：权限、版本、时间、预算、允许工具、干预目录、提案状态。语义层：用户表达的真正约束、候选成因的区别、材料是否足够、哪一种帮助仍服务目标。不要继续无边界增加“包含词A就判B”的规则，也不要每次简单点击启动多Agent推理。<\/p>\n<h2>双路径<\/h2>\n<p>L0：本地/服务端确定性响应，不调用生成模型。问候、明确按钮、读取已知状态按现有能力表处理；L0带token为错误，不能改标签掩盖。\nL1：明确问答/单步解释可快模型。\nL2：复杂语义/重规划走一个受限selector，再生成必要提案，尽量合并可合并调用；schema不合法最多修复一次。\nL3：真正多工具的深任务沿已有runtime持久运行、可离开，不把模式升级作为价值炫耀。<\/p>\n<h2>受限输出<\/h2>\n<p><code>{blocking_factors:[{candidate_id,evidence_refs}], selected_intervention_id, execution_mode, missing_decision_variable?, question?, used_ref_ids, confidence_band, abstain_reason?}<\/code>。\ncandidate/intervention/ref必须来自本次传入白名单；任意引用无效触发修复或诚实退回，不打印不存在的source。confidence_band是审慎标签，不向用户显示虚构精度百分比。模型不输出系统prompt、权限配置或越界数据库命令。<\/p>\n<h2>澄清的判据<\/h2>\n<p>只有两种候选会导致不同下一步、且当前证据无法决定时，问一个真正会改变决策的问题。不要追求问句数越多或越少。预算初值：自动澄清≤1轮；仍不清楚时允许“直接说情况/先给保守可试方案/先暂停”，用户主动补充不算系统追问。问句精度验收以问题是否分开了候选行动，而非疑问号检测。<\/p>\n<h2>无动作也可纠正（FIX97拍板）<\/h2>\n<p>选择单一自由输入“还有什么情况需要我知道？”作为基本出口；可附最多两个<strong>不同操作后果<\/strong>的例子，不摆15种卡点让用户诊断自己。该入口不依赖生成了错误行动，不受每日解释气泡次数限制。不确定时说“我还不确定卡在哪里”，但输入、返回和当前目标继续可用。<\/p>\n<h2>A05 自适应表面复用<\/h2>\n<p>保留六字段：granularity/clarification/explanation/intervention_preference/proactive_cadence/allocation_preference。新增UX映射“这次/这个目标/暂时不这样”，值必须取现有合法枚举；新枚举由contract owner显式迁移，不通过任意自然语言追加。用户手动设置与系统观察分开；撤回优先；用户从来可以重置。<\/p>\n<h2>示例<\/h2>\n<ul>\n<li>用户：“不是难，我只是资料太多不知道先看哪份。”排除difficulty历史，转retrieve/select，不把任务时长砍半当修复。<\/li>\n<li>用户：“考试还剩一天，别再拆计划了，先给一题我做。”保留必须人做的practice，直接题目，不进入深规划。<\/li>\n<li>用户：“帮我把已经确认的说明整理成PDF。”允许Agent制作工件；依然校验内容来源/输出权限，不要求用户手工排版以假装学习。<\/li>\n<li>用户：“你总觉得我喜欢图，但这次请讲证明。”更新当前约束，不能因历史画像拒绝。<\/li>\n<\/ul>\n<h2>非聊天表面<\/h2>\n<p>首页和回归页读取已持久化判断/episode视图，不暗中启动完整聊天图。主动触发在规则eligibility后才调用语义层，能够NO_ACTION。不将视觉模式或音效偏好解释为心理诊断。<\/p>\n", "text": "# Aurora：少问、问对、允许纠正的语义控制\n\n## 分工\n确定性层：权限、版本、时间、预算、允许工具、干预目录、提案状态。语义层：用户表达的真正约束、候选成因的区别、材料是否足够、哪一种帮助仍服务目标。不要继续无边界增加“包含词A就判B”的规则，也不要每次简单点击启动多Agent推理。\n\n## 双路径\nL0：本地/服务端确定性响应，不调用生成模型。问候、明确按钮、读取已知状态按现有能力表处理；L0带token为错误，不能改标签掩盖。\nL1：明确问答/单步解释可快模型。\nL2：复杂语义/重规划走一个受限selector，再生成必要提案，尽量合并可合并调用；schema不合法最多修复一次。\nL3：真正多工具的深任务沿已有runtime持久运行、可离开，不把模式升级作为价值炫耀。\n\n## 受限输出\n`{blocking_factors:[{candidate_id,evidence_refs}], selected_intervention_id, execution_mode, missing_decision_variable?, question?, used_ref_ids, confidence_band, abstain_reason?}`。\ncandidate/intervention/ref必须来自本次传入白名单；任意引用无效触发修复或诚实退回，不打印不存在的source。confidence_band是审慎标签，不向用户显示虚构精度百分比。模型不输出系统prompt、权限配置或越界数据库命令。\n\n## 澄清的判据\n只有两种候选会导致不同下一步、且当前证据无法决定时，问一个真正会改变决策的问题。不要追求问句数越多或越少。预算初值：自动澄清≤1轮；仍不清楚时允许“直接说情况/先给保守可试方案/先暂停”，用户主动补充不算系统追问。问句精度验收以问题是否分开了候选行动，而非疑问号检测。\n\n## 无动作也可纠正（FIX97拍板）\n选择单一自由输入“还有什么情况需要我知道？”作为基本出口；可附最多两个**不同操作后果**的例子，不摆15种卡点让用户诊断自己。该入口不依赖生成了错误行动，不受每日解释气泡次数限制。不确定时说“我还不确定卡在哪里”，但输入、返回和当前目标继续可用。\n\n## A05 自适应表面复用\n保留六字段：granularity/clarification/explanation/intervention_preference/proactive_cadence/allocation_preference。新增UX映射“这次/这个目标/暂时不这样”，值必须取现有合法枚举；新枚举由contract owner显式迁移，不通过任意自然语言追加。用户手动设置与系统观察分开；撤回优先；用户从来可以重置。\n\n## 示例\n- 用户：“不是难，我只是资料太多不知道先看哪份。”排除difficulty历史，转retrieve/select，不把任务时长砍半当修复。\n- 用户：“考试还剩一天，别再拆计划了，先给一题我做。”保留必须人做的practice，直接题目，不进入深规划。\n- 用户：“帮我把已经确认的说明整理成PDF。”允许Agent制作工件；依然校验内容来源/输出权限，不要求用户手工排版以假装学习。\n- 用户：“你总觉得我喜欢图，但这次请讲证明。”更新当前约束，不能因历史画像拒绝。\n\n## 非聊天表面\n首页和回归页读取已持久化判断/episode视图，不暗中启动完整聊天图。主动触发在规则eligibility后才调用语义层，能够NO_ACTION。不将视觉模式或音效偏好解释为心理诊断。\n"}, {"id": "03_intelligence/DATA_AND_GRAPH.md", "title": "跨模块数据闭环与真实成长", "group": "03_intelligence", "html": "<h1>跨模块数据闭环与真实成长<\/h1>\n<h2>FIX507已修，不再重做<\/h2>\n<p>S07说明干预生产写入已接到mark_delivered/accepted/dismissed/acted、spine下发和6h outcome关联任务。V4继承这些方法与测试。增量是<strong>交付与实际呈现的区分、同域关联、用户可读来源、丢失与撤回一致性<\/strong>，不是另造一条生命周期队列。<\/p>\n<h2>事件定义<\/h2>\n<ul>\n<li>dispatched/delivered：服务器确实下发或接收成功，不等于用户看到。<\/li>\n<li>rendered：对应卡在活跃表面可见。默认≥50%面积且持续≥500ms作为工程测量条件，屏幕阅读器路径以等价焦点阅读事件登记；此为项目假设，不是心理学注意力证明。<\/li>\n<li>accepted/rejected/edited/started：按真实操作记录；既有枚举没有edited时走显式契约扩展，不填假accepted。<\/li>\n<li>outcome_observed：既有OutcomeEntry引用、类型与时间；不能由客户端“感觉完成”直接伪造。<\/li>\n<li>censored：观察窗结束但无可解释结果；包括未返场/退出/失去授权。与failed分开。<\/li>\n<\/ul>\n<p>每个事件至少携带user、decision_id、goal/task/run可选真实外键、causation_id、dedupe_key、source_version、occurred_at/received_at。不能把task_occurrence_id当Task.id；缺关联就unattributed。received_at用于延迟与watermark，不能覆盖真实事件时间。<\/p>\n<h2>事务与可靠性<\/h2>\n<p>业务写入原有UoW+outbox不变；呈现/分析hook不拖垮主链，但要有持久可重放投递记录和计数告警，不能只logger后永久丢失。暴露“未关联结果占比、投影滞后、死信、epoch不一致”，每次发布样本追踪<code>UI→decision→receipt→event→outcome→insight<\/code>。<\/p>\n<h2>星图权威<\/h2>\n<p>资料显示当前主星图是关系型knowledge_nodes/node_relations/user_node_status/study_records；AGE是另一路GraphRAG且写生产者存在空缺。V4前台优先关系型当前真源。AGE只能作可检查版本/覆盖率的派生检索索引，落后时回到关系查询/普通检索；不因为想做“世界模型”新建第二套掌握度。<\/p>\n<p>能力证据与活动轨迹分离。旧时间累计亮度可作为“参与足迹”，标签不能叫精通；独立测验/修正过的练习证据才能支撑相应能力描述。遗忘估计标模型估计，不把没登录等于能力下降。成就光子与sprint排行只读其原账本，不把AI打分影响奖励和付费身份。<\/p>\n<h2>撤回与重算<\/h2>\n<p>outcome撤回→依赖索引查受影响节点/insight/experience→标pending_recompute→从仍有效事件按确定顺序重新投影→新version发布。Kalman/Bayesian更新非简单可逆，不能直接减去“撤回分”。重算过程中UI显示旧视图已失效/更新中，不展示双份相矛盾成长。用户删除材料亦使相关引用不可用，但不自动删除其他合法来源的事实。<\/p>\n<h2>对照指标<\/h2>\n<p>关联完整率按具备合法同域键的eligible事件计算，同时公开unattributed占全部比例；不能剔除难配对事件制造100%。feedback repeated去重；exposure分母不混服务端派发。D07洞察的出现不是效果门：必须验证文字中的数值/比较/来源，不能出现“2次成功=提升100%”。<\/p>\n", "text": "# 跨模块数据闭环与真实成长\n\n## FIX507已修，不再重做\nS07说明干预生产写入已接到mark_delivered/accepted/dismissed/acted、spine下发和6h outcome关联任务。V4继承这些方法与测试。增量是**交付与实际呈现的区分、同域关联、用户可读来源、丢失与撤回一致性**，不是另造一条生命周期队列。\n\n## 事件定义\n- dispatched/delivered：服务器确实下发或接收成功，不等于用户看到。\n- rendered：对应卡在活跃表面可见。默认≥50%面积且持续≥500ms作为工程测量条件，屏幕阅读器路径以等价焦点阅读事件登记；此为项目假设，不是心理学注意力证明。\n- accepted/rejected/edited/started：按真实操作记录；既有枚举没有edited时走显式契约扩展，不填假accepted。\n- outcome_observed：既有OutcomeEntry引用、类型与时间；不能由客户端“感觉完成”直接伪造。\n- censored：观察窗结束但无可解释结果；包括未返场/退出/失去授权。与failed分开。\n\n每个事件至少携带user、decision_id、goal/task/run可选真实外键、causation_id、dedupe_key、source_version、occurred_at/received_at。不能把task_occurrence_id当Task.id；缺关联就unattributed。received_at用于延迟与watermark，不能覆盖真实事件时间。\n\n## 事务与可靠性\n业务写入原有UoW+outbox不变；呈现/分析hook不拖垮主链，但要有持久可重放投递记录和计数告警，不能只logger后永久丢失。暴露“未关联结果占比、投影滞后、死信、epoch不一致”，每次发布样本追踪`UI→decision→receipt→event→outcome→insight`。\n\n## 星图权威\n资料显示当前主星图是关系型knowledge_nodes/node_relations/user_node_status/study_records；AGE是另一路GraphRAG且写生产者存在空缺。V4前台优先关系型当前真源。AGE只能作可检查版本/覆盖率的派生检索索引，落后时回到关系查询/普通检索；不因为想做“世界模型”新建第二套掌握度。\n\n能力证据与活动轨迹分离。旧时间累计亮度可作为“参与足迹”，标签不能叫精通；独立测验/修正过的练习证据才能支撑相应能力描述。遗忘估计标模型估计，不把没登录等于能力下降。成就光子与sprint排行只读其原账本，不把AI打分影响奖励和付费身份。\n\n## 撤回与重算\noutcome撤回→依赖索引查受影响节点/insight/experience→标pending_recompute→从仍有效事件按确定顺序重新投影→新version发布。Kalman/Bayesian更新非简单可逆，不能直接减去“撤回分”。重算过程中UI显示旧视图已失效/更新中，不展示双份相矛盾成长。用户删除材料亦使相关引用不可用，但不自动删除其他合法来源的事实。\n\n## 对照指标\n关联完整率按具备合法同域键的eligible事件计算，同时公开unattributed占全部比例；不能剔除难配对事件制造100%。feedback repeated去重；exposure分母不混服务端派发。D07洞察的出现不是效果门：必须验证文字中的数值/比较/来源，不能出现“2次成功=提升100%”。\n"}, {"id": "03_intelligence/EXPERIENCE_AND_LEARNING.md", "title": "从有数据到会改进：经验策略与人机学习边界", "group": "03_intelligence", "html": "<h1>从有数据到会改进：经验策略与人机学习边界<\/h1>\n<h2>三个不同账本，不相互冒充<\/h2>\n<ol>\n<li>行动账本：是否按授权完成了任务。<\/li>\n<li>产物证据：文件/练习/解释/独立检验到底是什么。<\/li>\n<li>干预经验：在什么情境下哪一种帮助与何种结果关联。<\/li>\n<\/ol>\n<p>“接受建议”不等于“任务推进”，“完成任务”不等于“能力掌握”，“伴随成功”不等于“导致成功”。三者在UI和离线统计中保留区分。<\/p>\n<h2>经验卡的最小结构<\/h2>\n<p>沿用M06/A05现有对象扩展：scope、context_pattern、intervention_id、required_preconditions、do_not_apply_when、source_refs+versions、observations(success/failure/censored/unknown)、approved_patch_ref、evaluation_version、valid_until、revoked_at。<\/p>\n<p>候选由显式纠正或合法结果触发。多次相似结果能增加审查优先级，不自动获得全局人格事实权限。初版仅在同目标或用户明确授权的同类任务生效；跨域转移作为影子实验而非默认启用。<\/p>\n<h2>学习闭环<\/h2>\n<p>有效outcome入账→版本化归因视图→生成/更新候选→回放针对性反例与配对holdout→策略候选shadow→满足发布门后有限live→持续看负迁移→可回退。重复事件与由同一模型摘要派生的多条“证据”按lineage折叠。观察窗内用户不回来记censored，不能给负reward逼系统更强催促。<\/p>\n<p>ACE的增量context/playbook启发适合“保留详细策略、局部修订”，但不采用运行时任意改prompt；MemRL的效用思想适合离线比较，不直接把用户勾选当RL奖励（R02/R03）。稀少样本下先用可解释规则与人工可读受限字段，避免自信Bayesian概率装饰。<\/p>\n<h2>Human / Hybrid / Agent 的学习目标<\/h2>\n<p>界面三种可读选择：<strong>我来做 / 带我做 / 交给Sparkle<\/strong>。底层仍是现有execution_mode，不另造流程。<\/p>\n<ul>\n<li>mastery goal：用户必须完成标记的human_required步骤；Agent准备相近示例/提示/检查，不提前泄露独立检验答案。<\/li>\n<li>deliverable goal：可把整理/检索/排版/代码草稿交给Agent，产物标AI辅助与待核验状态。<\/li>\n<li>mixed goal：把准备、决策、执行、检验拆清，不把所有步骤统一归Agent。<\/li>\n<\/ul>\n<p>“脚手架渐隐”：前一次示例充分→下次减少提示→用户独立尝试，但只在用户选择且证据支持时推进。失败时增加局部支持，不把用户降级。来自PNAS的一项特定高中数学实验说明辅助完成与独立学习可能不同（R11），不构成Sparkle已提升学习的证据。<\/p>\n<h2>对用户的解释<\/h2>\n<p>不用“understanding_depth=0.83”。用“本次采用了你在这个目标里选的先看示例；今天15分钟仅用于这次”。复盘用“你在3次类似任务中2次采用示例后开始了练习”，同时显示样本少/结果自报等限制。已删或无来源推断不进入叙事。<\/p>\n<h2>效果门<\/h2>\n<p>新策略必须在相同模型、材料、权限、可见历史与预算的对照下评估。公开指标：有记忆的收益、无关侵入、应使用记忆的遗漏、独立检验表现、成本。若只赢了固定坏基线却输给不使用历史，不可宣称实现自适应优势。<\/p>\n", "text": "# 从有数据到会改进：经验策略与人机学习边界\n\n## 三个不同账本，不相互冒充\n1. 行动账本：是否按授权完成了任务。\n2. 产物证据：文件/练习/解释/独立检验到底是什么。\n3. 干预经验：在什么情境下哪一种帮助与何种结果关联。\n\n“接受建议”不等于“任务推进”，“完成任务”不等于“能力掌握”，“伴随成功”不等于“导致成功”。三者在UI和离线统计中保留区分。\n\n## 经验卡的最小结构\n沿用M06/A05现有对象扩展：scope、context_pattern、intervention_id、required_preconditions、do_not_apply_when、source_refs+versions、observations(success/failure/censored/unknown)、approved_patch_ref、evaluation_version、valid_until、revoked_at。\n\n候选由显式纠正或合法结果触发。多次相似结果能增加审查优先级，不自动获得全局人格事实权限。初版仅在同目标或用户明确授权的同类任务生效；跨域转移作为影子实验而非默认启用。\n\n## 学习闭环\n有效outcome入账→版本化归因视图→生成/更新候选→回放针对性反例与配对holdout→策略候选shadow→满足发布门后有限live→持续看负迁移→可回退。重复事件与由同一模型摘要派生的多条“证据”按lineage折叠。观察窗内用户不回来记censored，不能给负reward逼系统更强催促。\n\nACE的增量context/playbook启发适合“保留详细策略、局部修订”，但不采用运行时任意改prompt；MemRL的效用思想适合离线比较，不直接把用户勾选当RL奖励（R02/R03）。稀少样本下先用可解释规则与人工可读受限字段，避免自信Bayesian概率装饰。\n\n## Human / Hybrid / Agent 的学习目标\n界面三种可读选择：**我来做 / 带我做 / 交给Sparkle**。底层仍是现有execution_mode，不另造流程。\n- mastery goal：用户必须完成标记的human_required步骤；Agent准备相近示例/提示/检查，不提前泄露独立检验答案。\n- deliverable goal：可把整理/检索/排版/代码草稿交给Agent，产物标AI辅助与待核验状态。\n- mixed goal：把准备、决策、执行、检验拆清，不把所有步骤统一归Agent。\n\n“脚手架渐隐”：前一次示例充分→下次减少提示→用户独立尝试，但只在用户选择且证据支持时推进。失败时增加局部支持，不把用户降级。来自PNAS的一项特定高中数学实验说明辅助完成与独立学习可能不同（R11），不构成Sparkle已提升学习的证据。\n\n## 对用户的解释\n不用“understanding_depth=0.83”。用“本次采用了你在这个目标里选的先看示例；今天15分钟仅用于这次”。复盘用“你在3次类似任务中2次采用示例后开始了练习”，同时显示样本少/结果自报等限制。已删或无来源推断不进入叙事。\n\n## 效果门\n新策略必须在相同模型、材料、权限、可见历史与预算的对照下评估。公开指标：有记忆的收益、无关侵入、应使用记忆的遗漏、独立检验表现、成本。若只赢了固定坏基线却输给不使用历史，不可宣称实现自适应优势。\n"}, {"id": "03_intelligence/LATENCY_COST_RUNTIME.md", "title": "速度、成本与长期运行", "group": "03_intelligence", "html": "<h1>速度、成本与长期运行<\/h1>\n<h2>基线边界<\/h2>\n<p>S05/S06是真gRPC模型调用，不包括Flutter/网关整链，26条/层不足以精确估p95尾部。L2/L3长尾明显；主调用cost漏辅助调用且model标签有错（FIX545）。V4不引用“每次只花$0.00122”作为商业单价。<\/p>\n<h2>前台预算<\/h2>\n<p>本地触控反馈p95≤100ms；确定性状态操作p95≤500ms（网络额外分层）。L0必须零生成调用，已知问候/状态不走分类+生成双调用。L1真实首个有用内容p50≤2s/p95≤5s；L2受限行动提案p50≤4s/p95≤12s，20s为本次交互转交/终止上限而非任意深任务总时限。以上是目标，需按网络、模型、硬件报告，失败就保持未通过。<\/p>\n<p>“有用”必须是请求相关内容/必要澄清/可操作阶段产物。ack、转圈、“正在思考”、随机鸡汤与像素粒子不计。不要把reasoning_content直接给用户当可解释证据；用工具阶段/所用来源/可验证计划摘要。<\/p>\n<h2>深任务<\/h2>\n<p>只在用户请求或同意后进入L3。run卡5s内应可查看真实范围、取消、离开；最终耗时单独记录，初始默认软预算90s/硬预算180s可配置，超过则明确暂停/失败而不是无限等待。每步独立deadline和幂等键；取消发出不代表已撤销外部副作用；UNKNOWN先对账。已完成片段可用但标明未全完成。<\/p>\n<h2>能力路由<\/h2>\n<p>模型配置以真实probe（schema/tool/text/stream/latency/context/价格来源）决定，保留V3可用provider，不为追“最新”换未经验证型号。不把同一模型不同tier冒充独立更强能力。fast失败要保持能力合同，不能悄悄从工具执行降为文字“已完成”。探测不读取或打印Key。<\/p>\n<h2>完整费用<\/h2>\n<p>一条root_request包括classifier、sufficiency、retrieval辅助、generation、review、reflection、tool模型、embedding、语音等attempt。记录requested/actual model、token/用量来源、currency、price_version、unknown parts、retry与取消。无计费数据保留unknown，决不填0；no_generation_model且token&gt;0作为计量错误。<\/p>\n<p>预算先reserve再settle，重放不双计；竞争worker共享原账本原子扣限；离线分析与用户请求分账。成本门先用开发配置限额运行，价格未核验或未授权预算时BLOCKED_BUDGET，不自动消耗所有额度。用“每个完成目标闭环的总成本”而非每token成本评商业性。<\/p>\n<h2>长期可控<\/h2>\n<p>跨App重开，恢复run与同一episode；后台重试不重播触觉/声音，不替用户确认人类步骤。过期权限和记忆版本在每次副作用前再验。关闭pixel主题不影响运行，关闭semantic selector回到V3安全路径，关闭主动不影响被动求助。<\/p>\n<h2>资源<\/h2>\n<p>前台Leader+6后台Agent；同机HEAVY=1，模拟器/大测试/构建共享独占。其他Agent继续轻量代码、评审、脚本分析。磁盘低于安全阈值暂停新build并保留状态，不删未归档证据。测试片级快速反馈，发布整链用既有CI串行分片，不因旧材料曾取消全量而永久忽略当前发布套件。<\/p>\n", "text": "# 速度、成本与长期运行\n\n## 基线边界\nS05/S06是真gRPC模型调用，不包括Flutter/网关整链，26条/层不足以精确估p95尾部。L2/L3长尾明显；主调用cost漏辅助调用且model标签有错（FIX545）。V4不引用“每次只花$0.00122”作为商业单价。\n\n## 前台预算\n本地触控反馈p95≤100ms；确定性状态操作p95≤500ms（网络额外分层）。L0必须零生成调用，已知问候/状态不走分类+生成双调用。L1真实首个有用内容p50≤2s/p95≤5s；L2受限行动提案p50≤4s/p95≤12s，20s为本次交互转交/终止上限而非任意深任务总时限。以上是目标，需按网络、模型、硬件报告，失败就保持未通过。\n\n“有用”必须是请求相关内容/必要澄清/可操作阶段产物。ack、转圈、“正在思考”、随机鸡汤与像素粒子不计。不要把reasoning_content直接给用户当可解释证据；用工具阶段/所用来源/可验证计划摘要。\n\n## 深任务\n只在用户请求或同意后进入L3。run卡5s内应可查看真实范围、取消、离开；最终耗时单独记录，初始默认软预算90s/硬预算180s可配置，超过则明确暂停/失败而不是无限等待。每步独立deadline和幂等键；取消发出不代表已撤销外部副作用；UNKNOWN先对账。已完成片段可用但标明未全完成。\n\n## 能力路由\n模型配置以真实probe（schema/tool/text/stream/latency/context/价格来源）决定，保留V3可用provider，不为追“最新”换未经验证型号。不把同一模型不同tier冒充独立更强能力。fast失败要保持能力合同，不能悄悄从工具执行降为文字“已完成”。探测不读取或打印Key。\n\n## 完整费用\n一条root_request包括classifier、sufficiency、retrieval辅助、generation、review、reflection、tool模型、embedding、语音等attempt。记录requested/actual model、token/用量来源、currency、price_version、unknown parts、retry与取消。无计费数据保留unknown，决不填0；no_generation_model且token>0作为计量错误。\n\n预算先reserve再settle，重放不双计；竞争worker共享原账本原子扣限；离线分析与用户请求分账。成本门先用开发配置限额运行，价格未核验或未授权预算时BLOCKED_BUDGET，不自动消耗所有额度。用“每个完成目标闭环的总成本”而非每token成本评商业性。\n\n## 长期可控\n跨App重开，恢复run与同一episode；后台重试不重播触觉/声音，不替用户确认人类步骤。过期权限和记忆版本在每次副作用前再验。关闭pixel主题不影响运行，关闭semantic selector回到V3安全路径，关闭主动不影响被动求助。\n\n## 资源\n前台Leader+6后台Agent；同机HEAVY=1，模拟器/大测试/构建共享独占。其他Agent继续轻量代码、评审、脚本分析。磁盘低于安全阈值暂停新build并保留状态，不删未归档证据。测试片级快速反馈，发布整链用既有CI串行分片，不因旧材料曾取消全量而永久忽略当前发布套件。\n"}, {"id": "03_intelligence/MEMORY_UTILITY_AND_CONFLICT.md", "title": "记忆的突破：从“召回历史”变为“选择有用且有边界的经验”", "group": "03_intelligence", "html": "<h1>记忆的突破：从“召回历史”变为“选择有用且有边界的经验”<\/h1>\n<h2>为什么这是 V4 第一优先级<\/h2>\n<p>A08修后 full0.45/no_memory0.55 是模拟机制反例，指向历史失败错迁移和无动作时纠正断流（S03、FIX52/97）。不能把下一轮目标写成“更多记忆参与”或“理解深度百分比更大”。目标是<strong>同等任务与模型条件下，合法经验改善未来选择，同时对不相关任务保持安静<\/strong>。<\/p>\n<h2>数据分层<\/h2>\n<p>业务状态为当前事实；用户记忆为确认偏好/待确认经验；知识是材料；事件是过程。沿原五层体系，不把LLM反思文本再抽取为“用户说过”。来源author_type=user_explicit/system_observed/model_inferred/external_material分别保留。外部材料中的指令不能提升为用户偏好（R13提醒持久化污染风险）。<\/p>\n<h2>两阶段选择（项目方案，不是已证明算法）<\/h2>\n<p><strong>阶段一硬门<\/strong>：owner和ACL、consent、scope、effective_at/expiry、revoked/retracted/superseded、当前epoch、source_alive。任一不满足即排除；global范围的推断不能自动压过当次explicit约束。匹配scope需要规范化的goal/type/domain key；不由LLM决定能否跨用户访问。<\/p>\n<p><strong>阶段二效用门<\/strong>：对剩余可选历史，根据当前问题的主题/动作/时间相近性、证据直接性、冲突、历史负迁移与token成本排序。初版用可解释规则/检索分数，不伪装有训练充分的价值网络。建议形式：\n<code>score = relevance + decision_relevance + confirmed_bonus − conflict_penalty − stale_penalty − negative_transfer_penalty − token_cost<\/code>\n权重必须在开发集冻结，并与“只按相似度”和“完全不用可选历史”对照。不要把这组分数叫概率，不把不完整点击结果拿来更新Q值。<\/p>\n<p>mandatory context（当前目标/显式约束/授权）始终可用；optional history有TopK与预算。初值可选历史≤6条、总context≤6000tokens，是待基线测量的成本预算而非普适最优值；资料问答可另申请资料预算。宁可省掉不确定历史，也不能让L0闲聊触发整个人生画像。<\/p>\n<h2>冲突裁决表<\/h2>\n<table>\n<thead>\n<tr>\n<th>情况<\/th>\n<th>决定<\/th>\n<th>用户呈现<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>今天15分钟 vs 平时60分钟<\/td>\n<td>今日约束优先，仅本次/有效期内<\/td>\n<td>“今天按15分钟安排”<\/td>\n<\/tr>\n<tr>\n<td>同目标新明确偏好 vs 旧确认偏好<\/td>\n<td>新版替代旧版；保留撤回谱系<\/td>\n<td>显示此次修改，不重复询问旧偏好<\/td>\n<\/tr>\n<tr>\n<td>行为观察 vs 用户否认<\/td>\n<td>否认优先；观察保留原事件但不能继续作为用户事实<\/td>\n<td>“不再按这个假设安排”<\/td>\n<\/tr>\n<tr>\n<td>两个同权威同时间约束冲突<\/td>\n<td>选会影响行动的最小澄清，或保守兼容动作<\/td>\n<td>不显示“系统判你错了”<\/td>\n<\/tr>\n<tr>\n<td>不同目标不同偏好<\/td>\n<td>不是冲突；按scope同时成立<\/td>\n<td>不提示“你的偏好矛盾”<\/td>\n<\/tr>\n<tr>\n<td>无法定位来源 / 旧scope引用<\/td>\n<td>不入prompt，返回缺失说明<\/td>\n<td>不编造来源<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>所谓“最新优先”只在同用户/同scope/同语义键/相当权限下适用；外部文档更晚不等于更权威。<\/p>\n<h2>删除与经验联动<\/h2>\n<p>撤回一条source导致依赖它的claim/recipe/context缓存和未执行proposal失效；原事件审计按既有隐私保留规则处理，用户内容不可继续用于推理。依赖图记录ref与version，不把一段摘要复制到十处没有来源的文本字段。结果重算从有效事件回放，不能对非线性掌握度/策略分数简单减法。<\/p>\n<h2>线上与离线分工<\/h2>\n<p>用户纠正→立即更新版本与当前决策；offload extraction只生成候选，不阻塞纠正生效。离线批处理去重source lineage，N条来自同一次对话的摘要算1个证据来源。未完成/未再上线为censored而非负效果。用户从未看到的建议不加入接受率分母。<\/p>\n<h2>如何验证不是“少用就好”<\/h2>\n<p>报告有效使用precision、遗漏应使用记忆recall、无关侵入、撤回残留、任务解决质量、token/延迟。选择器全拒用可把precision分母变0，必须输出N/A并同时不通过required-memory recall/utility门，不能取得100%。选择历史后错误增加则定位到具体source/version/decision，回退该策略，不把所有个性化关闭。<\/p>\n<p>此方向借鉴context engineering和MemRL“语义相关之外还看效用”的思路（R01/R02）；Sparkle的用户结果噪声大且延迟长，不能照搬其bench奖励或宣称论文提升已迁移。<\/p>\n", "text": "# 记忆的突破：从“召回历史”变为“选择有用且有边界的经验”\n\n## 为什么这是 V4 第一优先级\nA08修后 full0.45/no_memory0.55 是模拟机制反例，指向历史失败错迁移和无动作时纠正断流（S03、FIX52/97）。不能把下一轮目标写成“更多记忆参与”或“理解深度百分比更大”。目标是**同等任务与模型条件下，合法经验改善未来选择，同时对不相关任务保持安静**。\n\n## 数据分层\n业务状态为当前事实；用户记忆为确认偏好/待确认经验；知识是材料；事件是过程。沿原五层体系，不把LLM反思文本再抽取为“用户说过”。来源author_type=user_explicit/system_observed/model_inferred/external_material分别保留。外部材料中的指令不能提升为用户偏好（R13提醒持久化污染风险）。\n\n## 两阶段选择（项目方案，不是已证明算法）\n**阶段一硬门**：owner和ACL、consent、scope、effective_at/expiry、revoked/retracted/superseded、当前epoch、source_alive。任一不满足即排除；global范围的推断不能自动压过当次explicit约束。匹配scope需要规范化的goal/type/domain key；不由LLM决定能否跨用户访问。\n\n**阶段二效用门**：对剩余可选历史，根据当前问题的主题/动作/时间相近性、证据直接性、冲突、历史负迁移与token成本排序。初版用可解释规则/检索分数，不伪装有训练充分的价值网络。建议形式：\n`score = relevance + decision_relevance + confirmed_bonus − conflict_penalty − stale_penalty − negative_transfer_penalty − token_cost`\n权重必须在开发集冻结，并与“只按相似度”和“完全不用可选历史”对照。不要把这组分数叫概率，不把不完整点击结果拿来更新Q值。\n\nmandatory context（当前目标/显式约束/授权）始终可用；optional history有TopK与预算。初值可选历史≤6条、总context≤6000tokens，是待基线测量的成本预算而非普适最优值；资料问答可另申请资料预算。宁可省掉不确定历史，也不能让L0闲聊触发整个人生画像。\n\n## 冲突裁决表\n| 情况 | 决定 | 用户呈现 |\n|---|---|---|\n| 今天15分钟 vs 平时60分钟 | 今日约束优先，仅本次/有效期内 | “今天按15分钟安排” |\n| 同目标新明确偏好 vs 旧确认偏好 | 新版替代旧版；保留撤回谱系 | 显示此次修改，不重复询问旧偏好 |\n| 行为观察 vs 用户否认 | 否认优先；观察保留原事件但不能继续作为用户事实 | “不再按这个假设安排” |\n| 两个同权威同时间约束冲突 | 选会影响行动的最小澄清，或保守兼容动作 | 不显示“系统判你错了” |\n| 不同目标不同偏好 | 不是冲突；按scope同时成立 | 不提示“你的偏好矛盾” |\n| 无法定位来源 / 旧scope引用 | 不入prompt，返回缺失说明 | 不编造来源 |\n\n所谓“最新优先”只在同用户/同scope/同语义键/相当权限下适用；外部文档更晚不等于更权威。\n\n## 删除与经验联动\n撤回一条source导致依赖它的claim/recipe/context缓存和未执行proposal失效；原事件审计按既有隐私保留规则处理，用户内容不可继续用于推理。依赖图记录ref与version，不把一段摘要复制到十处没有来源的文本字段。结果重算从有效事件回放，不能对非线性掌握度/策略分数简单减法。\n\n## 线上与离线分工\n用户纠正→立即更新版本与当前决策；offload extraction只生成候选，不阻塞纠正生效。离线批处理去重source lineage，N条来自同一次对话的摘要算1个证据来源。未完成/未再上线为censored而非负效果。用户从未看到的建议不加入接受率分母。\n\n## 如何验证不是“少用就好”\n报告有效使用precision、遗漏应使用记忆recall、无关侵入、撤回残留、任务解决质量、token/延迟。选择器全拒用可把precision分母变0，必须输出N/A并同时不通过required-memory recall/utility门，不能取得100%。选择历史后错误增加则定位到具体source/version/decision，回退该策略，不把所有个性化关闭。\n\n此方向借鉴context engineering和MemRL“语义相关之外还看效用”的思路（R01/R02）；Sparkle的用户结果噪声大且延迟长，不能照搬其bench奖励或宣称论文提升已迁移。\n"}, {"id": "04_tasks/T 查→集成SHA复验→证据更新。不要重建V3。\n\n## 证据交付\n\n- diff_or_evidence_only.md\n\n- run_manifest.json\n\n- test_results.json\n\n- review_receipt.json\n\n- limitations.md\n\n必须记录真实命令/exit code/版本/样本/失败/限制；有UI附顶层截图、语义与真实操作；有模型附全部调用与价格来源。\n\n## 边界\n\n先按既有规范绑定本卡真实路径与只读依赖；工具/路由名为导航种子，禁止假设已存在或造第二权威。契约/迁移由单一owner单独合并，禁止手改生成文件。\n\n当前仓库已满足本卡行为时做差量举证，不重写；V3已DONE任务ID与证据不可重置。\n\n## 回滚\n\n变更独立commit与既有off/shadow/live开关；保留V3路径与数据向后兼容，迁移不得丢用户数据。\n\n## 停止条件\n\n- 发现权限/跨用户/删除复活/假成功立即隔离该变更，不绕门\n\n- 预算或外部授权缺失→BLOCKED_EXPLICIT，切换其他可执行工作\n\n- 连续三轮未改善停止无目标修补，写反例归因再裁决；不降验收阈值\n\n## 覆盖\n\n模块：跨系统/发布控制。来源：S05; S06\n"}, {"id": "04_tasks/cards/V4-D01.md", "title": "V4-D01｜交付到真实呈现的曝光语义增量", "group": "04_tasks", "html": "<h1>V4-D01｜交付到真实呈现的曝光语义增量<\/h1>\n<p><strong>implementation · 风险 high · 独立审查 2 位 · HEAVY=False<\/strong><\/p>\n<h2>做什么<\/h2>\n<p>保留FIX507生产hook；区分delivered/rendered与等价无障碍曝光，记录真实操作而非用下发代替看到，幂等接原事件。<\/p>\n<h2>依赖与必读<\/h2>\n<p>依赖：V4-B01, V4-B05。锁：lifecycle-exposure。<\/p>\n<ul>\n<li>\n<p>MASTER_DESIGN.md<\/p>\n<\/li>\n<li>\n<p>03_intelligence/DATA_AND_GRAPH.md<\/p>\n<\/li>\n<li>\n<p>V4_DONE.md<\/p>\n<\/li>\n<\/ul>\n<h2>验收（必须可失败）<\/h2>\n<ul>\n<li>\n<p>旧生产接线与测试不回退；无新同义事件总线<\/p>\n<\/li>\n<li>\n<p>不可见/后台下发不算看到；重复render不重复曝光<\/p>\n<\/li>\n<li>\n<p>丢事件可重放且不会拖跨主业务<\/p>\n<\/li>\n<\/ul>\n<h2>实施顺序<\/h2>\n<p>定位当前代码/同义权威→若已满足仅举证→绑定真实路径→冻结反例与当前版本→最小增量→自测→独立审查→集成SHA复验→证据更新。不要重建V3。<\/p>\n<h2>证据交付<\/h2>\n<ul>\n<li>\n<p>diff_or_evidence_only.md<\/p>\n<\/li>\n<li>\n<p>run_manifest.json<\/p>\n<\/li>\n<li>\n<p>test_results.json<\/p>\n<\/li>\n<li>\n<p>review_receipt.json<\/p>\n<\/li>\n<li>\n<p>limitations.md<\/p>\n<\/li>\n<\/ul>\n<p>必须记录真实命令/exit code/版本/样本/失败/限制；有UI附顶层截图、语义与真实操作；有模型附全部调用与价格来源。<\/p>\n<h2>边界<\/h2>\n<p>先按既有规范绑定本卡真实路径与只读依赖；工具/路由名为导航种子，禁止假设已存在或造第二权威。契约/迁移由单一owner单独合并，禁止手改生成文件。<\/p>\n<p>当前仓库已满足本卡行为时做差量举证，不重写；V3已DONE任务ID与证据不可重置。<\/p>\n<h2>回滚<\/h2>\n<p>变更独立commit与既有off/shadow/live开关；保留V3路径与数据向后兼容，迁移不得丢用户数据。<\/p>\n<h2>停止条件<\/h2>\n<ul>\n<li>\n<p>发现权限/跨用户/删除复活/假成功立即隔离该变更，不绕门<\/p>\n<\/li>\n<li>\n<p>预算或外部授权缺失→BLOCKED_ un_manifest.json\n\n- test_results.json\n\n- review_receipt.json\n\n- limitations.md\n\n必须记录真实命令/exit code/版本/样本/失败/限制；有UI附顶层截图、语义与真实操作；有模型附全部调用与价格来源。\n\n## 边界\n\n先按既有规范绑定本卡真实路径与只读依赖；工具/路由名为导航种子，禁止假设已存在或造第二权威。契约/迁移由单一owner单独合并，禁止手改生成文件。\n\n当前仓库已满足本卡行为时做差量举证，不重写；V3已DONE任务ID与证据不可重置。\n\n## 回滚\n\n变更独立commit与既有off/shadow/live开关；保留V3路径与数据向后兼容，迁移不得丢用户数据。\n\n## 停止条件\n\n- 发现权限/跨用户/删除复活/假成功立即隔离该变更，不绕门\n\n- 预算或外部授权缺失→BLOCKED_EXPLICIT，切换其他可执行工作\n\n- 连续三轮未改善停止无目标修补，写反例归因再裁决；不降验收阈值\n\n## 覆盖\n\n模块：memory, cognitive, galaxy。来源：本包相关设计与当前仓库映射\n"}, {"id": "04_tasks/cards/V4-D04.md", "title": "V4-D04｜星图证据与参与足迹分离", "group": "04_tasks", "html": "<h1>V4-D04｜星图证据与参与足迹分离<\/h1>\n<p><strong>implementation · 风险 normal · 独立审查 1 位 · HEAVY=False<\/strong><\/p>\n<h2>做什么<\/h2>\n<p>在关系型主星图中接有效outcome，区分练习过/独立检验通过；旧时间增长降为活动痕迹，贡献回到具体来源。<\/p>\n<h2>依赖与必读<\/h2>\n<p>依赖：V4-D03, V4-B02。锁：galaxy-evidence。<\/p>\n<ul>\n<li>\n<p>MASTER_DESIGN.md<\/p>\n<\/li>\n<li>\n<p>03_intelligence/DATA_AND_GRAPH.md<\/p>\n<\/li>\n<li>\n<p>V4_DONE.md<\/p>\n<\/li>\n<\/ul>\n<h2>验收（必须可失败）<\/h2>\n<ul>\n<li>\n<p>只学习计时不显示掌握；Agent产物不计人类能力<\/p>\n<\/li>\n<li>\n<p>撤回证据后节点、列表、insight同version<\/p>\n<\/li>\n<li>\n<p>sprint奖励不读AI掌握分，跨用户分享不加个人能力<\/p>\n<\/li>\n<\/ul>\n<h2>实施顺序<\/h2>\n<p>定位当前代码/同义权威→若已满足仅举证→绑定真实路径→冻结反例与当前版本→最小增量→自测→独立审查→集成SHA复验→证据更新。不要重建V3。<\/p>\n<h2>证据交付<\/h2>\n<ul>\n<li>\n<p>diff_or_evidence_only.md<\/p>\n<\/li>\n<li>\n<p>run_manifest.json<\/p>\n<\/li>\n<li>\n<p>test_results.json<\/p>\n<\/li>\n<li>\n<p>review_receipt.json<\/p>\n<\/li>\n<li>\n<p>limitations.md<\/p>\n<\/li>\n<\/ul>\n<p>必须记录真实命令/exit code/版本/样本/失败/限制；有UI附顶层截图、语义与真实操作；有模型附全部调用与价格来源。<\/p>\n<h2>边界<\/h2>\n<p>先按既有规范绑定本卡真实路径与只读依赖；工具/路由名为导航种子，禁止假设已存在或造第二权威。契约/迁移由单一owner单独合并，禁止手改生成文件。<\/p>\n<p>当前仓库已满足本卡行为时做差量举证，不重写；V3已DONE任务ID与证据不可重置。<\/p>\n<h2>回滚<\/h2>\n<p>变更独立commit与既有off/shadow/live开关；保留V3路径与数据向后兼容，迁移不得丢用户数据。<\/p>\n<h2>停止条件<\/h2>\n<ul>\n<li>\n<p>发现权限/跨用户/删除复活/假成功立即隔离该变更，不绕门<\/p>\n<\/li>\n<li>\n<p>预算或外部授权缺失→BLOCKED_EXPLICIT，切换其他可执行工作<\/p>\n<\/li>\n<li>\n<p>连续三轮未改善停止无
